[package]
name = "fln-bench"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
publish = false

[dependencies]
fln-hash = { path = "../fln-hash" }

# Integration tests link against this crate plus its dev-dependencies only, and
# `Digest`/`hash` appear in fln-bench's public signatures without being
# re-exported. This declares no new workspace edge: `fln-bench -> fln-hash` is
# already the reviewed edge above and in ci/WORKSPACE_GRAPH.txt.
[dev-dependencies]
fln-hash = { path = "../fln-hash" }
