[package]
name = "fln-conformance"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
publish = false

[features]
# Development-only lockstep-diagnosis machinery (plan §18.10, D8). NEVER a default;
# release CI proves its absence (tests/poison_compile_out.rs + the workspace grep).
oracle-fallback-dev = []

[dependencies]
fln-core = { path = "../fln-core" }
fln-env = { path = "../fln-env" }
fln-hash = { path = "../fln-hash" }
fln-kernel = { path = "../fln-kernel" }
fln-olean = { path = "../fln-olean" }
fln-parse = { path = "../fln-parse" }
fln-syntax = { path = "../fln-syntax" }
# The corpus projection (bead franken_lean-dgxa) covers every row of SCHEMA_REGISTRY,
# three of which are fln-verdict's wire formats. §21 puts fln-conformance last in the
# crate map, so this edge points downward like every other one here.
fln-verdict = { path = "../fln-verdict" }
