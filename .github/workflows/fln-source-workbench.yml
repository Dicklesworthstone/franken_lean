name: Native source workbench
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-source-workbench.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export current implementation inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/source-workbench target/source-frontend
          git rev-parse HEAD > target/source-workbench/commit.txt
          git rev-parse 'HEAD^{tree}' > target/source-workbench/tree.txt
          git show -s --format=fuller HEAD > target/source-workbench/commit-metadata.txt
          git ls-tree -r HEAD > target/source-workbench/tracked-files.txt
          git status --porcelain=v1 > target/source-workbench/checkout-status.txt
          git archive --format=tar.gz HEAD > target/source-workbench/source.tar.gz
          sha256sum target/source-workbench/source.tar.gz > target/source-workbench/SHA256SUMS
          git archive --format=tar.gz HEAD crates/fln-elab crates/fln-parse crates/fln-checker crates/fln crates/fln-cli docs examples AGENTS.md README.md COMPREHENSIVE_PLAN_FOR_THE_DESIGN_OF_FRANKEN_LEAN.md .beads Cargo.toml Cargo.lock rust-toolchain.toml SUITE.lock > target/source-frontend/frontend.tar.gz
          cp target/source-workbench/commit.txt target/source-workbench/tracked-files.txt target/source-frontend/
          sha256sum target/source-frontend/frontend.tar.gz > target/source-frontend/SHA256SUMS
      - name: Read active implementation beads
        shell: python
        run: |
          import collections
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('.beads/issues.jsonl').read_text().splitlines() if line.strip()]
          print('Bead status counts:', dict(collections.Counter(row.get('status') for row in rows)))
          active = [row for row in rows if row.get('status') in ('open', 'in_progress', 'blocked')]
          active.sort(key=lambda row: (row.get('priority', 9), row['id']))
          Path('target/source-workbench/active-beads.json').write_text(json.dumps(active, ensure_ascii=False, indent=2) + '\n')
          words = ('elaborat', 'athanor', 'tactic', 'source', 'unif', 'instance', 'match', 'induct', 'simp', 'rewrite')
          for row in active:
              if any(word in row.get('title', '').lower() for word in words):
                  print(json.dumps({key: row.get(key) for key in ('id', 'title', 'status', 'priority', 'description', 'dependencies')}, ensure_ascii=False))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-frontend-${{ github.sha }}
          path: target/source-frontend
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-workbench-${{ github.sha }}
          path: target/source-workbench
          compression-level: 0
          retention-days: 2
  compiler:
    if: startsWith(github.event.head_commit.message, 'test(source):')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export configured compiler for offline source tests
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          mkdir -p target/source-compiler
          rustc -Vv > target/source-compiler/compiler.txt
          tar -C "$(rustc --print sysroot)" -czf target/source-compiler/compiler.tar.gz bin lib
          sha256sum target/source-compiler/compiler.tar.gz > target/source-compiler/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-compiler-${{ github.sha }}
          path: target/source-compiler
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  context-reversion:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'feat(source): land checked context reversion')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply the exact locally tested native implementation
        shell: python
        run: |
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'eec765af1ca9b3cbd26bfd70d1a4f345a4f4775002e6898f3dd2a6d6ed761a54'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-context-reversion.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
      - name: Reexecute parser elaborator engine CLI and lint regressions
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo test --locked -p fln-parse -p fln-elab --no-fail-fast
          cargo test --locked -p fln --test source_context_generalization --test source_goal_control --test source_local_proofs --test source_induction --test source_rewrite_locations
          cargo test --locked -p fln-cli --test source_context_generalization
          cargo clippy --locked -p fln-elab -p fln-parse -p fln -p fln-cli --all-targets -- -D warnings
          git diff --check
      - name: Commit the checked implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add crates/fln-elab/src/source/tactics.rs crates/fln-elab/src/source/tactics/context.rs crates/fln-parse/src/proofs.rs crates/fln/tests/source_context_generalization.rs crates/fln-cli/tests/source_context_generalization.rs examples/native_context_generalization.lean docs/NATIVE_LOCAL_PROOFS.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(elab): implement dependency-safe revert and let-aware intro'
          git push origin HEAD:main
