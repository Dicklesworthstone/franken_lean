name: Native source workbench
# Capture current source and active product gaps for a checked native frontend increment.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-source-workbench.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export current implementation inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/source-workbench target/source-frontend
          git rev-parse HEAD > target/source-workbench/commit.txt
          git rev-parse 'HEAD^{tree}' > target/source-workbench/tree.txt
          git show -s --format=fuller HEAD > target/source-workbench/commit-metadata.txt
          git ls-tree -r HEAD > target/source-workbench/tracked-files.txt
          git status --porcelain=v1 > target/source-workbench/checkout-status.txt
          git archive --format=tar.gz HEAD > target/source-workbench/source.tar.gz
          sha256sum target/source-workbench/source.tar.gz > target/source-workbench/SHA256SUMS
          git archive --format=tar.gz HEAD crates/fln-elab crates/fln-parse crates/fln-checker crates/fln crates/fln-cli docs examples AGENTS.md README.md COMPREHENSIVE_PLAN_FOR_THE_DESIGN_OF_FRANKEN_LEAN.md .beads Cargo.toml Cargo.lock rust-toolchain.toml SUITE.lock > target/source-frontend/frontend.tar.gz
          cp target/source-workbench/commit.txt target/source-workbench/tracked-files.txt target/source-frontend/
          sha256sum target/source-frontend/frontend.tar.gz > target/source-frontend/SHA256SUMS
      - name: Read active implementation beads
        shell: python
        run: |
          import collections
          import json
          from pathlib import Path

          rows = [json.loads(line) for line in Path('.beads/issues.jsonl').read_text().splitlines() if line.strip()]
          print('Bead status counts:', dict(collections.Counter(row.get('status') for row in rows)))
          active = [row for row in rows if row.get('status') in ('open', 'in_progress', 'blocked')]
          active.sort(key=lambda row: (row.get('priority', 9), row['id']))
          Path('target/source-workbench/active-beads.json').write_text(json.dumps(active, ensure_ascii=False, indent=2) + '\n')
          words = ('elaborat', 'athanor', 'tactic', 'source', 'unif', 'instance', 'match', 'induct', 'simp', 'rewrite')
          for row in active:
              title = row.get('title', '')
              if any(word in title.lower() for word in words):
                  print(json.dumps({key: row.get(key) for key in ('id', 'title', 'status', 'priority', 'description', 'dependencies')}, ensure_ascii=False))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-frontend-${{ github.sha }}
          path: target/source-frontend
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-workbench-${{ github.sha }}
          path: target/source-workbench
          compression-level: 0
          retention-days: 2
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export configured compiler for offline source tests
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          mkdir -p target/source-compiler
          rustc -Vv > target/source-compiler/compiler.txt
          tar -C "$(rustc --print sysroot)" -czf target/source-compiler/compiler.tar.gz bin lib
          sha256sum target/source-compiler/compiler.tar.gz > target/source-compiler/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-compiler-${{ github.sha }}
          path: target/source-compiler
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
