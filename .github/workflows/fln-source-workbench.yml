name: Native source workbench
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-source-workbench.yml']
permissions:
  contents: read
jobs:
  computed-elimination:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'feat(source): land computed elimination')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RUST_BACKTRACE: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact locally checked expression elimination
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6224f731797a350252967d62ee643093edf247d7c4ef0acae28ce28414b657b5'
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'expression-elimination-evidence'
          evidence.mkdir()
          (evidence / 'patch.diff').write_bytes(patch)
          (evidence / 'base.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          subprocess.run(['git', 'apply', '--check', str(evidence / 'patch.diff')], check=True)
          subprocess.run(['git', 'apply', str(evidence / 'patch.diff')], check=True)
          expected = {
              'crates/fln-cli/tests/source_expression_elimination.rs': '3b856f539e1dd60ba4dd278ed42150770b007340',
              'crates/fln-elab/src/source.rs': '8d7e7fa678be3c8af189d72d00911bcb29ec0183',
              'crates/fln-elab/src/source/tactics.rs': '1cf65454581fead7dad0492b31577cfb09196895',
              'crates/fln-elab/src/source/tactics/context.rs': '89302e4cbfa1ccd1a89c6ba4d829b695e6f865f1',
              'crates/fln-elab/src/source/tactics/eliminate.rs': '5f5e5e0d426946da4ff7991b432d4713d7c8d14f',
              'crates/fln-parse/src/proofs/elimination.rs': '460f3092e14a19cf7ec7c5cb1015bff20a3d46a1',
              'crates/fln/tests/source_expression_elimination.rs': '4c3e3a1533cca37c83eb7040fbf18d0d68e0dd14',
              'docs/NATIVE_INDUCTION.md': '79504c609a0da194d367f68560e0705f9456b536',
              'examples/native_expression_elimination.lean': 'f9a6b08135192869b600ebfa3a91b8dd3efe49b0',
          }
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          (evidence / 'files.json').write_text(json.dumps(expected, indent=2) + '\n')
      - name: Verify native parser elaborator engine and installed command
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/expression-elimination-evidence"
          exec > >(tee "$evidence/validation.log") 2>&1
          rustup show active-toolchain
          rustc -Vv
          cargo test --locked -p fln-parse -p fln-elab --no-fail-fast
          cargo test --locked -p fln --no-fail-fast
          cargo test --locked -p fln-cli --test source_expression_elimination --test source_context_generalization --test source_constrained_simplification
          cargo clippy --locked -p fln-parse -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
          rustfmt --edition 2024 --config skip_children=true --check crates/fln-elab/src/source.rs crates/fln-elab/src/source/tactics.rs crates/fln-elab/src/source/tactics/context.rs crates/fln-elab/src/source/tactics/eliminate.rs crates/fln-parse/src/proofs/elimination.rs crates/fln/tests/source_expression_elimination.rs crates/fln-cli/tests/source_expression_elimination.rs
          git diff --check
      - name: Commit checked functionality directly to main
        shell: python
        run: |
          import json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'expression-elimination-evidence'
          expected = json.loads((evidence / 'files.json').read_text())
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          subprocess.run(['git', 'add', '--', *expected], check=True)
          actual = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(actual) == sorted(expected), actual
          message = 'feat(elab): support computed cases and induction with equation witnesses\n\nElaborate arbitrary bounded term discriminants through the heap source driver, retain optional branch equations, and generalize computed expressions before ordinary recursor elimination. Preserve dependent local contexts, generalizing parameters, real induction hypotheses, both kernel checks, and typed nonanswers.\n\nAdd lossless parser and small-stack regressions, eight engine tests, an installed CLI regression, and a runnable example. Full parser/elaborator and engine packages, focused CLI tests, scoped all-target Clippy, and workspace compilation passed before publication. Full workspace tests and Reference artifact parity are not claimed.'
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', message], check=True)
          (evidence / 'commit.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: expression-elimination-${{ github.sha }}
          path: ${{ runner.temp }}/expression-elimination-evidence
          retention-days: 7
          if-no-files-found: warn
