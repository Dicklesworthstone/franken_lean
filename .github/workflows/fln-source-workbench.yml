          rustfmt --edition 2024 --config skip_children=true --check "${rust_paths[@]}"
          git diff --check

      - name: Check shared while-loop observations and refusals with the exact Lean pin
        if: (success() || failure()) && steps.while-format.outcome == 'success'
        run: python3 crates/fln/tests/support/check_source_while_oracle.py --lean "$FLN_REFERENCE_LIB/../../bin/lean"

  while-loop:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'test(elab): validate checked while loops and observable effects'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      FLN_REQUIRE_REFERENCE: '1'
      CANDIDATE_SHA: '1733c48fa3cd228f69f630edd1d46879e56b025f'
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '1733c48fa3cd228f69f630edd1d46879e56b025f'
          persist-credentials: false
      - name: Verify candidate and install the exact compiler and Reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          rustup show active-toolchain
          test "$(rustup show active-toolchain | cut -d ' ' -f 1)" = nightly-2026-08-31-x86_64-unknown-linux-gnu
          rustc -Vv
          curl --user-agent 'OpenAI File Downloader, XaiImageApiFetch/1.0' --fail --location --retry 3 --output "$RUNNER_TEMP/lean-4.32.0-linux.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.32.0/lean-4.32.0-linux.tar.zst
          echo "fca846f3588724a38ad19ee40292c67cb7438d7555903372e3308eef795ba516  $RUNNER_TEMP/lean-4.32.0-linux.tar.zst" | sha256sum --check
          tar --zstd --no-same-owner -xf "$RUNNER_TEMP/lean-4.32.0-linux.tar.zst" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/lean-4.32.0-linux/bin/lean" --githash)" = 8c9756b28d64dab099da31a4c09229a9e6a2ef35
          for module in Init/Prelude Init/While Init/Control/Id Init/Data/List/Control; do
            for suffix in olean olean.server olean.private; do
              test -s "$RUNNER_TEMP/lean-4.32.0-linux/lib/lean/$module.$suffix"
            done
          done
          echo "FLN_REFERENCE_LIB=$RUNNER_TEMP/lean-4.32.0-linux/lib/lean" >> "$GITHUB_ENV"

      - name: Format the complete while-loop candidate and retain its exact bytes
        id: while-format
        shell: bash
        run: |
          set -euo pipefail
          rust_paths=(
            crates/fln/src/runtime/array_iteration.rs
            crates/fln/src/source_intrinsics/array_iteration.rs
            crates/fln/src/runtime/implemented_by.rs
            crates/fln/src/runtime/specialize.rs
            crates/fln/src/runtime.rs
            crates/fln/src/source_intrinsics.rs
            crates/fln/tests/source_imported_arrays.rs
            crates/fln/tests/source_imported_arrays/execution.rs
            crates/fln/tests/source_imported_arrays/authority.rs
            crates/fln/src/runtime/array_iteration/tests.rs
            crates/fln/src/runtime/global/partial.rs
            crates/fln/src/runtime/global/partial/callbacks.rs
            crates/fln/src/runtime/callables/stages.rs
            crates/fln/src/runtime/global/partial/tests.rs
            crates/fln/src/runtime/global/partial/tests/callback_stages.rs
            crates/fln-elab/src/source/do_notation.rs
            crates/fln-elab/src/source/patterns.rs
            crates/fln-elab/src/source/do_notation/while_loop.rs
            crates/fln-elab/src/source/do_notation/control.rs
            crates/fln-elab/src/source/do_notation/mutation.rs
            crates/fln-elab/src/source/do_notation/conditional.rs
            crates/fln/tests/source_while.rs
          )
          paths=(
            crates/fln/src/runtime/array_iteration.rs
            crates/fln/src/source_intrinsics/array_iteration.rs
            crates/fln/src/runtime/implemented_by.rs
            crates/fln/src/runtime/specialize.rs
            crates/fln/src/runtime.rs
            crates/fln/src/source_intrinsics.rs
            crates/fln/src/source_intrinsics/array_iteration/dependencies.txt
            crates/fln/tests/source_imported_arrays.rs
            crates/fln/tests/source_imported_arrays/programs.lean
            crates/fln/tests/source_imported_arrays/effects.lean
            crates/fln/tests/source_imported_arrays/execution.rs
            crates/fln/tests/source_imported_arrays/authority.rs
            crates/fln/tests/source_imported_arrays/check_oracle.py
            crates/fln/src/runtime/array_iteration/tests.rs
            crates/fln/src/runtime/global/partial.rs
            crates/fln/src/runtime/global/partial/callbacks.rs
            crates/fln/src/runtime/callables/stages.rs
            crates/fln/src/runtime/global/partial/tests.rs
            crates/fln/src/runtime/global/partial/tests/callback_stages.rs
            crates/fln-elab/src/source/do_notation.rs
            crates/fln-elab/src/source/patterns.rs
            crates/fln-elab/src/source/do_notation/while_loop.rs
            crates/fln-elab/src/source/do_notation/control.rs
            crates/fln-elab/src/source/do_notation/mutation.rs
            crates/fln-elab/src/source/do_notation/conditional.rs
            crates/fln/tests/source_while.rs
            crates/fln/tests/support/source_while.lean
            crates/fln/tests/support/source_while_expected.tsv
            crates/fln/tests/support/check_source_while_oracle.py
          )
          rustfmt --edition 2024 --config skip_children=true "${rust_paths[@]}"
          echo FLN_WHILE_RUSTFMT_DIFF_BEGIN
          git diff --no-ext-diff --binary -- "${paths[@]}"
          echo FLN_WHILE_RUSTFMT_DIFF_END
          echo FLN_WHILE_FORMATTED_BLOBS_BEGIN
          for path in "${paths[@]}"; do
            printf '%s  %s\n' "$(git hash-object "$path")" "$path"
          done
          echo FLN_WHILE_FORMATTED_BLOBS_END
          rustfmt --edition 2024 --config skip_children=true --check "${rust_paths[@]}"
          git diff --check

      - name: Check the existing do-notation elaboration and execution regressions
        if: (success() || failure()) && steps.while-format.outcome == 'success'
        shell: bash
        run: |
          cargo test --locked --offline -p fln-elab --lib source::do_notation -- --nocapture --test-threads=1
          cargo test --locked --offline -p fln --test source_do -- --nocapture --test-threads=1
      - name: Check the complete elaborator production target
        if: (success() || failure()) && steps.while-format.outcome == 'success'
        run: cargo clippy --locked --offline -p fln-elab --lib -- -D warnings
      - name: Check the affected source and native execution targets
        if: (success() || failure()) && steps.while-format.outcome == 'success'
        run: cargo clippy --locked --offline -p fln --lib --test source_while --test source_do -- -D warnings
      - name: Check native while computations, control-flow, effects and independent replay
        if: (success() || failure()) && steps.while-format.outcome == 'success'
        run: cargo test --locked --offline -p fln --test source_while -- --nocapture --test-threads=1
