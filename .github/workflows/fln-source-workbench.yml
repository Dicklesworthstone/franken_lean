name: Native source workbench
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Full main-ancestor commit to validate'
        required: true
        type: string
      changes:
        description: 'JSON object: existing source path -> [base blob, candidate blob]'
        required: true
        default: '{}'
        type: string
      suite:
        description: 'Fixed validation command; negative controls are expected to fail'
        required: true
        type: choice
        options: [range, cli, reference, missing-reference, flush-mutant, ingress, mutual-structural, polymorphic-callbacks, pattern-simp, refinement]
  push:
    branches: [main]
    paths:
      - '.github/workflows/fln-source-workbench.yml'
      - 'crates/fln-elab/src/source/recursion/**'
      - 'crates/fln-elab/src/source/partial/group/ordinary.rs'
      - 'crates/fln/tests/source_mutual_ordinary.rs'
permissions:
  contents: read
jobs:
  # Consumer: loop ingress and CLI publication candidates blocked by observed
  # RCH transport failures. This never publishes code or changes a test verdict.
  # Retire when those candidates land and the ordinary executor covers them.
  candidate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CANDIDATE_BASE: ${{ inputs.base || github.sha }}
      CANDIDATE_CHANGES: ${{ inputs.changes || '{}' }}
      CANDIDATE_SUITE: ${{ inputs.suite || (contains(github.event.head_commit.message, 'polymorphic callbacks') && 'polymorphic-callbacks') || 'mutual-structural' }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Validate immutable source identifiers before checkout
        shell: python
        run: |
          import json, os, re
          assert re.fullmatch('[0-9a-f]{40}', os.environ['CANDIDATE_BASE'])
          changes = json.loads(os.environ['CANDIDATE_CHANGES'])
          assert isinstance(changes, dict) and len(changes) <= 8
          allowed = {
              'crates/fln/src/runtime/callables/administrative.rs',
              'crates/fln/src/runtime/callables/administrative/tests.rs',
              'crates/fln/src/runtime/specialize.rs',
              'crates/fln-cli/tests/source_stateful_loops.rs',
              'crates/fln-cli/src/output.rs',
              'crates/fln-cli/src/output/tests.rs',
              'crates/fln-cli/src/goal_traces.rs',
              'crates/fln-cli/src/source_check/imports.rs',
              'crates/fln/src/source_records/simp.rs',
              'crates/fln-elab/src/source/tactics/rewrite/simplify/binders.rs',
              'crates/fln-elab/src/source.rs',
              'crates/fln-elab/src/source/tactics/refine.rs',
              'crates/fln/tests/source_refinement.rs',
          }
          for path, blobs in changes.items():
              assert path in allowed, path
              assert isinstance(blobs, list) and len(blobs) == 2
              assert all(isinstance(s, str) and re.fullmatch('[0-9a-f]{40}', s) for s in blobs)
          assert os.environ['CANDIDATE_SUITE'] in {
              'range', 'cli', 'reference', 'missing-reference', 'flush-mutant', 'ingress', 'mutual-structural', 'polymorphic-callbacks', 'pattern-simp', 'refinement',
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.base || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a main ancestor and materialize exact existing source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', os.environ['WORKFLOW_SHA']], check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['CANDIDATE_BASE']
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          changes = json.loads(os.environ['CANDIDATE_CHANGES'])
          for path, (before, after) in changes.items():
              file = pathlib.Path(path)
              assert all(not parent.is_symlink() for parent in [file, *file.parents])
              assert file.is_file() and blob(file.read_bytes()) == before, path
              request = urllib.request.Request(
                  'https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + after,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'User-Agent': 'franken_lean-agent (+https://github.com/Dicklesworthstone/franken_lean)',
                  })
              with urllib.request.urlopen(request, timeout=60) as response:
                  record = json.load(response)
              assert record['sha'] == after and record['encoding'] == 'base64'
              data = base64.b64decode(record['content'], validate=False)
              assert blob(data) == after, path
              file.write_bytes(data)
              print(path, before, after, hashlib.sha256(data).hexdigest(), flush=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          print('SOURCE_BASE=' + os.environ['CANDIDATE_BASE'], flush=True)
          print('SOURCE_CHANGES=' + json.dumps(changes, sort_keys=True), flush=True)
      - name: Install the repository-pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install and verify the SUITE.lock Reference
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/candidate-elan-bin"
          archive="$RUNNER_TEMP/candidate-elan.tar.gz"
          mkdir "$tool_root"
          curl --user-agent 'franken_lean-agent (+https://github.com/Dicklesworthstone/franken_lean)' \
            --fail --location --retry 3 --output "$archive" \
            https://github.com/leanprover/elan/releases/download/v4.2.1/elan-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_root"
          export ELAN_HOME="$RUNNER_TEMP/candidate-elan"
          "$tool_root/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$ELAN_HOME/bin:$PATH"
          mapfile -t reference_rows < <(grep -E '^reference ' SUITE.lock)
          test "${#reference_rows[@]}" -eq 1
          pin_tag="$(sed -nE 's/.* tag=([^ ]+).*/\1/p' <<<"${reference_rows[0]}")"
          pin_commit="$(sed -nE 's/.* commit=([0-9a-f]{40}).*/\1/p' <<<"${reference_rows[0]}")"
          [[ "$pin_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          test -n "$pin_commit"
          elan toolchain install "leanprover/lean4:$pin_tag"
          toolchain_root="$ELAN_HOME/toolchains/leanprover--lean4---$pin_tag"
          test "$("$toolchain_root/bin/lean" --githash)" = "$pin_commit"
          for suffix in olean olean.server olean.private; do
            test -s "$toolchain_root/lib/lean/Init/Prelude.$suffix"
            test -s "$toolchain_root/lib/lean/Init/Data/Repr.$suffix"
          done
          printf 'FLN_REFERENCE_LIB=%s/lib/lean\nFLN_REFERENCE_LEAN=%s/bin/lean\nFLN_REQUIRE_REFERENCE=1\n' \
            "$toolchain_root" "$toolchain_root" >> "$GITHUB_ENV"
      - name: Execute the selected fixed probe without changing its verdict
        shell: bash
        run: |
          set -euo pipefail
          case "$CANDIDATE_SUITE" in
            refinement)
              # n15v: retire when the ordinary full product gate covers this cut.
              cargo check --locked --all-targets
              cargo clippy --locked --all-targets -- -D warnings
              cargo test --locked --no-fail-fast -p fln \
                --test source_refinement --test source_index_refinement \
                --test source_core_closing_tactics --test source_backtracking \
                -- --nocapture
              cargo test --locked -p fln-elab --lib source::tactics::refine::tests -- --nocapture
              ;;
            pattern-simp)
              # b8zv: retire when the ordinary full product gate covers this cut.
              cargo check --locked --all-targets
              cargo clippy --locked --all-targets -- -D warnings
              cargo test --locked --release --no-fail-fast -p fln \
                --test source_equation_theorems --test source_simp_equations \
                --test source_default_simp --test source_simp_locations \
                --test source_simp_hypotheses --test source_simp_quantifiers \
                --test source_dsimp -- --nocapture
              ;;
            polymorphic-callbacks)
              rustfmt --edition 2024 --config skip_children=true --check crates/fln/src/runtime.rs crates/fln/src/runtime/templates.rs crates/fln/src/runtime/specialize/arguments.rs crates/fln/src/runtime/specialize/arguments/factories.rs crates/fln/src/runtime/specialize/arguments/tests.rs crates/fln/tests/runtime_parameterized_data.rs crates/fln/src/runtime/global/callbacks.rs crates/fln/tests/runtime_polymorphic_callbacks.rs
              cargo test --locked --release -p fln --test runtime_parameterized_data -- --test-threads=1
              cargo test --locked --release -p fln --test runtime_polymorphic_callbacks -- --test-threads=1
              cargo test --locked --release -p fln --lib runtime::specialize::arguments -- --test-threads=1
              cargo test --locked --release -p fln --lib runtime::templates -- --test-threads=1
              cargo test --locked --release -p fln --lib runtime::global::callbacks -- --test-threads=1
              cargo test --locked --release -p fln --lib runtime::records -- --test-threads=1
              cargo clippy --locked -p fln --lib -- -D warnings
              cargo check --locked --workspace --all-targets
              ;;
            mutual-structural)
              rustfmt --edition 2024 --config skip_children=true --check crates/fln-elab/src/source.rs crates/fln-elab/src/source/partial/group/ordinary.rs crates/fln-elab/src/source/recursion.rs crates/fln-elab/src/source/recursion/course.rs crates/fln-elab/src/source/recursion/matrix.rs crates/fln-elab/src/source/recursion/well_founded/mutual.rs crates/fln-elab/src/source/local_functions/lifting.rs crates/fln/tests/source_mutual_ordinary.rs crates/fln-elab/src/source/recursion/mutual_structural.rs
              cargo test --locked -p fln --test source_mutual_ordinary -- --nocapture --test-threads=1
              cargo test --locked --no-fail-fast -p fln \
                --test source_mutual_well_founded --test source_course_of_values \
                --test source_course_reduction --test source_matrix_recursion \
                --test source_partial_definitions --test source_mutual_partial \
                --test source_mutual_unsafe --test runtime_mutual_recursion \
                -- --test-threads=1
              cargo clippy --locked -p fln-elab --lib -- -D warnings
              cargo check --locked --workspace --all-targets
              ;;
            ingress)
              cargo check --locked --all-targets
              cargo clippy --locked --all-targets -- -D warnings
              cargo test --locked --release --no-fail-fast -p fln \
                --lib --test source_deriving_repr -- --nocapture
              cargo test --locked --release --no-fail-fast -p fln-cli \
                --test source_deriving_repr --test source_range_literals \
                --test source_stateful_loops --test source_while_loops -- --nocapture
              ;;
            range)
              cargo test --locked --release -p fln-cli --test source_range_literals -- --nocapture
              ;;
            cli)
              cargo test --locked --release -p fln-cli --lib -- --nocapture
              ;;
            reference|missing-reference)
              unset FLN_REFERENCE_LEAN
              if [ "$CANDIDATE_SUITE" = missing-reference ]; then
                export FLN_REFERENCE_LIB="$RUNNER_TEMP/absent-reference/lib/lean"
              fi
              cargo test --locked --release -p fln-cli --lib -- \
                goal_traces::tests::guard_literals_agree_with_the_pin_or_refuse \
                source_check::imports::tests::the_source_import_capture_ceiling_holds_the_pinned_init_closure \
                --exact --nocapture
              ;;
            flush-mutant)
              cargo test --locked --release -p fln-cli --lib -- \
                output::tests::native_stdout_flush_failure_is_not_success_with_empty_cli_output \
                --exact --nocapture
              ;;
            *) exit 2 ;;
          esac

  inline-simp:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'feat(source): finish inline simp attribute integration on current main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply the identity-checked inline attribute implementation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'inline-simp-evidence'
          root.mkdir()
          (root / 'base.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          request = urllib.request.Request(
              'https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/53b291f82f0975b2722ab48fd55c2b5ff77db0b0',
              headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)
          assert data['encoding'] == 'base64'
          compressed = base64.b64decode(data['content'])
          encoded = base64.b64encode(compressed).decode('ascii')
          assert encoded.count('sjZ8r2rGcWs7ueWscm') == 1
          encoded = encoded.replace('sjZ8r2rGcWs7ueWscm', 'sjZ8r2ZGcWs7ueWscm')
          compressed = base64.b64decode(encoded, validate=True)
          header = ('blob ' + str(len(compressed)) + '\0').encode()
          assert hashlib.sha1(header + compressed).hexdigest() == '2941fd78ee22f41ea1a030ebe186a3a24dbd0d7e'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '0c57b9bbbeaffc4c9aae499c2c742ff9d227c8db62fc76337b60c9b2521bfbf3'
          (root / 'attributes.patch').write_bytes(patch)
          paths = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git a/')]
          assert len(paths) == len(set(paths)) and paths
          assert all(path.startswith(('crates/', 'docs/', 'examples/')) and '..' not in path.split('/') for path in paths)
          assert '\ndeleted file mode ' not in patch.decode()
          (root / 'paths.json').write_text(json.dumps(paths))
          subprocess.run(['git', 'apply', '--check', str(root / 'attributes.patch')], check=True)
          subprocess.run(['git', 'apply', str(root / 'attributes.patch')], check=True)
      - name: Check native proof admission and the updated installed LSP surface
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/inline-simp-evidence"
          exec > >(tee "$evidence/validation.log") 2>&1
          rustup show active-toolchain
          rustc -Vv
          cargo test --locked -p fln-cli --test lsp_stdio_e2e
          cargo test --locked -p fln-parse -p fln-elab --no-fail-fast
          cargo test --locked -p fln --test source_default_simp --test source_automation --test source_file_check --test source_scopes
          cargo test --locked -p fln-cli --no-fail-fast
          cargo clippy --locked -p fln-parse -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
          git diff --check
      - name: Commit the checked attribute implementation directly to main
        shell: python
        run: |
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'inline-simp-evidence'
          paths = json.loads((root / 'paths.json').read_text())
          subprocess.run(['git', 'add', '--', *paths], check=True)
          actual = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(actual) == sorted(paths), actual
          message = 'feat(simp): admit inline simp attributes with atomic checked publication\n\nSupport lossless bounded @[simp] declaration attributes, directions and priorities. Register only after both checkers admit the declaration, including the single-declaration facade, and preserve namespace identities and immutable failure rollback. Reject unsupported execution-door attributes rather than ignoring them.\n\nReplace the stale FLBC fixture with native producer output and retain obsolete-version refusal coverage. Parser/elaborator packages, focused engine tests, the complete CLI package including updated incremental-LSP tests, scoped Clippy and workspace compilation passed before publication. The full engine package also passed on the preceding integration base; full workspace tests and Reference parity are not claimed.'
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', message], check=True)
          (root / 'commit.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inline-simp-${{ github.sha }}
          path: ${{ runner.temp }}/inline-simp-evidence
          retention-days: 7
          if-no-files-found: error
  assignment-transfer:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'build(elab): materialize checked assignment inference for direct main publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Import the exact locally tested patch as immutable Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'assignment-transfer'
          root.mkdir()
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          api = 'https://api.github.com/repos/Dicklesworthstone/franken_lean'
          def request(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api + path, data=body, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          manifest = {
              'crates/fln-elab/src/constraint/unify.rs': ['7ec99cccb07c68e9858e0ef4c64358964c8fbbc5', '5c9f1bb5fd2c5838e4bc1ece7812faabdcd73b49'],
              'crates/fln-elab/src/constraint/unify/assignment_types.rs': [None, 'd10de8322a65a8b842df4af8970d1464fb817353'],
              'crates/fln-elab/src/constraint/unify/residual.rs': ['6c5022e9208a1b32eec6bb2cb7a0dea4bac5cb78', '8858a2f988c094cc58a5b549adac8878901f1732'],
              'crates/fln-elab/tests/native_assignment_types.rs': [None, '1560d6e82fcba2ac1716f1e73e6c7be5fb299194'],
              'crates/fln-elab/tests/native_unification.rs': ['5472ef120e892d1eed28f0f32ab21a8e8b593105', '9050c10f7a31bfdab7042e887863f30785a77f52'],
              'crates/fln-elab/tests/universe_residuals.rs': ['dd8116b710a3b89a9e36694a0a2235ad7b51db81', '87a9bf5c570f40d49e91380c19a703b99ae8c86a'],
          }
          encoded = base64.b64decode(request('/git/blobs/5fab5b9520f0f32e862cf6626a23976bd1964d44')['content']).decode('ascii')
          # Repair one transport-only duplicated character; both the encoded
          # payload identity and the decompressed patch identity must then match.
          assert encoded.count('seOUVGTJJ69') == 1
          encoded = encoded.replace('seOUVGTJJ69', 'seOUVGTJ69')
          assert blob(encoded.encode()) == 'ee3bba008e933aef2cb87113be4dde4bccb9a664'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3d1a2b6e78e4c113ca3501204aa74414a68353f15a8dfc5e9fd1a00fc633faec'
          paths = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git a/')]
          assert sorted(paths) == sorted(manifest) and len(paths) == len(set(paths))
          for path, (before, after) in manifest.items():
              file = pathlib.Path(path)
              assert not file.is_symlink()
              assert (blob(file.read_bytes()) if file.exists() else None) == before, path
          patch_file = root / 'assignment.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', str(patch_file)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          for path, (before, after) in manifest.items():
              data = pathlib.Path(path).read_bytes()
              assert blob(data) == after, path
              result = request('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert result['sha'] == after, path
          # This job creates immutable objects only. The connected GitHub
          # caller separately checks current main and publishes a fast-forward.
          receipt = {'base': base, 'blobs': {path: after for path, (_, after) in manifest.items()},
              'patch_sha256': hashlib.sha256(patch).hexdigest(), 'published_branch': False}
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt, indent=2), flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assignment-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/assignment-transfer
          retention-days: 7
          if-no-files-found: error

  scientific-conversions:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'test(runtime): verify imported numeric helpers and persistent defaults on current main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      FLN_REQUIRE_REFERENCE: '1'
      CANDIDATE_SHA: '6a6e09c09707ade38f4959faf19d1d5bf4032e4f'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '6a6e09c09707ade38f4959faf19d1d5bf4032e4f'
          persist-credentials: false
      - name: Verify candidate and install the exact compiler and Reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          rustup show active-toolchain
