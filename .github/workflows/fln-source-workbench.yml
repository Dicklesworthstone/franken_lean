name: Native source workbench
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-source-workbench.yml']
permissions:
  contents: read
jobs:
  inline-simp:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'feat(source): finish inline simp attribute integration on current main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply the identity-checked inline attribute implementation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'inline-simp-evidence'
          root.mkdir()
          (root / 'base.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          request = urllib.request.Request(
              'https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/53b291f82f0975b2722ab48fd55c2b5ff77db0b0',
              headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)
          assert data['encoding'] == 'base64'
          compressed = base64.b64decode(data['content'])
          encoded = base64.b64encode(compressed).decode('ascii')
          assert encoded.count('sjZ8r2rGcWs7ueWscm') == 1
          encoded = encoded.replace('sjZ8r2rGcWs7ueWscm', 'sjZ8r2ZGcWs7ueWscm')
          compressed = base64.b64decode(encoded, validate=True)
          header = ('blob ' + str(len(compressed)) + '\0').encode()
          assert hashlib.sha1(header + compressed).hexdigest() == '2941fd78ee22f41ea1a030ebe186a3a24dbd0d7e'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '0c57b9bbbeaffc4c9aae499c2c742ff9d227c8db62fc76337b60c9b2521bfbf3'
          (root / 'attributes.patch').write_bytes(patch)
          paths = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git a/')]
          assert len(paths) == len(set(paths)) and paths
          assert all(path.startswith(('crates/', 'docs/', 'examples/')) and '..' not in path.split('/') for path in paths)
          assert '\ndeleted file mode ' not in patch.decode()
          (root / 'paths.json').write_text(json.dumps(paths))
          subprocess.run(['git', 'apply', '--check', str(root / 'attributes.patch')], check=True)
          subprocess.run(['git', 'apply', str(root / 'attributes.patch')], check=True)
      - name: Check native proof admission and the updated installed LSP surface
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/inline-simp-evidence"
          exec > >(tee "$evidence/validation.log") 2>&1
          rustup show active-toolchain
          rustc -Vv
          cargo test --locked -p fln-cli --test lsp_stdio_e2e
          cargo test --locked -p fln-parse -p fln-elab --no-fail-fast
          cargo test --locked -p fln --test source_default_simp --test source_automation --test source_file_check --test source_scopes
          cargo test --locked -p fln-cli --no-fail-fast
          cargo clippy --locked -p fln-parse -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
          git diff --check
      - name: Commit the checked attribute implementation directly to main
        shell: python
        run: |
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'inline-simp-evidence'
          paths = json.loads((root / 'paths.json').read_text())
          subprocess.run(['git', 'add', '--', *paths], check=True)
          actual = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(actual) == sorted(paths), actual
          message = 'feat(simp): admit inline simp attributes with atomic checked publication\n\nSupport lossless bounded @[simp] declaration attributes, directions and priorities. Register only after both checkers admit the declaration, including the single-declaration facade, and preserve namespace identities and immutable failure rollback. Reject unsupported execution-door attributes rather than ignoring them.\n\nReplace the stale FLBC fixture with native producer output and retain obsolete-version refusal coverage. Parser/elaborator packages, focused engine tests, the complete CLI package including updated incremental-LSP tests, scoped Clippy and workspace compilation passed before publication. The full engine package also passed on the preceding integration base; full workspace tests and Reference parity are not claimed.'
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', message], check=True)
          (root / 'commit.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inline-simp-${{ github.sha }}
          path: ${{ runner.temp }}/inline-simp-evidence
          retention-days: 7
          if-no-files-found: error
  assignment-transfer:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'build(elab): materialize checked assignment inference for direct main publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Import the exact locally tested patch as immutable Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'assignment-transfer'
          root.mkdir()
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          api = 'https://api.github.com/repos/Dicklesworthstone/franken_lean'
          def request(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api + path, data=body, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          manifest = {
              'crates/fln-elab/src/constraint/unify.rs': ['7ec99cccb07c68e9858e0ef4c64358964c8fbbc5', '5c9f1bb5fd2c5838e4bc1ece7812faabdcd73b49'],
              'crates/fln-elab/src/constraint/unify/assignment_types.rs': [None, 'd10de8322a65a8b842df4af8970d1464fb817353'],
              'crates/fln-elab/src/constraint/unify/residual.rs': ['6c5022e9208a1b32eec6bb2cb7a0dea4bac5cb78', '8858a2f988c094cc58a5b549adac8878901f1732'],
              'crates/fln-elab/tests/native_assignment_types.rs': [None, '1560d6e82fcba2ac1716f1e73e6c7be5fb299194'],
              'crates/fln-elab/tests/native_unification.rs': ['5472ef120e892d1eed28f0f32ab21a8e8b593105', '9050c10f7a31bfdab7042e887863f30785a77f52'],
              'crates/fln-elab/tests/universe_residuals.rs': ['dd8116b710a3b89a9e36694a0a2235ad7b51db81', '87a9bf5c570f40d49e91380c19a703b99ae8c86a'],
          }
          encoded = base64.b64decode(request('/git/blobs/5fab5b9520f0f32e862cf6626a23976bd1964d44')['content']).decode('ascii')
          # Repair one transport-only duplicated character; both the encoded
          # payload identity and the decompressed patch identity must then match.
          assert encoded.count('seOUVGTJJ69') == 1
          encoded = encoded.replace('seOUVGTJJ69', 'seOUVGTJ69')
          assert blob(encoded.encode()) == 'ee3bba008e933aef2cb87113be4dde4bccb9a664'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3d1a2b6e78e4c113ca3501204aa74414a68353f15a8dfc5e9fd1a00fc633faec'
          paths = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git a/')]
          assert sorted(paths) == sorted(manifest) and len(paths) == len(set(paths))
          for path, (before, after) in manifest.items():
              file = pathlib.Path(path)
              assert not file.is_symlink()
              assert (blob(file.read_bytes()) if file.exists() else None) == before, path
          patch_file = root / 'assignment.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', str(patch_file)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          for path, (before, after) in manifest.items():
              data = pathlib.Path(path).read_bytes()
              assert blob(data) == after, path
              result = request('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert result['sha'] == after, path
          # This job creates immutable objects only. The connected GitHub
          # caller separately checks current main and publishes a fast-forward.
          receipt = {'base': base, 'blobs': {path: after for path, (_, after) in manifest.items()},
              'patch_sha256': hashlib.sha256(patch).hexdigest(), 'published_branch': False}
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt, indent=2), flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assignment-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/assignment-transfer
          retention-days: 7
          if-no-files-found: error

  scientific-conversions:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'test(runtime): verify imported numeric helpers and persistent defaults on current main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      FLN_REQUIRE_REFERENCE: '1'
      CANDIDATE_SHA: '6a6e09c09707ade38f4959faf19d1d5bf4032e4f'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '6a6e09c09707ade38f4959faf19d1d5bf4032e4f'
          persist-credentials: false
      - name: Verify candidate and install the exact compiler and Reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          rustup show active-toolchain
          test "$(rustup show active-toolchain | cut -d ' ' -f 1)" = nightly-2026-08-31-x86_64-unknown-linux-gnu
          rustc -Vv
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/lean-4.32.0-linux.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.32.0/lean-4.32.0-linux.tar.zst
          echo "fca846f3588724a38ad19ee40292c67cb7438d7555903372e3308eef795ba516  $RUNNER_TEMP/lean-4.32.0-linux.tar.zst" | sha256sum --check
          tar --zstd --no-same-owner -xf "$RUNNER_TEMP/lean-4.32.0-linux.tar.zst" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/lean-4.32.0-linux/bin/lean" --githash)" = 8c9756b28d64dab099da31a4c09229a9e6a2ef35
          for module in Init/Prelude Init/Data/OfScientific; do
            for suffix in olean olean.server olean.private; do
              test -s "$RUNNER_TEMP/lean-4.32.0-linux/lib/lean/$module.$suffix"
            done
          done
          echo "FLN_REFERENCE_LIB=$RUNNER_TEMP/lean-4.32.0-linux/lib/lean" >> "$GITHUB_ENV"
      - name: Format the five conversion files and preserve the tested bytes
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            crates/fln/src/source_intrinsics/float.rs
            crates/fln/src/source_intrinsics/float/tests.rs
            crates/fln/tests/source_imported_floats.rs
            crates/fln/src/runtime/partial.rs
            crates/fln/src/runtime/floats/imported.rs
          )
          rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
          echo FLN_SCI_RUSTFMT_DIFF_BEGIN
          git diff --no-ext-diff --binary -- "${paths[@]}"
          echo FLN_SCI_RUSTFMT_DIFF_END
          echo FLN_SCI_FORMATTED_BLOBS_BEGIN
          for path in "${paths[@]}"; do
            printf '%s  %s\n' "$(git hash-object "$path")" "$path"
          done
          echo FLN_SCI_FORMATTED_BLOBS_END
          git diff --check
      - name: Compare all dynamic conversion bit expectations with the live pin
        shell: python
        run: |
          import os, pathlib, re, subprocess
          test = pathlib.Path('crates/fln/tests/source_imported_floats.rs').read_text()
          helper = test.split('fn assert_dynamic_conversions(', 1)[1]
          source = re.search(r'let source = r#"(.*?)"#;', helper, re.S).group(1)
          source, count = re.subn(r'^#eval (.+)$', r'#eval ((\1).toBits).toNat', source, flags=re.M)
          assert count == 17, count
          fixture = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dynamic-conversion-oracle.lean'
          fixture.write_text('import Init.Data.OfScientific\n' + source)
          lean = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lean-4.32.0-linux/bin/lean'
          result = subprocess.run([str(lean), str(fixture)], text=True, capture_output=True)
          print(result.stdout, end='')
          print(result.stderr, end='')
          assert result.returncode == 0, result.returncode
          expected = ['4611911198408756429', '1074161254', '4906019910204099648', '4608285800708723180', '1067408425', '4611911198408756429', '0', '1', '1', '9218868437227405312', '2139095040', '4895412794951729152', '1593835521', '4631107791820423168', '1109917696', '13854479828675198976', '1123680256']
          assert result.stdout.splitlines() == expected, (result.stdout.splitlines(), expected)
      - name: Check complete Float models and selected native helper authority
        if: success() || failure()
        run: cargo test --locked --offline -p fln --lib source_intrinsics::float::tests -- --nocapture --test-threads=1
      - name: Execute and replay actual imported scientific bodies
        if: success() || failure()
        run: cargo test --locked --offline -p fln --test source_imported_floats actual_imported_scientific_floats_execute_and_replay_the_regression -- --exact --nocapture --test-threads=1

  automatic-termination:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'test(elab): verify automatic termination with dependent recursion on current main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      FLN_REQUIRE_REFERENCE: '1'
      CANDIDATE_SHA: 'b617187c6db7acda22d81ad7ee9756c48ae40d39'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'b617187c6db7acda22d81ad7ee9756c48ae40d39'
          persist-credentials: false
      - name: Verify candidate and install the exact compiler and Reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          rustup show active-toolchain
          test "$(rustup show active-toolchain | cut -d ' ' -f 1)" = nightly-2026-08-31-x86_64-unknown-linux-gnu
          rustc -Vv
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/lean-4.32.0-linux.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.32.0/lean-4.32.0-linux.tar.zst
          echo "fca846f3588724a38ad19ee40292c67cb7438d7555903372e3308eef795ba516  $RUNNER_TEMP/lean-4.32.0-linux.tar.zst" | sha256sum --check
          tar --zstd --no-same-owner -xf "$RUNNER_TEMP/lean-4.32.0-linux.tar.zst" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/lean-4.32.0-linux/bin/lean" --githash)" = 8c9756b28d64dab099da31a4c09229a9e6a2ef35
          for module in Init/Prelude Init/WFTactics Init/Omega; do
            for suffix in olean olean.server olean.private; do
              test -s "$RUNNER_TEMP/lean-4.32.0-linux/lib/lean/$module.$suffix"
            done
          done
          echo "FLN_REFERENCE_LIB=$RUNNER_TEMP/lean-4.32.0-linux/lib/lean" >> "$GITHUB_ENV"
      - name: Format integrated default source and preserve the tested merge
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            crates/fln-elab/src/instances/defaults.rs
            crates/fln-elab/src/instances/defaults/export.rs
            crates/fln-elab/src/instances/defaults/export/tests.rs
            crates/fln-elab/src/instances/imported.rs
            crates/fln-elab/src/source.rs
            crates/fln-elab/src/source/instance_command.rs
            crates/fln-elab/src/source/instances.rs
            crates/fln-elab/src/source/scope/simp.rs
            crates/fln-elab/src/source/scope/visibility.rs
            crates/fln-olean/src/write/source.rs
            crates/fln-olean/src/write/source/defaults.rs
            crates/fln-olean/src/write/source/namespaces.rs
            crates/fln-parse/src/command_scope/instances.rs
            crates/fln/src/lib.rs
            crates/fln/src/source_check.rs
            crates/fln/src/source_check/instance_attributes.rs
            crates/fln/src/source_check/modules/artifacts.rs
            crates/fln/src/source_check/modules/imported.rs
            crates/fln/src/source_check/modules/persisted.rs
            crates/fln/src/source_check/modules/replay.rs
            crates/fln/src/source_check/modules/visibility.rs
            crates/fln/src/source_records.rs
            crates/fln/tests/source_default_instances.rs
            crates/fln/tests/source_default_simp.rs
            crates/fln/tests/source_module_artifacts/classes.rs
            crates/fln/tests/source_module_artifacts/defaults.rs
          )
          rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
          echo FLN_INTEGRATED_DEFAULT_RUSTFMT_DIFF_BEGIN
          git diff --no-ext-diff --binary -- "${paths[@]}"
          echo FLN_INTEGRATED_DEFAULT_RUSTFMT_DIFF_END
          echo FLN_INTEGRATED_DEFAULT_FORMATTED_BLOBS_BEGIN
          for path in "${paths[@]}"; do
            printf '%s  %s\n' "$(git hash-object "$path")" "$path"
          done
          echo FLN_INTEGRATED_DEFAULT_FORMATTED_BLOBS_END
          git diff --check
      - name: Format only the four candidate files and preserve the tested bytes
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            crates/fln-elab/src/source/recursion.rs
            crates/fln-elab/src/source/recursion/well_founded.rs
            crates/fln/tests/source_well_founded.rs
            crates/fln/tests/support/well_founded_inference.rs
          )
          rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
          echo FLN_WF_RUSTFMT_DIFF_BEGIN
          git diff --no-ext-diff --binary -- "${paths[@]}"
          echo FLN_WF_RUSTFMT_DIFF_END
          echo FLN_WF_FORMATTED_BLOBS_BEGIN
          for path in "${paths[@]}"; do
            printf '%s  %s\n' "$(git hash-object "$path")" "$path"
          done
          echo FLN_WF_FORMATTED_BLOBS_END
          git diff --check
      - name: Check inferred measures and proof-selection behavior against the live pin
        shell: python
        run: |
          import json, os, pathlib, re, subprocess
          source = pathlib.Path('crates/fln/tests/support/well_founded_inference.rs').read_text()
          literal = r'"(?:[^"\\]|\\.)*"'
          tuple_pattern = re.compile(r'\(\s*(' + literal + r')\s*,\s*(' + literal + r')\s*,\s*(' + literal + r')\s*,?\s*\)')
          programs = [tuple(json.loads(value) for value in match) for match in tuple_pattern.findall(source.split('const REFUSALS', 1)[0])]
          refusal_source = source.split('const REFUSALS: &[&str] = &[', 1)[1].split('\n];', 1)[0]
          refusals = [json.loads(value) for value in re.findall(r'^\s*(' + literal + r'),\s*$', refusal_source, re.M)]
          assert len(programs) == 16, len(programs)
          assert len(refusals) == 20, len(refusals)
          lean = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lean-4.32.0-linux/bin/lean'
          fixture = pathlib.Path(os.environ['RUNNER_TEMP']) / 'well-founded-inference-oracle.lean'
          failures = []
          def check(name, body, accepts, evaluates=False):
              fixture.write_text('import Init.WFTactics\nimport Init.Omega\n' + body + '\n')
              result = subprocess.run([str(lean), str(fixture)], text=True, capture_output=True, timeout=120)
              print('FLN_WF_ORACLE_CASE ' + name, flush=True)
              print(result.stdout, end='', flush=True)
              print(result.stderr, end='', flush=True)
              if (result.returncode == 0) != accepts:
                  failures.append((name, 'acceptance', result.returncode, accepts))
              if evaluates and re.findall(r'^\d+$', result.stdout, re.M) != ['42']:
                  failures.append((name, 'evaluation', result.stdout))
              if not accepts and ('unexpected token' in result.stdout or 'expected token' in result.stdout):
                  failures.append((name, 'syntax', result.stdout))
          for name, definition, application in programs:
              check(name, definition + '\n#eval ' + application, True, True)
          # These two native refusals are explicit capability boundaries:
          # the pin can use an earlier non-Nat SizeOf or a lexicographic tuple.
          native_only_boundaries = {14, 15}
          for index, definition in enumerate(refusals):
              check('refusal-' + str(index), definition, index in native_only_boundaries)
          assert not failures, failures
          print('FLN_WF_ORACLE_COMPLETE 16 evaluations; 18 pin refusals; 2 native capability boundaries', flush=True)
      - name: Check complete native well-founded lowering and proof replay
        if: success() || failure()
        run: cargo test --locked --offline -p fln --test source_well_founded -- --nocapture --test-threads=1
      - name: Check postponed applications with the new recursive-definition fallback
        if: success() || failure()
        run: cargo test --locked --offline -p fln --test source_postponed_applications -- --nocapture --test-threads=1

      - name: Check elaborator warnings on the exact merged implementation
        if: success() || failure()
