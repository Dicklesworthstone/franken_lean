name: Selected simplification and independent conversion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-simp-selected-unfolding.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fln-simp-selected-unfolding
  cancel-in-progress: false
jobs:
  simplify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare the configured compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/simp-landing
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/simp-landing/compiler.txt
          git rev-parse HEAD | tee target/simp-landing/input-commit.txt
      - name: Apply the exact source patch without replacing concurrent edits
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          payload = '''
          
          
          '''
          raw = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest() == 'e5ee69e02c2d0c8a2af84c9b05086c84658a64b1fa5a295c16abf35c0649d6a7', 'patch payload integrity'
          data = json.loads(raw)
          manifest = data['files']
          def digest(path):
              path = pathlib.Path(path)
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink(), 'unsafe patch target'
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
          current = {path: digest(path) for path in manifest}
          if not all(current[path] == row['after'] for path, row in manifest.items()):
              for path, row in manifest.items():
                  assert current[path] == row['before'], 'concurrent edit at ' + path
              subprocess.run(['git', 'apply', '--check', '-'], input=data['patch'].encode(), check=True)
              subprocess.run(['git', 'apply', '-'], input=data['patch'].encode(), check=True)
          for path, row in manifest.items():
              assert digest(path) == row['after'], 'post-patch digest at ' + path
          output = pathlib.Path('target/simp-landing')
          (output / 'source.patch').write_text(data['patch'])
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (output / 'paths.txt').write_text('\n'.join(manifest) + '\n')
          print('Exact source patch verified:', len(manifest), 'files')
          PY
          git diff --check
      - name: Test the independent checker and real source pipeline
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-checker --no-fail-fast 2>&1 | tee target/simp-landing/checker.log
          cargo test --locked -p fln-elab -p fln-parse --no-fail-fast 2>&1 | tee target/simp-landing/source.log
          cargo test --locked -p fln --lib --test source_automation --test source_equality --test source_rewriting --test source_file_check --no-fail-fast 2>&1 | tee target/simp-landing/engine.log
          cargo test --locked -p fln-cli --no-fail-fast 2>&1 | tee target/simp-landing/cli.log
          cargo clippy --locked -p fln-checker -p fln-elab -p fln-parse -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/simp-landing/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/simp-landing/workspace.log
          mapfile -t rust_paths < <(grep '\.rs$' target/simp-landing/paths.txt)
          rustfmt --edition 2024 --check "${rust_paths[@]}" 2>&1 | tee target/simp-landing/format.log
          cargo run --locked -p fln-cli --bin fln -- check-source --json examples/native_simplification.lean > target/simp-landing/example.json
      - name: Publish only the tested files directly to main
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, pathlib, subprocess
          manifest = json.loads(pathlib.Path('target/simp-landing/manifest.json').read_text())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) <= set(manifest), 'unexpected changed tracked path'
          for path, row in manifest.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == row['after'], 'test altered source ' + path
          subprocess.run(['git', 'add', '--', *manifest], check=True)
          PY
          if ! git diff --cached --quiet; then
            git config user.name 'FrankenLean source implementation'
            git config user.email 'noreply@github.com'
            git commit -m 'feat(elab): simplify selected definitions and repair independent conversion' -m 'Add selected safe-definition and local-let unfolding to simp only. Keep scoped let values in the independent checker reduction context and normalize reducible application heads before congruence. Full checker/source/CLI suites, engine library and source targets, scoped Clippy, formatting and all-target workspace compilation passed before this non-forced publication. No full release or general Lean parity claim.'
            git push origin HEAD:main
          fi
          git rev-parse HEAD | tee target/simp-landing/published-commit.txt
      - name: Retain exact source and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-simplification-${{ github.sha }}
          path: target/simp-landing
          if-no-files-found: error
          retention-days: 7
