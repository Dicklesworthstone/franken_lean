name: Native proof conversion integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-proof-conversion-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-land:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - name: Apply exact proof conversion and indexed data boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/proof-conversion
          git rev-parse HEAD > target/proof-conversion/tested-parent.txt
          git fetch --depth=1 origin 2fb2fa4e066f5fb173cafa16b7a23fa112c23f68
          python3 -I <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          original = subprocess.check_output(['git','show','2fb2fa4e066f5fb173cafa16b7a23fa112c23f68:.github/workflows/fln-proof-conversion-landing.yml']).decode()
          encoded = original.split("encoded = '''",1)[1].split("'''",1)[0]
          patch = zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest() == '96ba1bd8b88aced0ba5b093bdd02ac0e309203564bd04d62ef5ea25cc5341a04'
          before = {'crates/fln-elab/src/constraint/unify.rs':'f398841f810de2bbf16212e3c5cde05fe3617b2e','crates/fln-elab/src/constraint/unify/record_eta.rs':'61555cb708b11423c60a43a9de839363110bfb88','crates/fln-elab/src/constraint/unify/proof_irrelevance.rs':None,'crates/fln-elab/tests/native_proof_irrelevance.rs':None,'crates/fln-elab/tests/native_unification_record_eta.rs':'68e25ca7196d5c40050c8bf2c3e4965989bdbe97'}
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name, expected in before.items():
              path = pathlib.Path(name)
              assert (not path.exists()) if expected is None else blob(path.read_bytes()) == expected, name
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          supplement = zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(supplement).hexdigest() == 'dcd618a639740887bac9e3e0b1dcfdc5e26f374ad929f181a98b1e2cdc7dfdb3'
          subprocess.run(['git','apply','--check','-'],input=supplement,check=True)
          subprocess.run(['git','apply','-'],input=supplement,check=True)
          assert blob(pathlib.Path('crates/fln-elab/tests/native_unification_record_eta.rs').read_bytes()) == '1bc5dc877ebc2f2c148d29cce8e36fe6c5d38d76'
          pathlib.Path('target/proof-conversion/implementation.patch').write_bytes(patch+supplement)
          PY
      - name: Install configured compiler and format changed source
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/proof-conversion/compiler.txt
          rustfmt --edition 2024 --config skip_children=true crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/constraint/unify/record_eta.rs crates/fln-elab/src/constraint/unify/proof_irrelevance.rs crates/fln-elab/tests/native_proof_irrelevance.rs crates/fln-elab/tests/native_unification_record_eta.rs
      - name: Verify native proof conversion and existing elaboration
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-elab --test native_proof_irrelevance --test native_unification_record_eta --no-fail-fast 2>&1 | tee target/proof-conversion/proof-tests.log
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/proof-conversion/elab-tests.log
          cargo clippy --locked -p fln-elab --all-targets -- -D warnings 2>&1 | tee target/proof-conversion/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/proof-conversion/workspace-check.log
          git diff --check
      - name: Publish verified proof conversion directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/constraint/unify/record_eta.rs crates/fln-elab/src/constraint/unify/proof_irrelevance.rs crates/fln-elab/tests/native_proof_irrelevance.rs crates/fln-elab/tests/native_unification_record_eta.rs
          git commit -m 'feat(elab): compare existing proofs with kernel-validated proof irrelevance'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/proof-conversion/published-commit.txt
      - name: Retain exact source and verification results
        if: always()
        shell: bash
        run: |
          tar -czf target/proof-conversion/tested-source.tar.gz crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/constraint/unify/record_eta.rs crates/fln-elab/src/constraint/unify/proof_irrelevance.rs crates/fln-elab/tests/native_proof_irrelevance.rs crates/fln-elab/tests/native_unification_record_eta.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proof-conversion-${{ github.sha }}
          path: target/proof-conversion
          retention-days: 7
          if-no-files-found: error
