name: Native proof conversion integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-proof-conversion-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-land:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - name: Apply exact proof inference and source outcome integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/proof-conversion
          git rev-parse HEAD > target/proof-conversion/tested-parent.txt
          git fetch --depth=1 origin 655a8a2f1485c0447c6fc5498df74af9fae662ac
          git fetch --depth=1 origin 65cc864ba6a232f36107baef91a58de26a351cd7
          python3 -I <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          path = '.github/workflows/fln-proof-conversion-landing.yml'
          original = subprocess.check_output(['git','show','655a8a2f1485c0447c6fc5498df74af9fae662ac:'+path]).decode()
          encoded = original.split("encoded = '''",1)[1].split("'''",1)[0]
          patch = zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest() == '21b035d3c2d89f01b0b087acdd3c2fd3f07f154b43002c83d81c1cc99275dde8'
          original = subprocess.check_output(['git','show','65cc864ba6a232f36107baef91a58de26a351cd7:'+path]).decode()
          encoded = original.split("supplement = zlib.decompress(base64.b64decode('",1)[1].split("',validate=True))",1)[0]
          supplement = zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(supplement).hexdigest() == '33fb362df677ca6d011412f33fd1a0a5e41896ed8d07232543ec575dafd9676c'
          placement = zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(placement).hexdigest() == '4844f70f1b2962cd4d3049afda532dbd642f858ba7d5d6fe90077da57afe6910'
          before = {'crates/fln-cli/tests/source_proof_indices.rs':None,'crates/fln-elab/src/constraint/unify.rs':'939fca2f5545be4eeb9af96240b462d893ec756d','crates/fln-elab/src/constraint/unify/proof_irrelevance.rs':'92df7165043d3d54e0dcc7956f7122d2457b2476','crates/fln-elab/tests/native_proof_irrelevance.rs':'1dd14a1b023c74e9796cfc1d0f2360cd48998f23','crates/fln/tests/source_proof_indices.rs':None,'examples/native_proof_indices.lean':None,'crates/fln/src/source_check.rs':'040488bcc7d774939d7fe66d6fcd29eff8eea273','crates/fln-elab/src/source/tactics/backtrack.rs':'df43899ddf6b9d1e0aacdb5bead683df5e093117','crates/fln-elab/src/source/tactics/rewrite/matching.rs':'9043cb0f867d470c5284346144d7c1065846cd98','crates/fln/tests/proof_conversion_outcomes.rs':None}
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name, expected in before.items():
              path = pathlib.Path(name)
              assert (not path.exists()) if expected is None else blob(path.read_bytes()) == expected, name
          for data in [patch,supplement,placement]:
              subprocess.run(['git','apply','--check','-'],input=data,check=True)
              subprocess.run(['git','apply','-'],input=data,check=True)
          expected = {'crates/fln-elab/src/source/tactics/backtrack.rs':'df43899ddf6b9d1e0aacdb5bead683df5e093117','crates/fln-elab/src/source/tactics/rewrite/matching.rs':'5bcf27e4314abc155d004ba53cba394cf8d76d37','crates/fln/src/source_check.rs':'ed8e0db3a70be389bd6f821841d74cfab4d396af','crates/fln/tests/source_proof_indices.rs':'efde510efd401edf84d3758b9248a9ff80e9476b','examples/native_proof_indices.lean':'80e8ed4c5a1dd5199e0ca655c3158408e076b0a3','crates/fln/tests/proof_conversion_outcomes.rs':'0cb377db4b4aa2823e93e9342e052b4a44288f55'}
          for name, expected in expected.items(): assert blob(pathlib.Path(name).read_bytes()) == expected, name
          pathlib.Path('target/proof-conversion/implementation.patch').write_bytes(patch+supplement+placement)
          PY
      - name: Install configured compiler and format changed source
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/proof-conversion/compiler.txt
          rustfmt --edition 2024 --config skip_children=true crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/constraint/unify/proof_irrelevance.rs crates/fln-elab/src/source/tactics/rewrite/matching.rs crates/fln-elab/tests/native_proof_irrelevance.rs crates/fln/src/source_check.rs crates/fln/tests/source_proof_indices.rs crates/fln/tests/proof_conversion_outcomes.rs crates/fln-cli/tests/source_proof_indices.rs
      - name: Verify proof inference and source outcome authority
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/proof-conversion/elab-tests.log
          cargo test --locked -p fln --test source_proof_indices --test proof_conversion_outcomes --test source_file_check --no-fail-fast 2>&1 | tee target/proof-conversion/source-tests.log
          cargo test --locked -p fln-cli --test source_proof_indices --no-fail-fast 2>&1 | tee target/proof-conversion/cli-tests.log
          cargo clippy --locked -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/proof-conversion/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/proof-conversion/workspace-check.log
          git diff --check
      - name: Publish verified proof index inference directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/constraint/unify/proof_irrelevance.rs crates/fln-elab/src/source/tactics/rewrite/matching.rs crates/fln-elab/tests/native_proof_irrelevance.rs crates/fln/src/source_check.rs crates/fln/tests/source_proof_indices.rs crates/fln/tests/proof_conversion_outcomes.rs crates/fln-cli/tests/source_proof_indices.rs examples/native_proof_indices.lean
          git commit -m 'feat(elab): infer proof indices and preserve proof conversion outcomes end to end'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/proof-conversion/published-commit.txt
      - name: Retain exact source and verification results
        if: always()
        shell: bash
        run: |
          tar -czf target/proof-conversion/tested-source.tar.gz crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/constraint/unify/proof_irrelevance.rs crates/fln-elab/src/source/tactics/rewrite/matching.rs crates/fln-elab/tests/native_proof_irrelevance.rs crates/fln/src/source_check.rs crates/fln/tests/source_proof_indices.rs crates/fln/tests/proof_conversion_outcomes.rs crates/fln-cli/tests/source_proof_indices.rs examples/native_proof_indices.lean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proof-conversion-${{ github.sha }}
          path: target/proof-conversion
          retention-days: 7
          if-no-files-found: error
