name: Native explicit application integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-proof-conversion-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-land:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - name: Apply explicit applications with exact source guards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/explicit-application
          git rev-parse HEAD > target/explicit-application/tested-parent.txt
          python3 -I <<'PY'
          import base64,hashlib,pathlib,subprocess,zlib
          encoded = ''''''
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='ea149a056a422b5d0db8683021aed6da7294325f83b17ec9d44249a898ac6291'
          before={'crates/fln-parse/src/lib.rs':'89d86ec69bb26d62ac200846cdcda560c43e9faf','crates/fln-parse/tests/explicit_application.rs':None,'crates/fln-elab/src/source.rs':'bc0fa8701bb0769511504c49973a4bed9edd8201','crates/fln/tests/source_explicit_application.rs':None}
          after={'crates/fln-parse/src/lib.rs':'afb983dde7320b17162effd4cca25e51d180ab22','crates/fln-parse/tests/explicit_application.rs':'95dcd792a9cae2df0e3441ee161a86aafc78882b','crates/fln-elab/src/source.rs':'ae91ca774eb4d0ddaf1727a53558374e18789740','crates/fln/tests/source_explicit_application.rs':'aa03b07999c9b3871c49cb3c5b47d5c9410bc89b'}
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name,sha in before.items():
              p=pathlib.Path(name)
              assert not p.exists() if sha is None else blob(p.read_bytes())==sha,name
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name,sha in after.items():assert blob(pathlib.Path(name).read_bytes())==sha,name
          pathlib.Path('target/explicit-application/implementation.patch').write_bytes(patch)
          PY
      - name: Verify exact explicit-application source
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv > target/explicit-application/compiler.txt
          rustfmt --edition 2024 --config skip_children=true --check crates/fln-parse/src/lib.rs crates/fln-parse/tests/explicit_application.rs crates/fln-elab/src/source.rs crates/fln/tests/source_explicit_application.rs
          cargo test --locked -p fln-parse -p fln-elab --no-fail-fast 2>&1 | tee target/explicit-application/parse-elab-tests.log
          cargo test --locked -p fln --test source_explicit_application 2>&1 | tee target/explicit-application/source-tests.log
          cargo clippy --locked -p fln-parse -p fln-elab -p fln --all-targets -- -D warnings 2>&1 | tee target/explicit-application/clippy.log
          git diff --check
      - name: Publish verified explicit applications directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln-parse/src/lib.rs crates/fln-parse/tests/explicit_application.rs crates/fln-elab/src/source.rs crates/fln/tests/source_explicit_application.rs
          git commit -m 'feat(elab): parse and elaborate explicit application arguments'
          git push origin HEAD:main
          git rev-parse HEAD > target/explicit-application/published-commit.txt
      - name: Retain exact source and verification
        if: always()
        shell: bash
        run: |
          tar -czf target/explicit-application/tested-source.tar.gz crates/fln-parse/src/lib.rs crates/fln-parse/tests/explicit_application.rs crates/fln-elab/src/source.rs crates/fln/tests/source_explicit_application.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: explicit-application-${{ github.sha }}
          path: target/explicit-application
          retention-days: 7
          if-no-files-found: error
