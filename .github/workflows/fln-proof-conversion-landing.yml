name: Native proof conversion integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-proof-conversion-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-land:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - name: Apply proof-type inference and end-to-end instance regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/proof-conversion
          git rev-parse HEAD > target/proof-conversion/tested-parent.txt
          python3 -I <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '21b035d3c2d89f01b0b087acdd3c2fd3f07f154b43002c83d81c1cc99275dde8'
          before = {'crates/fln-cli/tests/source_proof_indices.rs':None,'crates/fln-elab/src/constraint/unify.rs':'939fca2f5545be4eeb9af96240b462d893ec756d','crates/fln-elab/src/constraint/unify/proof_irrelevance.rs':'92df7165043d3d54e0dcc7956f7122d2457b2476','crates/fln-elab/tests/native_proof_irrelevance.rs':'1dd14a1b023c74e9796cfc1d0f2360cd48998f23','crates/fln/tests/source_proof_indices.rs':None,'examples/native_proof_indices.lean':None}
          after = {'crates/fln-cli/tests/source_proof_indices.rs':'50ed631bb305733bc87b469f435f832fa7007b40','crates/fln-elab/src/constraint/unify.rs':'a7de7c2e1ce70cd89f685afc9607f69235837556','crates/fln-elab/src/constraint/unify/proof_irrelevance.rs':'ea5ace23edfb36bf3660163f61849e5d375a8782','crates/fln-elab/tests/native_proof_irrelevance.rs':'886ddf1151a4fca3b2b7c99a4717c309dab3cf93','crates/fln/tests/source_proof_indices.rs':'f48806d18a975bcb5a822a859bd1e6c45514ff3f','examples/native_proof_indices.lean':'d2b340d9bd91bdbf88ef9bdc85ccd172b5bf1b4e'}
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name, expected in before.items():
              path = pathlib.Path(name)
              assert (not path.exists()) if expected is None else blob(path.read_bytes()) == expected, name
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name, expected in after.items(): assert blob(pathlib.Path(name).read_bytes()) == expected, name
          pathlib.Path('target/proof-conversion/implementation.patch').write_bytes(patch)
          PY
      - name: Install configured compiler and format changed source
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/proof-conversion/compiler.txt
          rustfmt --edition 2024 --config skip_children=true crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/constraint/unify/proof_irrelevance.rs crates/fln-elab/tests/native_proof_irrelevance.rs crates/fln/tests/source_proof_indices.rs crates/fln-cli/tests/source_proof_indices.rs
      - name: Verify proof inference and both source checking engines
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/proof-conversion/elab-tests.log
          cargo test --locked -p fln --test source_proof_indices --no-fail-fast 2>&1 | tee target/proof-conversion/source-tests.log
          cargo test --locked -p fln-cli --test source_proof_indices --no-fail-fast 2>&1 | tee target/proof-conversion/cli-tests.log
          cargo clippy --locked -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/proof-conversion/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/proof-conversion/workspace-check.log
          git diff --check
      - name: Publish verified proof index inference directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/constraint/unify/proof_irrelevance.rs crates/fln-elab/tests/native_proof_irrelevance.rs crates/fln/tests/source_proof_indices.rs crates/fln-cli/tests/source_proof_indices.rs examples/native_proof_indices.lean
          git commit -m 'feat(elab): infer proof indices and select proof-indexed source instances'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/proof-conversion/published-commit.txt
      - name: Retain exact source and verification results
        if: always()
        shell: bash
        run: |
          tar -czf target/proof-conversion/tested-source.tar.gz crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/constraint/unify/proof_irrelevance.rs crates/fln-elab/tests/native_proof_irrelevance.rs crates/fln/tests/source_proof_indices.rs crates/fln-cli/tests/source_proof_indices.rs examples/native_proof_indices.lean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proof-conversion-${{ github.sha }}
          path: target/proof-conversion
          retention-days: 7
          if-no-files-found: error
