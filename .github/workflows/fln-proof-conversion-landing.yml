name: Native quotient source integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-proof-conversion-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-land:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 3
      - name: Apply exact quotient source patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/quotient-source
          git rev-parse HEAD > target/quotient-source/tested-parent.txt
          python3 -I <<'PYTHON'
          import base64, hashlib, pathlib, subprocess, zlib
          # Recover the immutable transfer payload; authenticate the complete
          # decoded patch before inspecting or changing any source file.
          carrier = subprocess.check_output(['git','show','1de2bc2118e48bd6bedfb75a4056a611eddf425c:.github/workflows/fln-proof-conversion-landing.yml']).decode()
          encoded = carrier.split("base64.b64decode('", 1)[1].split("', validate=True)", 1)[0]
          for repeated, original in [('X3gm5nc5f3gm5nc5vn','X3gm5nc5vn'),('YJi6m5vYJi6Za','YJi6Za'),('FxOavFtplxOavFxp','FxOavFxp')]:
              assert encoded.count(repeated) == 1
              encoded = encoded.replace(repeated, original, 1)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '50d352d16ae305e5523368001d9b3c5cfed0fdc9208b2a084922e71b79531a89'
          before = {'.github/workflows/fln-unifier-integration.yml': '07c0b26424d136560c13de4f1cdba55c8bf83180', 'crates/fln-cli/tests/source_quotients.rs': None, 'crates/fln-elab/src/seed.rs': '2f68b606adf63cfd400ecdfb04ef7085639e40bf', 'crates/fln-elab/src/seed/quotient.rs': None, 'crates/fln-elab/src/source/reduce.rs': 'd324e2dca31dbe6a0cb9eccd0dcb21aeac4bede2', 'crates/fln-elab/src/source/reduce/quotient.rs': None, 'crates/fln-elab/tests/support/quotient.rs': '95e9e9ab2900f17ffe8f037206d5b45d38874365', 'crates/fln/tests/source_quotients.rs': None, 'examples/native_quotients.lean': None}
          after = {'.github/workflows/fln-unifier-integration.yml': '162c1838789fbf685761c9765f533ce41deec598', 'crates/fln-cli/tests/source_quotients.rs': '23521c03093c0072b77345d1636305f206d98ce5', 'crates/fln-elab/src/seed.rs': '3047826c1e15a684fe6d377846d9492fa7cbe8d8', 'crates/fln-elab/src/seed/quotient.rs': '072fb25612910082ac48751bbf5170ca01080482', 'crates/fln-elab/src/source/reduce.rs': '150b07cbb1013b82c50ea87457efa1e40498b68b', 'crates/fln-elab/src/source/reduce/quotient.rs': 'ff769a9f46481a4d6a32fd1fdb98665d8bb87fa0', 'crates/fln-elab/tests/support/quotient.rs': '8f4cce1e27b13f8fa2faec2549a52b0a6bbd876a', 'crates/fln/tests/source_quotients.rs': '86b2e563c631b3c4b533abe04898751f7ad838e9', 'examples/native_quotients.lean': '14a0323846fd7a9868bcb84f8e48bf7020a22d41'}
          def blob(data): return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for name, expected in before.items():
              path = pathlib.Path(name)
              assert (not path.exists()) if expected is None else blob(path.read_bytes()) == expected, name
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          for name, expected in after.items():
              assert blob(pathlib.Path(name).read_bytes()) == expected, name
          pathlib.Path('target/quotient-source/implementation.patch').write_bytes(patch)
          PYTHON
      - name: Install configured compiler and format changed source
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/quotient-source/compiler.txt
          rustfmt --edition 2024 --config skip_children=true crates/fln-cli/tests/source_quotients.rs crates/fln-elab/src/seed.rs crates/fln-elab/src/seed/quotient.rs crates/fln-elab/src/source/reduce.rs crates/fln-elab/src/source/reduce/quotient.rs crates/fln-elab/tests/support/quotient.rs crates/fln/tests/source_quotients.rs
      - name: Verify source quotients and all elaboration regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/quotient-source/elab-tests.log
          cargo test --locked -p fln --test source_quotients --test source_proof_indices --no-fail-fast 2>&1 | tee target/quotient-source/source-tests.log
          cargo test --locked -p fln-cli --test source_quotients --no-fail-fast 2>&1 | tee target/quotient-source/cli-tests.log
          cargo clippy --locked -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/quotient-source/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/quotient-source/workspace-check.log
          git diff --check
      - name: Publish verified quotient source support directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/fln-unifier-integration.yml crates/fln-cli/tests/source_quotients.rs crates/fln-elab/src/seed.rs crates/fln-elab/src/seed/quotient.rs crates/fln-elab/src/source/reduce.rs crates/fln-elab/src/source/reduce/quotient.rs crates/fln-elab/tests/support/quotient.rs crates/fln/tests/source_quotients.rs examples/native_quotients.lean
          git commit -m 'feat(elab): admit and compute quotient primitives in source programs'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/quotient-source/published-commit.txt
      - name: Retain tested source and verification results
        if: always()
        shell: bash
        run: |
          tar -czf target/quotient-source/tested-source.tar.gz .github/workflows/fln-unifier-integration.yml crates/fln-cli/tests/source_quotients.rs crates/fln-elab/src/seed.rs crates/fln-elab/src/seed/quotient.rs crates/fln-elab/src/source/reduce.rs crates/fln-elab/src/source/reduce/quotient.rs crates/fln-elab/tests/support/quotient.rs crates/fln/tests/source_quotients.rs examples/native_quotients.lean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quotient-source-${{ github.sha }}
          path: target/quotient-source
          retention-days: 7
          if-no-files-found: error
