name: Native proof assertion landing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-proof-assertions-landing.yml']
permissions:
  contents: read
concurrency:
  group: fln-proof-assertions-landing
  cancel-in-progress: false
jobs:
  assertions:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'feat(source): validate and land native proof assertions'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Install the configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv
      - name: Check and publish three meaningful source increments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'proof-assertions'
          root.mkdir()
          def run(*args):
              subprocess.run(args, check=True)
          def output(*args):
              return subprocess.check_output(args).decode().strip()
          def checked(label, *args):
              with (root / (label + '.log')).open('wb') as log:
                  process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  for line in iter(process.stdout.readline, b''):
                      log.write(line)
                      print(line.decode(errors='replace'), end='', flush=True)
                  if process.wait():
                      raise RuntimeError('validation failed: ' + label)
          (root / 'base.txt').write_text(output('git', 'rev-parse', 'HEAD') + '\n')
          expected = {
              'crates/fln-parse/src/lib.rs': '15fea2045565cf619be90edd2c462c2e06c383d5',
              'crates/fln-parse/src/term_binders.rs': 'c2b9f416591958862af6b4cce2ce594fd899128a',
              'crates/fln-elab/src/source.rs': 'a6e57c2400b8b3c1119f6f3326aae1098fd03156',
              'crates/fln-elab/src/source/local_functions.rs': '6ef77b51a8704d8d583ad17105dc4f6079ffadd5',
              'crates/fln-elab/src/source/coercions.rs': 'e7ee595517ba95ed876a5c12b9537d3a444b1bf0',
              'crates/fln-elab/src/source/tactics.rs': 'b69ac7020fe1025dbd785797c25f668f0b5fb2c7',
          }
          new = {
              'crates/fln-parse/src/term_locals.rs',
              'crates/fln-parse/tests/term_assertions.rs',
              'crates/fln-elab/tests/source_term_assertions.rs',
          }
          for path, sha in expected.items():
              assert output('git', 'rev-parse', 'HEAD:' + path) == sha, 'concurrent edit: ' + path
          for path in new:
              assert not pathlib.Path(path).exists(), 'new path collision: ' + path
          chunks = []
          for sha in ['d8bcf3a9189178c52dbcf7cf8df699f0ab25f4f2', 'db2f8bb197f9e48969eaa3dc57ebf2a5e83d8924', 'f56444dc4d795a87e3b3a466f64e749c8cb9c33c']:
              request = urllib.request.Request(
                  'https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + sha,
                  headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = json.load(response)
              assert data['encoding'] == 'base64'
              chunk = base64.b64decode(data['content'])
              assert hashlib.sha1(('blob ' + str(len(chunk)) + '\0').encode() + chunk).hexdigest() == sha
              chunks.append(chunk)
          mailbox = gzip.decompress(base64.b64decode(b''.join(chunks), validate=True))
          assert hashlib.sha256(mailbox).hexdigest() == 'ee262d10471241cd234bd587c3185cc820db46a7df815a41345c4c174cdfb551'
          mbox = root / 'assertions.mbox'
          mbox.write_bytes(mailbox)
          parts = root / 'parts'
          parts.mkdir()
          run('git', 'mailsplit', '-o' + str(parts), str(mbox))
          patches = sorted(parts.iterdir())
          assert len(patches) == 3
          messages = [
              'feat(source): elaborate opaque have bindings and typed show terms',
              'feat(source): elaborate checked suffices continuations',
              'feat(parse): support multiline proof assertion continuations',
          ]
          run('git', 'config', 'user.name', 'github-actions[bot]')
          run('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          for index, (patch, message) in enumerate(zip(patches, messages), 1):
              assert not output('git', 'status', '--porcelain')
              run('git', 'fetch', 'origin', 'main')
              run('git', 'merge', '--ff-only', 'origin/main')
              run('git', 'apply', '--index', '--whitespace=error', str(patch))
              changed = output('git', 'diff', '--cached', '--name-only').splitlines()
              assert changed and set(changed) <= set(expected) | new
              run('git', 'diff', '--cached', '--check')
              checked(str(index) + '-fmt', 'rustfmt', '--edition', '2024', '--config', 'skip_children=true', '--check', *changed)
              checked(str(index) + '-parse', 'cargo', 'test', '--locked', '-p', 'fln-parse', '--', '--test-threads=1')
              checked(str(index) + '-elab', 'cargo', 'test', '--locked', '-p', 'fln-elab', '--', '--test-threads=1')
              checked(str(index) + '-clippy', 'cargo', 'clippy', '--locked', '-p', 'fln-parse', '-p', 'fln-elab', '--all-targets', '--', '-D', 'warnings')
              run('git', 'commit', '-m', message)
              run('git', 'push', 'origin', 'HEAD:main')
              (root / ('commit-' + str(index) + '.txt')).write_text(output('git', 'rev-parse', 'HEAD') + '\n')
          checked('workspace-check', 'cargo', 'check', '--locked', '--workspace', '--all-targets')
          checked('engine-tests', 'cargo', 'test', '--locked', '-p', 'fln', '--', '--test-threads=1')
      - name: Retain the exact checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof-assertions"
          git rev-parse HEAD > "$RUNNER_TEMP/proof-assertions/source-commit.txt"
          git status --porcelain > "$RUNNER_TEMP/proof-assertions/worktree-status.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/proof-assertions/source.tar.gz"
          rustc -Vv > "$RUNNER_TEMP/proof-assertions/compiler.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proof-assertions-${{ github.run_id }}
          path: ${{ runner.temp }}/proof-assertions
          retention-days: 7
          if-no-files-found: error
