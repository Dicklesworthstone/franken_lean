name: Native empty elimination
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-empty-runtime.yml'
      - 'crates/fln-comp/src/ingress/**'
      - 'crates/fln-comp/src/ingress.rs'
      - 'crates/fln-elab/src/seed/**'
      - 'crates/fln-elab/src/seed.rs'
      - 'crates/fln-elab/src/source/tactics/constructors.rs'
      - 'crates/fln-elab/src/source/tactics/constructor_transport.rs'
      - 'crates/fln/src/runtime/**'
      - 'crates/fln/src/runtime.rs'
      - 'crates/fln/tests/runtime_empty_elimination.rs'
      - 'crates/fln/tests/runtime_impossible_patterns.rs'
      - 'crates/fln-vm/tests/empty_elimination.rs'
      - 'crates/fln-cli/tests/source_empty_runtime.rs'
      - 'examples/native_empty_elimination.lean'
      - 'examples/native_impossible_patterns.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  empty:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^" ]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - name: Check non-returning bytecode and source admission
        run: |
          set -euo pipefail
          cargo test --locked -p fln-comp -p fln-vm --lib --test empty_elimination --test constructor_dispatch --test closure_interfaces
          cargo test --locked -p fln-elab
          cargo test --locked -p fln --lib --test runtime_empty_elimination --test runtime_impossible_patterns --test runtime_indexed_data --test runtime_equality_transport --test runtime_proof_data --test runtime_recursive_data --test runtime_mutual_recursion
          cargo test --locked -p fln-cli --test source_empty_runtime --test source_indexed_runtime --test source_proof_runtime
          cargo clippy --locked -p fln-comp -p fln-vm -p fln-elab -p fln --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
