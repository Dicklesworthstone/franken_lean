name: Native nested let terms
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-nested-lets.yml'
      - 'crates/fln-parse/src/**'
      - 'crates/fln-parse/tests/nested_let_terms.rs'
      - 'crates/fln/tests/source_nested_lets.rs'
      - 'crates/fln-cli/tests/source_nested_lets.rs'
      - 'examples/native_nested_lets.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nested-lets:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^" ]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - name: Check source fidelity, scope, admission and independent execution
        run: |
          set -euo pipefail
          cargo test --locked -p fln-parse -p fln-elab
          cargo test --locked -p fln --lib --test source_nested_lets --test runtime_staged_closures --test runtime_dependent_programs --test source_module_check --test source_module_session
          cargo test --locked -p fln-cli --test source_nested_lets --test source_multistage_callbacks
          cargo clippy --locked -p fln-parse -p fln --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
