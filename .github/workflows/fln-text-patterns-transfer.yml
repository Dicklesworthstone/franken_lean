name: Checked source object transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-text-patterns-transfer.yml']
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4e0b027ef535cfd89cd533f527948eae5c9eee1f
          persist-credentials: false
      - name: Transfer exact tested files without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-transfer'
          root.mkdir()
          api = 'https://api.github.com/repos/Dicklesworthstone/franken_lean'
          def request(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api + path, data=body, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == '51fb17b4132af4c7fa628098a25ec54114f8e2aa'
          source = '94916512a91ede6ef0d461da9ba4372c78f7ef4a'
          obj = request('/git/blobs/' + source)
          assert obj['encoding'] == 'base64'
          encoded = base64.b64decode(obj['content'])
          assert blob(encoded) == source
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e1f1437f48c622b2a9f208f8ed508e2b893e37d2eddee7df66f546b4ebe5d20a'
          manifest = {
              'crates/fln-parse/src/extensions.rs': ['af1bce42aabfbf9a24f5faee9d4c34efcb4abb57', '172302efcf25c2c627ac636d4882590fb08caf42'],
              'crates/fln-parse/src/matching.rs': ['bcf30e07d5afc0cf1e8dd1741d1bfbd407fdfad1', 'd74c1bd1135eb63c8895743c0c5c8773e9f77e38'],
              'crates/fln-parse/tests/quotation_trees.rs': ['9fdbb07dd49da2b0c2e8f6aa2bd355a5255d7f20', '9d47ce8fd28706c71bf0b9729f4ae3d2aaaa70ab'],
              'crates/fln-parse/tests/syntax_extensions.rs': ['febf8be24aa7a6e0ccddd89bdca7a7d5c94a1adc', '3ad7f002cfff26ebf87bfff659201ca7e8a58aa1'],
              'crates/fln/tests/source_notation.rs': ['0a34abfe320a9f74d5150b54726bf3c306845daa', '217c0473555db860add2fa49cd2902306bb0c62d'],
          }
          paths = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git a/')]
          assert sorted(paths) == sorted(manifest) and len(paths) == len(set(paths))
          assert '\ndeleted file mode ' not in patch.decode()
          for path, (before, after) in manifest.items():
              file = pathlib.Path(path)
              assert not file.is_symlink()
              assert (blob(file.read_bytes()) if file.exists() else None) == before, path
          patch_file = root / 'source.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', str(patch_file)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          for path, (before, after) in manifest.items():
              assert blob(pathlib.Path(path).read_bytes()) == after, path
          for path, (before, after) in manifest.items():
              result = request('/git/blobs', {'content': base64.b64encode(pathlib.Path(path).read_bytes()).decode(), 'encoding': 'base64'})
              assert result['sha'] == after, path
              print(after, path)
          # The connected GitHub client performs the guarded publication after
          # comparing current main. This job never creates a commit or ref.
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/source-transfer
          retention-days: 7
          if-no-files-found: error
