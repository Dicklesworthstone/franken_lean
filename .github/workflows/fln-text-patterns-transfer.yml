name: Checked source object transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-text-patterns-transfer.yml']
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3b3ab3d01438373fe23d2295408cb9e3d08fee20
          persist-credentials: false
      - name: Transfer exact tested files without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-transfer'
          root.mkdir()
          api = 'https://api.github.com/repos/Dicklesworthstone/franken_lean'
          def request(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api + path, data=body, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == 'e64e3ea63d3d7f651870fddc99504c808c74ab9f'
          source = 'd4165b73c9d054abfcdf95a9431105ae9dda741c'
          obj = request('/git/blobs/' + source)
          assert obj['encoding'] == 'base64'
          encoded = base64.b64decode(obj['content'])
          assert blob(encoded) == source
          # Repair two transport transcription bytes, never source text.
          # The intended encoded identity, complete patch and every output file
          # are independently bound below to the locally tested originals.
          assert encoded.count(b'CSSiz2Wde') == 1
          assert encoded.count(b'AV+SfjVnh') == 1
          encoded = encoded.replace(b'CSSiz2Wde', b'CSSiz2de').replace(b'AV+SfjVnh', b'AV+RfjVnh')
          assert blob(encoded) == '9e9adf246ffb798ce0e4f16ede839b148b54fddb'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '19b61d8589e3dd0141b52889909366c0da4151828b8a86ed933d23637c9d8fd3'
          manifest = {
              'crates/fln-elab/src/source/matching.rs': ['7bd2aaf959e2160420878c028dbc08def5c3aaf3', 'dc7c1c1f674ffe5bb63256be3a4a95acfdf7290b'],
              'crates/fln/src/source_check/grammar.rs': ['6bedc1d1523b6c214766c11f3417ded82c844bd0', 'bbec21fb6618bea9c0aa1aa845c03cab9900a51e'],
              'crates/fln/src/source_check/grammar/quotation_scope.rs': ['2e383e045cb1900eece94227791dc1cc6176fb5f', '895a38b7f5f02f54bdce7838a7c92df42f840a96'],
              'crates/fln/src/source_check/grammar/quotation_scope/matches.rs': [None, '6e28f6652e000ea90d7b6753b08b3d74e6a5c5a8'],
              'crates/fln/tests/source_quotation_scope.rs': ['bffc47bcc75f4c082c82b4ea51c18f96ae118cf7', '48c2cf7434b6ae7b2f24ff7dc65afd809f494e8f'],
          }
          paths = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git a/')]
          assert sorted(paths) == sorted(manifest) and len(paths) == len(set(paths))
          assert '\ndeleted file mode ' not in patch.decode()
          for path, (before, after) in manifest.items():
              file = pathlib.Path(path)
              assert not file.is_symlink()
              assert (blob(file.read_bytes()) if file.exists() else None) == before, path
          patch_file = root / 'source.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', str(patch_file)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          for path, (before, after) in manifest.items():
              assert blob(pathlib.Path(path).read_bytes()) == after, path
          for path, (before, after) in manifest.items():
              result = request('/git/blobs', {'content': base64.b64encode(pathlib.Path(path).read_bytes()).decode(), 'encoding': 'base64'})
              assert result['sha'] == after, path
              print(after, path)
          # The connected GitHub client performs the guarded publication after
          # comparing current main. This job never creates a commit or ref.
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/source-transfer
          retention-days: 7
          if-no-files-found: error
