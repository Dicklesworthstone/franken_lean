name: Native mutually indexed runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-mutual-indexed-runtime.yml'
      - 'crates/fln/src/runtime/**'
      - 'crates/fln/src/runtime.rs'
      - 'crates/fln/src/lib.rs'
      - 'crates/fln-comp/src/**'
      - 'crates/fln/tests/runtime_mutual_indexed.rs'
      - 'crates/fln-cli/tests/source_mutual_indexed.rs'
      - 'examples/native_mutual_indexed.lean'
      - 'crates/fln/tests/runtime_mutual_function_children.rs'
      - 'crates/fln-cli/tests/source_mutual_function_children.rs'
      - 'examples/native_mutual_function_children.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutual-indexed:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^" ]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - name: Check peer indices, strictness, layout guards and independent replay
        run: |
          set -euo pipefail
          cargo test --locked -p fln --test runtime_mutual_function_children
          cargo test --locked -p fln-cli --test source_mutual_function_children
          cargo test --locked -p fln --lib --test runtime_mutual_indexed --test runtime_mutual_recursion --test runtime_mutual_data --test runtime_indexed_data --test runtime_indexed_function_children --test runtime_impossible_patterns --test runtime_staged_closures --test runtime_proof_data --test runtime_equality_transport
          cargo test --locked -p fln --test source_mutual_cases --test source_mutual_matching --test source_module_check --test source_module_session
          cargo test --locked -p fln-cli --test source_mutual_indexed --test source_empty_runtime --test source_indexed_runtime --test source_proof_runtime
          cargo clippy --locked -p fln --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
