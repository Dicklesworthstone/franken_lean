name: IR graph archive activation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/fln-hash/src/ir_graph.rs'
      - 'crates/fln-olean/src/ir_archive.rs'
      - 'scripts/register_ir_graph_codec.py'
      - 'scripts/register_ir_graph_cli.py'
      - '.github/patches/ir-graph-cli/**'
      - '.github/workflows/ir-archive-landing.yml'
permissions:
  contents: write
concurrency:
  group: ir-archive-activation
  cancel-in-progress: true
jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Register the codec without rewriting historical evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git rev-parse HEAD
          rustup show active-toolchain
          mkdir -p "$RUNNER_TEMP/ir-archive-evidence"
          python3 -I scripts/register_ir_graph_codec.py | tee "$RUNNER_TEMP/ir-archive-evidence/registration.log"
      - name: Install the exact command sources and executable tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/register_ir_graph_cli.py | tee "$RUNNER_TEMP/ir-archive-evidence/command-install.log"
      - name: Format the codec, commands and their existing IR dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The prior IR run produced a real formatting failure. Format these
          # existing IR files too; do not suppress or skip the formatting gate.
          rustfmt --edition 2024 --config skip_children=true \
            crates/fln-hash/src/ir_graph.rs crates/fln-hash/src/canon.rs \
            crates/fln-hash/src/domain.rs crates/fln-hash/src/lib.rs \
            crates/fln-hash/tests/domain_enforcement.rs \
            crates/fln-olean/src/ir_archive.rs crates/fln-olean/src/lib.rs \
            crates/fln-olean/src/ir_validate.rs crates/fln-olean/src/ir_types.rs \
            crates/fln-olean/src/ir_files.rs crates/fln-olean/src/ir_files/type_tests.rs \
            crates/fln-olean/tests/ir_validate.rs crates/fln-olean/tests/ir_validated_graph.rs \
            crates/fln-olean/tests/ir_files.rs crates/fln-olean/tests/ir_types.rs \
            crates/fln-olean/tests/ir_type_cli.rs \
            crates/fln-olean/src/bin/fln-ir-check.rs \
            crates/fln-olean/src/bin/fln-ir-graph.rs \
            crates/fln-olean/src/bin/ir_support/mod.rs \
            crates/fln-olean/tests/ir_archive_cli.rs
      - name: Run both complete package suites including real command tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-hash -p fln-olean 2>&1 | tee "$RUNNER_TEMP/ir-archive-evidence/tests.log"
      - name: Clippy both packages without warning exemptions
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p fln-hash -p fln-olean --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/ir-archive-evidence/clippy.log"
      - name: Compile workspace consumers of the registry
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/ir-archive-evidence/workspace-check.log"
      - name: Publish only the tested registration and command sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import subprocess
          legacy_format_only = {
              'crates/fln-olean/src/ir_validate.rs', 'crates/fln-olean/src/ir_types.rs',
              'crates/fln-olean/src/ir_files.rs', 'crates/fln-olean/src/ir_files/type_tests.rs',
              'crates/fln-olean/tests/ir_validate.rs', 'crates/fln-olean/tests/ir_validated_graph.rs',
              'crates/fln-olean/tests/ir_files.rs', 'crates/fln-olean/tests/ir_types.rs',
              'crates/fln-olean/tests/ir_type_cli.rs',
          }
          allowed = legacy_format_only | {
              'crates/fln-hash/src/canon.rs', 'crates/fln-hash/src/domain.rs',
              'crates/fln-hash/src/lib.rs', 'crates/fln-hash/src/ir_graph.rs',
              'crates/fln-hash/tests/domain_enforcement.rs',
              'crates/fln-hash/fixtures/ir_domain_vectors.txt',
              'crates/fln-olean/src/lib.rs', 'crates/fln-olean/src/ir_archive.rs',
              'crates/fln-olean/src/bin/fln-ir-check.rs',
              'crates/fln-olean/src/bin/fln-ir-graph.rs',
              'crates/fln-olean/src/bin/ir_support/mod.rs',
              'crates/fln-olean/tests/ir_archive_cli.rs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          if (changed | untracked) - allowed:
              raise SystemExit(f'unexpected publication set: {changed | untracked}')
          # Enforce that inherited files are exactly rustfmt outputs of HEAD;
          # none of their assertions or implementation can be changed here.
          from pathlib import Path
          import tempfile
          for path in sorted(changed & legacy_format_only):
              original = subprocess.check_output(['git', 'show', 'HEAD:' + path])
              with tempfile.TemporaryDirectory() as directory:
                  candidate = Path(directory) / Path(path).name
                  candidate.write_bytes(original)
                  subprocess.run(['rustfmt', '--edition', '2024', '--config-path', 'rustfmt.toml', '--config', 'skip_children=true', str(candidate)], check=True)
                  if candidate.read_bytes() != Path(path).read_bytes():
                      raise SystemExit(f'non-formatting change in inherited IR file: {path}')
          if changed or untracked:
              subprocess.run(['git', 'add', '--', *sorted(changed | untracked)], check=True)
          PY
          if git diff --cached --quiet; then
            echo 'No uncommitted registration or command changes; tests verified existing source.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'feat(olean): activate tested reusable IR graph archives and file-only queries' \
            -m 'Both hash/codec package suites, package Clippy, and workspace compilation completed in this workflow. New hash domains are frozen separately; historical vectors and host attestations are unchanged. Existing IR changes are checked against exact rustfmt outputs. Archives and query results remain analysis data, not execution or kernel authority.'
          git rev-parse HEAD | tee "$RUNNER_TEMP/ir-archive-evidence/tested-commit.txt"
          # No force/rebase: a concurrent advance must be reconciled and re-tested.
          git push origin HEAD:main
      - name: Retain logs and the exact working-tree correction
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ir-archive-evidence"
          git diff HEAD -- > "$RUNNER_TEMP/ir-archive-evidence/working-tree.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/ir-archive-evidence/checkout.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ir-archive-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ir-archive-evidence
          if-no-files-found: error
