name: Native goal inspection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-goal-inspection.yml'
      - 'crates/fln-elab/src/source/**'
      - 'crates/fln-elab/src/source.rs'
      - 'crates/fln/src/source_check/**'
      - 'crates/fln-server/src/dispatch/**'
      - 'crates/fln-server/src/dispatch.rs'
      - 'crates/fln-cli/src/source_check/**'
      - 'crates/fln/tests/source_goal_inspection.rs'
      - 'crates/fln-cli/tests/lsp_goals.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  goals:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply exact locally checked native inspection implementation
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[land-native-inspection]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          chunks = ['e6aeaebe6b3b058c1b59504594279fe839e3d8a3', '81e34afba0244e5483bb9bcab573e14bf8acc53f', 'ef60deada44c2a4a98b0675632abb6b7bc3df2aa', '6056498c516e4c8e3bbec5ccbd27d749fb18dc4d', 'd54262a5a80fdf1bbb6c2ce12ffb34236951384b', 'fbf88c5b8df39f4df7ee70abbb0907649de172c4', '1af21c4322f8eeaaa39722720ebdf14f5b262854']
          compressed = bytearray()
          for sha in chunks:
              req = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  blob = json.load(response)
              assert blob['encoding'] == 'base64'
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest() == sha
              compressed.extend(data)
          payload = gzip.decompress(compressed)
          assert hashlib.sha256(payload).hexdigest() == '025e09866591ad5923239bc8a1aa049f9d123865d83db861826d490e30b1005d'
          bundle = json.loads(payload)
          allowed = {'crates/fln-elab/src/source.rs', 'crates/fln-elab/src/source/inspect.rs', 'crates/fln-elab/src/source/tactics.rs', 'crates/fln-elab/src/source/tactics/eliminate.rs', 'crates/fln-elab/src/source/tactics/search.rs', 'crates/fln-parse/src/proofs.rs', 'crates/fln-parse/tests/term_assertions.rs', 'crates/fln/src/source_check.rs', 'crates/fln/src/source_check/inspect.rs', 'crates/fln/src/source_check/modules/cache.rs', 'crates/fln/tests/source_goal_inspection.rs'}
          assert set(bundle['preimages']) == allowed
          for name, sha in bundle['preimages'].items():
              path = pathlib.Path(name)
              assert path.parts[0] == 'crates' and '..' not in path.parts
              if sha is None:
                  assert not path.exists(), name
              else:
                  actual = subprocess.check_output(['git', 'hash-object', '--', name], text=True).strip()
                  assert actual == sha, (name, actual, sha)
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-inspection.patch'
          patch.write_text(bundle['patch'])
          assert '\ndeleted file mode ' not in bundle['patch']
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          actual = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(actual) == allowed
      - name: Install exact repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
          rustc -Vv
      - name: Check native goal and protocol consumers
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/native-inspection-validation.log") 2>&1
          git rev-parse HEAD
          cargo test --locked -p fln --test source_goal_inspection --test source_module_check --test source_module_session
          cargo test --locked -p fln-parse --test term_assertions
          cargo clippy --locked -p fln-elab -p fln --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
          git diff --cached --check
      - name: Publish tested implementation directly to main
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[land-native-inspection]')
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(elab): inspect native proof goals and terms against checked source prefixes'
          git rev-parse HEAD | tee "$RUNNER_TEMP/native-inspection-commit.txt"
          git push origin HEAD:main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-inspection-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-inspection-validation.log
            ${{ runner.temp }}/native-inspection-commit.txt
          retention-days: 7
          if-no-files-found: error
