name: Native source integration snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-native-source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logical-rewriting:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'feat(source): land checked Iff')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply the exact locally checked logical rewriting increment
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'logical-rewriting'
          evidence.mkdir()
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '9fd9f6dd1032eda8a79aa1545f08508819cc6d25bbf6ebd0b29cd8d8c1116142'
          (evidence / 'patch.diff').write_bytes(patch)
          (evidence / 'base.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          subprocess.run(['git', 'apply', '--check', str(evidence / 'patch.diff')], check=True)
          subprocess.run(['git', 'apply', str(evidence / 'patch.diff')], check=True)
          expected = {
              'crates/fln-cli/tests/source_logical_rewriting.rs': 'a3a80286621001005794e59c5cbdb096f6a94497',
              'crates/fln-elab/src/seed.rs': '2ab4190e6e1804a99eb104da636b3f0335f9bbdb',
              'crates/fln-elab/src/seed/logic.rs': '26743cac47c634d4581bc0cfc1a00a681a4abab6',
              'crates/fln-elab/src/source/scope/simp.rs': 'e0dde49f5177d98da4bf2da0f124d9c8b8d204fe',
              'crates/fln-elab/src/source/tactics/rewrite/matching.rs': '410b8618f122e3e656a9e4ae93e6c383e70c854f',
              'crates/fln/tests/source_logical_rewriting.rs': '0f82296faa204437e2a4ea1e3f08ee4c8ae3593f',
              'docs/NATIVE_SOURCE_PROOFS.md': 'cc1aa9f999e2520de72c6120bc26277ba08a0ec1',
              'examples/native_logical_rewriting.lean': '9cbb1b294b0635660052855e6940e6275b0b5d24',
          }
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          (evidence / 'files.json').write_text(json.dumps(expected, indent=2))
      - name: Verify native proof production and installed command
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/logical-rewriting/validation.log") 2>&1
          rustup show active-toolchain
          cargo test --locked -p fln-parse -p fln-elab --no-fail-fast
          cargo test --locked -p fln --test source_logical_rewriting --test source_default_simp --test source_automation --test source_rewrite_locations
          cargo test --locked -p fln-cli --test source_logical_rewriting --test source_default_simp
          cargo clippy --locked -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings
          git diff --check
      - name: Commit checked functionality directly to main
        shell: python
        run: |
          import json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'logical-rewriting'
          expected = json.loads((evidence / 'files.json').read_text())
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          subprocess.run(['git', 'add', '--', *expected], check=True)
          actual = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(actual) == sorted(expected), actual
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'feat(simp): compile Iff rewrites through explicit propositional extensionality\n\nSupport quantified and conditional Iff rules in rw, rewrite, simp only, and registered simp sets, at goals and named hypotheses. Seed the standard explicit propext axiom after the admitted Iff block and preserve its original proof in ordinary checked equality transports. No new kernel conversion, arbitrary theorem axioms, or weakened checker veto.\n\nAdd six engine regressions, installed multi-file failure/recovery coverage, and a runnable example. Native parser/elaborator packages, focused engine and CLI tests, scoped all-target Clippy, and whitespace checks passed before this direct-main publication. Full workspace and Reference parity are not claimed.'], check=True)
          (evidence / 'commit.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: logical-rewriting-${{ github.sha }}
          path: ${{ runner.temp }}/logical-rewriting
          retention-days: 7
