name: Native source integration snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-native-source-snapshot.yml']
permissions:
  contents: read
jobs:
  proposition-simp:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'feat(source): land checked proposition')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply the digest-checked native proposition implementation
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'proposition-simp'
          evidence.mkdir()
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5840382858c23a9e4e5401fcb49fc2db00f99e45c2a8fbe367fb6278f30920a9'
          (evidence / 'patch.diff').write_bytes(patch)
          (evidence / 'base.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          subprocess.run(['git', 'apply', '--check', str(evidence / 'patch.diff')], check=True)
          subprocess.run(['git', 'apply', str(evidence / 'patch.diff')], check=True)
          expected = {'crates/fln-cli/tests/source_logical_rewriting.rs': '20e8fc4accd94709a42b65357ac5de7f642d4681', 'crates/fln-elab/src/source/scope/simp.rs': 'a98f6e3bcbe9bc523801b192aeec209b5dcb563e', 'crates/fln-elab/src/source/tactics/rewrite/matching.rs': '932a287e9e7c4801dd62a1c133ce4880262be457', 'crates/fln-elab/src/source/tactics/rewrite/simplify.rs': 'e1ec412dc690435002f1818793fff78dc7127624', 'crates/fln/tests/source_default_simp.rs': '7628c32a1300fced09894ef659e15dc8230353b9', 'crates/fln/tests/source_logical_rewriting.rs': '31a6524e3a979e87319184efd102ce0e3ce1abc5', 'docs/NATIVE_SOURCE_PROOFS.md': 'cc9591fc97c6c28fcac0eb3004cd116aa9c2727d', 'examples/native_logical_rewriting.lean': '86223b323316a201e2ff61251f89e7853a72d28b'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          (evidence / 'files.json').write_text(json.dumps(expected, indent=2))
      - name: Exercise checked proofs, refusals, installed command, and lints
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/proposition-simp/validation.log") 2>&1
          rustup show active-toolchain
          cargo test --locked -p fln --test source_logical_rewriting --test source_default_simp --test source_automation --test source_rewrite_locations
          cargo test --locked -p fln-cli --test source_logical_rewriting
          cargo clippy --locked -p fln-elab --all-targets -- -D warnings
          git diff --check
      - name: Commit the tested functionality directly to main
        shell: python
        run: |
          import json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'proposition-simp'
          expected = json.loads((evidence / 'files.json').read_text())
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
          subprocess.run(['git', 'add', '--', *expected], check=True)
          assert sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()) == sorted(expected)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'feat(simp): rewrite proved and refuted propositions with checked evidence\n\nCompile selected positive facts to True and negations to False through Iff.intro, False.rec, explicit propext and ordinary equality transport. Preserve quantified parameter inference, selected conditional premises, both admission vetoes and typed resource stops. Support forward registered theorem facts and close True with checked True.intro.\n\nAdd engine, installed-command, negative and immutable-registry regressions and expand the runnable logical rewriting example. This is bounded native proof automation, not full Lean simp or release-gate parity.'], check=True)
          (evidence / 'commit.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proposition-simp-${{ github.sha }}
          path: ${{ runner.temp }}/proposition-simp
          retention-days: 7
          if-no-files-found: warn
