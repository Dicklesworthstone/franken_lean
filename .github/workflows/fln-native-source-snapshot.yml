name: Native source integration snapshot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-native-source-snapshot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export exact native integration input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/native-source-snapshot
          git archive --format=tar.gz HEAD > target/native-source-snapshot/source.tar.gz
          git rev-parse HEAD > target/native-source-snapshot/source-commit.txt
          git rev-parse 'HEAD^{tree}' > target/native-source-snapshot/source-tree.txt
          sha256sum target/native-source-snapshot/source.tar.gz > target/native-source-snapshot/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-source-snapshot-${{ github.sha }}
          path: target/native-source-snapshot
          retention-days: 1
          if-no-files-found: error
