name: Native checker frontier
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/native-checker-frontier.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validated-source-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/checker-cycle-target
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Stage the exact regression input
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request
          path = pathlib.Path('crates/fln-checker/src/whnf.rs')
          data = path.read_bytes()
          digest = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          assert digest == '79d80c6e5bf599a246c2a50d6d8befd174b7dc2c', 'source changed; reconcile before staging'
          sha = '7172e83f1a247afef4cd3934f4ad0bd2db9badfc'
          request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              blob = json.load(response)
          assert blob['encoding'] == 'base64'
          data = base64.b64decode(blob['content'])
          assert hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest() == sha
          target = pathlib.Path('crates/fln-checker/tests/free_binding_reuse.rs')
          with target.open('xb') as output:
              output.write(data)
      - name: Install the repository's pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Reproduce the original fault, then verify the repair
        shell: python
        run: |
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'checker-cycle-evidence'
          root.mkdir()
          test = 'crates/fln-checker/tests/free_binding_reuse.rs'
          subprocess.run(['rustfmt', '--edition', '2024', test], check=True)
          command = ['cargo', 'test', '--locked', '-p', 'fln-checker', '--test', 'free_binding_reuse',
              'repeated_identity_binding_after_beta_is_not_a_cycle', '--', '--exact']
          baseline = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          (root / 'baseline.log').write_text(baseline.stdout)
          print(baseline.stdout, flush=True)
          assert baseline.returncode != 0 and 'running 1 test' in baseline.stdout and 'FreeBindingCycle' in baseline.stdout, 'baseline did not reproduce the named defect'
          path = pathlib.Path('crates/fln-checker/src/whnf.rs')
          source = path.read_text()
          anchor = '''            if !pending_arguments.is_empty()
                          && matches!(self.node(&current)?, ExprNode::Lambda { .. })
                      {
                          self.control
                              .reduction(current.root.index(), self.cancelled)?;'''
          # Preserve the exact source indentation rather than YAML indentation.
          anchor = '\n'.join(line[10:] if index else line for index, line in enumerate(anchor.splitlines()))
          assert source.count(anchor) == 1, 'beta anchor is not unique'
          insertion = '''
                          // This is a new reduction problem, not another edge of the
                          // free-alias chain. For example f (f x), with f := fun x => x,
                          // legitimately unfolds f again after consuming its argument.
                          // Alias-only cycles remain guarded; recursive beta computation
                          // is bounded by the ordinary reduction budget and cancellation.
                          self.unfolded_bindings.clear();'''
          insertion = '\n'.join(line[10:] if index else line for index, line in enumerate(insertion.splitlines()))
          path.write_text(source.replace(anchor, anchor + insertion))
          commands = [
              ['cargo', 'fmt', '--package', 'fln-checker', '--', '--check'],
              ['cargo', 'test', '--locked', '-p', 'fln-checker'],
              ['cargo', 'clippy', '--locked', '-p', 'fln-checker', '--all-targets', '--', '-D', 'warnings'],
              ['git', 'diff', '--check'],
          ]
          for index, command in enumerate(commands):
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (root / ('check-' + str(index) + '.log')).write_text(result.stdout)
              print('COMMAND ' + json.dumps(command) + '\n' + result.stdout, flush=True)
              assert result.returncode == 0, command
          (root / 'validation.json').write_text(json.dumps({'base': os.environ['GITHUB_SHA'],
              'baseline_reproduced': True, 'commands': commands, 'corpus_replay': 'not_run'}, indent=2))
      - name: Publish validated source objects without modifying a branch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'checker-cycle-evidence'
          validation = json.loads((root / 'validation.json').read_text())
          paths = ['crates/fln-checker/src/whnf.rs', 'crates/fln-checker/tests/free_binding_reuse.rs']
          blobs = {}
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs',
                  data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == expected
              blobs[path] = expected
              target = root / 'source' / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          receipt = {**validation, 'blobs': blobs, 'published_branch': False}
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2))
          print('VALIDATED_CHECKER_SOURCE_OBJECTS ' + json.dumps(receipt), flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checker-cycle-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/checker-cycle-evidence
          retention-days: 7
          if-no-files-found: error
