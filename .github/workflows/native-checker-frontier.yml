name: Native checker frontier
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/native-checker-frontier.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validated-source-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reproduce and validate the exact checker repair
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/checker-cycle-target
          CARGO_BUILD_JOBS: 2
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, sys, urllib.request
          sha = '1576bf8a2ce55bac015cb27e47d1c20f366f92dc'
          request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              blob = json.load(response)
          assert blob['encoding'] == 'base64'
          data = base64.b64decode(blob['content'])
          assert hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest() == sha
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'checker-cycle-repair.py'
          with target.open('xb') as output:
              output.write(data)
          subprocess.run([sys.executable, str(target)], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checker-cycle-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/checker-cycle-evidence
          retention-days: 7
          if-no-files-found: error
