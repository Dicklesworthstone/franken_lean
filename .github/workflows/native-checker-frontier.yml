name: Native checker frontier

on:
  push:
    branches: [main]
    paths:
      - crates/fln-admission/**
      - crates/fln/tests/provisional_frontier.rs
      - Cargo.lock
      - SUITE.lock
      - rust-toolchain.toml
      - .github/workflows/native-checker-frontier.yml
  pull_request:
    branches: [main]
    paths:
      - crates/fln-admission/**
      - crates/fln/tests/provisional_frontier.rs
      - Cargo.lock
      - SUITE.lock
      - rust-toolchain.toml
      - .github/workflows/native-checker-frontier.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checker-frontier-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Provision the locked suite dependency
        run: bash scripts/ci/checkout_asupersync.sh
      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version
      - name: Format the frontier implementation and regression tests
        run: rustfmt --edition 2024 --check crates/fln-admission/src/provisional.rs crates/fln/tests/provisional_frontier.rs
      - name: Check admission targets and provisional integration tests
        if: ${{ !cancelled() }}
        run: |
          cargo check --locked -p fln-admission --all-targets
          cargo check --locked -p fln --test provisional_frontier
      - name: Test admission and provisional scheduling
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p fln-admission --no-fail-fast
          cargo test --locked -p fln --test provisional_frontier --no-fail-fast
      - name: Clippy admission targets and provisional integration tests
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --locked -p fln-admission --all-targets -- -D warnings
          cargo clippy --locked -p fln --test provisional_frontier -- -D warnings
