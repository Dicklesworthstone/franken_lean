name: Native checker frontier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-checker-frontier.yml'
      - 'crates/fln-checker/**'
      - 'crates/fln-core/**'
      - 'crates/fln-env/**'
      - 'crates/fln-bignum/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-checker-frontier
  cancel-in-progress: false
jobs:
  independent-admission:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Retain companion documentation and linker executables
        working-directory: /tmp
        run: |
          root="$(rustc --print sysroot)"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p "$RUNNER_TEMP/checker-compiler"
          cd "$root"
          tar -czf "$RUNNER_TEMP/checker-compiler/companion.tar.gz" bin/rustdoc "lib/rustlib/$host/bin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checker-companion-${{ github.sha }}
          path: ${{ runner.temp }}/checker-compiler
          retention-days: 2
          if-no-files-found: error
      - name: Validate exact implementation and retain source objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/Dicklesworthstone/franken_lean'
          def request(path, data=None):
              req = urllib.request.Request(api + path, data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          before = {
              'crates/fln-checker/src/admit.rs': '2a23906d44cb63b93e1ee01ae1a0332dc7c01127',
              'crates/fln-checker/src/admit/uniform.rs': '966d5b9c9061bd17f35a152f44fb5187ab9cb66e',
              'crates/fln-checker/src/admit/uniform/mutual.rs': '2bcf6aac303b78a5a6abd93e3350c9fd340071cb',
              'crates/fln-checker/src/admit/uniform/nested.rs': 'a4300f1b59602e26f88ec8008829132556c0a4c0',
              'crates/fln-checker/tests/admit.rs': '91a2008447dd2337153c171f0406ae2c8a2ecdc1',
              'crates/fln-checker/tests/admit/higher_order.rs': '8213d68531c2d3842c84be5228e4fc3de355af83',
          }
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'checker-result'
          root.mkdir()
          for path, expected in before.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          patches = [
              ('fb772a4557ed6a40a19422c13e30367afa430503', '1415418ba23839d2f25e87099eb7a38fc35757fe7aa0a95d50cd2b129381e626'),
              ('c4c79f0b98a6700633c19631e405b622a632a405', '6171d5d6db82f789c212b0bfba7b1426cb012542554278b9268041845b825786'),
          ]
          for index, (sha, digest) in enumerate(patches):
              result = request('/git/blobs/' + sha)
              assert result['encoding'] == 'base64'
              patch = base64.b64decode(result['content'])
              assert hashlib.sha256(patch).hexdigest() == digest
              text = patch.decode()
              paths = [line.split(' b/', 1)[1] for line in text.splitlines() if line.startswith('diff --git a/')]
              assert set(paths).issubset(before) and len(paths) == len(set(paths))
              assert '\ndeleted file mode ' not in text
              file = root / ('implementation-' + str(index) + '.patch')
              file.write_bytes(patch)
              subprocess.run(['git', 'apply', '--index', '--whitespace=error', str(file)], check=True)
          changes = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines()
          assert sorted(changes) == sorted(before), changes
          for path in changes:
              target = root / 'source' / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(pathlib.Path(path).read_bytes())
          checks = [
              ['cargo', 'fmt', '--check', '-p', 'fln-checker'],
              ['cargo', 'test', '--locked', '-p', 'fln-checker', '--no-fail-fast'],
              ['cargo', 'clippy', '--locked', '-p', 'fln-checker', '--all-targets', '--', '-D', 'warnings'],
          ]
          for index, command in enumerate(checks):
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (root / ('check-' + str(index) + '.log')).write_text(result.stdout)
              print(result.stdout, flush=True)
              result.check_returncode()
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          blobs = {}
          for path in changes:
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
              result = request('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert result['sha'] == expected
              blobs[path] = expected
          receipt = {'base': os.environ['GITHUB_SHA'], 'before': before, 'blobs': blobs, 'tests': 'passed', 'clippy': 'passed', 'published_branch': False}
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt, indent=2), flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checker-result-${{ github.sha }}
          path: ${{ runner.temp }}/checker-result
          retention-days: 2
          if-no-files-found: error
