name: Native collection runtime integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-collection-runtime.yml'
      - 'crates/fln/src/lib.rs'
      - 'crates/fln/src/runtime.rs'
      - 'crates/fln/src/runtime/**'
      - 'crates/fln/tests/runtime_parameterized_data.rs'
      - 'crates/fln-cli/tests/source_collections.rs'
      - 'examples/native_collection_runtime.lean'
permissions:
  contents: read
jobs:
  collections:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - name: Check collection execution and installed bytecode replay
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln --test runtime_parameterized_data
          cargo test --locked -p fln-cli --test source_collections
          cargo clippy --locked -p fln --all-targets -- -D warnings
          cargo clippy --locked -p fln-cli --test source_collections -- -D warnings
          cargo check --locked --workspace --all-targets
