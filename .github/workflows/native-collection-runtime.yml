name: Native collection runtime integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-collection-runtime.yml']
permissions:
  contents: read
jobs:
  source-object:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'build(runtime): stage digest-verified ground-data source object'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Materialize one exact source blob without publishing a branch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          path = pathlib.Path('crates/fln/src/lib.rs')
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          assert blob(path.read_bytes()) == '64efd0740c2c064cacc70f5147f4d9aac9facc4b'
          encoded = ''
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ground-data-types.patch'
          patch.write_bytes(base64.b64decode(encoded, validate=True))
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', str(patch)], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert changed == [str(path)]
          content = path.read_bytes()
          expected = '5a718efb75ba9dbb0a6b1daf62d2d713b24e6861'
          assert blob(content) == expected
          request = urllib.request.Request(
              'https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs',
              data=json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0'},
              method='POST')
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == expected
          receipt = {'path': str(path), 'sha': expected, 'branchPublished': False}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-object.json').write_text(json.dumps(receipt))
          print(json.dumps(receipt))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ground-data-source-object-${{ github.sha }}
          path: ${{ runner.temp }}/source-object.json
          retention-days: 3
          if-no-files-found: error
