# One-shot, fail-closed landing lane for the fln-51y8 HEq semantic unit.
# Remove this workflow after either landing path records the verified commit.
name: fln-51y8 HEq verified landing

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths: [.github/workflows/fln-51y8-heq-landing.yml]

jobs:
  verify_and_land:
    if: github.event.head_commit.message == 'chore(agent): launch macOS-verified fln-51y8 HEq landing'
    runs-on: macos-14
    timeout-minutes: 90
    env:
      EXPECTED_ADMIT_BLOB: 9a8ce762c5c3cf4463797bf4127051e992adac2e
      EXPECTED_TEST_BLOB: 85cb88c0e2942c31b76110ac38bb107486996f87
      BR_REV: d2393c99ddcf337bd77d4ba61ce29ea8cdbe715b
      BR_TOOLCHAIN: nightly-2026-08-25
      PATCH_GZ_B64: 
      AGENT_NAME: gpt-5.6-pro
    steps:
      - name: checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I - <<'PY2'
          import pathlib
          import tomllib
          value = tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          if not isinstance(value, str) or not value.startswith('nightly-'):
              raise SystemExit(f'not an exact nightly channel: {value!r}')
          print(value)
          PY2
          )"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy

      - name: rebase and verify immutable patch anchors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6 Pro'
          git config user.email 'noreply@openai.com'
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            git rebase origin/main
          fi
          test "$(git hash-object crates/fln-checker/src/admit.rs)" = "$EXPECTED_ADMIT_BLOB"
          test "$(git hash-object crates/fln-checker/tests/admit.rs)" = "$EXPECTED_TEST_BLOB"

      - name: apply the HEq semantic unit
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY2'
          import base64
          import gzip
          import os
          import pathlib
          payload = base64.b64decode(os.environ['PATCH_GZ_B64'], validate=True)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'heq.patch').write_bytes(gzip.decompress(payload))
          PY2
          git apply --check "$RUNNER_TEMP/heq.patch"
          git apply "$RUNNER_TEMP/heq.patch"
          git diff --check --             crates/fln-checker/src/admit.rs             crates/fln-checker/tests/admit.rs

      - name: verify the exact and full checker surfaces
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test -p fln-checker --test admit \
            kr600_803_init_heq_block_is_reconstructed -- --exact --nocapture
          cargo test --no-fail-fast -p fln-checker
          cargo clippy -p fln-checker --all-targets -- -D warnings

      - name: commit and push the verified code
        shell: bash
        run: |
          set -euo pipefail
          git commit -o -m 'fix(checker): reconstruct pinned HEq hygienic recursor' \
            crates/fln-checker/src/admit.rs \
            crates/fln-checker/tests/admit.rs
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            git rebase origin/main
            cargo fmt --all --check
            cargo test -p fln-checker --test admit \
              kr600_803_init_heq_block_is_reconstructed -- --exact --nocapture
            cargo test --no-fail-fast -p fln-checker
            cargo clippy -p fln-checker --all-targets -- -D warnings
          fi
          git push origin HEAD:main

      - name: install the pinned bead client
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$BR_TOOLCHAIN" --profile minimal
          rustup run "$BR_TOOLCHAIN" cargo install \
            --git https://github.com/Dicklesworthstone/beads_rust.git \
            --rev "$BR_REV" --locked --root "$RUNNER_TEMP/br" --bin br
          echo "$RUNNER_TEMP/br/bin" >> "$GITHUB_PATH"

      - name: record the verified frontier advance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            git rebase origin/main
          fi
          RUST_LOG=error br sync --import-only --rebuild
          code_sha="$(git log -1 --format=%H -- crates/fln-checker/src/admit.rs)"
          RUST_LOG=error br --json update fln-51y8 \
            --status in_progress --assignee "$AGENT_NAME"
          RUST_LOG=error br --json comments add fln-51y8 \
            --author "$AGENT_NAME" \
            --message "Verified HEq semantic unit landed at $code_sha on macos-14. Green: cargo fmt --all --check; exact kr600_803_init_heq_block_is_reconstructed; full fln-checker --no-fail-fast; fln-checker all-target clippy -D warnings. The reflexive premise now supplies motive alpha a_hyg_outer (HEq.refl alpha a_hyg_outer), while the major premise preserves distinct outer-left and rebound-right hygienic locals. fln-51y8 remains in_progress pending the exact real pinned Init.Prelude council rerun and next-frontier capture."
          RUST_LOG=error br sync --flush-only
          git diff --check -- .beads/issues.jsonl
          git commit -o -m 'meta(tracker): record verified HEq council advance' \
            .beads/issues.jsonl
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
