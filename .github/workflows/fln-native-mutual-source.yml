name: Native mutual source checking
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fln-native-mutual-source.yml'
      - 'crates/fln-parse/src/inductive.rs'
      - 'crates/fln-parse/src/command_scope.rs'
      - 'crates/fln-elab/src/source/inductive/**'
      - 'crates/fln-elab/src/source/inductive.rs'
      - 'crates/fln-elab/src/source/matching/**'
      - 'crates/fln-elab/src/source/matching.rs'
      - 'crates/fln/tests/source_mutual_inductives.rs'
      - 'examples/native_mutual_inductives.lean'
permissions:
  contents: read
jobs:
  mutual-source:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Import the identity-bound file integration
        if: >-
          github.event.head_commit.message == 'test(source): validate ordinary mutual inductive file checking'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mutual-source'
          root.mkdir(exist_ok=True)
          manifest = {
              'crates/fln-cli/tests/source_check.rs': ['b21743a391ad4075bbf48a74c4837541e68c7e1a', 'bc1d774a3ba20190a0093a2f1719a9946a79ea66'],
              'crates/fln-elab/src/source/inductive.rs': ['740acaf011615106fa94946f7def3977067f2339', '2072755eea525fd8284ef72e21a87836a2a181cd'],
              'crates/fln-parse/src/command_scope.rs': ['a2b3b390493121e5966f97eb163d0911ab24ea33', 'ce28cf311fc547f37f9d8b960583a995ce292079'],
              'crates/fln-parse/src/inductive.rs': ['61728599159870816f3de92f3bf23f377d3bccfb', '7d6a560ad3bfe4c89b56a5292852842068eaa15b'],
              'crates/fln-parse/src/lib.rs': ['cc01ba2df2131189b6a3a2618ae0fff0c310447e', 'c291054b1a72c93886b24dffbd8319533f2e71fb'],
              'crates/fln/tests/source_mutual_inductives.rs': ['953453e18b0e5314ed9a725c79873dcaebb853c9', '6c35ecfc4aa3f8507e183f1c7dd11cb412983937'],
              'docs/NATIVE_MUTUAL_CHECKER.md': ['8914adbe824addb80c6cf2ccc0c0c10a09b7b453', 'a5278be459fb5bafbf008003c0d12844cb05751f'],
              'examples/native_mutual_inductives.lean': [None, 'ab7fba165150c1e9f68d6235ea968504cc69c8e8'],
          }
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          def fetch_blob(sha):
              request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['encoding'] == 'base64'
              data = base64.b64decode(result['content'])
              assert blob(data) == sha
              return data
          encoded = fetch_blob('b237e0f4d67017ee48baa0cd68e0cac838942c50').decode('ascii')
          for sent, original in [('Nk2i1PMKHR', 'Nk2i1iKHR'), ('LZdJJii5', 'LZdJii5'), ('UbQvHLRZZsb', 'UbQvHLRZsb'), ('npbOOPSak', 'npbOIPSak')]:
              assert encoded.count(sent) == 1
              encoded = encoded.replace(sent, original)
          assert blob(encoded.encode()) == '5fa0f052d57b3849a0a6d02188d911811076aa2a'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '27f506e8e812db53542add4b5a3aaac5378c29c61b8f0b13b30ce1dd6313862a'
          paths = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git a/')]
          assert sorted(paths) == sorted(manifest) and len(paths) == len(set(paths))
          assert '\ndeleted file mode ' not in patch.decode()
          parser = 'crates/fln-parse/src/lib.rs'
          before = {}
          for path, (old, new) in manifest.items():
              p = pathlib.Path(path)
              before[path] = blob(p.read_bytes()) if p.exists() else None
              if path != parser:
                  assert before[path] == old, path
          original = fetch_blob(manifest[parser][0])
          assert subprocess.check_output(['git','hash-object','-w','--stdin'], input=original).decode().strip() == manifest[parser][0]
          (root / 'parser-before.rs').write_bytes(pathlib.Path(parser).read_bytes())
          (root / 'integration.patch').write_bytes(patch)
          subprocess.run(['git','apply','--3way','--index',str(root / 'integration.patch')], check=True)
          for path, (old, new) in manifest.items():
              actual = blob(pathlib.Path(path).read_bytes())
              if path != parser:
                  assert actual == new, path
              manifest[path] = [before[path], actual]
          (root / 'parser-after.rs').write_bytes(pathlib.Path(parser).read_bytes())
          (root / 'second-manifest.json').write_text(json.dumps(manifest))
          parts = ['bae732d90868989605760092dcbfdb74449b2baa', '6ef197cace62b30b48cc231af5cb794d3a94c4a8', '6d04f91e1e44602c816c8b3c4cec5b670f73f1bb', 'f403896c6aa28e04911dbedd8139735fcfbec447']
          encoded = b''.join(fetch_blob(sha) for sha in parts)
          assert blob(encoded) == '477b9e4d5c3774aedadfb03726917c1fcefe7cbe'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4531d6d7fd9b7918fb0ca3c8b982be951e4e08429188df0f2567232fc3590c44'
          (root / 'matching.patch').write_bytes(patch)
          (root / 'export.py').write_text('''import hashlib,json,os,pathlib,subprocess,sys,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'mutual-source'
          def post(endpoint,value):
              request=urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/'+endpoint,data=json.dumps(value).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response:
                  return json.load(response)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          entries=[]
          for path in paths:
              data=pathlib.Path(path).read_bytes()
              assert data==subprocess.check_output(['git','show',':'+path])
              sha=hashlib.sha1(('blob '+str(len(data))+'\\0').encode()+data).hexdigest()
              assert post('blobs',{'content':data.decode(),'encoding':'utf-8'})['sha']==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          parent=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          tree=post('trees',{'base_tree':base,'tree':entries})['sha']
          assert tree==subprocess.check_output(['git','write-tree'],text=True).strip()
          result={'parent':parent,'tree':tree,'files':entries}
          (root/(sys.argv[1]+'-tested-tree.json')).write_text(json.dumps(result,indent=2))
          (root/(sys.argv[1]+'.patch')).write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          print('MUTUAL_TESTED_TREE '+sys.argv[1]+' '+json.dumps(result),flush=True)
          ''')
      - name: Test ordinary mutual file integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mutual-source"
          exec > >(tee "$RUNNER_TEMP/mutual-source/file-validation.log") 2>&1
          channel=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
          rustc -Vv
          cargo test --locked -p fln-parse
          cargo test --locked -p fln --test source_mutual_inductives --test source_inductive --test generated_mutual_inductives
          if test -f crates/fln/tests/source_do.rs; then cargo test --locked -p fln --test source_do; fi
          cargo test --locked -p fln-cli --test source_check installed_binary_checks_mutual_source_and_cross_family_computation
          cargo clippy --locked --no-deps -p fln-parse -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
          git diff --check
          git diff --cached --check
      - name: Export tested file integration
        if: >-
          github.event.head_commit.message == 'test(source): validate ordinary mutual inductive file checking'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/mutual-source/export.py" second
      - name: Integrate checked mutual case analysis
        if: >-
          github.event.head_commit.message == 'test(source): validate ordinary mutual inductive file checking'
        shell: python
        run: |
          import hashlib,os,pathlib,re,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'mutual-source'
          patch=(root/'matching.patch').read_text()
          allowed={'crates/fln-cli/tests/source_check.rs','crates/fln-elab/src/source/matching.rs','crates/fln-elab/src/source/matching/mutual.rs','crates/fln/tests/source_mutual_inductives.rs','docs/NATIVE_MUTUAL_CHECKER.md','examples/native_mutual_inductives.lean'}
          rows={}
          def blob(data):
              return hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
          for section in patch.split('diff --git ')[1:]:
              path=section.splitlines()[0].split(' b/',1)[1]
              assert path in allowed and path not in rows
              match=re.search(r'^index ([0-9a-f]{40})\.\.([0-9a-f]{40})',section,re.M)
              assert match and '\ndeleted file mode ' not in section
              old,new=match.groups()
              p=pathlib.Path(path)
              assert (blob(p.read_bytes()) if p.exists() else '0'*40)==old,path
              rows[path]=new
          assert set(rows)==allowed
          subprocess.run(['git','apply','--check',str(root/'matching.patch')],check=True)
          subprocess.run(['git','apply','--index',str(root/'matching.patch')],check=True)
          for path,sha in rows.items():
              assert blob(pathlib.Path(path).read_bytes())==sha,path
      - name: Verify ordinary mutual matches
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/mutual-source/match-validation.log") 2>&1
          cargo test --locked -p fln --test source_mutual_inductives --test source_inductive --test source_matching --test source_pattern_matrices
          cargo test --locked -p fln-cli --test source_check installed_binary_checks_mutual_source_and_cross_family_computation
          cargo clippy --locked --no-deps -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
          git diff --check
          git diff --cached --check
      - name: Export tested mutual matches
        if: >-
          github.event.head_commit.message == 'test(source): validate ordinary mutual inductive file checking'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/mutual-source/export.py" third
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutual-source-${{ github.sha }}
          path: ${{ runner.temp }}/mutual-source
          retention-days: 7
          if-no-files-found: error
