# Consumer: the native pattern compiler. The previous coverage commits were
# compiled but their new integration target had not been executed by a lane.
# The one-time reproduction archive can be retired after offline validation;
# the regression job remains an ordinary check of committed product source.
name: Native matrix regressions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-matrix-regressions.yml'
      - 'crates/fln-elab/**'
      - 'crates/fln-parse/**'
      - 'crates/fln/src/**'
      - 'crates/fln/tests/source_matrix*.rs'
      - 'crates/fln/tests/source_pattern*.rs'
      - 'crates/fln/tests/source_named_match_hints.rs'
      - 'crates/fln/tests/fixtures/named_monad_match.lean'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check native coverage, recursion, row priority and pattern binders
        run: |
          cargo test --locked -p fln --test source_matrix_coverage --test source_matrix_recursion --test source_pattern_matrices --test source_pattern_binders --test source_named_match_hints --no-fail-fast
      - name: Check modified compiler paths
        run: |
          cargo clippy --locked -p fln-elab -p fln --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
  reproduction-inputs:
    if: >-
      github.event_name == 'push' && contains(github.event.head_commit.message, 'retain pinned reproduction inputs')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retain exact source and pinned native compiler for offline regression work
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          test "$(rustc -Vv | sed -n 's/^commit-hash: //p')" = "$(awk '$1 == "rust-commit" {print $2}' SUITE.lock)"
          out="$RUNNER_TEMP/matrix-reproduction"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
          rustc -Vv > "$out/compiler.txt"
          tar --exclude=lib/rustlib/src -czf "$out/compiler.tar.gz" -C "$(rustc --print sysroot)" bin lib libexec
          (cd "$out" && sha256sum source.tar.gz compiler.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matrix-reproduction-${{ github.sha }}
          path: ${{ runner.temp }}/matrix-reproduction
          retention-days: 1
          if-no-files-found: error
  named-monad-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the shared source with the checksum-verified pinned Reference
        shell: bash
        run: |
          set -euo pipefail
          curl --user-agent 'OpenAI File Downloader, XaiImageApiFetch/1.0' --fail --location --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.32.0/lean-4.32.0-linux.tar.zst
          echo "fca846f3588724a38ad19ee40292c67cb7438d7555903372e3308eef795ba516  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd --no-same-owner -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          reference="$RUNNER_TEMP/lean-4.32.0-linux/bin/lean"
          test "$("$reference" --githash)" = 8c9756b28d64dab099da31a4c09229a9e6a2ef35
          "$reference" crates/fln/tests/fixtures/named_monad_match.lean
          python3 -I - "$RUNNER_TEMP" <<'PY'
          import pathlib, sys
          source = pathlib.Path('crates/fln/tests/fixtures/named_monad_match.lean').read_text()
          assert source.count('Eq (chooseNamed (some 42)) (42 : Nat)') == 1
          (pathlib.Path(sys.argv[1]) / 'FalseNamed.lean').write_text(source.replace('Eq (chooseNamed (some 42)) (42 : Nat)', 'Eq (chooseNamed (some 42)) (43 : Nat)'))
          PY
          if "$reference" "$RUNNER_TEMP/FalseNamed.lean" > "$RUNNER_TEMP/false-named.log" 2>&1; then
            echo 'The negative reference control unexpectedly succeeded' >&2
            exit 1
          fi
          grep -F 'error:' "$RUNNER_TEMP/false-named.log"
