name: Native constructive logic integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-native-logic-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-logic-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Integrate source syntax and preserve concurrent logical definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '557944148eb4001a988285b2f1f4944d49437292eef66aa16543afaa67a32d58'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-logic-notation.patch'
          path.write_bytes(patch)
          if subprocess.run(['git', 'apply', '--reverse', '--check', str(path)], capture_output=True).returncode:
              subprocess.run(['git', 'apply', '--check', str(path)], check=True)
              subprocess.run(['git', 'apply', str(path)], check=True)
          # The connective module belongs to the concurrent implementation.
          # Preserve its bytes and admit its ordinary candidates; never replace it.
          seed = pathlib.Path('crates/fln-elab/src/seed.rs')
          text = seed.read_text()
          def replace(old, new):
              global text
              if text.count(old) != 1:
                  raise SystemExit('Refusing stale or ambiguous seed anchor: ' + old)
              text = text.replace(old, new, 1)
          if 'logic_support::logical_support_seed_declarations()' not in text:
              if 'pub fn source_seed_declarations() -> [Declaration; 59] {' in text:
                  if 'mod logic;' not in text:
                      replace('mod decidable;', 'mod decidable;\nmod logic;')
                  replace('pub fn source_seed_declarations() -> [Declaration; 59] {',
                      'pub fn source_seed_declarations() -> [Declaration; 71] {\n    let [and, and_left, and_right, or, or_elim, iff, iff_mp, iff_mpr, and_instance, or_instance, implies_instance, iff_instance] = logic::logical_seed_declarations();')
                  replace('        generic_eq,\n    ]',
                      '        generic_eq,\n        and, and_left, and_right, or, or_elim, iff, iff_mp, iff_mpr,\n        and_instance, or_instance, implies_instance, iff_instance,\n    ]')
              if 'mod logic_support;' not in text:
                  replace('mod logic;', 'mod logic;\nmod logic_support;')
              replace('pub fn source_seed_declarations() -> [Declaration; 71] {',
                  'pub fn source_seed_declarations() -> [Declaration; 73] {\n    let [false_elim, not_equal] = logic_support::logical_support_seed_declarations();')
              # Find the unique declaration array terminator, independent of
              # rustfmt's layout of the concurrent twelve-item destructuring.
              start = text.index('pub fn source_seed_declarations()')
              end = text.index('\n    ]\n}', start)
              text = text[:end] + '\n        false_elim,\n        not_equal,' + text[end:]
              seed.write_text(text)
          engine = pathlib.Path('crates/fln/src/lib.rs')
          text = engine.read_text()
          names = ['instDecidableAnd', 'instDecidableOr', 'instDecidableImplies', 'instDecidableIff']
          present = [f'            "{name}",' in text for name in names]
          if any(present) and not all(present):
              raise SystemExit('Refusing partially registered concurrent logic')
          if not any(present):
              anchor = '            "instDecidableNot",'
              assert text.count(anchor) == 1
              engine.write_text(text.replace(anchor, anchor + ''.join(f'\n            "{name}",' for name in names), 1))
          PY
      - name: Verify and commit actual source directly to main
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustfmt --edition 2024 --config skip_children=true crates/fln-elab/src/seed.rs crates/fln/src/lib.rs
          validate() {
            cargo test --locked -p fln --test source_logic_notation --test source_logic_seeds --test source_constructor_equality --test source_equality_decisions --test source_generic_decisions
            cargo test --locked -p fln-cli --test source_propositional_logic
            cargo test --locked -p fln-parse -p fln-elab --no-fail-fast
            cargo clippy --locked -p fln-parse -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings
            cargo check --locked --workspace --all-targets
            git diff --check
          }
          validate
          git add crates/fln-parse/src/lib.rs crates/fln-parse/src/record_terms.rs crates/fln-parse/tests/source_logic_notation.rs crates/fln-elab/src/lib.rs crates/fln-elab/src/source.rs crates/fln-elab/src/seed.rs crates/fln/src/lib.rs crates/fln/tests/source_constructor_equality.rs crates/fln/tests/source_logic_notation.rs crates/fln/tests/source_logic_seeds.rs crates/fln-cli/tests/source_propositional_logic.rs examples/native_propositional_logic.lean
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(elab): integrate constructive logic and hygienic propositional notation' -m 'Preserve the concurrent connective implementation and admit it with polymorphic Ne and False.elim. Add conjunction, disjunction, equivalence, inequality and prefix negation with pinned precedence, iterative parser frames, and explicit-root hygiene. Cover source proofs, recursive decisions, small-stack parsing, invalid proofs and real CLI transactional recovery; no new axioms or admission exceptions.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then git rev-parse HEAD; exit 0; fi
            git fetch origin main
            git rebase origin/main
            validate
          done
          exit 1
