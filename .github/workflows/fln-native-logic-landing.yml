name: Native constructive logic integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-native-logic-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-logic-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Apply the locally tested source increment
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '15220cf6eb86464526d8898b862d02e91283d3b6364ddc6338a41e5b981177e2'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-logic.patch'
          path.write_bytes(patch)
          if subprocess.run(['git', 'apply', '--reverse', '--check', str(path)], capture_output=True).returncode:
              subprocess.run(['git', 'apply', '--check', str(path)], check=True)
              subprocess.run(['git', 'apply', str(path)], check=True)
          PY
      - name: Verify and commit the actual source directly to main
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          validate() {
            cargo test --locked -p fln --test source_logic_seeds --test source_equality_decisions --test source_generic_decisions
            cargo test --locked -p fln-elab --no-fail-fast
            cargo clippy --locked -p fln-elab -p fln --all-targets -- -D warnings
            cargo check --locked --workspace --all-targets
            git diff --check
          }
          validate
          git add crates/fln-elab/src/seed.rs crates/fln-elab/src/seed/logic.rs crates/fln/src/lib.rs crates/fln/tests/source_logic_seeds.rs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(elab): add constructive propositional logic and decision synthesis' -m 'Admit And, Or, Iff, Ne, projections and eliminators, plus proof-carrying decisions for conjunction, disjunction, implication and equivalence. Register recursive native instances and cover truth tables, nested equality decisions, symbolic dictionaries, constructive tactics, forbidden elimination and failure-atomic resource stops through both checkers.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then git rev-parse HEAD; exit 0; fi
            git fetch origin main
            git rebase origin/main
            validate
          done
          exit 1
