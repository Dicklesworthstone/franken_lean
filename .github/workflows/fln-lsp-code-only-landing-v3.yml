name: fln LSP code-only v3 landing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fln-lsp-code-only-landing-v3.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: fln-lsp-code-only-v3
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: checkout and isolate the writer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: cancel superseded bounded-LSP runs and fast-forward
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for status in queued in_progress; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" \
              --jq '.workflow_runs[] | select((.name | startswith("fln LSP")) and (.id != (env.GITHUB_RUN_ID | tonumber))) | .id' |
              while IFS= read -r run_id; do
                [[ -n "$run_id" ]] || continue
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
              done
          done
          git fetch origin main
          git merge --ff-only origin/main
          git config user.name "Jeff Emanuel"
          git config user.email "35050222+Dicklesworthstone@users.noreply.github.com"

      - name: apply and commit source-aware versioned diagnostics
        shell: bash
        run: |
          set -euo pipefail
          run_step() {
            local file="$1" step_name="$2" output
            output="$(mktemp)"
            ruby -ryaml -e '
              d = YAML.load_file(ARGV[0]); n = ARGV[1]
              s = d.fetch("jobs").fetch("land").fetch("steps").find { |x| x["name"] == n }
              abort("missing landing step: #{n}") unless s
              print s.fetch("run")
            ' "$file" "$step_name" > "$output"
            bash -euo pipefail "$output"
          }
          if ! grep -Fq 'pub const fn versioned(uri:' crates/fln-server/src/lib.rs; then
            run_step .github/workflows/fln-lsp-versioned-diagnostics-landing.yml \
              'implement version-bound diagnostic publication'
          fi
          python3 -I - <<'PY'
          from pathlib import Path
          path = Path("crates/fln-server/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              ".is_some_and(|byte| matches!(byte, b'/' | b'\\\\'))",
              ".is_some_and(|byte| matches!(*byte, b'/' | b'\\\\'))",
          )
          text = text.replace(
              ".all(|byte| byte.is_ascii_alphanumeric() || matches!(byte, b'+' | b'-' | b'.'))",
              ".all(|byte| byte.is_ascii_alphanumeric() || matches!(*byte, b'+' | b'-' | b'.'))",
          )
          old = '''    let mut by_file: BTreeMap<String, LspFileDiagnostics<'_>> = BTreeMap::new();
              for source in sources {
                  let entry = by_file
                      .entry(projected_file_identity(source.uri, request.path))
                      .or_default();
                  entry.version = newest_version(entry.version, source.version);
              }
              for diagnostic in diagnostics {
          '''
          old = "\n".join(line[14:] if line.startswith("              ") else line for line in old.splitlines()) + "\n"
          new = '''    let mut by_file: BTreeMap<String, LspFileDiagnostics<'_>> = BTreeMap::new();
              if diagnostics.is_empty() {
                  for source in sources {
                      let entry = by_file
                          .entry(projected_file_identity(source.uri, request.path))
                          .or_default();
                      entry.version = newest_version(entry.version, source.version);
                  }
              }
              for diagnostic in diagnostics {
          '''
          new = "\n".join(line[14:] if line.startswith("              ") else line for line in new.splitlines()) + "\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif "if diagnostics.is_empty()" not in text:
              raise SystemExit("diagnostic source-preseed block is in an unknown state")
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check -- crates/fln-server crates/fln-cli
          cargo test --locked -p fln-server --lib
          cargo test --locked -p fln-cli --lib --no-run
          git add crates/fln-server/src/lib.rs crates/fln-server/src/dispatch.rs crates/fln-cli/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix(server): bind UTF-16 diagnostics to source versions" \
              -m "Wire exact unsaved source into the live server, convert primary and related spans to UTF-16, publish clean/error diagnostics with retained versions, preserve explicit unversioned state and URI schemes, and avoid clearing related-only source snapshots." \
              -m "Bead: franken_lean-v2p"
          fi

      - name: apply and commit JSON-RPC and coordinate-state hardening
        shell: bash
        run: |
          set -euo pipefail
          run_step() {
            local file="$1" step_name="$2" output
            output="$(mktemp)"
            ruby -ryaml -e '
              d = YAML.load_file(ARGV[0]); n = ARGV[1]
              s = d.fetch("jobs").fetch("land").fetch("steps").find { |x| x["name"] == n }
              abort("missing landing step: #{n}") unless s
              print s.fetch("run")
            ' "$file" "$step_name" > "$output"
            bash -euo pipefail "$output"
          }
          if ! grep -Fq 'malformed_transition_clears_previously_published_diagnostics' crates/fln-server/src/dispatch.rs; then
            run_step .github/workflows/fln-lsp-stale-diagnostics-landing.yml \
              'clear diagnostics whenever retained source becomes unknowable'
          fi
          if ! grep -Fq 'initialize_refuses_clients_that_exclude_utf16_and_recovers' crates/fln-server/src/dispatch.rs; then
            run_step .github/workflows/fln-lsp-position-negotiation-landing.yml \
              'negotiate the only supported wire position encoding'
          fi
          if ! grep -Fq 'requests_before_initialize_fail_with_server_not_initialized_and_recover' crates/fln-server/src/dispatch.rs; then
            run_step .github/workflows/fln-lsp-jsonrpc-state-recovery.yml \
              'enforce JSON-RPC envelopes and lifecycle states'
          fi
          cargo fmt --all
          git diff --check -- crates/fln-server
          cargo test --locked -p fln-server --lib
          git add crates/fln-server/src/dispatch.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix(server): enforce coordinate and JSON-RPC state contracts" \
              -m "Clear diagnostics with source invalidation, negotiate UTF-16, validate exact JSON-RPC 2.0 envelopes and string methods, and distinguish pre-initialize and post-shutdown request states from unknown methods." \
              -m "Bead: franken_lean-v2p"
          fi

      - name: apply and commit document lifecycle and typed callback faults
        shell: bash
        run: |
          set -euo pipefail
          run_step() {
            local file="$1" step_name="$2" output
            output="$(mktemp)"
            ruby -ryaml -e '
              d = YAML.load_file(ARGV[0]); n = ARGV[1]
              s = d.fetch("jobs").fetch("land").fetch("steps").find { |x| x["name"] == n }
              abort("missing landing step: #{n}") unless s
              print s.fetch("run")
            ' "$file" "$step_name" > "$output"
            bash -euo pipefail "$output"
          }
          if ! grep -Fq 'duplicate_did_open_does_not_overwrite_the_authoritative_snapshot' crates/fln-server/src/dispatch.rs; then
            run_step .github/workflows/fln-lsp-document-lifecycle-landing.yml \
              'separate document lifecycle from retained source bytes'
          fi
          if ! grep -Fq 'full_sync_rejects_ranged_incremental_changes_without_replaying_stale_source' crates/fln-server/src/dispatch.rs; then
            run_step .github/workflows/fln-lsp-full-sync-shape-landing.yml \
              'reject incremental change shapes under Full synchronization'
          fi
          if ! grep -Fq 'known_methods_refuse_the_wrong_request_or_notification_shape' crates/fln-server/src/dispatch.rs; then
            run_step .github/workflows/fln-lsp-method-role-landing.yml \
              'distinguish requests from notifications before dispatch'
          fi
          if ! grep -Fq 'callback_projection_refusal_is_visible_and_clears_diagnostics' crates/fln-server/src/dispatch.rs; then
            run_step .github/workflows/fln-lsp-callback-refusal-landing.yml \
              'make diagnostic callback refusal explicit'
          fi
          python3 -I - <<'PY'
          import re
          from pathlib import Path
          server = Path("crates/fln-server/src/lib.rs")
          text = server.read_text(encoding="utf-8")
          start = text.find("pub(crate) fn projection_refusal_notification")
          if start >= 0:
              end = text.find("\n/// Project a snapshot", start)
              if end < 0:
                  raise SystemExit("projection refusal function boundary missing")
              replacement = r'''pub(crate) fn projection_refusal_notification(refusal: ProjectionRefusal) -> String {
              let detail = BoundedText::new(format!("{refusal:?}"));
              format!(
                  concat!(
                      "{{\"jsonrpc\":\"2.0\",\"method\":\"$/lean/diagnosticOutcome\",",
                      "\"params\":{{\"schema\":{},\"outcome\":\"internal_fault\",",
                      "\"authority\":false,\"invariant\":\"lsp-projection-contract\",",
                      "\"detail\":{}}}}}"
                  ),
                  json_string(DIAGNOSTIC_PROJECTION_SCHEMA),
                  bounded_json(&detail)
              )
          }
          '''
              replacement = "\n".join(line[14:] if line.startswith("              ") else line for line in replacement.splitlines())
              server.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          dispatch = Path("crates/fln-server/src/dispatch.rs")
          text = dispatch.read_text(encoding="utf-8")
          split = text.find("#[cfg(test)]")
          if split < 0:
              raise SystemExit("dispatch tests missing")
          production, tests = text[:split], text[split:]
          tests = re.sub(r"(?m)^(\s+)Vec::new\(\)\n(\s+\},)$", r"\1Ok(Vec::new())\n\2", tests)
          dispatch.write_text(production + tests, encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check -- crates/fln-server crates/fln-cli
          cargo test --locked -p fln-server --lib
          cargo test --locked -p fln-cli --lib --no-run
          git add crates/fln-server/src/lib.rs crates/fln-server/src/dispatch.rs crates/fln-cli/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix(server): harden document lifecycle and projection faults" \
              -m "Retain open-document metadata independently of source bytes, refuse duplicate and implicit opens, reject ranged fragments under Full synchronization, enforce request/notification roles, recover from invalidated source, and surface typed projection faults instead of empty success." \
              -m "Bead: franken_lean-v2p"
          fi

      - name: apply and commit complete JSON syntax validation
        shell: bash
        run: |
          set -euo pipefail
          run_step() {
            local file="$1" step_name="$2" output
            output="$(mktemp)"
            ruby -ryaml -e '
              d = YAML.load_file(ARGV[0]); n = ARGV[1]
              s = d.fetch("jobs").fetch("land").fetch("steps").find { |x| x["name"] == n }
              abort("missing landing step: #{n}") unless s
              print s.fetch("run")
            ' "$file" "$step_name" > "$output"
            bash -euo pipefail "$output"
          }
          if ! grep -Fq 'malformed_json_in_unselected_fields_is_a_parse_error_and_recovery_is_clean' crates/fln-server/src/dispatch.rs; then
            run_step .github/workflows/fln-lsp-json-syntax-landing.yml \
              'validate every JSON byte before selected-field dispatch'
          fi
          if ! grep -Fq 'json_syntax_rejects_terminally_incomplete_values' crates/fln-server/src/dispatch.rs; then
            run_step .github/workflows/fln-lsp-json-syntax-totality-fix.yml \
              'bind document validity to value-parser success'
          fi
          cargo fmt --all
          git diff --check -- crates/fln-server
          cargo test --locked -p fln-server --lib
          git add crates/fln-server/src/dispatch.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix(server): validate complete JSON syntax before dispatch" \
              -m "Validate bounded object/array grammar, strings and escapes, literals, and complete numbers before selected-field extraction. Invalid UTF-8 and malformed JSON now return recoverable ParseError responses, and terminal parser failure cannot be laundered by reaching end-of-input." \
              -m "Bead: franken_lean-v2p"
          fi

      - name: update and commit status, changelog, CLI help, and Beads progress
        shell: bash
        run: |
          set -euo pipefail
          extract_run() {
            local file="$1" step_name="$2" output="$3"
            ruby -ryaml -e '
              d = YAML.load_file(ARGV[0]); n = ARGV[1]
              s = d.fetch("jobs").fetch("land").fetch("steps").find { |x| x["name"] == n }
              abort("missing landing step: #{n}") unless s
              print s.fetch("run")
            ' "$file" "$step_name" > "$output"
          }
          if ! grep -Fq 'Lantern wire correctness: coordinates, versions, and lifecycle' CHANGELOG.md; then
            extract_run .github/workflows/fln-lsp-status-docs-landing.yml \
              'update code-facing and project-facing documentation' /tmp/base_docs.sh
            bash -euo pipefail /tmp/base_docs.sh
          fi
          if ! grep -Fq 'Complete JSON syntax validation and recovery' CHANGELOG.md; then
            extract_run .github/workflows/fln-lsp-json-syntax-landing.yml \
              'update bounded status and consolidate this landing record' /tmp/json_docs_full.sh
            python3 -I - <<'PY'
          from pathlib import Path
          text = Path('/tmp/json_docs_full.sh').read_text()
          start = text.index("python3 -I - <<'PY'\n")
          body_start = start + len("python3 -I - <<'PY'\n")
          end = text.index("\nPY\n", body_start)
          Path('/tmp/json_docs.py').write_text(text[body_start:end], encoding='utf-8')
          PY
            python3 -I /tmp/json_docs.py
          fi
          if ! grep -Fq 'Terminal parser failure is authoritative' CHANGELOG.md; then
            extract_run .github/workflows/fln-lsp-json-syntax-totality-fix.yml \
              'update status and archive the correction lane' /tmp/json_fix_docs_full.sh
            python3 -I - <<'PY'
          from pathlib import Path
          text = Path('/tmp/json_fix_docs_full.sh').read_text()
          start = text.index("python3 -I - <<'PY'\n")
          body_start = start + len("python3 -I - <<'PY'\n")
          end = text.index("\nPY\n", body_start)
          Path('/tmp/json_fix_docs.py').write_text(text[body_start:end], encoding='utf-8')
          PY
            python3 -I /tmp/json_fix_docs.py
          fi
          cargo fmt --all -- --check
          git diff --check -- crates/fln-server crates/fln-cli IMPLEMENTATION_STATUS.md CHANGELOG.md .beads/issues.jsonl
          cargo test --locked -p fln-server --lib
          cargo test --locked -p fln-cli --lib --no-run
          cargo test --locked -p structure-guard --test real_workspace
          git add crates/fln-server/src/lib.rs crates/fln-cli/src/lib.rs \
            IMPLEMENTATION_STATUS.md CHANGELOG.md .beads/issues.jsonl
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "workflow file was accidentally staged in the code-only landing" >&2
            exit 2
          fi
          if ! git diff --cached --quiet; then
            git commit -m "docs(status): record bounded Lantern protocol hardening" \
              -m "Update module and CLI help, evidence-graded implementation status, changelog, and the existing franken_lean-v2p progress record. Preserve explicit boundaries to semantic LSP, Lean RPC, shared-daemon, editor, and performance work; no bead closure is claimed." \
              -m "Bead: franken_lean-v2p (progress only)"
          fi

      - name: publish only code, documentation, and Beads commits
        shell: bash
        run: |
          git fetch origin main
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "$(git rev-parse origin/main)" || {
            echo "main moved incompatibly during code-only landing" >&2
            exit 2
          }
          test -z "$(git diff --cached --name-only)"
          git push origin HEAD:main
