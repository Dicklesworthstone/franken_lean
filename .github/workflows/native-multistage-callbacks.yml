name: Native multi-stage callbacks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-multistage-callbacks.yml'
      - 'crates/fln/src/runtime/**'
      - 'crates/fln/src/runtime.rs'
      - 'crates/fln/tests/runtime_staged_closures.rs'
      - 'crates/fln/tests/runtime_staged_specialization.rs'
      - 'crates/fln/tests/runtime_interleaved_specialization.rs'
      - 'crates/fln-cli/tests/source_multistage_callbacks.rs'
      - 'examples/native_multistage_callbacks.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  callbacks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^" ]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - name: Check call boundaries, ownership and independent replay
        run: |
          set -euo pipefail
          cargo test --locked -p fln --lib --test runtime_staged_closures --test runtime_staged_specialization --test runtime_interleaved_specialization --test runtime_higher_order --test runtime_closure_data --test runtime_mutual_indexed
          cargo test --locked -p fln-cli --test source_multistage_callbacks --test source_empty_runtime
          cargo clippy --locked -p fln --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
