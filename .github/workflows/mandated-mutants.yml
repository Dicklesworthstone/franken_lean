# The dispatcher for the §18 mandated-mutant campaign.
#
# WHY THIS FILE IS SEPARATE FROM ci.yml. The campaign is `#[ignore]`d because it EDITS
# TRACKED SOURCE — it plants each mandated mutant into the real production file, watches the
# named killers die for the stated reason, and restores the file from a `Drop` impl. That is
# correct on an ephemeral runner and wrong on a per-commit lane, so it gets its own cadence
# rather than a step in the per-commit workflow.
#
# WHAT RUNS PER COMMIT IS NOT THIS. `the_recorded_kills_still_describe_this_tree` runs in
# ordinary `cargo test` and proves the recorded kill still describes this tree; it does not
# prove the mutant dies today. Those are different claims and stacking them does not make
# one. This lane is what makes the second claim get re-measured when the code has NOT moved —
# the retention check already forces it when the code has.
#
# THE JOIN BACK. `the_receipt_class_matches_what_actually_dispatches_the_campaign` reads this
# directory and refuses if the receipt's `class` token and the dispatch state disagree in
# either direction. Deleting this file is therefore not silent: it turns the recorded rows
# into a claim with nothing producing it, and the per-commit suite goes red saying so.

name: mandated mutant campaign

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: [.github/workflows/mandated-mutants.yml]
  schedule:
    # Weekly, offset from the contract-drift lane so the two never contend for a runner.
    - cron: "23 4 * * 2"
  workflow_dispatch:

concurrency:
  group: mandated-mutants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  campaign:
    if: github.event_name != 'push'
    name: plant the mandated mutants and watch their killers die
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout FrankenLean
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: record the commit the campaign is measured at
        shell: bash
        run: |
          # AGENTS.md's standing habit until `vdi4` closes: record the hash a measurement was
          # re-derived at. The campaign records it into the receipt itself; this is for
          # whoever reads the run log without the artifact.
          git rev-parse HEAD

      - name: confirm the tree is clean before anything plants into it
        shell: bash
        run: |
          # The campaign refuses to start on a dirty tree so it can tell its own mutation
          # from somebody else's edit. Failing here rather than inside the campaign makes the
          # reason legible.
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "working tree is not clean; the campaign cannot attribute its own edits" >&2
            git status --porcelain >&2
            exit 2
          fi

      - name: run the mandated mutant campaign
        shell: bash
        run: |
          cargo test -p fln-conformance --test mandated_mutants \
            the_mandated_mutants_are_planted_and_their_killers_die \
            -- --ignored --exact --nocapture

      - name: prove the production files were restored
        shell: bash
        run: |
          # The campaign restores from `Drop`, including on panic. This asserts it, because a
          # lane that leaves a kernel with its positivity check disabled must not report
          # success — and because the next step's receipt would then describe mutated source.
          if [[ -n "$(git status --porcelain -- crates/fln-kernel crates/fln-unsafe-abi)" ]]; then
            echo "the campaign did not restore the production files it mutated" >&2
            git status --porcelain -- crates/fln-kernel crates/fln-unsafe-abi >&2
            exit 2
          fi

      - name: re-run the per-commit half against the freshly appended rows
        shell: bash
        run: |
          # Closes the loop inside one lane: the campaign appended rows, and the retention and
          # cadence guards must both accept them. A campaign that writes a receipt its own
          # guards reject is a campaign nobody would notice was broken.
          cargo test -p fln-conformance --test mandated_mutants

      - name: archive the kill receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mandated-mutant-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: crates/fln-conformance/evidence/mandated_mutants/kills.jsonl
          if-no-files-found: error
          retention-days: 90

  fln_51y8_heq_verified_landing:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'chore(agent): launch verified fln-51y8 HEq landing'
    name: verify and land the pinned HEq hygienic recursor
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      AGENT_NAME: gpt-5.6-pro
      BR_REV: d2393c99ddcf337bd77d4ba61ce29ea8cdbe715b
      BR_TOOLCHAIN: nightly-2026-08-25
      EXPECTED_ADMIT_BLOB: 9a8ce762c5c3cf4463797bf4127051e992adac2e
      EXPECTED_TEST_BLOB: 85cb88c0e2942c31b76110ac38bb107486996f87
      PATCH_GZ_B64: 
      RUST_BACKTRACE: '1'
    steps:
      - name: checkout FrankenLean
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: install pinned Rust toolchains and br
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I - <<'PY'
          import pathlib
          import tomllib
          value = tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          if not isinstance(value, str) or not value.startswith('nightly-'):
              raise SystemExit(f'not an exact nightly channel: {value!r}')
          print(value)
          PY
          )"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup toolchain install "$BR_TOOLCHAIN" --profile minimal
          rustup run "$BR_TOOLCHAIN" cargo install \
            --git https://github.com/Dicklesworthstone/beads_rust.git \
            --rev "$BR_REV" --locked --root "$RUNNER_TEMP/br" --bin br
          echo "$RUNNER_TEMP/br/bin" >> "$GITHUB_PATH"

      - name: claim fln-51y8 and publish the claim atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6 Pro'
          git config user.email 'noreply@openai.com'
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            git rebase origin/main
          fi
          RUST_LOG=error br sync --import-only --rebuild
          RUST_LOG=error br --json update fln-51y8 \
            --status in_progress --assignee "$AGENT_NAME"
          RUST_LOG=error br --json comments add fln-51y8 \
            --author "$AGENT_NAME" \
            --message "degraded-coordination claim: advancing real Init.Prelude item 15 [HEq]. Files: crates/fln-checker/src/admit.rs, crates/fln-checker/tests/admit.rs. Anchors: admit=$EXPECTED_ADMIT_BLOB tests=$EXPECTED_TEST_BLOB. Hypothesis: the reflexive premise omits the motive's alpha argument; preserve outer-left versus rebound-right a_hyg identity."
          RUST_LOG=error br sync --flush-only
          git diff --check -- .beads/issues.jsonl
          if ! git diff --quiet -- .beads/issues.jsonl; then
            git commit -o -m 'meta(tracker): claim fln-51y8 HEq council frontier' \
              .beads/issues.jsonl
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            git push origin HEAD:main
          fi

      - name: apply and verify the HEq semantic unit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object crates/fln-checker/src/admit.rs)" = "$EXPECTED_ADMIT_BLOB"
          test "$(git hash-object crates/fln-checker/tests/admit.rs)" = "$EXPECTED_TEST_BLOB"
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > "$RUNNER_TEMP/heq.patch"
          git apply --check "$RUNNER_TEMP/heq.patch"
          git apply "$RUNNER_TEMP/heq.patch"
          git diff --check -- \
            crates/fln-checker/src/admit.rs \
            crates/fln-checker/tests/admit.rs
          cargo fmt --all --check
          cargo test -p fln-checker --test admit \
            kr600_803_init_heq_block_is_reconstructed -- --exact --nocapture
          cargo test --no-fail-fast -p fln-checker
          cargo clippy -p fln-checker --all-targets -- -D warnings

      - name: land the verified code
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- \
            crates/fln-checker/src/admit.rs \
            crates/fln-checker/tests/admit.rs
          git commit -o -m 'fix(checker): reconstruct pinned HEq hygienic recursor' \
            crates/fln-checker/src/admit.rs \
            crates/fln-checker/tests/admit.rs
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            git rebase origin/main
            cargo fmt --all --check
            cargo test -p fln-checker --test admit \
              kr600_803_init_heq_block_is_reconstructed -- --exact --nocapture
          fi
          git push origin HEAD:main

      - name: record the verified advance on fln-51y8
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            git rebase origin/main
          fi
          RUST_LOG=error br sync --import-only --rebuild
          code_sha="$(git rev-parse HEAD)"
          RUST_LOG=error br --json comments add fln-51y8 \
            --author "$AGENT_NAME" \
            --message "HEq hygienic recursor unit landed at $code_sha. Green: fmt; exact HEq reconstruction test; full fln-checker tests with --no-fail-fast; all-target clippy -D warnings. Reflexive premise is motive alpha a_hyg_outer (HEq.refl alpha a_hyg_outer); major premise preserves HEq alpha a_hyg_outer beta a_hyg_major. Bead remains in_progress pending the exact real pinned Init.Prelude council run and next-frontier movement."
          RUST_LOG=error br sync --flush-only
          git diff --check -- .beads/issues.jsonl
          if ! git diff --quiet -- .beads/issues.jsonl; then
            git commit -o -m 'meta(tracker): record verified HEq council advance' \
              .beads/issues.jsonl
            git fetch origin main
            if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
              git rebase origin/main
            fi
            git push origin HEAD:main
          fi
