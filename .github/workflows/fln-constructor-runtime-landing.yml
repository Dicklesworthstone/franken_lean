name: Native constructor runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fln-constructor-runtime-landing.yml'
      - 'crates/fln-comp/**'
      - 'crates/fln-vm/**'
      - 'crates/fln/src/**'
      - 'crates/fln/tests/runtime_*.rs'
      - 'crates/fln-cli/tests/source_variant_runtime.rs'
      - 'examples/native_variants.lean'
      - 'examples/native_recursive_data.lean'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fln-constructor-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record source identity and install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/constructor-runtime
          git rev-parse HEAD > target/constructor-runtime/tested-commit.txt
          git rev-parse 'HEAD^{tree}' > target/constructor-runtime/tested-tree.txt
          channel="$(python3 -I -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv > target/constructor-runtime/compiler.txt
      - name: Test first-class recursors and higher-order execution
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln --test runtime_partial_recursors --test runtime_higher_order --no-fail-fast 2>&1 | tee target/constructor-runtime/partial-recursors.log
      - name: Test compiler and VM
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-comp -p fln-vm --no-fail-fast 2>&1 | tee target/constructor-runtime/compiler-vm.log
      - name: Test native source data and recursion
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln --lib --test runtime_variants --test runtime_recursive_data --test runtime_records --test runtime_nat_recursion --test runtime_local_functions --test runtime_conditionals --test source_record_execution --test source_recursion --no-fail-fast 2>&1 | tee target/constructor-runtime/engine.log
      - name: Test installed execution imports and replay
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-cli --test source_variant_runtime --test source_record_runtime --test source_nat_runtime --test source_local_helpers --test runtime_conditionals --test source_term_binders --no-fail-fast 2>&1 | tee target/constructor-runtime/cli.log
      - name: Lint and compile downstream targets
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p fln-comp -p fln-vm -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/constructor-runtime/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/constructor-runtime/workspace.log
          rustfmt --edition 2024 --check --config skip_children=true crates/fln/src/runtime.rs crates/fln/src/runtime/records.rs crates/fln/src/runtime/variants.rs crates/fln/src/runtime/data_recursion.rs crates/fln/src/runtime/callables.rs crates/fln/src/runtime/callables/recursors.rs crates/fln/tests/runtime_partial_recursors.rs crates/fln/tests/runtime_recursive_data.rs crates/fln/tests/runtime_variants.rs crates/fln-cli/tests/source_variant_runtime.rs crates/fln-vm/tests/constructor_dispatch.rs crates/fln-comp/src/ingress/constructor_case.rs
      - name: Retain exact verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: constructor-runtime-${{ github.sha }}
          path: target/constructor-runtime
          retention-days: 7
          if-no-files-found: error
