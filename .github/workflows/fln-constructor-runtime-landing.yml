name: Native source variants
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-constructor-runtime-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fln-constructor-runtime-landing
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - name: Apply exact tested source variant implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin dd2fc42d6aa9cb896a904d7ab79829ec032c041f
          python3 -I <<'PY'
          import hashlib,subprocess,textwrap
          original=subprocess.check_output(['git','show','dd2fc42d6aa9cb896a904d7ab79829ec032c041f:.github/workflows/fln-constructor-runtime-landing.yml'])
          assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()=='701c3d6c6e1b42f1d215365b3b01d2e900d36f29'
          script=textwrap.dedent(original.decode().split("          python3 -I <<'PY'\n",1)[1].split('\n          PY\n',1)[0])
          # One transfer character differs from the locally exercised payload.
          # Its original SHA256 and all before/after blob gates remain intact.
          assert script.count('FPbS231TUtb')==1
          script=script.replace('FPbS231TUtb','FPbS831TUtb')
          exec(compile(script,'exact-verified-variant-transfer','exec'))
          PY
      - name: Verify source execution and installed bytecode replay
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          cargo test --locked -p fln --lib --test runtime_variants --test runtime_records --test runtime_nat_recursion --test runtime_local_functions --test source_record_execution --no-fail-fast 2>&1 | tee target/constructor-runtime/tests.log
          cargo test --locked -p fln-cli --test source_variant_runtime --test source_record_runtime 2>&1 | tee target/constructor-runtime/cli.log
          cargo clippy --locked -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/constructor-runtime/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/constructor-runtime/workspace.log
          xargs rustfmt --edition 2024 --check --config skip_children=true < target/constructor-runtime/rust-paths.txt
          git diff --check
      - name: Commit tested source variants directly to main
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs git add -- < target/constructor-runtime/paths.txt
          git commit -m 'feat(runtime): execute native variants with lazy typed payload branches'
          git push origin HEAD:main
          git rev-parse HEAD > target/constructor-runtime/published-commit.txt
          git archive --format=tar.gz HEAD > target/constructor-runtime/published-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: constructor-runtime-${{ github.sha }}
          path: target/constructor-runtime
          retention-days: 7
          if-no-files-found: warn
