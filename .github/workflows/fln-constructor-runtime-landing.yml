name: Native source variants
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-constructor-runtime-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fln-constructor-runtime-landing
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - name: Apply exact tested source variant implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import pathlib,hashlib,zlib,base64,subprocess
          before={'crates/fln-cli/tests/source_variant_runtime.rs':None,'crates/fln/src/runtime.rs':'aec31fc4ed5bf1b81210d8175ef10ca96177f458','crates/fln/src/runtime/records.rs':'894f54db522a143ace4d83aab2078a92575b8d06','crates/fln/src/runtime/variants.rs':None,'crates/fln/tests/runtime_variants.rs':None,'examples/native_variants.lean':None}
          after={'crates/fln-cli/tests/source_variant_runtime.rs':'7bcc598db62ed95f70a30e507450ac2b741de387','crates/fln/src/runtime.rs':'4a9c82cbc2ee47e4fa670564002106e8d105034e','crates/fln/src/runtime/records.rs':'bc8a4bcafc0a141eb10ba9b6ba6bbe75a45cfd61','crates/fln/src/runtime/variants.rs':'72f212fc0ec6b3036da12892a0cc6cf871fc7f6e','crates/fln/tests/runtime_variants.rs':'04dca54de0e623d8bc160750422711655172209f','examples/native_variants.lean':'9a29bf31ecdd8ad5ae3b2c9f301d32224fa5f71e'}
          def verify(rows):
              for n,h in rows.items():
                  p=pathlib.Path(n)
                  if h is None:
                      assert not p.exists(),n
                  else:
                      b=p.read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==h,n
          verify(before)
          encoded=''''''
          assert len(encoded)==10180
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='d3b7a01d4adebab8bc53573aaa09f302c6e1359d847456439e3db925b811aad0'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          verify(after)
          out=pathlib.Path('target/constructor-runtime');out.mkdir(parents=True,exist_ok=True)
          (out/'integration.patch').write_bytes(patch)
          (out/'paths.txt').write_text('\n'.join(after)+'\n')
          (out/'rust-paths.txt').write_text('\n'.join(p for p in after if p.endswith('.rs'))+'\n')
          PY
      - name: Verify source execution and installed bytecode replay
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          cargo test --locked -p fln --lib --test runtime_variants --test runtime_records --test runtime_nat_recursion --test runtime_local_functions --test source_record_execution --no-fail-fast 2>&1 | tee target/constructor-runtime/tests.log
          cargo test --locked -p fln-cli --test source_variant_runtime --test source_record_runtime 2>&1 | tee target/constructor-runtime/cli.log
          cargo clippy --locked -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/constructor-runtime/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/constructor-runtime/workspace.log
          xargs rustfmt --edition 2024 --check --config skip_children=true < target/constructor-runtime/rust-paths.txt
          git diff --check
      - name: Commit tested source variants directly to main
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs git add -- < target/constructor-runtime/paths.txt
          git commit -m 'feat(runtime): execute native variants with lazy typed payload branches'
          git push origin HEAD:main
          git rev-parse HEAD > target/constructor-runtime/published-commit.txt
          git archive --format=tar.gz HEAD > target/constructor-runtime/published-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: constructor-runtime-${{ github.sha }}
          path: target/constructor-runtime
          retention-days: 7
          if-no-files-found: warn
