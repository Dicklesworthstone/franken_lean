name: Native recursive data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-constructor-runtime-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fln-constructor-runtime-landing
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - name: Apply exact tested recursive data implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import pathlib,hashlib,zlib,base64,subprocess
          before={'crates/fln-cli/tests/source_variant_runtime.rs':'7bcc598db62ed95f70a30e507450ac2b741de387','crates/fln/src/runtime.rs':'4a9c82cbc2ee47e4fa670564002106e8d105034e','crates/fln/src/runtime/data_recursion.rs':None,'crates/fln/src/runtime/records.rs':'bc8a4bcafc0a141eb10ba9b6ba6bbe75a45cfd61','crates/fln/src/runtime/variants.rs':'72f212fc0ec6b3036da12892a0cc6cf871fc7f6e','crates/fln/tests/runtime_recursive_data.rs':None,'examples/native_recursive_data.lean':None}
          after={'crates/fln-cli/tests/source_variant_runtime.rs':'41f827110657bfdbadea618c6c8880843b37f4fa','crates/fln/src/runtime.rs':'920da5af684279dc087a2bf78fa845de825f001a','crates/fln/src/runtime/data_recursion.rs':'c6eafe8803002aea9d51572e8ba2374d94a69440','crates/fln/src/runtime/records.rs':'e0213dfd11ae52cdf2ebed1d8fdc7a92455dfa73','crates/fln/src/runtime/variants.rs':'8311ae20e40fc27b8af3aafea2e112f08bfa0165','crates/fln/tests/runtime_recursive_data.rs':'a0d2b117f63a8b91e190ce5598ed1b2fcb5df665','examples/native_recursive_data.lean':'d44ab813d6026e311faaa9cb872ab0020ba236fc'}
          def verify(rows):
              for n,h in rows.items():
                  p=pathlib.Path(n)
                  if h is None:
                      assert not p.exists(),n
                  else:
                      b=p.read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==h,n
          verify(before)
          encoded=''''
          PY
