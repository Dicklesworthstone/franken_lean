name: Native constructor dispatch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-constructor-runtime-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fln-constructor-runtime-landing
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - name: Apply exact locally tested compiler and VM implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import pathlib,hashlib,zlib,base64,subprocess
          before={'crates/fln-comp/src/fir.rs':'cdc448dab36260da9e35f25e0e8da5d29e51897b','crates/fln-comp/src/flbc.rs':'593fda77ff9dc51b5498ef7f5610df55f35cd471','crates/fln-comp/src/ingress.rs':'02512676a95f9cb01a0e2f6a487f1724ee943f8a','crates/fln-comp/src/ingress/branch.rs':'76ccfc1077ac9216ffe955021ec58bda47132fb9','crates/fln-comp/src/ingress/constructor_case.rs':None,'crates/fln-vm/src/interpreter.rs':'5332303324abc8be5d247ff4990c3be8919af33a','crates/fln-vm/tests/constructor_dispatch.rs':None,'crates/fln/src/runtime.rs':'cb42f107e6324448047040fda0c7faaf5dc10f7a'}
          after={'crates/fln-comp/src/fir.rs':'b9130ac62ffeca5105c071faa2f7f357eb834a21','crates/fln-comp/src/flbc.rs':'a922788a945842dc68ea0a3bbc943d6dc92aeac7','crates/fln-comp/src/ingress.rs':'78b34782f72ca3ebb23afde8b0a98747342fcb90','crates/fln-comp/src/ingress/branch.rs':'c116904e20012d7fb0b25152dab2f1737e1f8dcb','crates/fln-comp/src/ingress/constructor_case.rs':'461d074fb9b8c1e7e6ee1c4f2e1785abcf1a9b9a','crates/fln-vm/src/interpreter.rs':'7bb5da5d80dd00280173e59274c5a709fc757ea6','crates/fln-vm/tests/constructor_dispatch.rs':'b5afd4cf8892ae0c3ffa3f50047ff497ba46ccff','crates/fln/src/runtime.rs':'aec31fc4ed5bf1b81210d8175ef10ca96177f458'}
          def verify(rows):
              for n,h in rows.items():
                  p=pathlib.Path(n)
                  if h is None:
                      assert not p.exists(),n
                  else:
                      b=p.read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==h,n
          verify(before)
          encoded=''''''
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='a4d6d6efd7e6bde1cc6e3aa572e7d033e379b44dd6b8a2b98b18bfc78e326969'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          verify(after)
          out=pathlib.Path('target/constructor-runtime');out.mkdir(parents=True,exist_ok=True)
          (out/'integration.patch').write_bytes(patch)
          (out/'paths.txt').write_text('\n'.join(after)+'\n')
          PY
      - name: Test compiler and VM and compile downstream targets
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          cargo test --locked -p fln-comp -p fln-vm --no-fail-fast 2>&1 | tee target/constructor-runtime/tests.log
          cargo clippy --locked -p fln-comp -p fln-vm --all-targets -- -D warnings 2>&1 | tee target/constructor-runtime/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/constructor-runtime/workspace.log
          xargs rustfmt --edition 2024 --check --config skip_children=true < target/constructor-runtime/paths.txt
          git diff --check
      - name: Commit tested implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs git add -- < target/constructor-runtime/paths.txt
          git commit -m 'feat(vm): compile lazy constructor dispatch with checked bytecode shapes'
          git push origin HEAD:main
          git rev-parse HEAD > target/constructor-runtime/published-commit.txt
          git archive --format=tar.gz HEAD > target/constructor-runtime/published-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: constructor-runtime-${{ github.sha }}
          path: target/constructor-runtime
          retention-days: 7
          if-no-files-found: warn
