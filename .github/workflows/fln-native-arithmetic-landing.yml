name: Land native arithmetic constraints
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-native-arithmetic-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fln-native-arithmetic-landing
  cancel-in-progress: false
jobs:
  arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Install configured compiler
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          mkdir -p target/arithmetic-evidence
          rustc -Vv > target/arithmetic-evidence/compiler.txt
          git rev-parse HEAD > target/arithmetic-evidence/input-commit.txt
      - name: Apply exact native arithmetic implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          expected = {
              'crates/fln-elab/src/lib.rs': '034a84bbe49f3846f539aac3f4ef39a3a149016e',
              'crates/fln-elab/src/constraint/unify/reduce.rs': '482257e2b767de196bae5a5020b93cfe0396b278',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'Concurrent source change at {path}: {actual}; expected {sha}')
          for path in ['crates/fln-elab/src/nat_reduce.rs', 'crates/fln-elab/tests/native_unification_arithmetic.rs']:
              if pathlib.Path(path).exists():
                  raise SystemExit(f'Refusing to replace existing {path}')
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != 'c67f40cf8a4b020440752be453d0cf643353ab1767ea753cbbbcf29f95e8f873':
              raise SystemExit('Native arithmetic patch integrity mismatch')
          pathlib.Path('target/arithmetic-evidence/implementation.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          rustfmt --edition 2024 --config skip_children=true crates/fln-elab/src/nat_reduce.rs crates/fln-elab/src/constraint/unify/reduce.rs crates/fln-elab/tests/native_unification_arithmetic.rs
      - name: Test the real solver and check downstream targets
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/arithmetic-evidence/tests.log
          cargo clippy --locked -p fln-elab --all-targets -- -D warnings 2>&1 | tee target/arithmetic-evidence/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/arithmetic-evidence/workspace-check.log
      - name: Publish validated implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git add crates/fln-elab/src/lib.rs crates/fln-elab/src/nat_reduce.rs crates/fln-elab/src/constraint/unify/reduce.rs crates/fln-elab/tests/native_unification_arithmetic.rs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(elab): reduce native Nat arithmetic in transactional constraints' -m 'Evaluate admitted successor, addition, subtraction, multiplication and Boolean comparisons with heap continuations and pre-allocation metering. Preserve delayed constraints, transparency, K1 assignment validation and failure-atomic publication. Fourteen new integration tests cover K1 agreement, computed indices, inductive reduction, malformed primitives, rollback, cancellation and small-stack traversal. Package tests, strict Clippy and workspace compilation passed before this nonforced main publication.'
          git push origin HEAD:main
          git rev-parse HEAD > target/arithmetic-evidence/published-commit.txt
      - name: Retain exact candidate and compiler for independent verification
        if: always() && steps.compiler.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add crates/fln-elab/src/lib.rs crates/fln-elab/src/constraint/unify/reduce.rs
          for p in crates/fln-elab/src/nat_reduce.rs crates/fln-elab/tests/native_unification_arithmetic.rs; do
            if test -f "$p"; then git add "$p"; fi
          done
          tree="$(git write-tree)"
          printf '%s\n' "$tree" > target/arithmetic-evidence/candidate-tree.txt
          git archive --format=tar.gz "$tree" > target/arithmetic-evidence/candidate-source.tar.gz
          toolchain="$(rustc --print sysroot)"
          tar -C "$toolchain" -czf target/arithmetic-evidence/compiler.tar.gz bin lib
          sha256sum target/arithmetic-evidence/candidate-source.tar.gz target/arithmetic-evidence/compiler.tar.gz > target/arithmetic-evidence/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arithmetic-${{ github.sha }}
          path: target/arithmetic-evidence
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
