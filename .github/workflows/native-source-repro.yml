name: native source reproduction

# Auxiliary native-source validation, not a product acceptance gate.
# Exports a tested tree only; it NEVER creates commits or moves a branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/native-source-repro.yml']

permissions:
  contents: read

jobs:
  reproduce:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: checkout the exact triggering source tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: install the repository-pinned native toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt

      - name: apply the identity-checked selected-lemma feature patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          encoded = ''
          manifest = {
              'crates/fln-elab/src/source/tactics.rs': ['5e59e691df9bc51114cbe8fda9d8bc237ac71a07', 'efd723e25cd5186909ed23cde2ed3aa8fed8c668'],
              'crates/fln-elab/src/source/tactics/search.rs': ['714c1acf365610b5a095155e6b507b00103351af', '51e2d4b0d9ea2da40b9173e2c36a0d5e1f516cfe'],
              'crates/fln-elab/src/source/tactics/search/selection.rs': ['6fc27becd9b416321167347bc35352ca334242f4', 'ee79f93a45442ef2c256125ec9fbb7bd39cb3dda'],
              'crates/fln-parse/src/proofs.rs': ['83ed8e544a033c78b0529891654d21e13a3110b4', 'ac6ee338d0c8ccce0fcf9982fcd6283395225b19'],
              'crates/fln-parse/src/proofs/search.rs': ['7940db022818c1e40863a467ab369ccdf2cd511e', 'e4e5e9d8dcafae9fd774ddcf2fee8c07772a9ee1'],
              'crates/fln/tests/source_selected_search.rs': [None, 'c115de18253db2138a10b68b1c081735854850f7'],
          }
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for path, (before, after) in manifest.items():
              p = pathlib.Path(path)
              actual = blob(p.read_bytes()) if p.exists() else None
              if actual != before:
                  raise SystemExit('Source identity changed: ' + path)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '8c6f59df577f4dcda7b95a3d08d42754ad7cb17f3f904cba0a4aa6256f671796':
              raise SystemExit('Patch digest mismatch')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for path, (before, after) in manifest.items():
              if blob(pathlib.Path(path).read_bytes()) != after:
                  raise SystemExit('Result identity changed: ' + path)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'selected-manifest.json').write_text(json.dumps(manifest))
          PY

      - name: validate native parser elaborator and dual-checker admission
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check --config skip_children=true crates/fln-elab/src/source/tactics.rs crates/fln-elab/src/source/tactics/search.rs crates/fln-elab/src/source/tactics/search/selection.rs crates/fln-parse/src/proofs.rs crates/fln-parse/src/proofs/search.rs crates/fln/tests/source_selected_search.rs
          cargo test --locked --offline -p fln-parse -p fln-elab --lib --no-fail-fast
          cargo test --locked --offline -p fln --test source_selected_search --no-fail-fast

      - name: export tested Git objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'Dicklesworthstone/franken_lean':
              raise SystemExit('Unexpected repository')
          manifest = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'selected-manifest.json').read_text())
          def post(endpoint, body):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/' + endpoint, data=json.dumps(body).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'FrankenLean-native-source-validation'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          for path, (before, after) in manifest.items():
              data = pathlib.Path(path).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != after:
                  raise SystemExit('Post-test source identity changed: ' + path)
              uploaded = post('blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              if uploaded['sha'] != after:
                  raise SystemExit('Uploaded blob identity mismatch')
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': after})
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree = post('trees', {'base_tree': base, 'tree': entries})
          print('TESTED_SOURCE_TREE=' + json.dumps({'parent': parent, 'tree': tree['sha'], 'files': entries}, sort_keys=True))
          PY
