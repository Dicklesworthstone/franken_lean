name: native proof-search regressions

# Auxiliary focused regression runner. Existing product and quality gates
# remain authoritative. This workflow never exports source or updates Git.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/native-source-repro.yml']
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout the triggering source tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: install the repository-pinned native compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt
      - name: validate parser elaborator checked proofs and executable exits
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check --config skip_children=true crates/fln-elab/src/source/tactics.rs crates/fln-elab/src/source/tactics/search.rs crates/fln-elab/src/source/tactics/search/selection.rs crates/fln-parse/src/proofs.rs crates/fln-parse/src/proofs/search.rs crates/fln/tests/source_selected_search.rs crates/fln-cli/tests/source_selected_search.rs
          cargo test --locked --offline -p fln-parse -p fln-elab --lib --no-fail-fast
          cargo test --locked --offline -p fln -p fln-cli --test source_selected_search --no-fail-fast
          cargo test --locked --offline -p fln --test source_proof_search --test source_search_reflexivity --no-fail-fast
