name: Propositional family verified publication
on:
  push:
    branches: [main]
    paths: ['scripts/propositional-family-transfer/manifest.json', '.github/workflows/fln-propositional-families-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fln-propositional-families-landing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate the exact patch and its input and output identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/propositional-landing
          git rev-parse HEAD > target/propositional-landing/input-commit.txt
          python3 - <<'PY'
          import base64,gzip,hashlib,io,json,pathlib,subprocess
          out=pathlib.Path('target/propositional-landing')
          raw=pathlib.Path('scripts/propositional-family-transfer/manifest.json').read_bytes()
          plan=json.loads(raw)
          compressed=base64.b64decode(plan['patch_gzip_base64'],validate=True)
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as stream:
              patch=stream.read(2_000_001)
          assert len(patch)<=2_000_000
          assert hashlib.sha256(patch).hexdigest()==plan['sha256']
          paths=plan['paths']
          assert paths and len(paths)==len(set(paths))
          assert set(paths)==set(plan['base_blobs'])==set(plan['source_sha256'])
          blob=lambda data:hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name,expected in plan['base_blobs'].items():
              p=pathlib.Path(name)
              assert name.startswith(('crates/fln-elab/','crates/fln-parse/','crates/fln-checker/','crates/fln/','crates/fln-cli/','docs/','examples/'))
              assert '..' not in p.parts and not p.is_symlink()
              if expected is None:
                  assert not p.exists(),name
              else:
                  assert blob(p.read_bytes())==expected,name
          assert set(line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/'))==set(paths)
          assert b'+++ /dev/null' not in patch
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          for name,digest in plan['source_sha256'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          (out/'manifest.json').write_bytes(raw)
          (out/'change.patch').write_bytes(patch)
          (out/'source-digests.json').write_text(json.dumps(plan['source_sha256'],indent=2)+'\n')
          PY
      - name: Test the real checker frontend engine and installed CLI
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustc -Vv | tee target/propositional-landing/compiler.txt
          cargo test --locked -p fln-elab -p fln-parse -p fln-checker -p fln -p fln-cli --no-fail-fast 2>&1 | tee target/propositional-landing/tests.log
          cargo clippy --locked -p fln-elab -p fln-parse -p fln-checker -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/propositional-landing/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/propositional-landing/workspace.log
          python3 - <<'PY'
          import json,pathlib,subprocess
          out=pathlib.Path('target/propositional-landing')
          plan=json.loads((out/'manifest.json').read_text())
          rust=sorted(p for p in plan['paths'] if p.endswith('.rs'))
          subprocess.run(['rustfmt','--edition','2024','--config','skip_children=true','--check',*rust],check=True)
          for example in plan['examples']:
              name=example['path']
              assert name.startswith('examples/') and '..' not in pathlib.PurePosixPath(name).parts
              data=subprocess.check_output(['cargo','run','--locked','-p','fln-cli','--bin','fln','--','check-source','--json',name])
              result=json.loads(data)
              assert result['commands']==example['commands'] and result['theorems']==example['theorems']
              assert result['outcome']=='complete' and result['authority'] is True and result['executed'] is False
              (out/(pathlib.Path(name).stem+'.json')).write_bytes(data)
          PY
          git diff --check
          git diff --cached --check
      - name: Publish only the exact tested files without a force push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          out=pathlib.Path('target/propositional-landing')
          plan=json.loads((out/'manifest.json').read_text())
          for name,digest in plan['source_sha256'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          assert not subprocess.check_output(['git','diff','--name-only']).strip()
          assert set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())==set(plan['paths'])
          (out/'verified.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          subprocess.run(['git','config','user.name','FrankenLean implementation'],check=True)
          subprocess.run(['git','config','user.email','noreply@github.com'],check=True)
          subprocess.run(['git','commit','-m',plan['message']],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          (out/'published-commit.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: propositional-families-${{ github.sha }}
          path: target/propositional-landing
          retention-days: 7
