name: Dependent indexed recursion verified publication
on:
  push:
    branches: [main]
    paths: ['scripts/dependent-index-transfer/**', '.github/workflows/fln-dependent-indices-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fln-dependent-indices-landing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate the exact recovered patch and source identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/dependent-indices-landing
          git rev-parse HEAD > target/dependent-indices-landing/input-commit.txt
          python3 - <<'PY'
          import gzip,hashlib,io,json,pathlib,subprocess
          root=pathlib.Path('scripts/dependent-index-transfer')
          out=pathlib.Path('target/dependent-indices-landing')
          raw=(root/'manifest.json').read_bytes()
          plan=json.loads(raw)
          blob=lambda data: hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert len(plan['parts'])==6
          parts=[]
          for i,part in enumerate(plan['parts']):
              p=root/f'{i}.gz-part'
              assert str(p)==part['path'] and not p.is_symlink()
              data=p.read_bytes()
              assert len(data)<=1536 and blob(data)==part['blob']
              parts.append(data)
          with gzip.GzipFile(fileobj=io.BytesIO(b''.join(parts))) as stream:
              patch=stream.read(2_000_001)
          assert len(patch)==plan['length']==35140
          assert hashlib.sha256(patch).hexdigest()==plan['sha256']=='30fa676e2a8debed7c9cd3106b80797aab0bd25e3b73a0f2afb71cf8de8504c9'
          paths=plan['paths']
          assert len(paths)==len(set(paths))==9
          assert set(paths)==set(plan['base_blobs'])==set(plan['source_sha256'])
          for name,expected in plan['base_blobs'].items():
              p=pathlib.Path(name)
              assert name.startswith(('crates/fln-checker/','crates/fln-cli/','crates/fln-elab/','crates/fln/','docs/','examples/'))
              assert '..' not in p.parts and not p.is_symlink()
              if expected is None:
                  assert not p.exists(),name
              else:
                  assert blob(p.read_bytes())==expected,name
          assert set(line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/'))==set(paths)
          assert b'+++ /dev/null' not in patch
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          for name,digest in plan['source_sha256'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          (out/'manifest.json').write_bytes(raw)
          (out/'change.patch').write_bytes(patch)
          (out/'source-digests.json').write_text(json.dumps(plan['source_sha256'],indent=2)+'\n')
          PY
      - name: Test the actual checker frontend engine and CLI
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustc -Vv | tee target/dependent-indices-landing/compiler.txt
          cargo test --locked -p fln-elab -p fln-parse -p fln-checker -p fln -p fln-cli --no-fail-fast 2>&1 | tee target/dependent-indices-landing/tests.log
          cargo clippy --locked -p fln-elab -p fln-parse -p fln-checker -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/dependent-indices-landing/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/dependent-indices-landing/workspace.log
          python3 - <<'PY'
          import json,pathlib,subprocess
          out=pathlib.Path('target/dependent-indices-landing')
          plan=json.loads((out/'manifest.json').read_text())
          rust=sorted(p for p in plan['paths'] if p.endswith('.rs'))
          subprocess.run(['rustfmt','--edition','2024','--config','skip_children=true','--check',*rust],check=True)
          for example,commands,theorems in [('native_indexed_recursion',12,6),('native_dependent_indices',9,4)]:
              data=subprocess.check_output(['cargo','run','--locked','-p','fln-cli','--bin','fln','--','check-source','--json',f'examples/{example}.lean'])
              result=json.loads(data)
              assert result['commands']==commands and result['theorems']==theorems
              assert result['outcome']=='complete' and result['authority'] is True and result['executed'] is False
              (out/f'{example}.json').write_bytes(data)
          PY
          git diff --check
          git diff --cached --check
      - name: Publish exactly the tested implementation to main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          out=pathlib.Path('target/dependent-indices-landing')
          plan=json.loads((out/'manifest.json').read_text())
          for p,digest in plan['source_sha256'].items():
              assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==digest,p
          assert not subprocess.check_output(['git','diff','--name-only']).strip()
          assert set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())==set(plan['paths'])
          (out/'verified.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          subprocess.run(['git','config','user.name','FrankenLean implementation'],check=True)
          subprocess.run(['git','config','user.email','noreply@github.com'],check=True)
          subprocess.run(['git','commit','-m',plan['message']],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          (out/'published-commit.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-dependent-indices-${{ github.sha }}
          path: target/dependent-indices-landing
          retention-days: 7
