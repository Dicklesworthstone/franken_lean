name: scheduled contract drift

permissions:
  contents: read

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: contract-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-drift:
    name: regenerate contracts against the pinned Reference
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: checkout FrankenLean
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: checkout pinned lean4export source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover/lean4export
          ref: 4e7915201d3f9f04470d9eae002fa695f7cdc589
          path: target/ci-tools/lean4export
          persist-credentials: false

      - name: checkout pinned nanoda source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ammkrn/nanoda_lib
          ref: ddfac2bf5a7b56cb46e141494427ff3dd55963c7
          path: target/ci-tools/nanoda
          persist-credentials: false

      - name: install pinned elan
        shell: bash
        run: |
          tool_root="$RUNNER_TEMP/elan-bin"
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          mkdir "$tool_root"
          python3 -I -S - "$archive" <<'PY'
          import hashlib
          import pathlib
          import sys
          import urllib.request

          url = (
              "https://github.com/leanprover/elan/releases/download/"
              "v4.2.1/elan-x86_64-unknown-linux-gnu.tar.gz"
          )
          expected = "4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c"
          limit = 32 * 1024 * 1024
          with urllib.request.urlopen(url, timeout=60) as response:
              payload = response.read(limit + 1)
          if len(payload) > limit:
              raise SystemExit(f"elan archive exceeds {limit} bytes")
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"elan archive digest mismatch: {actual} != {expected}")
          pathlib.Path(sys.argv[1]).write_bytes(payload)
          print(f"elan archive SHA-256: {actual}")
          PY
          tar -xzf "$archive" -C "$tool_root"
          # Run elan-init in its installer mode. That is what creates $ELAN_HOME/bin with
          # elan and its lean/lake/leanc/leanchecker proxies. Renaming the binary to `elan`
          # skipped it, so every later bare `lake` failed with "command not found" and every
          # weekly run from 2026-07-27 to 2026-09-28 stopped at the witness-tools build
          # (bead franken_lean-z8j.1.17).
          export ELAN_HOME="$HOME/.elan"
          "$tool_root/elan-init" -y --no-modify-path --default-toolchain none
          for proxy in elan lean lake leanc leanchecker; do
            test -x "$ELAN_HOME/bin/$proxy"
          done
          printf 'ELAN_HOME=%s\n' "$ELAN_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$ELAN_HOME/bin" >> "$GITHUB_PATH"

      - name: read the Reference tag from SUITE.lock
        id: reference
        shell: bash
        run: |
          mapfile -t reference_rows < <(grep -E '^reference ' SUITE.lock)
          if (( ${#reference_rows[@]} != 1 )); then
            echo "SUITE.lock must contain exactly one reference row" >&2
            exit 2
          fi
          pin_tag="$(
            sed -E 's/.*tag=([^ ]+).*/\1/' <<<"${reference_rows[0]}"
          )"
          if [[ ! "$pin_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "SUITE.lock Reference tag cannot name an elan toolchain: $pin_tag" >&2
            exit 2
          fi
          printf 'pin_tag=%s\n' "$pin_tag" >> "$GITHUB_OUTPUT"
          printf 'Reference tag from SUITE.lock: %s\n' "$pin_tag"

      - name: install the SUITE.lock-pinned Reference toolchain
        id: toolchain
        shell: bash
        env:
          PIN_TAG: ${{ steps.reference.outputs.pin_tag }}
        run: |
          elan --version
          elan toolchain install "leanprover/lean4:$PIN_TAG"
          toolchain_root="$HOME/.elan/toolchains/leanprover--lean4---$PIN_TAG"
          test -x "$toolchain_root/bin/lean"
          "$toolchain_root/bin/lean" --version
          # Every bare lean/lake below must resolve to the pin, inside or outside a
          # directory carrying its own lean-toolchain file.
          elan default "leanprover/lean4:$PIN_TAG"
          pin_commit="$(sed -nE 's/^reference .*commit=([0-9a-f]{40}).*/\1/p' SUITE.lock)"
          test -n "$pin_commit"
          lean --version | grep -F "$pin_commit"
          lake --version

      # Every cargo step below builds FrankenLean, which rust-toolchain.toml pins to an
      # exact nightly. Install it explicitly, as ci.yml does, rather than relying on
      # rustup's implicit install from the toolchain file.
      - name: install the pinned Rust toolchain
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          channel="$(python3 -I -S -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt --component clippy
          rustup run "$channel" rustc --version
          rustup run "$channel" cargo --version

      # Every step from here on runs whenever the pinned Reference installed, even after
      # an earlier step failed: each lane is its own check, and stopping at the first red
      # hid every later one (none of them had ever executed in CI before run
      # 37276449789). The job still fails if any step fails.
      - name: run the leanchecker witness lane (Reference-kernel oracle, franken_lean-z8j.1.17)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          step_root="target/e2e/contract-drift-leanchecker-witness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/tribunal/leanchecker_witness.sh
          mapfile -d '' -t runs < <(
            find target/e2e -mindepth 1 -maxdepth 1 -type d \
              -name 'leanchecker-witness-*' -print0
          )
          if (( ${#runs[@]} != 1 )); then
            echo "the witness lane published ${#runs[@]} runs; expected one" >&2
            exit 2
          fi
          # The pin is installed in this job, so a typed skip is a broken lane here, not
          # an absent pin: require the run to have passed.
          grep -q '"step":"run_end","status":"passed"' "${runs[0]}/run.ndjson"
          mv "${runs[0]}" "$step_root"

      - name: build pinned certificate-format witness tools
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          lean4export_root="$GITHUB_WORKSPACE/target/ci-tools/lean4export"
          nanoda_root="$GITHUB_WORKSPACE/target/ci-tools/nanoda"
          lean4export_revision="4e7915201d3f9f04470d9eae002fa695f7cdc589"
          nanoda_revision="ddfac2bf5a7b56cb46e141494427ff3dd55963c7"
          actual_lean4export="$(
            git -C "$lean4export_root" rev-parse --verify 'HEAD^{commit}'
          )"
          actual_nanoda="$(
            git -C "$nanoda_root" rev-parse --verify 'HEAD^{commit}'
          )"
          if [[ "$actual_lean4export" != "$lean4export_revision" ]]; then
            echo "lean4export checkout mismatch" >&2
            exit 2
          fi
          if [[ "$actual_nanoda" != "$nanoda_revision" ]]; then
            echo "nanoda checkout mismatch" >&2
            exit 2
          fi

          (
            cd "$lean4export_root"
            lake build
          )
          # nanoda is a standalone cargo package. Built in place, cargo walks up from
          # target/ci-tools/nanoda to FrankenLean's own Cargo.toml and refuses ("current
          # package believes it's in a workspace when it's not"), which is how this step
          # failed on its first execution (run 37276449789). Build a copy outside the
          # workspace, from inside it, so neither FrankenLean's workspace nor its pinned
          # nightly applies to the third-party tool. The revision check above is on the
          # checkout; the copy is byte-identical including .git.
          nanoda_build="$RUNNER_TEMP/fln-nanoda-src"
          cp -a "$nanoda_root" "$nanoda_build"
          test "$(git -C "$nanoda_build" rev-parse --verify 'HEAD^{commit}')" = "$nanoda_revision"
          nanoda_target="$RUNNER_TEMP/fln-nanoda-target"
          (
            cd "$nanoda_build"
            cargo build --release --locked \
              --target-dir "$nanoda_target" \
              --bin nanoda_bin
          )
          lean4export_bin="$lean4export_root/.lake/build/bin/lean4export"
          nanoda_bin="$nanoda_target/release/nanoda_bin"
          test -x "$lean4export_bin"
          test -x "$nanoda_bin"
          {
            printf 'FLN_LEAN4EXPORT_ROOT=%s\n' "$lean4export_root"
            printf 'FLN_LEAN4EXPORT_BIN=%s\n' "$lean4export_bin"
            printf 'FLN_NANODA_ROOT=%s\n' "$nanoda_root"
            printf 'FLN_NANODA_BIN=%s\n' "$nanoda_bin"
          } >> "$GITHUB_ENV"

      - name: expose the toolchain/vendor identity joins
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        env:
          PIN_TAG: ${{ steps.reference.outputs.pin_tag }}
        run: |
          toolchain_header="$HOME/.elan/toolchains/leanprover--lean4---$PIN_TAG/include/lean/lean.h"
          vendor_header="vendor/lean4-src/src/include/lean/lean.h"
          sha256sum "$toolchain_header" "$vendor_header"
          cmp "$toolchain_header" "$vendor_header"
          echo "toolchain/vendor lean.h join: byte-identical"
          ./scripts/verify_vendor_tree.sh

      - name: verify the pinned LSP wire inventory
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          python3 -I -S scripts/extract/gen_lsp_wire_census.py --check

      - name: verify the pinned CLI and Lake census
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          python3 -I -S scripts/extract/gen_cli_lake_census.py --check
          python3 -I -S scripts/extract/gen_cli_lake_census.py --check-probes

      - name: verify the joined public-surface contract
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          python3 -I -S scripts/extract/gen_public_surface_contract.py --check

      - name: materialize the extern/builtin census shards
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          # The extern row join reads the untracked builtin shards; with the pin
          # installed above they regenerate and verify against the tracked envelope.
          ./scripts/extract/census_materialize.sh

      - name: verify the extern row contract
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          python3 -I -S scripts/extract/gen_extern_rows.py --check

      - name: pin-dependent conformance suites (fln-rgha)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        env:
          PIN_TAG: ${{ steps.reference.outputs.pin_tag }}
        run: |
          # Four binaries carry typed-skip sites cited by NINE terminal coverage rows in
          # ci/VERIFICATION_MANIFEST.jsonl; the fifth is the manifest-complete LSP producer
          # proof, the sixth is the G0-4 syntax/hygiene Reference differential, and the
          # seventh is the per-frontend diagnostic projection differential. The eighth is
          # the complete CLI/Lake census differential, and the ninth joins the option,
          # CLI/Lake, and LSP products through fresh real processes. The tenth has the
          # pinned leanchecker and lean consume a FrankenLean-written module that imports
          # the Reference's Init (the mixed-producer seed, franken_lean-0nz). All ten are
          # compiled PinRig entries. Until this step the nine cited rows
          # had never executed in any workflow: ci.yml installs no Lean pin and this workflow
          # ran no cargo, so the intersection was empty (bead fln-rgha).
          #
          # They run HERE, not in ci.yml, deliberately. ci.yml installs no elan on purpose --
          # see the comment above its contract-handoff step, where a prior attempt produced a
          # setup failure that LOOKED LIKE A REAL VERIFICATION, which is this bead's own
          # defect. The pinned toolchain is 2.8 GB; that is not a per-push cost. Rust comes
          # from rust-toolchain.toml, which auto-selects the pinned nightly.
          #
          # THE EXECUTION JOIN. Exit 0 and libtest's per-test `ok` cannot be the gate here.
          # Measured by cc_3 at b45ff944 and independently by cc_2 at 9b6a7dfa: with the pin
          # present and masked, cargo's externally visible dispositions are identical because
          # each typed skip is an early return inside a test that then passes. Grepping the log
          # merely changes cargo's capture policy and still cannot prove which assertions ran.
          #
          # Each registered pin rig therefore owns one structured record file. The record is
          # written only after the assertion-bearing body completes, or as typed_skip_no_pin
          # from the declining branch. The verifier below derives the expected set from the
          # compiled PinRig registry and the live #[ignore] attributes, binds every record to
          # SUITE.lock's tag and full commit, writes a first-class tally, and refuses missing,
          # duplicate, stale, unexpected or skipped records. The directory is unique to this
          # workflow attempt so a prior green cannot satisfy a later run.
          artifact_root="target/e2e/contract-drift-rgha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export FLN_RIG_EXECUTION_DIR="$PWD/$artifact_root/records"
          export FLN_RIG_EXECUTION_SUMMARY="$PWD/$artifact_root/rig-execution-summary.txt"
          mkdir -p "$FLN_RIG_EXECUTION_DIR"
          log="$RUNNER_TEMP/rgha-suites.log"
          set +e
          cargo test --locked -p fln-conformance \
            --test kernel_replay \
            --test pin_option_defaults \
            --test ext_observable_capture \
            --test pin_ctor_inventory \
            --test lsp_census_no_mock_e2e \
            --test cli_lake_census_no_mock_e2e \
            --test public_surface_no_mock_e2e \
            --test g0_4_no_mock_e2e \
            --test olean_mixed_producer_no_mock_e2e \
            --test diag_render \
            -- --nocapture > "$log" 2>&1
          rc=$?
          cargo test --locked -p fln-conformance \
            --test ci_execution_join \
            configured_pin_rig_records_prove_each_scheduled_rig_executed \
            -- --exact --nocapture
          collector_rc=$?
          set -e
          result_lines=$(grep -c '^test result:' "$log" || true)
          passed=$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' "$log" \
            | paste -sd+ - | bc 2>/dev/null || echo 0)
          [[ -z "$passed" ]] && passed=0
          printf 'rgha-join: cargo_rc=%s collector_rc=%s result_lines=%s passed=%s\n' \
            "$rc" "$collector_rc" "$result_lines" "$passed"
          fail=0
          if (( rc != 0 )); then
            echo "rgha-join: REFUSED - cargo exited $rc; a real failure, not a skip question" >&2
            fail=1
          fi
          if (( collector_rc != 0 )); then
            echo "rgha-join: REFUSED - the structured per-rig execution join failed" >&2
            fail=1
          fi
          # These two floors answer only whether the command shape collapsed. They do not
          # carry execution evidence; the structured records above do.
          if (( result_lines < 10 )); then
            echo "rgha-join: REFUSED - only $result_lines of 10 binaries reported a result" >&2
            fail=1
          fi
          if (( passed < 30 )); then
            echo "rgha-join: REFUSED - only $passed tests ran (floor 30 after mixed-producer registration); a zero-test cargo success is not a run" >&2
            fail=1
          fi
          (( fail )) && exit 2
          cat "$FLN_RIG_EXECUTION_SUMMARY"
          echo "rgha-join: PASS - exact structured record for every scheduled pin rig"
          # WHAT THIS DOES NOT ESTABLISH: that the suites checked their subject CORRECTLY.
          # It proves that the registered assertion-bearing bodies executed and did not
          # silently skip; the soundness of the assertions remains their own obligation.

      - name: verify imported tag queries and real module publication
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          # The tag test uses checked-in bytes on every ordinary test run.
          # Regenerate those bytes here and also execute the module target's
          # installed-pin companion case, which fails on absent artifacts.
          artifact_root="target/e2e/contract-drift-imported-tags-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -I -S scripts/extract/gen_attribute_state_census.py \
            --tag-oracle-output "$artifact_root/prelude.tsv"
          cmp crates/fln-conformance/fixtures/tag_attributes/prelude.tsv "$artifact_root/prelude.tsv"
          cmp crates/fln-conformance/fixtures/tag_attributes/prelude.lean "$artifact_root/prelude.lean"
          for suffix in .olean .olean.server .olean.private; do
            cmp "crates/fln-conformance/fixtures/tag_attributes/prelude$suffix" "$artifact_root/prelude$suffix"
          done
          python3 -I -S scripts/extract/gen_attribute_state_census.py --check
          cargo test --locked -p fln-conformance \
            --test real_attribute_fixtures_e2e \
            --test real_module_fixtures_e2e \
            --test pinned_nat_council \
            --no-fail-fast -- --include-ignored --nocapture

      - name: hold the Reference-differential ledger to the pinned Reference (fln-ew20)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          # The product gate enforces the seed-dialect freeze from the ledger
          # without the pin; this is where every ledger row is re-derived from the
          # real Reference. FLN_REQUIRE_REFERENCE turns the rig's typed SKIP into a
          # failure, so an absent pin cannot pass as an agreeing ledger.
          FLN_REQUIRE_REFERENCE=1 cargo test --locked -p fln-cli \
            --test source_reference_differential --no-fail-fast

      - name: measure ordinary Lean against the pinned Reference (fln-ordinary-lean-probe-g03u)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          # Measuring, not gating: prints one line per probe program and the
          # acceptance triple into this log. It fails only when FrankenLean's
          # `lean` accepts a program the Reference rejects, or on a broken scan.
          FLN_REQUIRE_REFERENCE=1 cargo test --locked -p fln-cli \
            --test ordinary_lean_probe --no-fail-fast -- --nocapture

      - name: run the certificate-format independent-checker lane
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          step_root="target/e2e/contract-drift-certificate-format-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$step_root"
          FLN_E2E_ART_ROOT="$PWD/$step_root" \
            FLN_E2E_CACHE_STATE="github-actions-contract-drift" \
            ./scripts/e2e/certificate_format_no_mock_e2e.sh
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          if (( ${#bundles[@]} != 1 )); then
            echo "certificate-format lane published ${#bundles[@]} bundles; expected one" >&2
            exit 2
          fi
          artifact="${bundles[0]}"
          python3 -I -S scripts/evidence.py validate-bundle \
            --art-dir "$artifact" \
            --manifest "$artifact/manifest.json" \
            --digest "$artifact/manifest.digest" \
            --commit "$artifact/bundle.complete.json" \
            --artifact-root "$artifact"

      - name: run the certificate-cartridge no-mock lane
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          step_root="target/e2e/contract-drift-cartridge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$step_root"
          FLN_E2E_ART_ROOT="$PWD/$step_root" \
            FLN_E2E_CACHE_STATE="github-actions-contract-drift" \
            ./scripts/e2e/cartridge_no_mock_e2e.sh
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          if (( ${#bundles[@]} != 1 )); then
            echo "certificate-cartridge lane published ${#bundles[@]} bundles; expected one" >&2
            exit 2
          fi
          artifact="${bundles[0]}"
          python3 -I -S scripts/evidence.py validate-bundle \
            --art-dir "$artifact" \
            --manifest "$artifact/manifest.json" \
            --digest "$artifact/manifest.digest" \
            --commit "$artifact/bundle.complete.json" \
            --artifact-root "$artifact"

      - name: run the bignum-vectors no-mock lane
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          step_root="target/e2e/contract-drift-bignum-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$step_root"
          FLN_E2E_ART_ROOT="$PWD/$step_root" \
            FLN_E2E_CACHE_STATE="github-actions-contract-drift" \
            ./scripts/e2e/bignum_vectors.sh
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          if (( ${#bundles[@]} != 1 )); then
            echo "bignum-vectors lane published ${#bundles[@]} bundles; expected one" >&2
            exit 2
          fi
          artifact="${bundles[0]}"
          python3 -I -S scripts/evidence.py validate-bundle \
            --art-dir "$artifact" \
            --manifest "$artifact/manifest.json" \
            --digest "$artifact/manifest.digest" \
            --commit "$artifact/bundle.complete.json" \
            --artifact-root "$artifact"

      - name: run the suite-upgrade isolated-candidate no-mock lane
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          step_root="target/e2e/contract-drift-suite-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$step_root"
          FLN_E2E_ART_ROOT="$PWD/$step_root" \
            FLN_E2E_CACHE_STATE="github-actions-contract-drift" \
            ./scripts/e2e/suite_upgrade_no_mock_e2e.sh
          mapfile -d '' -t runs < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          if (( ${#runs[@]} != 1 )); then
            echo "suite-upgrade lane retained ${#runs[@]} runs; expected one" >&2
            exit 2
          fi
          artifact="${runs[0]}"
          python3 -I -S scripts/evidence.py validate-run \
            --file "$artifact/run.ndjson" --schema fln.e2e/2 \
            --expected-verdict pass --artifact-root "$artifact" --offline
          python3 -I -S scripts/evidence.py validate-manifest \
            --art-dir "$artifact" --manifest "$artifact/manifest.json" \
            --digest "$artifact/manifest.digest" --offline

      - name: run the G0-4 syntax and hygiene no-mock lane
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          step_root="target/e2e/contract-drift-g04-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$step_root"
          FLN_E2E_ART_ROOT="$PWD/$step_root" \
            FLN_E2E_CACHE_STATE="github-actions-contract-drift" \
            ./scripts/e2e/g0_4_no_mock_e2e.sh
          mapfile -d '' -t runs < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          if (( ${#runs[@]} != 1 )); then
            echo "G0-4 lane retained ${#runs[@]} runs; expected one" >&2
            exit 2
          fi
          artifact="${runs[0]}"
          python3 -I -S scripts/evidence.py validate-run \
            --file "$artifact/run.ndjson" --schema fln.e2e/2 \
            --expected-verdict pass --artifact-root "$artifact" --offline
          python3 -I -S scripts/evidence.py validate-manifest \
            --art-dir "$artifact" --manifest "$artifact/manifest.json" \
            --digest "$artifact/manifest.digest" --offline

      - name: run the per-frontend diagnostic projection no-mock lane
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          step_root="target/e2e/contract-drift-diagnostic-projection-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$step_root"
          FLN_E2E_ART_ROOT="$PWD/$step_root" \
            FLN_E2E_CACHE_STATE="github-actions-contract-drift" \
            ./scripts/e2e/diag_goldens.sh
          mapfile -d '' -t runs < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          if (( ${#runs[@]} != 1 )); then
            echo "diagnostic projection lane retained ${#runs[@]} runs; expected one" >&2
            exit 2
          fi
          artifact="${runs[0]}"
          python3 -I -S scripts/evidence.py validate-run \
            --file "$artifact/run.ndjson" --schema fln.e2e/2 \
            --expected-verdict pass --artifact-root "$artifact" --offline
          python3 -I -S scripts/evidence.py validate-manifest \
            --art-dir "$artifact" --manifest "$artifact/manifest.json" \
            --digest "$artifact/manifest.digest" --offline

      - name: run the governed kernel replay evidence lane
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          # Registration and shellcheck never established that this lane ran. Execute the
          # actual script in the pin-bearing workflow and retain its committed fln.e2e/2
          # admission child. The outer fln.e2e/1 journal is legacy compatibility evidence;
          # the independently validated child is the authoritative receipt.
          step_root="target/e2e/contract-drift-kernel-replay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$step_root"
          FLN_E2E_ART_ROOT="$PWD/$step_root" \
            FLN_E2E_CACHE_STATE="github-actions-contract-drift" \
            ./scripts/e2e/kernel_replay.sh
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          if (( ${#bundles[@]} != 1 )); then
            echo "kernel replay lane published ${#bundles[@]} outer bundles; expected one" >&2
            exit 2
          fi
          artifact="${bundles[0]}"
          child="$artifact/admission-ap6"
          python3 -I -S scripts/evidence.py validate-bundle \
            --art-dir "$child" \
            --manifest "$child/manifest.json" \
            --digest "$child/manifest.digest" \
            --commit "$child/bundle.complete.json" \
            --artifact-root "$child"

      - name: verify the epoch lab and run Reference-vs-Reference E2E
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          # This lane belongs here rather than in ci.yml: it requires the 2.8 GB
          # SUITE.lock-pinned Reference toolchain installed above. The shared
          # fln.e2e/2 bundle remains mandatory in this weekly/on-demand workflow;
          # crates/fln-conformance/tests/contract_roots.rs binds both commands to
          # this reachable dispatcher so a governed-input or shellcheck mention
          # cannot satisfy the obligation.
          ./scripts/tribunal/gen_epoch_manifest.sh --check
          step_root="target/e2e/contract-drift-ref-vs-ref-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$step_root"
          FLN_E2E_ART_ROOT="$PWD/$step_root" \
            FLN_E2E_CACHE_STATE="github-actions-contract-drift" \
            ./scripts/tribunal/ref_vs_ref.sh
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          if (( ${#bundles[@]} != 1 )); then
            echo "Reference-vs-Reference lane published ${#bundles[@]} bundles; expected one" >&2
            exit 2
          fi
          artifact="${bundles[0]}"
          python3 -I -S scripts/evidence.py validate-bundle \
            --art-dir "$artifact" \
            --manifest "$artifact/manifest.json" \
            --digest "$artifact/manifest.digest" \
            --commit "$artifact/bundle.complete.json" \
            --artifact-root "$artifact"

      - name: run the seeded contract drift lane
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          step_root="target/e2e/contract-drift-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$step_root"
          FLN_E2E_ART_ROOT="$PWD/$step_root" \
            FLN_E2E_CACHE_STATE="github-actions-contract-drift" \
            ./scripts/e2e/contract_drift.sh
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          if (( ${#bundles[@]} != 1 )); then
            echo "contract-drift lane published ${#bundles[@]} bundles; expected one" >&2
            exit 2
          fi
          artifact="${bundles[0]}"
          python3 -I -S scripts/evidence.py validate-bundle \
            --art-dir "$artifact" \
            --manifest "$artifact/manifest.json" \
            --digest "$artifact/manifest.digest" \
            --commit "$artifact/bundle.complete.json" \
            --artifact-root "$artifact"
          git diff --exit-code -- \
            ABI_CONTRACT.md \
            contracts/PUBLIC_SURFACE_CONTRACT.md \
            contracts/PUBLIC_SURFACE_CONTRACT.txt \
            crates/fln-rt/src/abi.rs \
            crates/fln-olean/src/format.rs \
            crates/fln-conformance/src/public_surface_generated.rs

      # OchreLynx's grammar census drift check (bead fln-vokf): regenerates both census files
      # from the pin into scratch and diffs them; exit 1 is drift. The full check replays
      # every Init/Std source file (about 5-10 CPU-minutes per 100 files), so it runs last
      # and runs even when an earlier lane failed, as long as the pin installed.
      - name: check the pinned grammar census for drift (fln-vokf)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 90
        shell: bash
        env:
          FLN_GRAMMAR_CENSUS_JOBS: 4
        run: |
          ./scripts/extract/gen_grammar_census.sh --check

      - name: archive contract drift evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contract-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/e2e/contract-drift-*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
