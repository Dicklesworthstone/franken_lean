name: Native elaborator functional tests

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-elab-native.yml']
permissions:
  contents: read
jobs:
  elaborator:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.event.head_commit.message == 'test(source): prepare verified scope integration objects'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare exact reviewed scope changes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/scope_objects.py" <<'PYTHON'
          import base64, hashlib, json, os, pathlib, subprocess, sys, urllib.request, zlib
          MANIFEST = {'crates/fln-elab/src/source.rs': ['c318d7f81ea96e15c2eee443fe50f24e2645c21f', 'cbc449d69c6cb2838ec34a62870437ccaaab5ac2'], 'crates/fln-elab/src/source/inductive.rs': ['a6b9c75cf718269f74632c4c1107e7a291cb5543', '84002b1a82cf980598dd5ddef2f178c2a198898b'], 'crates/fln-elab/src/source/level_syntax.rs': ['e46b2f2468bd20088c551336ce7f294a5dddfede', 'bb8964e27f8b3dcf70ae62ad7eb247b9fdc9f0d9'], 'crates/fln-elab/src/source/matching.rs': ['05b2841b5ab21d2204027c22a29261387e8d55de', '288f4a5693bdb8ce40eb8736736925922aa6d802'], 'crates/fln-elab/src/source/patterns.rs': ['bf77fc450a1458a86dae357b9ba1c565105d3d85', '5e5086fce4d421164a1cc020eb0558495bf6f66f'], 'crates/fln-elab/src/source/record.rs': ['a6f59f67a4aafeb8822ed1c414822ab8cc349271', 'f66a8688e46c17f1173b5ca4a9e97905d481da42'], 'crates/fln-elab/src/source/record_terms.rs': ['da8af64290a9cfac2cda8d8a14d6f9dec58ccc1f', 'b74977ae5c3cedc197e6a78f0f39ccc1fa2855ee'], 'crates/fln-elab/src/source/recursion.rs': ['63a5987804a494fdc41d424ce260cc5c9221645e', '40527ae650273aa23b418ffbdb1b7a1422dafb89'], 'crates/fln-parse/src/lib.rs': ['7a841a4f5a0f82c32306bca17986c4dee74988fa', '6da03244144a1a3151c36c0f45b00cfd1258f7c9'], 'crates/fln/src/source_check.rs': ['ac783dec1a200b247894a35b2fb7b13eaa0a0262', '040488bcc7d774939d7fe66d6fcd29eff8eea273'], 'crates/fln/src/source_records.rs': ['8a407e6f4f97bfe6a83d21aae5fe6c5a3fdcbe6f', '8014765bb5a5e0588c6205f3bcf1fbe19b95bf56'], 'crates/fln/tests/source_file_check.rs': ['729e7b2415cb0214428537f89e8c8738163ff07c', 'f3c9c21429b53a7766ba469c6364a0b48534cda9'], 'crates/fln/tests/source_scopes.rs': [None, 'c3f52996a9512ad29bd0f28f86495ebdc9baed94']}
          def blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if sys.argv[1] == "prepare":
              for path, (before, after) in MANIFEST.items():
                  file = pathlib.Path(path)
                  assert (blob(file.read_bytes()) if file.exists() else None) == before, path
              for path, expected in {
                  "crates/fln-elab/src/source/scope.rs": "744c3dbf68647b36143d6d44c1007a8e964f16d7",
                  "crates/fln-parse/src/command_scope.rs": "eaa5fdc297f01f43e6bdd5ae2f6f001a904d3e71",
                  "crates/fln/src/source_check/scopes.rs": "48e7a0bc40f6b5a7b2c6cc587b833f8e26777c0c",
              }.items():
                  assert blob(pathlib.Path(path).read_bytes()) == expected, path
              patch = zlib.decompress(base64.b64decode(""))
              assert hashlib.sha256(patch).hexdigest() == "7605a91a097026d9128b1186e81b10c6b720cdf48f0f3b968dc41454b0b0c2aa"
              subprocess.run(["git", "apply", "--index", "--check", "-"], input=patch, check=True)
              subprocess.run(["git", "apply", "--index", "-"], input=patch, check=True)
              paths = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
              assert sorted(paths) == sorted(MANIFEST), paths
              for path, (_, after) in MANIFEST.items():
                  assert blob(pathlib.Path(path).read_bytes()) == after, path
          elif sys.argv[1] == "publish-blobs":
              # Write immutable, hash-verified objects only. No branch/ref/commit writes.
              assert os.environ["GITHUB_REPOSITORY"] == "Dicklesworthstone/franken_lean"
              result = {}
              for path, (_, expected) in MANIFEST.items():
                  data = pathlib.Path(path).read_bytes()
                  assert blob(data) == expected, path
                  request = urllib.request.Request(
                      "https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs",
                      data=json.dumps({"content": base64.b64encode(data).decode(), "encoding": "base64"}).encode(),
                      headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(request, timeout=60) as response:
                      actual = json.load(response)["sha"]
                  assert actual == expected, (path, actual, expected)
                  result[path] = actual
                  print("SCOPE_BLOB", path, actual, flush=True)
              pathlib.Path("target/elab-functional/objects.json").write_text(json.dumps(result, indent=2) + "\n")
          else:
              raise SystemExit("unknown mode")
          PYTHON
          python3 -I "$RUNNER_TEMP/scope_objects.py" prepare
      - name: Install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv
      - name: Test complete integration before publishing objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/elab-functional
          cargo check --locked --workspace --all-targets 2>&1 | tee target/elab-functional/workspace-check.log
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/elab-functional/elab.log
          cargo test --locked -p fln-parse command_scope:: 2>&1 | tee target/elab-functional/parser-scopes.log
          cargo test --locked -p fln --test source_scopes --test source_file_check --test source_universes --test source_inheritance 2>&1 | tee target/elab-functional/scopes.log
          cargo clippy --locked -p fln-elab -p fln-parse -p fln --all-targets -- -D warnings 2>&1 | tee target/elab-functional/clippy.log
          git diff --cached --check
      - name: Publish verified immutable Git blobs without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 -I "$RUNNER_TEMP/scope_objects.py" publish-blobs
      - name: Retain validation and object manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scope-integration-${{ github.sha }}
          path: target/elab-functional
          retention-days: 7
