name: Native elaborator functional tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/fln-elab/**'
      - '.github/workflows/fln-elab-native.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fln-elab-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  elaborator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the configured compiler for functional testing
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv
          git rev-parse HEAD
      - name: Format the authored elaborator files when explicitly requested
        if: startsWith(github.event.head_commit.message, 'style(elab): format native elaborator additions')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/elab-functional
          rustfmt --edition 2024 crates/fln-elab/src/constraint.rs crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/mvar.rs crates/fln-elab/src/universe.rs crates/fln-elab/src/txn.rs crates/fln-elab/tests/native_unification.rs
          git diff --check
          git diff --stat
          git diff > target/elab-functional/rustfmt.patch
      - name: Check, test, and lint the actual elaborator package
        id: functional
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p target/elab-functional
          cargo check --locked -p fln-elab --all-targets 2>&1 | tee target/elab-functional/check.log
          check_status=${PIPESTATUS[0]}
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/elab-functional/test.log
          test_status=${PIPESTATUS[0]}
          cargo clippy --locked -p fln-elab --all-targets -- -D warnings 2>&1 | tee target/elab-functional/clippy.log
          clippy_status=${PIPESTATUS[0]}
          printf 'check=%s test=%s clippy=%s\n' "$check_status" "$test_status" "$clippy_status" | tee target/elab-functional/result.txt
          test "$check_status" -eq 0 && test "$test_status" -eq 0 && test "$clippy_status" -eq 0
      - name: Compile downstream workspace targets
        if: always() && steps.compiler.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/elab-functional
          cargo check --locked --workspace --all-targets 2>&1 | tee target/elab-functional/workspace-check.log
      - name: Publish only the tested formatting, without rewriting concurrent work
        if: always() && steps.functional.outcome == 'success' && startsWith(github.event.head_commit.message, 'style(elab): format native elaborator additions')
        shell: bash
        run: |
          set -euo pipefail
          paths=(crates/fln-elab/src/constraint.rs crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/mvar.rs crates/fln-elab/src/universe.rs crates/fln-elab/src/txn.rs crates/fln-elab/tests/native_unification.rs)
          while IFS= read -r path; do
            case "$path" in
              crates/fln-elab/src/constraint.rs|crates/fln-elab/src/constraint/unify.rs|crates/fln-elab/src/mvar.rs|crates/fln-elab/src/universe.rs|crates/fln-elab/src/txn.rs|crates/fln-elab/tests/native_unification.rs) ;;
              *) printf 'Unexpected changed file: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          if ! git diff --quiet; then
            git config user.name 'FrankenLean formatting'
            git config user.email 'noreply@github.com'
            git add -- "${paths[@]}"
            git commit -m 'style(elab): rustfmt verified native unification and transaction code'
            git push origin HEAD:main
          fi
          git rev-parse HEAD | tee target/elab-functional/published-commit.txt
      - name: Retain functional test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elab-functional-${{ github.sha }}
          path: target/elab-functional
          if-no-files-found: warn
          retention-days: 7
