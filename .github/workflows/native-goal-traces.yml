name: native goal trace source transport

# Temporary transport of locally compiled and tested source, not a test verdict.
# The separate Linux validation run remains independent. Only blobs are exported;
# committing source and updating main are explicit GitHub operations.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/native-goal-traces.yml']
permissions:
  contents: read
jobs:
  transport:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: preserve committed source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: export the exact locally tested trace source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import base64, hashlib, json, os, subprocess, textwrap, urllib.request
          identity = 'dec4921d32f97bc25f10cd97ef91b3cfb3a0968e'
          url = 'https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + identity
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'FrankenLean-goal-trace-transport'})
          with urllib.request.urlopen(request, timeout=60) as response:
              source = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest() == identity
          source = source.decode()
          for name in ['apply the exact native trace candidate', 'export validated source blobs without publishing a branch']:
              start = source.index('      - name: ' + name + '\n')
              end = source.find('\n      - ', start + 1)
              block = source[start:] if end == -1 else source[start:end]
              block = textwrap.dedent(block.split('        run: |\n', 1)[1])
              block = block.replace('python3 -I -', 'python -I -')
              subprocess.run(['bash', '-euo', 'pipefail', '-c', block], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: goal-trace-source-blobs-${{ github.sha }}
          path: ${{ runner.temp }}/goal-trace-validation/
          retention-days: 2
          if-no-files-found: warn
