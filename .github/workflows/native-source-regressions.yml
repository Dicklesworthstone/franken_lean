name: Native parser regressions

on:
  push:
    branches: [main]
    paths:
      - 'crates/fln-core/**'
      - 'crates/fln-syntax/**'
      - 'crates/fln-parse/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-source-regressions.yml'

permissions:
  contents: read

concurrency:
  group: native-source-regressions
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Parser grouping source reconstruction and bounded-stack regressions
        run: cargo test --locked -p fln-parse --no-fail-fast
      - name: Lint the native parser
        run: cargo clippy --locked -p fln-parse --all-targets -- -D warnings
  checked-proof-publication:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'feat(source): publish verified wildcard and simpa increments'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: false
      - name: Recover digest-checked patches without changing their bytes
        shell: python
        run: |
          import pathlib, py_compile, subprocess, textwrap
          stored = subprocess.check_output(['git', 'show', 'bc9eccd8aec0042a4a52cc1ba6353da60e96c472:.github/workflows/native-source-regressions.yml'], text=True)
          start = stored.index('          import base64, gzip, hashlib, json, os, pathlib, subprocess\n')
          end = stored.index('      - name: Validate and commit wildcard local proof selection\n', start)
          script = textwrap.dedent(stored[start:end])
          old = "'''.replace('\\n          ', '\\n').lstrip())"
          assert script.count(old) == 1
          script = script.replace(old, "'''.lstrip())")
          old = "assert parent == '793bbd01302aee900ceac9a7242d5ff1ad950e95'"
          assert script.count(old) == 1
          script = script.replace(old, "assert parent == 'bc9eccd8aec0042a4a52cc1ba6353da60e96c472'")
          exec(compile(script, '<checked-publication-recovery>', 'exec'))
          py_compile.compile(str(evidence / 'publish.py'), doraise=True)
      - name: Validate and commit wildcard local proof selection
        run: python "$RUNNER_TEMP/checked-proof-publication/publish.py" 1
      - name: Validate and commit simpa proof completion
        run: python "$RUNNER_TEMP/checked-proof-publication/publish.py" 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checked-proof-publication-${{ github.sha }}
          path: ${{ runner.temp }}/checked-proof-publication
          retention-days: 7
          if-no-files-found: error
