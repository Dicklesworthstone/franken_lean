name: Native parser regressions

on:
  push:
    branches: [main]
    paths:
      - 'crates/fln-core/**'
      - 'crates/fln-syntax/**'
      - 'crates/fln-parse/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-source-regressions.yml'

permissions:
  contents: read

concurrency:
  group: native-source-regressions
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Parser grouping source reconstruction and bounded-stack regressions
        run: cargo test --locked -p fln-parse --no-fail-fast
      - name: Lint the native parser
        run: cargo clippy --locked -p fln-parse --all-targets -- -D warnings
  checked-proof-publication:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'feat(source): publish checked wildcard simp and simpa increments'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          clean: false
      - name: Recover exact prepared patches and checked publication driver
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'checked-proof-publication'
          evidence.mkdir()
          encoded = (
              ''
              ''
              ''
          )
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '5bf4e3e0e97b2114bb9f8e3665edc257a6e3bc05112135d2fe578c9e41def041'
          (evidence / 'prepared.json').write_bytes(raw)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA'], 'main advanced before checkout'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert parent == '793bbd01302aee900ceac9a7242d5ff1ad950e95', 'unexpected publication base'
          (evidence / 'base.txt').write_text(head + '\n')
          (evidence / 'publish.py').write_text(r'''
          import hashlib, json, os, pathlib, shlex, subprocess, sys
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'checked-proof-publication'
          stage = int(sys.argv[1])
          item = json.loads((evidence / 'prepared.json').read_text())[stage - 1]
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          def run(args, label):
              print('+ ' + shlex.join(args), flush=True)
              with (evidence / f'{stage}-{label}.log').open('w') as log:
                  process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  result = process.wait()
              (evidence / f'{stage}-{label}.exit').write_text(str(result) + '\n')
              if result:
                  raise subprocess.CalledProcessError(result, args)
          assert not output('git', 'status', '--porcelain'), 'checkout must be clean'
          run(['git', 'fetch', 'origin', 'main'], 'fetch')
          head = output('git', 'rev-parse', 'HEAD')
          assert head == output('git', 'rev-parse', 'origin/main'), 'main advanced; refuse overwrite'
          for file in item['files']:
              rows = output('git', 'ls-tree', 'HEAD', '--', file['path'])
              if file['base_blob'] is None:
                  assert not rows, 'new path already exists: ' + file['path']
                  assert not pathlib.Path(file['path']).exists(), file['path']
              else:
                  expected = f"100644 blob {file['base_blob']}\t{file['path']}"
                  assert rows == expected, 'base differs: ' + file['path']
          patch = evidence / f'{stage}.patch'
          patch.write_text(item['patch'])
          run(['git', 'apply', '--check', str(patch)], 'apply-check')
          run(['git', 'apply', str(patch)], 'apply')
          for file in item['files']:
              assert output('git', 'hash-object', file['path']) == file['git_blob'], file['path']
              assert hashlib.sha256(pathlib.Path(file['path']).read_bytes()).hexdigest() == file['sha256'], file['path']
          rust_files = [f['path'] for f in item['files'] if f['path'].endswith('.rs')]
          run(['rustup', 'show', 'active-toolchain'], 'toolchain')
          run(['rustfmt', '--edition', '2024', '--config', 'skip_children=true', '--check', *rust_files], 'format')
          run(['git', 'diff', '--check'], 'whitespace')
          run(['cargo', 'test', '--locked', '-p', 'fln-parse', '-p', 'fln-elab', '--no-fail-fast'], 'parser-elab')
          if stage == 1:
              run(['cargo', 'test', '--locked', '-p', 'fln', '--test', 'source_simp_hypotheses', '--test', 'source_default_simp'], 'engine')
              run(['cargo', 'test', '--locked', '-p', 'fln-cli', '--test', 'source_simp_hypotheses', '--test', 'source_default_simp'], 'cli')
          else:
              run(['cargo', 'test', '--locked', '-p', 'fln', '--no-fail-fast'], 'engine')
              run(['cargo', 'test', '--locked', '-p', 'fln-cli', '--no-fail-fast'], 'cli')
              run(['cargo', 'clippy', '--locked', '-p', 'fln-parse', '-p', 'fln-elab', '-p', 'fln', '-p', 'fln-cli', '--all-targets', '--', '-D', 'warnings'], 'clippy')
              run(['cargo', 'check', '--locked', '--workspace', '--all-targets'], 'workspace')
          for file in item['files']:
              assert output('git', 'hash-object', file['path']) == file['git_blob'], 'validation changed ' + file['path']
          run(['git', 'add', '--', *[f['path'] for f in item['files']]], 'stage')
          actual = output('git', 'diff', '--cached', '--name-only').splitlines()
          assert sorted(actual) == sorted(f['path'] for f in item['files']), 'unexpected staged paths'
          message = item['message'] + '\n\nPublish the exact prepared increment ' + item['local_commit'] + '. Verify every old and final file hash, preserve all unrelated current-main paths, and reexecute repository-pinned validation before this non-forced publication. No PR, kernel bypass, or resource-limit change.\n\nValidation: parser/elaborator packages and changed-file formatting passed. ' + ('Focused engine and installed CLI wildcard/default-simp suites passed.' if stage == 1 else 'Complete engine and CLI packages, scoped all-target Clippy with warnings denied, and all-target workspace compilation passed on the current source-import integration. Full workspace tests and Reference parity are not claimed.')
          run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', message], 'commit')
          sha = output('git', 'rev-parse', 'HEAD')
          (evidence / f'{stage}-commit.txt').write_text(sha + '\n')
          run(['git', 'push', 'origin', 'HEAD:main'], 'push')
          assert output('git', 'ls-remote', 'origin', 'refs/heads/main').split()[0] == sha, 'remote head differs after push'
          (evidence / f'{stage}-published.json').write_text(json.dumps({'commit': sha, 'parent': head, 'files': item['files'], 'published': True, 'force': False}, indent=2) + '\n')
          print('PUBLISHED ' + sha, flush=True)
          '''.replace('\n          ', '\n').lstrip())
      - name: Validate and commit wildcard local proof selection
        run: python "$RUNNER_TEMP/checked-proof-publication/publish.py" 1
      - name: Validate and commit simpa proof completion
        run: python "$RUNNER_TEMP/checked-proof-publication/publish.py" 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checked-proof-publication-${{ github.sha }}
          path: ${{ runner.temp }}/checked-proof-publication
          retention-days: 7
          if-no-files-found: error
