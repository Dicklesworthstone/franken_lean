name: Native parser regressions

on:
  push:
    branches: [main]
    paths:
      - 'crates/fln-core/**'
      - 'crates/fln-syntax/**'
      - 'crates/fln-parse/**'
      - 'crates/fln-elab/src/source/tactics/**'
      - 'crates/fln-elab/src/source/tactics.rs'
      - 'crates/fln/tests/source_goal_control.rs'
      - 'crates/fln/tests/source_backtracking.rs'
      - 'crates/fln/tests/source_simp_auto_unfold.rs'
      - 'crates/fln/tests/source_simp_auto_unfold.lean'
      - 'crates/fln/src/source_check/**'
      - 'crates/fln/src/source_check.rs'
      - 'crates/fln/src/source_records.rs'
      - 'crates/fln-elab/src/source/scope.rs'
      - 'crates/fln/tests/source_command_macros.rs'
      - 'crates/fln/tests/source_command_macro_hygiene.rs'
      - 'crates/fln/tests/source_quoted_capture_kinds.rs'
      - 'crates/fln/tests/source_quotation_repetitions.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-source-regressions.yml'

permissions:
  contents: read

concurrency:
  group: native-source-regressions
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Parser grouping source reconstruction and bounded-stack regressions
        run: cargo test --locked -p fln-parse --no-fail-fast
      - name: Check transactional goal mapping and backtracking
        run: cargo test --locked -p fln --test source_goal_control --test source_backtracking --no-fail-fast -- --test-threads=1
      - name: Check match-aware simplification through the native kernel
        run: cargo test --locked -p fln --test source_simp_auto_unfold --no-fail-fast -- --test-threads=1
      - name: Preserve work accounting across failed goal attempts
        run: cargo test --locked -p fln-elab --lib source::tactics::backtrack::tests::nonprogressing_repetitions_and_backtracking_cannot_refund_work -- --exact
      - name: Check native command macros, hygiene and journal replay
        run: cargo test --locked -p fln --test source_command_macros --test source_command_macro_hygiene --no-fail-fast -- --test-threads=1
      - name: Check quotation expansion through the native elaborator and kernel
        run: cargo test --locked -p fln --test source_quoted_capture_kinds --test source_quotation_repetitions --no-fail-fast
      - name: Lint the native parser
        run: cargo clippy --locked -p fln-parse --all-targets -- -D warnings
