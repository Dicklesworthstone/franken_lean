name: Native parser regressions

on:
  push:
    branches: [main]
    paths:
      - 'crates/fln-core/**'
      - 'crates/fln-syntax/**'
      - 'crates/fln-parse/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-source-regressions.yml'

permissions:
  contents: read

concurrency:
  group: native-source-regressions
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Parser grouping source reconstruction and bounded-stack regressions
        run: cargo test --locked -p fln-parse --no-fail-fast
      - name: Lint the native parser
        run: cargo clippy --locked -p fln-parse --all-targets -- -D warnings
  checked-simpa-objects:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'fix(publication): retain concurrent commits when exporting validated simpa'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Export exact passing simpa objects without moving main
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_ARTIFACT_ID: '10573645754'
          VALIDATION_ARCHIVE_SHA256: 1b65e1c6a3fe413c3d27897a2f48e2f032dec588cab31479edb4be2876d67940
        shell: python
        run: |
          """Replay the exact passing simpa patch and publish Git objects, never refs."""
          import base64
          import hashlib
          import io
          import json
          import os
          import pathlib
          import subprocess
          import urllib.error
          import urllib.request
          import zipfile

          REPO = 'Dicklesworthstone/franken_lean'
          API = 'https://api.github.com/repos/' + REPO
          TOKEN = os.environ['GH_TOKEN']
          ARTIFACT = int(os.environ['VALIDATION_ARTIFACT_ID'])
          ARCHIVE_SHA = os.environ['VALIDATION_ARCHIVE_SHA256']
          BASE = '372a9cadf85cdea08ff28ad1939e49c656636980'
          PAYLOAD_SHA = '5bf4e3e0e97b2114bb9f8e3665edc257a6e3bc05112135d2fe578c9e41def041'
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-simpa-objects'
          root.mkdir()

          def output(*args):
              return subprocess.check_output(args, text=True).strip()

          def request_json(endpoint, data=None):
              headers = {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + TOKEN}
              body = None if data is None else json.dumps(data).encode()
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              request = urllib.request.Request(API + endpoint, data=body, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          # Do not forward the GitHub credential to a redirected artifact-storage host.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          request = urllib.request.Request(API + '/actions/artifacts/' + str(ARTIFACT) + '/zip',
              headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + TOKEN})
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=60) as response:
                  archive = response.read()
          except urllib.error.HTTPError as error:
              if error.code != 302:
                  raise
              location = error.headers['Location']
              assert location.startswith('https://')
              with urllib.request.urlopen(location, timeout=60) as response:
                  archive = response.read()
          assert hashlib.sha256(archive).hexdigest() == ARCHIVE_SHA, 'validation archive changed'
          (root / 'validation.zip').write_bytes(archive)

          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              raw = bundle.read('prepared.json')
              assert hashlib.sha256(raw).hexdigest() == PAYLOAD_SHA
              item = json.loads(raw)[1]
              assert item['local_commit'] == 'c2648e65084d09aec9a84143655e59690e55b979'
              first = json.loads(bundle.read('1-published.json'))
              assert first['commit'] == BASE and first['published'] and not first['force']
              checks = ['apply-check', 'apply', 'toolchain', 'format', 'whitespace',
                        'parser-elab', 'engine', 'cli', 'clippy', 'workspace', 'stage', 'commit']
              for label in checks:
                  assert bundle.read('2-' + label + '.exit').strip() == b'0', label + ' failed'
              assert bundle.read('2.patch').decode() == item['patch']
              tested_commit = bundle.read('2-commit.txt').decode().strip()

          assert not output('git', 'status', '--porcelain'), 'checkout not clean'
          head = output('git', 'rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA'], 'wrong checkout'
          subprocess.run(['git', 'merge-base', '--is-ancestor', BASE, head], check=True)
          changes = output('git', 'diff', '--name-only', BASE, head).splitlines()
          allowed_test = 'crates/fln-conformance/tests/pinned_nat_council.rs'
          assert all(path.startswith('.github/workflows/') or path == allowed_test for path in changes), ('source changed since validation', changes)
          assert output('git', 'rev-parse', 'HEAD:' + allowed_test) == 'f46eb934d94b7e8014bd137d6de5b30c5c8a1ad1', 'unreviewed conformance change'
          for file in item['files']:
              rows = output('git', 'ls-tree', 'HEAD', '--', file['path'])
              if file['base_blob'] is None:
                  assert not rows and not pathlib.Path(file['path']).exists(), file['path']
              else:
                  assert rows == f"100644 blob {file['base_blob']}\t{file['path']}", file['path']
          patch = root / 'simpa.patch'
          patch.write_text(item['patch'])
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          # Recompile the newest integration, including the separately added ignored test.
          with (root / 'workspace.log').open('w') as log:
              for command in [['rustup', 'show', 'active-toolchain'], ['cargo', 'check', '--locked', '--workspace', '--all-targets']]:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
                  log.flush()
                  if result.returncode:
                      print((root / 'workspace.log').read_text(), flush=True)
                      raise subprocess.CalledProcessError(result.returncode, command)
          (root / 'workspace.exit').write_text('0\n')
          entries = []
          for file in item['files']:

              content = pathlib.Path(file['path']).read_bytes()
              sha = hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest()
              assert sha == file['git_blob'], file['path']
              assert hashlib.sha256(content).hexdigest() == file['sha256'], file['path']
              blob = request_json('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
              assert blob['sha'] == sha
              entries.append({'path': file['path'], 'mode': '100644', 'type': 'blob', 'sha': sha})

          # Restore only this session's temporary publisher, leaving other workflows intact.
          workflow = '.github/workflows/native-source-regressions.yml'
          original = subprocess.check_output(['git', 'show', '793bbd01302aee900ceac9a7242d5ff1ad950e95:' + workflow])
          original_sha = hashlib.sha1(('blob ' + str(len(original)) + '\0').encode() + original).hexdigest()
          assert original_sha == '055721bcd2609a6010f5a91093940edd8508be0a'
          pathlib.Path(workflow).write_bytes(original)
          entries.append({'path': workflow, 'mode': '100644', 'type': 'blob', 'sha': original_sha})
          paths = [entry['path'] for entry in entries]
          subprocess.run(['git', 'add', '--', *paths], check=True)
          assert sorted(output('git', 'diff', '--cached', '--name-only').splitlines()) == sorted(paths)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          base_tree = output('git', 'rev-parse', 'HEAD^{tree}')
          tree = request_json('/git/trees', {'base_tree': base_tree, 'tree': entries})
          assert tree['sha'] == output('git', 'write-tree')
          record = {'parent': head, 'tree': tree['sha'], 'base_tree': base_tree, 'files': entries,
                    'prepared_commit': item['local_commit'], 'tested_commit': tested_commit,
                    'validation_source_base': BASE, 'validation_artifact': ARTIFACT,
                    'validation_archive_sha256': ARCHIVE_SHA, 'checks': checks,
                    'intervening_paths': changes, 'workspace_rechecked': True, 'ref_changed': False}
          (root / 'tested-tree.json').write_text(json.dumps(record, indent=2) + '\n')
          print('VALIDATED_SIMPA_TREE ' + json.dumps(record), flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-simpa-objects-${{ github.sha }}
          path: ${{ runner.temp }}/verified-simpa-objects
          retention-days: 7
          if-no-files-found: error
