name: Native namespace opens

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fln-namespace-opens.yml
      - .github/patches/fln-namespace-opens.py
      - crates/fln/src/source_check/scopes.rs
      - crates/fln/src/source_check/scopes/**
      - crates/fln-elab/src/source/scope.rs
      - crates/fln-elab/src/source/scope/**
      - crates/fln-parse/src/command_scope.rs
      - crates/fln-parse/src/command_scope/**
      - crates/fln-cli/tests/namespace_opens.rs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fln-namespace-opens
  cancel-in-progress: false

jobs:
  native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/namespace-opens"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/namespace-target" >> "$GITHUB_ENV"
          git rev-parse HEAD | tee "$RUNNER_TEMP/namespace-opens/base.txt"
          rustup show active-toolchain 2>&1 | tee "$RUNNER_TEMP/namespace-opens/toolchain.txt"
          rustc -Vv 2>&1 | tee -a "$RUNNER_TEMP/namespace-opens/toolchain.txt"

      - name: Apply pending integration and format only its source files
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/patches/fln-namespace-opens.py; then
            python3 -I .github/patches/fln-namespace-opens.py
          fi
          python3 -I - <<'PY'
          from pathlib import Path
          import subprocess
          paths = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          paths.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          paths.add('crates/fln/src/source_check/scopes.rs')
          for path in sorted(paths):
              if not path.startswith('crates/') or not path.endswith('.rs'):
                  raise SystemExit(f'unexpected source edit: {path}')
              subprocess.run(['rustfmt', '--edition', '2024', '--config', 'skip_children=true', path], check=True)
          subprocess.run(['git', 'add', '--', *sorted(paths)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          git diff --cached --binary > "$RUNNER_TEMP/namespace-opens/source.patch"
          git write-tree > "$RUNNER_TEMP/namespace-opens/tested-tree.txt"

      - name: Compile the complete workspace including tests
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/namespace-opens/workspace-check.txt"

      - name: Exercise parser, resolver, and transactional scopes
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-parse --lib command_scope 2>&1 | tee "$RUNNER_TEMP/namespace-opens/parser-tests.txt"
          cargo test --locked -p fln-elab --lib source::scope 2>&1 | tee "$RUNNER_TEMP/namespace-opens/resolver-tests.txt"
          cargo test --locked -p fln --lib source_check::scopes 2>&1 | tee "$RUNNER_TEMP/namespace-opens/scope-tests.txt"
          if test -f crates/fln-cli/tests/namespace_opens.rs; then
            cargo test --locked -p fln-cli --test namespace_opens 2>&1 | tee "$RUNNER_TEMP/namespace-opens/cli-tests.txt"
          fi

      - name: Export tested source blobs without moving any branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          rows = []
          for path in paths:
              if not path.startswith('crates/') or not path.endswith('.rs'):
                  raise SystemExit(f'unexpected staged path: {path}')
              data = Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              result = subprocess.run(
                  ['gh', 'api', '--method', 'POST', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs', '--input', '-'],
                  input=json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}),
                  text=True, capture_output=True, check=True,
              )
              actual = json.loads(result.stdout)['sha']
              if actual != expected:
                  raise SystemExit(f'blob mismatch: {path}')
              rows.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': actual})
          receipt = {
              'base_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'tested_tree': subprocess.check_output(['git', 'write-tree'], text=True).strip(),
              'tree_elements': rows,
              'reference_differential': 'not_run',
          }
          encoded = json.dumps(receipt, indent=2) + '\n'
          (Path(os.environ['RUNNER_TEMP']) / 'namespace-opens' / 'tested-blobs.json').write_text(encoded)
          print(encoded)
          PY

      - name: Retain logs and exact source even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namespace-opens-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/namespace-opens
          if-no-files-found: error
          retention-days: 14
