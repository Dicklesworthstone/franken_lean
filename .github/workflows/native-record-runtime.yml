name: Native record runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-record-runtime.yml'
      - 'crates/fln/src/runtime/**'
      - 'crates/fln/src/runtime.rs'
      - 'crates/fln/tests/runtime_record_projection.rs'
      - 'crates/fln-cli/tests/source_ground_projections.rs'
      - 'examples/native_ground_projections.lean'
      - 'crates/fln/tests/runtime_closure_data.rs'
      - 'crates/fln-cli/tests/source_closure_data.rs'
      - 'examples/native_closure_data.lean'
      - 'crates/fln/src/lib.rs'
      - 'crates/fln-parse/src/lib.rs'
      - 'crates/fln-parse/tests/source_mutual_modules.rs'
      - 'crates/fln/tests/runtime_mutual_data.rs'
      - 'crates/fln/tests/runtime_mutual_recursion.rs'
      - 'crates/fln-cli/tests/source_mutual_data.rs'
      - 'examples/native_mutual_data.lean'
      - 'examples/native_mutual_folds.lean'
      - 'crates/fln/tests/runtime_function_children.rs'
      - 'examples/native_function_child_runtime.lean'
permissions:
  contents: read
jobs:
  records:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Preserve the exact inputs for reproducing projection/layout failures
      # when concurrent source changes make a later checkout differ from CI.
      - name: Retain exact reproduction inputs
        run: |
          mkdir -p "$RUNNER_TEMP/record-runtime"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/record-runtime/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/record-runtime/commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: record-runtime-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/record-runtime
          retention-days: 1
          compression-level: 0
      - name: Install repository toolchain
        run: |
          channel=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - name: Test source, layouts and installed bytecode consumers
        run: |
          cargo test --locked -p fln-parse --test source_mutual_modules
          cargo test --locked -p fln --lib
          cargo test --locked -p fln --test runtime_mutual_data --test runtime_mutual_recursion
          cargo test --locked -p fln --test runtime_function_children --test source_higher_order_recursion
          cargo test --locked -p fln --test runtime_closure_data --test runtime_record_projection --test runtime_parameterized_data --test runtime_records --test runtime_specialization --test runtime_higher_order
          cargo test --locked -p fln-cli --test source_mutual_data
          cargo test --locked -p fln-cli --test source_closure_data --test source_ground_projections --test source_collections
          cargo clippy --locked -p fln --all-targets -- -D warnings
          cargo clippy --locked -p fln-cli --test source_closure_data --test source_ground_projections -- -D warnings
          cargo check --locked --workspace --all-targets
  mutual-function-child-validation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d39c7af0f1baf6ed21e6666094b9be61a1649af4
          persist-credentials: false
      - name: Restore the exact locally tested mutual function-child patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd()
          out = root / 'target/mutual-function-validation'
          out.mkdir(parents=True)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          sha = 'ca736efacd125de8004a63c287d205f06c028922'
          data = bytearray(base64.b64decode(json.loads(subprocess.check_output(['gh','api','repos/Dicklesworthstone/franken_lean/git/blobs/'+sha]))['content']))
          assert blob(data) == sha
          # Restore one transport-byte transcription error, then bind the whole
          # canonical archive before decompression or any source-file mutation.
          assert len(data) == 9907 and data[758] == 83
          data[758] = 116
          assert blob(data) == 'b2f73399e57afd22b956a5304a4efaa69b01c65c'
          assert hashlib.sha256(data).hexdigest() == '93424e29f2fe1a6362ba326e3e4ba08bf5b03b98c99b019f393784b4a71c0004'
          manifest = json.loads(gzip.decompress(data))
          assert git('rev-parse','HEAD') == manifest['base'] == 'd39c7af0f1baf6ed21e6666094b9be61a1649af4'
          assert git('rev-parse','HEAD^{tree}') == manifest['base_tree'] == 'e9ccbb365d03eaf77142ab19b00ffeb1037bb4ac'
          allowed = {'.github/workflows/native-record-runtime.yml', 'crates/fln-cli/src/lib.rs', 'crates/fln-cli/tests/source_mutual_data.rs', 'crates/fln/src/runtime/mutual.rs', 'crates/fln/src/runtime/mutual/fold.rs', 'crates/fln/src/runtime/records.rs', 'crates/fln/tests/runtime_mutual_data.rs', 'crates/fln/tests/runtime_mutual_function_children.rs', 'docs/NATIVE_FUNCTION_CHILDREN.md', 'docs/NATIVE_MUTUAL_RUNTIME.md', 'examples/native_mutual_function_children.lean'}
          paths = [e['path'] for e in manifest['entries']]
          assert len(paths) == 11 and set(paths) == allowed
          for entry in manifest['entries']:
              path = root / entry['path']
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              assert entry['mode'] == '100644'
              if entry['before'] is None:
                  assert not path.exists() and not git('ls-files','--',entry['path'])
              else:
                  assert blob(path.read_bytes()) == entry['before'], entry['path']
          patch = out / 'change.patch'
          patch.write_text(manifest['patch'])
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert set(git('diff','--cached','--name-only').splitlines()) == allowed
          for entry in manifest['entries']:
              assert blob((root / entry['path']).read_bytes()) == entry['after']
          assert git('write-tree') == manifest['tree'] == 'bf0ab55642c421b2c9827a5997b313bf4eb0437a'
          (out / 'manifest.json').write_text(json.dumps(manifest))
          (out / 'tree.txt').write_text(git('write-tree')+'\n')
          print('VALIDATION_TREE',git('write-tree'))
          PY
      - name: Check mutual execution, failure atomicity, and installed replay
        run: |
          set -euo pipefail
          channel=$(python3 -I -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
          cargo test --locked -p fln --lib --test runtime_function_children --test runtime_mutual_function_children --test runtime_mutual_data --test runtime_mutual_recursion --test runtime_recursive_data --test runtime_closure_data --test engine_builder_facade --test source_module_check --test source_module_session 2>&1 | tee target/mutual-function-validation/engine.log
          cargo test --locked -p fln-cli --test source_mutual_data --test cli_personalities_and_verbs --test lsp_goals 2>&1 | tee target/mutual-function-validation/cli.log
          cargo clippy --locked -p fln --all-targets -- -D warnings 2>&1 | tee target/mutual-function-validation/engine-clippy.log
          cargo clippy --locked -p fln-cli --test source_mutual_data --test source_closure_data --test source_ground_projections -- -D warnings 2>&1 | tee target/mutual-function-validation/cli-clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/mutual-function-validation/check.log
          git diff --check --cached
      - name: Export checked file objects without changing branch references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          out = pathlib.Path('target/mutual-function-validation')
          manifest = json.loads((out / 'manifest.json').read_text())
          for entry in manifest['entries']:
              data = pathlib.Path(entry['path']).read_bytes()
              sha = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert sha == entry['after']
              request = json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              response = json.loads(subprocess.check_output(['gh','api','--method','POST','repos/Dicklesworthstone/franken_lean/git/blobs','--input','-'],input=request))
              assert response['sha'] == sha
              print('EXPORTED',sha,entry['path'],flush=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == manifest['tree'] == (out / 'tree.txt').read_text().strip()
          print('VALIDATED_EXPORT_COMPLETE',tree,flush=True)
          PY
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutual-function-child-validation-${{ github.run_id }}
          path: target/mutual-function-validation/
          retention-days: 7
  export-saved-proof-objects:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3ddb4d0859bf76a2619e5c0649b3f473b73259ae
          persist-credentials: false
      - name: Transfer prior-tested proof objects with exact preimage and postimage checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tempfile
          sha = '0de06e54bdd357f092283c952f1cdb918b2bde99'
          response = json.loads(subprocess.check_output(['gh','api','repos/Dicklesworthstone/franken_lean/git/blobs/'+sha]))
          data = base64.b64decode(response['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == sha
          block = data.decode().split('        run: |\n', 1)[1].split('      - name: Install repository toolchain\n', 1)[0]
          lines = block.splitlines(keepends=True)
          assert all(line.startswith('          ') for line in lines)
          script = ''.join(line[10:] for line in lines)
          assert hashlib.sha256(script.encode()).hexdigest() == 'e912cf030a4c360d2adeca9310dc346fc9871a809e7b11ca6055776997f40e78'
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as temp:
              restore = pathlib.Path(temp) / 'restore.sh'
              restore.write_text(script)
              subprocess.run(['bash','-euo','pipefail',str(restore)],check=True)
          out = pathlib.Path('target/proof-publication')
          (out / 'validation-scope.txt').write_text('CHECKSUM-ONLY OBJECT TRANSFER. This job does not rerun functional tests and does not update any branch reference. The separate native-proof-runtime workflow retains the fresh functional validation attempts.\n')
          print('CHECKSUM-ONLY TRANSFER: no new functional test claim',flush=True)
          subprocess.run(['python3','-I',str(out / 'export.py'),'1'],check=True)
          subprocess.run(['python3','-I',str(out / 'apply.py'),'2'],check=True)
          subprocess.run(['python3','-I',str(out / 'export.py'),'2'],check=True)
          print('CHECKSUM_ONLY_TRANSFER_COMPLETE; no branch references changed',flush=True)
          PY
      - name: Retain exact object manifests and transfer scope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-runtime-objects-${{ github.run_id }}
          path: target/proof-publication/
          retention-days: 14
