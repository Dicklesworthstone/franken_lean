name: Native source inference landing

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-source-landing.yml']

permissions:
  contents: write

jobs:
  source-inference:
    if: >-
      startsWith(github.event.head_commit.message, 'feat(elab): land dependent source signatures')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install configured compiler
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv
      - name: Verify and apply exact implementation patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/source-landing
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/d70c2f62ff1e83a04771d6a00ac4257659c0cb0e > target/source-landing/blob.json
          python3 -I - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          root = pathlib.Path('target/source-landing')
          encoded = base64.b64decode(json.loads((root / 'blob.json').read_text())['content'])
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f40e40f34a174963075f16411d1aa42bcfd4d16eb7a40f177058b377b0fdf2bb'
          (root / 'source.patch').write_bytes(patch)
          PY
          git apply --check --index target/source-landing/source.patch
          git apply --index target/source-landing/source.patch
          python3 -I - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert paths == {'crates/fln-parse/src/lib.rs', 'crates/fln-elab/src/source.rs', 'crates/fln-elab/src/source/infer.rs', 'crates/fln-elab/tests/source_inference.rs'}, paths
          PY
      - name: Verify parser elaborator and engine
        run: |
          set -euo pipefail
          git diff --cached --check
          rustfmt --edition 2024 --check crates/fln-parse/src/lib.rs crates/fln-elab/src/source.rs crates/fln-elab/tests/source_inference.rs
          cargo test --locked -p fln-parse --lib --no-fail-fast 2>&1 | tee target/source-landing/parser-test.log
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/source-landing/test.log
          cargo clippy --locked -p fln-elab -p fln-parse --all-targets -- -D warnings 2>&1 | tee target/source-landing/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/source-landing/workspace.log
          cargo test --locked -p fln --lib --no-fail-fast 2>&1 | tee target/source-landing/engine-test.log
      - name: Commit verified implementation directly to main
        run: |
          set -euo pipefail
          git config user.name 'FrankenLean implementation'
          git config user.email 'noreply@github.com'
          git commit -m 'feat(elab): elaborate source dependent and implicit binder signatures'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/source-landing/published-commit.txt
      - name: Retain validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-inference-${{ github.sha }}
          path: target/source-landing
          if-no-files-found: warn
          retention-days: 7
