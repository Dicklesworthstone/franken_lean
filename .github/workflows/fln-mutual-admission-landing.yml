name: Native mutual-inductive admission landing

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-mutual-admission-landing.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: fln-mutual-admission-landing
  cancel-in-progress: false

jobs:
  mutual:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply checksum-bound native generator with context-checked hunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/mutual-landing
          git rev-parse HEAD | tee target/mutual-landing/base.txt
          python3 -I - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = ''
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'e6ac0407dc9194c634f888279e3e991e4ed98bb9b75a2b20f828c601d64e1482'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-mutual-generator.patch'
          path.write_bytes(raw)
          if subprocess.run(['git', 'apply', '--reverse', '--check', str(path)], capture_output=True).returncode != 0:
              subprocess.run(['git', 'apply', '--check', str(path)], check=True)
              subprocess.run(['git', 'apply', str(path)], check=True)
          PY
          git diff --check
      - name: Install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/mutual-landing/compiler.txt
      - name: Validate generated blocks through both seats
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-elab 2>&1 | tee target/mutual-landing/elaborator-tests.log
          cargo test --locked -p fln --lib --test generated_mutual_inductives --test mutual_inductive_admission 2>&1 | tee target/mutual-landing/engine-tests.log
          cargo clippy --locked -p fln-elab -p fln --all-targets -- -D warnings 2>&1 | tee target/mutual-landing/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/mutual-landing/workspace-check.log
      - name: Publish verified implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/fln-elab/src/inductive.rs crates/fln-elab/src/inductive/mutual.rs crates/fln/tests/generated_mutual_inductives.rs
          if ! git diff --cached --quiet; then
            git commit -m 'feat(elab): generate native dependent mutual data-inductive blocks' -m 'Construct all motives, constructor premises and cross-family iota rules natively with uniform dependent parameters, family-specific indices and function-valued children. Preserve capture-free scopes, strict positivity, empty-family motive inference and explicit work bounds. Both admission seats, elaborator tests, strict scoped Clippy and workspace compilation passed before this fast-forward publication.'
            git push origin HEAD:main
          fi
          git rev-parse HEAD | tee target/mutual-landing/published.txt
      - name: Retain results
        if: always()
        shell: bash
        run: |
          mkdir -p target/mutual-landing
          git diff > target/mutual-landing/uncommitted.patch
          git rev-parse HEAD > target/mutual-landing/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutual-generator-${{ github.run_id }}
          path: target/mutual-landing
          retention-days: 3
          if-no-files-found: error
