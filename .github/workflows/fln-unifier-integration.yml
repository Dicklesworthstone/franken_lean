name: Native unifier integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fln-unifier-integration.yml'
      - 'crates/fln-elab/**'
      - 'crates/fln-core/**'
      - 'crates/fln-env/**'
      - 'crates/fln-kernel/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-unifier-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Retain exact source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/unifier-integration
          git rev-parse HEAD | tee target/unifier-integration/tested-commit.txt
          git archive --format=tar.gz HEAD Cargo.toml Cargo.lock rust-toolchain.toml SUITE.lock crates/fln-elab crates/fln-core crates/fln-env crates/fln-kernel > target/unifier-integration/source-inputs.tar.gz
      - name: Install configured Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/unifier-integration/compiler.txt
      - name: Run native elaborator tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/unifier-integration/elab-tests.log
      - name: Check elaborator and downstream compilation
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p fln-elab --all-targets -- -D warnings 2>&1 | tee target/unifier-integration/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/unifier-integration/workspace-check.log
      - name: Retain source and verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unifier-integration-${{ github.sha }}
          path: target/unifier-integration
          retention-days: 7
          if-no-files-found: error
