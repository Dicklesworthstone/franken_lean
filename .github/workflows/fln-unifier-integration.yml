name: Native unifier integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-unifier-integration.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-land:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - name: Retain source inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/unifier-integration
          git rev-parse HEAD > target/unifier-integration/tested-parent.txt
          git archive --format=tar.gz HEAD Cargo.toml Cargo.lock rust-toolchain.toml SUITE.lock AGENTS.md COMPREHENSIVE_PLAN_FOR_THE_DESIGN_OF_FRANKEN_LEAN.md IMPLEMENTATION_STATUS.md .beads crates/fln-elab crates/fln-core crates/fln-env crates/fln-kernel crates/fln-checker crates/fln-parse crates/fln crates/fln-cli > target/unifier-integration/source-inputs.tar.gz
      - name: Apply native quotient implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I <<'PYTHON'
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f4cf8d187bf2da6a283ca8d3a0ffd39c3b187ea07d4764de909f3036beb7b27b'
          before = {'crates/fln-elab/src/constraint/unify/reduce.rs': '482257e2b767de196bae5a5020b93cfe0396b278'}
          after = {'crates/fln-elab/src/constraint/unify/reduce.rs': 'fb2dbd717a389b93c047dcc2b0c5b23a444ce2b2', 'crates/fln-elab/src/constraint/unify/reduce/quotient.rs': '5bc942942564769c337fd52e82c6751a976c6b4d', 'crates/fln-elab/tests/support/quotient.rs': '95e9e9ab2900f17ffe8f037206d5b45d38874365', 'crates/fln-elab/tests/native_unification_quotient.rs': 'e258bf1b0a43ccc443ed21bfdf73941beea32820'}
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for name, expected in after.items():
              path = pathlib.Path(name)
              assert (blob(path.read_bytes()) == before[name]) if name in before else not path.exists(), name
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for name, expected in after.items():
              assert blob(pathlib.Path(name).read_bytes()) == expected, name
          pathlib.Path('target/unifier-integration/applied.patch').write_bytes(patch)
          PYTHON
      - name: Install configured Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/unifier-integration/compiler.txt
      - name: Verify native quotient and existing reduction paths
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true crates/fln-elab/src/constraint/unify/reduce.rs crates/fln-elab/src/constraint/unify/reduce/quotient.rs crates/fln-elab/tests/support/quotient.rs crates/fln-elab/tests/native_unification_quotient.rs
          cargo test --locked -p fln-elab --test native_unification_quotient --test native_unification_iota --test native_unification_record_eta --no-fail-fast 2>&1 | tee target/unifier-integration/reduction-tests.log
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/unifier-integration/elab-tests.log
          cargo clippy --locked -p fln-elab --all-targets -- -D warnings 2>&1 | tee target/unifier-integration/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/unifier-integration/workspace-check.log
          git diff --check
      - name: Publish verified implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln-elab/src/constraint/unify/reduce.rs crates/fln-elab/src/constraint/unify/reduce/quotient.rs crates/fln-elab/tests/support/quotient.rs crates/fln-elab/tests/native_unification_quotient.rs
          git commit -m 'feat(elab): reduce quotient primitives in transactional unification'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/unifier-integration/published-commit.txt
          git archive --format=tar.gz HEAD crates/fln-elab > target/unifier-integration/published-source.tar.gz
      - name: Retain source and verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unifier-integration-${{ github.sha }}
          path: target/unifier-integration
          retention-days: 7
          if-no-files-found: error
