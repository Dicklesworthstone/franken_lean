name: Native section variables
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-section-variables.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-section-variables
  cancel-in-progress: true
jobs:
  sections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Restore and export the first locally validated feature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/section-verification
          git rev-parse HEAD > target/section-verification/input-commit.txt
          cat > target/section-verification/transport.py <<'PY'
          import base64, gzip, json, pathlib, subprocess, sys

          REPO = 'Dicklesworthstone/franken_lean'
          ROOT = pathlib.Path('target/section-verification')
          ROOT.mkdir(parents=True, exist_ok=True)


          def git_hash(path):
              return subprocess.check_output(['git', 'hash-object', path], text=True).strip()


          def api(endpoint, payload=None):
              args = ['gh', 'api', 'repos/' + REPO + '/' + endpoint]
              if payload is not None:
                  args += ['--method', 'POST', '--input', '-']
              return json.loads(subprocess.run(args, input=json.dumps(payload) if payload is not None else None,
                                              capture_output=True, text=True, check=True).stdout)


          def apply(stage, blob, manifest):
              actual = {p: git_hash(p) if pathlib.Path(p).exists() else None for p in manifest}
              if all(actual[p] == after for p, (_, after) in manifest.items()):
                  return
              for p, (before, _) in manifest.items():
                  assert actual[p] == before, 'concurrent edit: ' + p
              data = base64.b64decode(api('git/blobs/' + blob)['content'])
              compressed = ROOT / (stage + '.gz')
              compressed.write_bytes(data)
              assert git_hash(str(compressed)) == blob
              patch = ROOT / (stage + '.patch')
              patch.write_bytes(gzip.decompress(data))
              paths = [line[6:] for line in patch.read_text().splitlines() if line.startswith('+++ b/')]
              assert len(paths) == len(manifest) and set(paths) == set(manifest)
              assert '+++ /dev/null' not in patch.read_text()
              subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
              subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
              changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
              assert set(changed) == set(manifest)
              for p, (_, after) in manifest.items():
                  assert git_hash(p) == after, 'postimage mismatch: ' + p


          def upload(stage, manifest):
              entries = []
              for p, (_, expected) in manifest.items():
                  assert git_hash(p) == expected
                  result = api('git/blobs', {'encoding': 'base64', 'content': base64.b64encode(pathlib.Path(p).read_bytes()).decode()})
                  assert result['sha'] == expected, 'uploaded blob mismatch: ' + p
                  entries.append({'path': p, 'mode': '100644', 'type': 'blob', 'sha': expected})
              report = {'input_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                        'manifest': manifest, 'tree_elements': entries}
              (ROOT / (stage + '-objects.json')).write_text(json.dumps(report, indent=2))
              print(json.dumps(report, indent=2), flush=True)

          MANIFESTS = {'first': {'crates/fln-elab/src/source.rs': ['1312205e7378750776322f646dbcb8a50c88153b', '54f652d3521ba1cb6ccb14014f0dcbf4cac8a327'], 'crates/fln-elab/src/source/level_syntax.rs': ['bb8964e27f8b3dcf70ae62ad7eb247b9fdc9f0d9', '0dc0a5d56aae021973c912d54588441b5b2f07b9'], 'crates/fln-elab/src/source/scope.rs': ['113d891c4bc0b6d237425c0666f8f1199f1c9ef9', '0e646d72dc4b1234670d29c4299983d20dfaf281'], 'crates/fln-elab/src/source/scope/variables.rs': [None, '2beb9aeee67e625a0cd7ea415d41e149586b4e67'], 'crates/fln-parse/src/command_scope.rs': ['5adcfe6b755bf792d7a43c574359980ce339e566', 'd0666972abaf070d8f3789fbbab7e75fc5c3e86a'], 'crates/fln-parse/src/command_scope/variables.rs': [None, 'ac8e0e26f08fa404f53556d002ce2c325c88d76a'], 'crates/fln/src/source_check.rs': ['9ac7834d31689f8c7ca543016d70e89d2e8ecd98', '1776a87c807de734065004397f2d957caf4b15e1'], 'crates/fln/src/source_check/scopes.rs': ['8a2bc97d810920794a70cc73df0743d52d3d641b', '6cb35c05cedb501a47d22c8c30f47488eb3d9ad5'], 'crates/fln/tests/source_section_variables.rs': [None, '92ad688617cd54e09ac8282c914d4d7641fac861'], 'docs/NATIVE_SECTION_VARIABLES.md': [None, '79bf2a9ee449fb6affe51c00801b725a70eae35a']}, 'second': {'crates/fln-elab/src/source/scope.rs': ['0e646d72dc4b1234670d29c4299983d20dfaf281', '11b1dd3a98dd2858166a7aaaf964f1f5f1cdc572'], 'crates/fln-elab/src/source/scope/variables.rs': ['2beb9aeee67e625a0cd7ea415d41e149586b4e67', '40eff72c326fe50203759886fa0196f1a71420e1'], 'crates/fln-parse/src/command_scope.rs': ['d0666972abaf070d8f3789fbbab7e75fc5c3e86a', '17f018f0c3af004dcdbf2eda681f05a5ae866117'], 'crates/fln-parse/src/command_scope/variables.rs': ['ac8e0e26f08fa404f53556d002ce2c325c88d76a', 'efcabe88b54f6894cb6bd40dfe8baacfedf8eb4b'], 'crates/fln/src/source_check/scopes.rs': ['6cb35c05cedb501a47d22c8c30f47488eb3d9ad5', '792f5a737dedc9139571a0269694024062b1b36d'], 'crates/fln/tests/source_section_variables.rs': ['92ad688617cd54e09ac8282c914d4d7641fac861', 'befe08cbf7dad74d3bec7c65c6ec3699465f5453'], 'docs/NATIVE_SECTION_VARIABLES.md': ['79bf2a9ee449fb6affe51c00801b725a70eae35a', 'd4b1a5668c38dbabc1dcc352f4e680f2fb76eca6']}}
          BLOBS = {'first': '6d88391d102ac40920280598b595a79ea89457cf', 'second': 'ccc9b1e633c48672826f249664f1705a6da81f50'}
          stage, operation = sys.argv[1:]
          if operation == 'apply':
              apply(stage, BLOBS[stage], MANIFESTS[stage])
          elif operation == 'upload':
              upload(stage, MANIFESTS[stage])
          else:
              raise ValueError(operation)
          PY
          python3 -I target/section-verification/transport.py first apply
          python3 -I target/section-verification/transport.py first upload
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Local validation baseline for checked section variables'
          fi
      - name: Retain first-feature object manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section-first-objects
          path: target/section-verification/
          retention-days: 7
      - name: Restore and validate the second feature against current main inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -I target/section-verification/transport.py second apply
          channel="$(python3 -I -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustc -Vv | tee target/section-verification/compiler.txt
          cargo test --locked -p fln-parse -p fln-elab --no-fail-fast 2>&1 | tee target/section-verification/frontend.log
          cargo test --locked -p fln --test source_section_variables --test source_scopes --test source_instances --test source_module_check --test source_module_session --no-fail-fast 2>&1 | tee target/section-verification/source.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/section-verification/check.log
          cargo clippy --locked -p fln-elab -p fln-parse -p fln --all-targets -- -D warnings 2>&1 | tee target/section-verification/clippy.log
          git diff --cached --name-only | while read -r path; do
            case "$path" in *.rs) rustfmt --edition 2024 --check --config skip_children=true "$path" ;; esac
          done
          git diff --cached --check
          python3 -I target/section-verification/transport.py second upload
      - name: Retain validation and object manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section-validated-objects
          path: target/section-verification/
          retention-days: 14
