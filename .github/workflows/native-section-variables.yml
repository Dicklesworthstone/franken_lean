name: Native section variables
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-section-variables.yml'
      - 'crates/fln-elab/**'
      - 'crates/fln-parse/**'
      - 'crates/fln/src/**'
      - 'crates/fln/tests/source_section_variables.rs'
      - 'crates/fln/tests/source_section_records.rs'
      - 'crates/fln/tests/source_section_inductives.rs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-section-variables
  cancel-in-progress: true
jobs:
  sections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify section elaboration and its consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/section-verification
          git rev-parse HEAD | tee target/section-verification/input-commit.txt
          channel="$(python3 -I -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          rustc -Vv | tee target/section-verification/compiler.txt
          cargo test --locked -p fln-parse -p fln-elab --no-fail-fast 2>&1 | tee target/section-verification/frontend.log
          cargo test --locked -p fln --test source_section_variables --test source_section_records --test source_section_inductives --test source_inductive --test source_indexed --test source_mutual_inductives --test source_mutual_matching --test source_mutual_cases --test source_record_defaults --test source_inheritance --test source_scopes --test source_instances --test source_module_check --test source_module_session --no-fail-fast 2>&1 | tee target/section-verification/source.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/section-verification/check.log
          cargo clippy --locked -p fln-elab -p fln-parse -p fln --all-targets -- -D warnings 2>&1 | tee target/section-verification/clippy.log
          rustfmt --edition 2024 --check --config skip_children=true crates/fln-elab/src/source/scope/variables.rs crates/fln-parse/src/command_scope/variables.rs crates/fln/tests/source_section_variables.rs crates/fln/tests/source_section_records.rs crates/fln/tests/source_section_inductives.rs
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section-validation
          path: target/section-verification/
          retention-days: 14
