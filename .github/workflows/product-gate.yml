# The product gate (bead franken_lean-z8j.1.21).
#
# ci.yml has never had a green run: its evidence and governance lanes fail
# before the product is tested, so a red there carries no information about the
# code. This gate runs only the three checks AGENTS.md makes mandatory for every
# change: rustfmt, workspace clippy with warnings denied, and the whole workspace
# test suite. It must stay green, and it is the check that says whether main
# builds and passes.
#
# Anti-vacuity: a green that ran fewer tests than were measured is refused, so
# the gate cannot be "fixed" by skipping tests. FLOOR is the passed count of the
# first green run of this gate (36070617986, at 1731a004): 7765 passed across 524
# test binaries. Raise it when the measured count rises; lowering it needs the
# reason in the commit that does it.
#
# The SUITE.lock Reference supplies artifacts and the differential oracle for
# imported-source tests. A missing pin must fail setup rather than turn those
# tests into skips or leave mandatory installed-command tests without inputs.

name: product gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-gate-${{ github.ref }}
  # main moves many times an hour and one run takes ~20 minutes, so cancelling
  # on every push would leave main with no finished run at all. On main the
  # running job always completes and only the newest waiting push is kept; a
  # pull request's superseded runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      FLOOR: '7765'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # History-reading guards (commit anchors, first-parent walks) need it.
          fetch-depth: 0
          persist-credentials: false
      - name: install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^" ]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version
      - name: rustfmt
        run: cargo fmt --all --check
      # clippy and the tests run even when an earlier step is red. The job's
      # verdict is unchanged: any red step still fails the gate. What changes is
      # that a formatting red no longer hides the test tally. From 2026-10-13
      # to 2026-10-19 every run stopped at rustfmt, so the gate executed no test
      # in over 200 runs while regressions landed (bead fln-publisher-landing-contract-czyx).
      - name: clippy (workspace, all targets, warnings denied)
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: install and verify the SUITE.lock Reference for source tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/product-elan-bin"
          archive="$RUNNER_TEMP/product-elan.tar.gz"
          mkdir "$tool_root"
          curl --user-agent 'franken_lean-agent (+https://github.com/Dicklesworthstone/franken_lean)' \
            --fail --location --retry 3 --output "$archive" \
            https://github.com/leanprover/elan/releases/download/v4.2.1/elan-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_root"
          export ELAN_HOME="$HOME/.elan"
          "$tool_root/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$ELAN_HOME/bin:$PATH"
          mapfile -t reference_rows < <(grep -E '^reference ' SUITE.lock)
          test "${#reference_rows[@]}" -eq 1
          pin_tag="$(sed -nE 's/.* tag=([^ ]+).*/\1/p' <<<"${reference_rows[0]}")"
          pin_commit="$(sed -nE 's/.* commit=([0-9a-f]{40}).*/\1/p' <<<"${reference_rows[0]}")"
          [[ "$pin_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          test -n "$pin_commit"
          elan toolchain install "leanprover/lean4:$pin_tag"
          elan default "leanprover/lean4:$pin_tag"
          toolchain_root="$ELAN_HOME/toolchains/leanprover--lean4---$pin_tag"
          test "$("$toolchain_root/bin/lean" --githash)" = "$pin_commit"
          for suffix in olean olean.server olean.private; do
            test -s "$toolchain_root/lib/lean/Init/Prelude.$suffix"
            test -s "$toolchain_root/lib/lean/Init/Data/Repr.$suffix"
          done
          printf 'ELAN_HOME=%s\nFLN_REFERENCE_LIB=%s/lib/lean\nFLN_REFERENCE_LEAN=%s/bin/lean\nFLN_REQUIRE_REFERENCE=1\n' \
            "$ELAN_HOME" "$toolchain_root" "$toolchain_root" >> "$GITHUB_ENV"
          printf '%s\n' "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - name: test (workspace, no fail-fast)
        if: ${{ !cancelled() }}
        # Six tests are skipped here BY NAME, and only these; each name is unique
        # across the workspace, so no filter can drop an unrelated test. They
        # guard the main-tree checkout's own state, not the product, and a CI
        # clone cannot honestly supply what they measure; faking it would be the
        # vacuous satisfaction they exist to refuse. They keep running in the
        # main tree.
        # Measured in a fresh local clone at f644e6ef:
        # - the_unresolvable_citation_census_matches_the_measured_population:
        #   counts manifest citations of files that exist only untracked in the
        #   main tree, so a clean checkout measures a different population;
        # - real_workspace_policy_report_is_complete_and_read_only: runs the
        #   operator's `br` binary against the live tracker; CI has no `br`;
        # - every_rust_side_launch_of_a_trusted_script_is_sealed: its
        #   anti-vacuity floor requires generated output on disk, which a fresh
        #   checkout never has (AGENTS.md, green-bar table).
        # Measured on this runner (run 36068215033):
        # - the three commit_anchor_reachability tests below classify cited
        #   anchors against refs/original and the pre-filter-branch backup refs,
        #   which exist only in the main repository and are never fetched. In a
        #   clone every backup-only anchor becomes unresolvable, so the negative
        #   control cannot be built, the floor sees 0, and the AGENTS.md row reads
        #   as repaired. The tests say so themselves.
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-fail-fast -- \
            --skip the_unresolvable_citation_census_matches_the_measured_population \
            --skip real_workspace_policy_report_is_complete_and_read_only \
            --skip every_rust_side_launch_of_a_trusted_script_is_sealed \
            --skip the_classifier_separates_a_reachable_anchor_from_a_backup_only_one \
            --skip the_allowance_carries_no_dead_or_zero_rows \
            --skip a_derived_zero_is_refused_as_a_broken_scan \
            2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: executed-test floor
        if: always()
        run: |
          python3 -I - "$RUNNER_TEMP/test.log" "$FLOOR" <<'PY'
          import re, sys
          log, floor = open(sys.argv[1], encoding="utf-8", errors="replace").read(), int(sys.argv[2])
          results = re.findall(r"^test result: \w+\. (\d+) passed; (\d+) failed", log, re.M)
          passed = sum(int(p) for p, _ in results)
          failed = sum(int(f) for _, f in results)
          print(f"product-gate: {len(results)} test binaries, {passed} passed, {failed} failed, floor {floor}")
          if failed or passed < floor:
              sys.exit(f"product-gate: REFUSED (failed={failed}, passed={passed} < floor {floor})"
                       if passed < floor else f"product-gate: REFUSED ({failed} failed)")
          PY
