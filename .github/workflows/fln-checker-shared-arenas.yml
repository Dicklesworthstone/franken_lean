name: checker shared arenas - verify and land

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fln-checker-shared-arenas.yml

permissions:
  contents: write

concurrency:
  group: fln-checker-shared-arenas
  cancel-in-progress: false

jobs:
  verify-and-land:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Prepare the guarded implementation and regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shared-arena-evidence"
          cat > "$RUNNER_TEMP/apply-shared-arenas.py" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          path = root / "crates/fln-checker/src/wire.rs"
          test = root / "crates/fln-checker/tests/shared_arena.rs"
          TESTS = r'''#![forbid(unsafe_code)]

          use std::collections::hash_map::DefaultHasher;
          use std::hash::{Hash, Hasher};

          use fln_checker::term::{TermBudget, TermOutcome, raise_external_bounds};
          use fln_checker::whnf::{WhnfBudget, WhnfContext, WhnfOutcome, whnf, whnf_with};
          use fln_checker::wire::{DecodeBudget, DecodeOutcome, WireExpr, decode_expr};
          use fln_core::expr::{BinderInfo, Expr, Literal};
          use fln_core::level::Level;
          use fln_core::name::Name;
          use fln_hash::canon::Canonical;

          fn decoded(expression: &Expr) -> WireExpr {
              match decode_expr(&expression.to_canonical_bytes(), DecodeBudget::unlimited()) {
                  DecodeOutcome::Complete(Ok(term)) => term,
                  other => panic!("fixture failed to decode: {other:?}"),
              }
          }

          fn fixture() -> WireExpr {
              decoded(&Expr::app(
                  Expr::bvar(0).expect("bounded index"),
                  Expr::sort(Level::one()),
              ))
          }

          fn hash(term: &WireExpr) -> u64 {
              let mut hasher = DefaultHasher::new();
              term.hash(&mut hasher);
              hasher.finish()
          }

          #[test]
          fn clones_share_expression_and_level_storage() {
              let term = fixture();
              assert!(!term.nodes().is_empty());
              assert!(!term.levels().is_empty());
              let clones: Vec<_> = (0..64).map(|_| term.clone()).collect();
              for cloned in &clones {
                  assert!(std::ptr::eq(term.nodes(), cloned.nodes()));
                  assert!(std::ptr::eq(term.levels(), cloned.levels()));
                  assert_eq!(cloned.root(), term.root());
                  assert_eq!(cloned, &term);
              }
          }

          #[test]
          fn independently_decoded_arenas_keep_content_equality_and_hashing() {
              let first = fixture();
              let second = fixture();
              assert!(!std::ptr::eq(first.nodes(), second.nodes()));
              assert!(!std::ptr::eq(first.levels(), second.levels()));
              assert_eq!(first, second);
              assert_eq!(hash(&first), hash(&second));
              assert_eq!(hash(&first), hash(&first.clone()));
              let different = decoded(&Expr::sort(Level::zero()));
              assert_ne!(first, different);
          }

          #[test]
          fn rewriting_a_shared_arena_leaves_every_alias_unchanged() {
              let original = fixture();
              let alias = original.clone();
              let before_hash = hash(&original);
              let changed = match raise_external_bounds(&alias, 3, 0, TermBudget::unlimited()) {
                  TermOutcome::Complete(term) => term,
                  other => panic!("rewrite failed: {other:?}"),
              };
              let expected = decoded(&Expr::app(
                  Expr::bvar(3).expect("bounded index"),
                  Expr::sort(Level::one()),
              ));
              assert_eq!(changed, expected);
              assert_ne!(changed, original);
              assert_eq!(original, fixture());
              assert_eq!(alias, original);
              assert_eq!(hash(&original), before_hash);
              assert!(std::ptr::eq(original.nodes(), alias.nodes()));
          }

          #[test]
          fn the_last_alias_retains_large_node_payloads() {
              let payload = "shared checker payload ".repeat(16_384);
              let surviving = {
                  let original = decoded(&Expr::lit(Literal::Str(payload.clone())));
                  let alias = original.clone();
                  assert!(std::ptr::eq(original.nodes(), alias.nodes()));
                  alias
              };
              assert_eq!(surviving, decoded(&Expr::lit(Literal::Str(payload))));
          }

          fn redex() -> WireExpr {
              decoded(&Expr::app(
                  Expr::lam(
                      Name::anonymous(),
                      Expr::sort(Level::one()),
                      Expr::bvar(0).expect("bounded index"),
                      BinderInfo::Default,
                  ),
                  Expr::sort(Level::zero()),
              ))
          }

          #[test]
          fn independent_threads_can_reduce_shared_inputs() {
              let original = redex();
              let before = original.clone();
              std::thread::scope(|scope| {
                  for _ in 0..4 {
                      let input = original.clone();
                      scope.spawn(move || {
                          let result = whnf(&input, &WhnfContext::default(), WhnfBudget::unlimited());
                          let WhnfOutcome::Complete(result) = result else {
                              panic!("reduction failed: {result:?}");
                          };
                          assert_eq!(result.term, decoded(&Expr::sort(Level::zero())));
                      });
                  }
              });
              assert_eq!(original, before);
              assert!(std::ptr::eq(original.nodes(), before.nodes()));
          }

          #[test]
          fn sharing_preserves_reduction_progress_and_nonanswers() {
              let original = redex();
              let alias = original.clone();
              let context = WhnfContext::default();
              assert_eq!(
                  whnf(&original, &context, WhnfBudget::unlimited()),
                  whnf(&alias, &WhnfContext::default(), WhnfBudget::unlimited()),
              );
              let exhausted = WhnfBudget::new(0, 0, TermBudget::unlimited());
              let left = whnf(&original, &context, exhausted);
              let right = whnf(&alias, &context, exhausted);
              assert!(matches!(left, WhnfOutcome::Inconclusive(_)));
              assert_eq!(left, right);
              let left = whnf_with(&original, &context, WhnfBudget::unlimited(), || true);
              let right = whnf_with(&alias, &context, WhnfBudget::unlimited(), || true);
              assert!(matches!(left, WhnfOutcome::Inconclusive(_)));
              assert_eq!(left, right);
          }

          #[test]
          fn shared_inputs_still_pay_materialization_limits() {
              let term = redex();
              let alias = term.clone();
              for materialization in [
                  TermBudget::new(0, u64::MAX),
                  TermBudget::new(u64::MAX, 0),
                  TermBudget::unlimited().with_max_arena_nodes(0),
              ] {
                  let budget = WhnfBudget::new(10_000, 10_000, materialization);
                  let original = whnf(&term, &WhnfContext::default(), budget);
                  let shared = whnf(&alias, &WhnfContext::default(), budget);
                  assert!(matches!(original, WhnfOutcome::Inconclusive(_)));
                  assert_eq!(original, shared);
              }
          }
          '''

          if sys.argv[2] == "tests":
              if test.exists():
                  raise SystemExit("refusing to overwrite an existing test file")
              test.write_text(TESTS, encoding="utf-8")
          else:
              source = path.read_text(encoding="utf-8")
              edits = [
                  ("pub struct WireExpr {\n    nodes: Vec<ExprNode>,\n    levels: Vec<LevelNode>,", "pub struct WireExpr {\n    nodes: std::sync::Arc<Vec<ExprNode>>,\n    levels: std::sync::Arc<Vec<LevelNode>>," , 1),
                  ("        WireExpr {\n            nodes,\n            levels,\n            root,\n        }", "        WireExpr {\n            nodes: nodes.into(),\n            levels: levels.into(),\n            root,\n        }", 1),
                  ("    Ok(WireExpr {\n        nodes,\n        levels: levels.nodes,\n        root,\n    })", "    Ok(WireExpr::from_parts(nodes, levels.nodes, root))", 2),
                  ("/// One independently decoded expression and all levels embedded in it.", "/// One independently decoded expression and all levels embedded in it.\n///\n/// Immutable arenas share their storage on clone. Inference, reduction and memo\n/// results can retain a term without copying its nodes or literal payloads.\n/// Arena builders still own mutable vectors and freeze them only at publication;\n/// no mutable access to the shared storage is exposed. Equality and hashing remain\n/// structural, and the decoder and term-operation budgets are unchanged.\n/// `Arc<Vec<_>>` also moves a builder's existing allocation without copying it.", 1),
              ]
              for before, after, count in edits:
                  actual = source.count(before)
                  if actual != count:
                      raise SystemExit(f"source changed: expected {count} matches, got {actual}: {before!r}")
                  source = source.replace(before, after)
              path.write_text(source, encoding="utf-8")
          PY

      - name: Verify against current main and publish only the tested source
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/shared-arena-evidence"
          original="$GITHUB_WORKSPACE"
          for attempt in 1 2 3; do
            cd "$original"
            git fetch origin main
            base="$(git rev-parse origin/main)"
            work="$RUNNER_TEMP/shared-arenas-${GITHUB_RUN_ID}-${attempt}"
            git worktree add --detach "$work" "$base"
            cd "$work"
            if [[ -f crates/fln-checker/tests/shared_arena.rs ]]; then
              echo "Implementation already present; refusing duplicate publication."
              exit 0
            fi
            printf '%s\n' "$base" > "$evidence/base-${attempt}.txt"
            export CARGO_TARGET_DIR="$work/target/shared-arenas"
            rustup show active-toolchain | tee "$evidence/toolchain-${attempt}.log"
            python3 -I "$RUNNER_TEMP/apply-shared-arenas.py" "$work" tests

            # The old implementation must compile and fail the exact storage
            # regression. A compiler/setup failure is not a successful control.
            set +e
            cargo test --locked -p fln-checker --test shared_arena \
              clones_share_expression_and_level_storage -- --exact \
              > "$evidence/before-${attempt}.log" 2>&1
            before=$?
            set -e
            cat "$evidence/before-${attempt}.log"
            [[ "$before" -eq 101 ]]
            grep -Fq 'test clones_share_expression_and_level_storage ... FAILED' "$evidence/before-${attempt}.log"
            grep -Fq 'assertion failed: std::ptr::eq' "$evidence/before-${attempt}.log"

            python3 -I "$RUNNER_TEMP/apply-shared-arenas.py" "$work" patch
            rustfmt --edition 2024 crates/fln-checker/src/wire.rs crates/fln-checker/tests/shared_arena.rs
            cargo test --locked -p fln-checker 2>&1 | tee "$evidence/tests-${attempt}.log"
            cargo clippy --locked -p fln-checker --all-targets -- -D warnings \
              2>&1 | tee "$evidence/clippy-${attempt}.log"
            cargo check --locked --workspace --all-targets \
              2>&1 | tee "$evidence/workspace-${attempt}.log"
            rustfmt --edition 2024 --check crates/fln-checker/src/wire.rs crates/fln-checker/tests/shared_arena.rs
            git diff --check
            git add crates/fln-checker/src/wire.rs crates/fln-checker/tests/shared_arena.rs
            python3 -I - <<'PY'
          import subprocess
          expected = {"crates/fln-checker/src/wire.rs", "crates/fln-checker/tests/shared_arena.rs"}
          changed = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f"unexpected staged files: {changed}")
          if subprocess.check_output(["git", "diff", "--name-only"], text=True).strip():
              raise SystemExit("unstaged tracked changes must not accompany publication")
          PY
            git diff --cached > "$evidence/change-${attempt}.patch"
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" != "$base" ]]; then
              echo "main advanced: repeat all checks against its new head, never rebase untested code."
              continue
            fi
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'perf(checker): share immutable expression arenas across cloned terms' \
              -m "Replace deep WireExpr clones with shared immutable expression and universe vectors. Keep structural equality/hashing, mutable builders, budgets, and the independent decoder unchanged. Seven regressions cover storage sharing, alias-safe rewrites, payload lifetime, threading, and typed stops. The storage regression failed on base $base before the change; package tests, Clippy, changed-file rustfmt, and workspace compilation passed afterward. Bead fln-checker-associator-time-y8wc remains open: input materialization and corpus timing are not claimed fixed. Evidence: Actions run $GITHUB_RUN_ID."
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee "$evidence/published.txt"
              exit 0
            fi
            echo "Fast-forward push was rejected; retry from current main with fresh verification."
          done
          echo "main kept advancing; no untested rebase or force-push attempted." >&2
          exit 1

      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checker-shared-arena-evidence
          path: ${{ runner.temp }}/shared-arena-evidence
          if-no-files-found: error
