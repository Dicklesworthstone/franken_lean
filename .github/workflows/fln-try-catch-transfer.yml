name: Native exception object transfer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/fln-try-catch-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify the retained transport and collect the concurrent merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, pathlib, subprocess, textwrap
          old = "34df040e005b73990a5f66b48d5f4537877103c6"
          subprocess.run(["git", "fetch", "--depth=1", "origin", old], check=True)
          data = subprocess.check_output(["git", "show", old + ":.github/workflows/fln-try-catch-transfer.yml"])
          assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == "a94881ca35f8e42838c0061b9d4e634900bb4e42"
          text = data.decode()
          for before, after in [("ffC0ZZcaq", "ffC0Zcaq"), ("F6OazB7pvced", "F6OazB3pvced"), ("nvhwJ9vB33", "nvhwJvB33")]:
              assert text.count(before) == 1
              text = text.replace(before, after)
          script = textwrap.dedent(text.split("          python3 - <<'PYTHON'\n", 1)[1].split("          PYTHON\n", 1)[0])
          assert hashlib.sha256(script.encode()).hexdigest() == "66c75222df385ec9e9b163bb0bd751e6c9b1072a69770220ba888a1f52aabe42"
          # git merge-file may report more than one conflict. Collect every
          # conflict for inspection, but leave the no-conflicts publication
          # guard in place: this program only creates immutable blobs.
          guard = "assert result.returncode in (0, 1), (path, result.returncode)"
          assert script.count(guard) == 1
          script = script.replace(guard, "assert 0 <= result.returncode < 128, (path, result.returncode)")
          pathlib.Path("verified-exception-transfer.py").write_text(script)
          exec(compile(script, "verified-exception-transfer.py", "exec"))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-exception-merged-sources
          path: exception-transfer/
          retention-days: 7
