name: Native exception object transfer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/fln-try-catch-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Verify and merge exact exception sources without publishing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, json, os, pathlib, subprocess, tempfile, urllib.request, zlib
          R = pathlib.Path.cwd()
          OUT = R / "exception-transfer"
          OUT.mkdir()
          BASE = "d0afb0e9fd5a273b5ab5891c3c167b826fdacb0a"
          EXPECTED = {'crates/fln-elab/src/source/do_notation.rs': {'before': '32fdd8a4625f9d321a17b430b0ed1303401dbeb5', 'after': '6fba0fe322fc865d5b50db4d7774f008f276f536'}, 'crates/fln-elab/src/source/do_notation/conditional.rs': {'before': 'e85ad180325e1ea9a2ceef7b5627a9268b3a01bc', 'after': '6df0ab900938145404ee1a08c63c2322a6a25548'}, 'crates/fln-elab/src/source/do_notation/exceptions.rs': {'before': None, 'after': '1ddf762079065ce962d341bbce8075d48a825452'}, 'crates/fln-elab/src/source/do_notation/for_loop.rs': {'before': 'f127e54f257316fbba57ea6e95e6c27725cb52f0', 'after': '3d66691b2174f4563f91dbfa7895b7c2ecb913c0'}, 'crates/fln-elab/src/source/do_notation/returns.rs': {'before': '8a14380ba755172ac2a6e7b771ab6ce1c5bcbc1b', 'after': '0d505cb72559fee93d070415f5ca3a1cc4a50fee'}, 'crates/fln-parse/src/matching.rs': {'before': '9fc05b5003017ddc410fa621345b20952561a07d', 'after': '0a4f92f92839a99653f3b54dfdffabc8267db22e'}, 'crates/fln-parse/src/matching/do_scopes.rs': {'before': '42878472228b044eb58eeb2b1d4fa2cdc2912861', 'after': '7358ea23a1a2a1543d98e4df6d5701c73c8f596f'}, 'crates/fln-parse/src/matching/exceptions.rs': {'before': None, 'after': 'd19d41c056788e7c9882020cb734e7bc50deb4c6'}, 'crates/fln-parse/src/term_do.rs': {'before': '6c2478324085ab6909fc288dc387f471bcf3d532', 'after': 'a6aa3af3bfed9fe8dd05c2c1c38d444a0c58d44a'}, 'crates/fln-parse/tests/do_exceptions.rs': {'before': None, 'after': 'f49b9f9cc3cadc00fdc687ce2ceb1af2a888854a'}, 'crates/fln/tests/source_do_exceptions.rs': {'before': None, 'after': 'c07aa832086ab841cda6cec0343601d2c3d8b32c'}}
          PATCH = zlib.decompress(base64.b64decode(""))
          assert hashlib.sha256(PATCH).hexdigest() == "d9c907fac99910c01234a72fc6e2215a7f10b61dee72a140cd7af47a6096e57f"
          def run(args, **kw):
              return subprocess.run(args, check=True, stdout=subprocess.PIPE, **kw).stdout
          def sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          def write(root, path, data):
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              return target
          run(["git", "fetch", "--depth=1", "origin", BASE])
          with tempfile.TemporaryDirectory() as tmp:
              tmp = pathlib.Path(tmp)
              original = {}
              for path, item in EXPECTED.items():
                  before = item["before"]
                  data = run(["git", "show", BASE + ":" + path]) if before else b""
                  assert (sha(data) if before else None) == before, path
                  original[path] = data
                  if before:
                      write(tmp, path, data)
              patchfile = tmp / "change.patch"
              patchfile.write_bytes(PATCH)
              names = run(["git", "apply", "--numstat", str(patchfile)], cwd=tmp).decode().splitlines()
              assert {line.split("\t", 2)[2] for line in names} == set(EXPECTED)
              run(["git", "apply", "--check", str(patchfile)], cwd=tmp)
              run(["git", "apply", str(patchfile)], cwd=tmp)
              manifest = {}
              conflicts = []
              for path, item in EXPECTED.items():
                  proposed = (tmp / path).read_bytes()
                  assert sha(proposed) == item["after"], path
                  current = (R / path).read_bytes() if (R / path).exists() else None
                  if item["before"] is None:
                      assert current is None or current == proposed, path
                      merged = proposed
                  else:
                      assert current is not None, path
                      ours = write(OUT / "baseline", path, current)
                      ancestor = write(tmp / "original", path, original[path])
                      theirs = tmp / path
                      result = subprocess.run(["git", "merge-file", "-p", str(ours), str(ancestor), str(theirs)], stdout=subprocess.PIPE)
                      assert result.returncode in (0, 1), (path, result.returncode)
                      merged = result.stdout
                      if result.returncode:
                          conflicts.append(path)
                  write(OUT / "source", path, merged)
                  manifest[path] = {"before": sha(current) if current is not None else None, "after": sha(merged)}
              for path in ['crates/fln-elab/src/source/do_notation/fallback.rs', 'crates/fln-parse/src/matching/fallback.rs', 'crates/fln-parse/src/term_do/fallback.rs', 'crates/fln-parse/tests/source_do_fallback.rs', 'crates/fln/tests/source_do_fallback.rs', 'crates/fln-elab/src/source/do_notation/loop_returns.rs', 'crates/fln-elab/src/source/do_notation/control.rs', 'crates/fln/tests/source_do/for_loops.rs', 'crates/fln/tests/source_do/for_loops/loop_returns.rs', 'crates/fln/tests/source_do/for_loops/branch_sequences.rs', 'crates/fln/tests/source_do/for_loops/conditional.rs', 'crates/fln/tests/source_do/for_loops/early_returns.rs', 'crates/fln/tests/source_do/for_loops/match_sequences.rs']:
                  if (R / path).exists():
                      write(OUT / "validation", path, (R / path).read_bytes())
              (OUT / "status.json").write_text(json.dumps({"base": BASE, "head": os.environ["GITHUB_SHA"], "conflicts": conflicts}, indent=2))
              (OUT / "manifest.json").write_text(json.dumps(manifest, indent=2))
              (OUT / "implementation.patch").write_bytes(PATCH)
              assert not conflicts, conflicts
              for path, item in manifest.items():
                  data = (OUT / "source" / path).read_bytes()
                  request = urllib.request.Request("https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs", data=json.dumps({"content": base64.b64encode(data).decode(), "encoding": "base64"}).encode(), headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "Content-Type": "application/json"}, method="POST")
                  with urllib.request.urlopen(request) as response:
                      created = json.load(response)
                  assert created["sha"] == item["after"], path
              (OUT / "objects-created.txt").write_text("Verified immutable blobs only; no commit, ref update, or PR.\n")
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-exception-merged-sources
          path: exception-transfer/
          retention-days: 7
