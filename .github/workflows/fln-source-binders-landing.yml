name: Native dependent source binders

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-source-binders-landing.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fln-source-binders-landing
  cancel-in-progress: false

jobs:
  land:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install configured Rust
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv
      - name: Apply exact locally exercised source integration
        shell: bash
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import pathlib, hashlib, base64, zlib, subprocess
          before = {
            'crates/fln-parse/src/lib.rs': '0cdb2d2904094f8d66b24080ac1d05b2c5c86b1c',
            'crates/fln-parse/src/record_terms.rs': '59773575573265cf6f8560910c13d3c32fccde69',
            'crates/fln-elab/src/source.rs': '9dd71dbaa0b2b8b92d716d251bf7103ecfd1287a',
            'crates/fln/tests/source_term_binders.rs': None,
            'crates/fln-parse/src/term_binders.rs': 'c2b9f416591958862af6b4cce2ce594fd899128a',
            'crates/fln-elab/src/source/binders.rs': '5b636323b5a95365e7562d30aef5f2ca00e48302',
          }
          after = {
            'crates/fln-parse/src/lib.rs': 'f76ce6b0b0b3e5b2ec27385a3e63924894ea8063',
            'crates/fln-parse/src/record_terms.rs': 'd5b9277219e650f3496773567b962fe9ac903686',
            'crates/fln-elab/src/source.rs': '4c76dc9cf1d1f0efbbf9096a8e0b531a9eb72fef',
            'crates/fln/tests/source_term_binders.rs': '68abf7c549e86e1ecd1fa947cf0251bdb2f5d7c5',
            'crates/fln-parse/src/term_binders.rs': 'c2b9f416591958862af6b4cce2ce594fd899128a',
            'crates/fln-elab/src/source/binders.rs': '5b636323b5a95365e7562d30aef5f2ca00e48302',
          }
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def verify(expected):
              for name, sha in expected.items():
                  path = pathlib.Path(name)
                  if sha is None:
                      assert not path.exists(), name
                  else:
                      assert blob(path.read_bytes()) == sha, name
          verify(before)
          encoded = ''''''
          # Correct only transport transcription, then validate the immutable payload.
          encoded = encoded.replace('OouUU4Y', 'OouU4Y').replace('nFiZq6m5nng', 'nFiZqrm5nng').replace('v2Q5d/cbg', 'v2Q5/cbg')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b528ec0a0532ca3bacf14da3cbcacf1e4e5e5e0ded054e8642b29cec63860d5f'
          subprocess.run(['git', 'apply', '--check', '--whitespace=error'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--whitespace=error'], input=patch, check=True)
          verify(after)
          PY
      - name: Compile test and lint the actual integrated source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/source-binders
          cargo test --locked -p fln-parse -p fln-elab --no-fail-fast 2>&1 | tee target/source-binders/package-tests.log
          cargo test --locked -p fln --test source_term_binders 2>&1 | tee target/source-binders/dual-checker-tests.log
          cargo clippy --locked -p fln-parse -p fln-elab --all-targets -- -D warnings 2>&1 | tee target/source-binders/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/source-binders/workspace-check.log
          rustfmt --edition 2024 --check --config skip_children=true crates/fln-parse/src/lib.rs crates/fln-parse/src/record_terms.rs crates/fln-parse/src/term_binders.rs crates/fln-elab/src/source.rs crates/fln-elab/src/source/binders.rs crates/fln/tests/source_term_binders.rs
          git diff --check
      - name: Commit checked implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln-parse/src/lib.rs crates/fln-parse/src/record_terms.rs crates/fln-elab/src/source.rs crates/fln/tests/source_term_binders.rs
          git commit -m 'feat(source): enable typed lambdas and dependent Pi telescopes'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/source-binders/published-commit.txt
      - name: Retain functional results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-binders-${{ github.sha }}
          path: target/source-binders
          retention-days: 7
          if-no-files-found: warn
