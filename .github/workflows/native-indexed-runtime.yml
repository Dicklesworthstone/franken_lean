name: Native indexed runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-indexed-runtime.yml'
      - 'crates/fln/src/runtime/**'
      - 'crates/fln/src/runtime.rs'
      - 'crates/fln/tests/runtime_indexed_data.rs'
      - 'crates/fln-cli/tests/source_indexed_runtime.rs'
      - 'examples/native_indexed_vectors.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexed:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - name: Check indexed layouts, strictness, admission and installed replay
        run: |
          set -euo pipefail
          cargo test --locked -p fln --lib --test runtime_indexed_data --test runtime_recursive_data --test runtime_parameterized_data --test runtime_proof_data --test source_indexed --test source_indexed_elimination
          cargo test --locked -p fln-cli --test source_indexed_runtime --test source_proof_runtime
          cargo clippy --locked -p fln --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
          rustfmt --edition 2024 --check --config skip_children=true crates/fln/src/runtime/indexed.rs crates/fln/src/runtime/indexed/tests.rs crates/fln/tests/runtime_indexed_data.rs crates/fln-cli/tests/source_indexed_runtime.rs
  transport-validation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6d271b44f9f245e1f6408defe768fb2809041923
          persist-credentials: false
      - name: Restore checksum-bound equality transport inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd()
          out = root / 'target/transport-validation'
          out.mkdir(parents=True)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          chunks = ['3549e9c005c1a3c90680e1be95034f4160142920', '0b0989129cfe6ddf74081cb38467de66be455273']
          packed = bytearray()
          for sha in chunks:
              response = json.loads(subprocess.check_output(['gh','api','repos/Dicklesworthstone/franken_lean/git/blobs/'+sha]))
              data = base64.b64decode(response['content'])
              assert blob(data) == sha
              packed.extend(data)
          assert len(packed) == 8599
          assert hashlib.sha256(packed).hexdigest() == '12c18f3d43679ef2e0b7d107edd8cd5d4a00b2a6dbf61032ab5ee86130914c41'
          manifest = json.loads(gzip.decompress(packed))
          assert git('rev-parse','HEAD') == manifest['base'] == '6d271b44f9f245e1f6408defe768fb2809041923'
          assert git('rev-parse','HEAD^{tree}') == manifest['base_tree'] == 'a14801f8f779dd3b1273ae6a73a57eeb06336d52'
          allowed = {'.github/workflows/native-indexed-runtime.yml', 'crates/fln-cli/tests/source_indexed_runtime.rs', 'crates/fln/src/runtime.rs', 'crates/fln/src/runtime/specialize.rs', 'crates/fln/src/runtime/transport.rs', 'crates/fln/src/runtime/transport/tests.rs', 'crates/fln/tests/runtime_equality_transport.rs', 'docs/NATIVE_EQUALITY_TRANSPORT.md', 'docs/NATIVE_INDEXED_RUNTIME.md', 'examples/native_equality_transport.lean'}
          assert len(manifest['entries']) == 10 and {e['path'] for e in manifest['entries']} == allowed
          for entry in manifest['entries']:
              path = root / entry['path']
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              assert entry['mode'] == '100644'
              if entry['before'] is None:
                  assert not path.exists() and not git('ls-files','--',entry['path'])
              else:
                  assert blob(path.read_bytes()) == entry['before'], entry['path']
          patch = out / 'change.patch'
          patch.write_text(manifest['patch'])
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert set(git('diff','--cached','--name-only').splitlines()) == allowed
          for entry in manifest['entries']:
              assert blob((root / entry['path']).read_bytes()) == entry['after'], entry['path']
          assert git('write-tree') == manifest['tree'] == '8299a85b5e389339085f87de5e8f719cda085c18'
          (out / 'manifest.json').write_text(json.dumps(manifest))
          print('TRANSPORT_TREE',git('write-tree'))
          PY
      - name: Check cast invariants, refined matches and installed replay
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
          cargo test --locked -p fln --lib --test runtime_equality_transport --test runtime_indexed_data --test source_index_refinement --test runtime_proof_data --test runtime_higher_order 2>&1 | tee target/transport-validation/engine.log
          cargo test --locked -p fln-cli --test source_indexed_runtime --test source_proof_runtime 2>&1 | tee target/transport-validation/cli.log
          cargo clippy --locked -p fln --all-targets -- -D warnings 2>&1 | tee target/transport-validation/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/transport-validation/check.log
          rustfmt --edition 2024 --check --config skip_children=true crates/fln/src/runtime.rs crates/fln/src/runtime/specialize.rs crates/fln/src/runtime/transport.rs crates/fln/src/runtime/transport/tests.rs crates/fln/tests/runtime_equality_transport.rs crates/fln-cli/tests/source_indexed_runtime.rs
          git diff --cached --check
      - name: Export checked file objects without moving any branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          manifest = json.loads(pathlib.Path('target/transport-validation/manifest.json').read_text())
          for entry in manifest['entries']:
              data = pathlib.Path(entry['path']).read_bytes()
              sha = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert sha == entry['after']
              request = json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              response = json.loads(subprocess.check_output(['gh','api','--method','POST','repos/Dicklesworthstone/franken_lean/git/blobs','--input','-'],input=request))
              assert response['sha'] == sha
              print('EXPORTED',sha,entry['path'],flush=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == manifest['tree']
          print('TRANSPORT_VALIDATED_EXPORT_COMPLETE',tree,flush=True)
          PY
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: equality-transport-validation-${{ github.run_id }}
          path: target/transport-validation/
          retention-days: 14
