name: Native Lake integrity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-lake-integrity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-inputs:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 17a8cd578ee6857392326870f5ea24635900331d
          fetch-depth: 20
          persist-credentials: false
      - name: Retain exact concurrent changes and full metadata
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          base = 'f863cd4a5ca297286d074b02804d65fe2db60408'
          head = '17a8cd578ee6857392326870f5ea24635900331d'
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'lake-integration'
          out.mkdir()
          def git(*args):
              return subprocess.check_output(['git',*args])
          assert git('rev-parse','HEAD').decode().strip() == head
          paths = git('diff','--name-only','-z',base,head).decode().rstrip('\0').split('\0')
          patch = git('diff','--binary',base,head)
          (out/'concurrent.patch').write_bytes(patch)
          entries = []
          with tarfile.open(out/'current-files.tar.gz','w:gz') as archive:
              for name in paths:
                  p = pathlib.Path(name)
                  assert p.is_file() and not p.is_symlink()
                  data = p.read_bytes()
                  sha = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  assert sha == git('rev-parse',head+':'+name).decode().strip()
                  archive.add(p,arcname=name,recursive=False)
                  entries.append({'path':name,'sha':sha})
          (out/'manifest.json').write_text(json.dumps({'base':base,'head':head,'tree':git('rev-parse','HEAD^{tree}').decode().strip(),'entries':entries,'patch_sha256':hashlib.sha256(patch).hexdigest()},indent=2))
          print('Retained concurrent inputs, not a functional validation:',head,len(entries))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lake-integration-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/lake-integration
          retention-days: 14
