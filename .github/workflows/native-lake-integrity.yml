name: Native Lake integrity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-lake-integrity.yml'
      - 'crates/fln-lake/**'
      - 'crates/fln-cli/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^" ]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - name: Check real command outcomes and nonpublication
        run: |
          set -euo pipefail
          cargo test --locked -p fln-lake -p fln-cli --lib --test lake_config_and_actions --test lake_integrity --test cli_personalities_and_verbs
          cargo clippy --locked -p fln-lake -p fln-cli --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
