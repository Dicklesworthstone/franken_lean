name: fln bounded LSP state landing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fln-lsp-utf16-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: fln-bounded-lsp-state-landing-v4
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout exact main head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: implement the bounded LSP state slice
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import re
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one literal anchor, observed {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_pattern(path: str, pattern: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              text, count = re.subn(pattern, new, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex anchor: {pattern[:100]!r}")
              file.write_text(text, encoding="utf-8")

          dispatch = "crates/fln-server/src/dispatch.rs"
          replace_once(
              dispatch,
              "use crate::json_string;\nuse crate::transport;\n",
              "use crate::{LSP_POSITION_ENCODING, json_string};\nuse crate::transport;\n",
          )
          replace_pattern(
              dispatch,
              r"#\[derive\(Debug\)\]\nstruct CachedDocument \{.*?\n\}\n\nfn skip_ws",
              '''#[derive(Debug)]
          struct CachedDocument {
              text: String,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          enum CacheRefusal {
              DocumentLimit,
              ByteLimit,
              AccountingOverflow,
          }

          impl CacheRefusal {
              const fn message(self) -> &'static str {
                  match self {
                      Self::DocumentLimit => {
                          "FrankenLean source cache is full; current source was checked but not retained"
                      }
                      Self::ByteLimit => {
                          "FrankenLean source cache byte budget is exhausted; current source was checked but not retained"
                      }
                      Self::AccountingOverflow => {
                          "FrankenLean source cache accounting overflowed; current source was checked but not retained"
                      }
                  }
              }
          }

          #[derive(Debug)]
          struct DocumentCache {
              documents: BTreeMap<String, CachedDocument>,
              total_bytes: usize,
              max_documents: usize,
              max_bytes: usize,
          }

          impl DocumentCache {
              fn new() -> Self {
                  Self::with_limits(MAX_OPEN_DOCUMENTS, MAX_OPEN_DOCUMENT_BYTES)
              }

              fn with_limits(max_documents: usize, max_bytes: usize) -> Self {
                  Self {
                      documents: BTreeMap::new(),
                      total_bytes: 0,
                      max_documents,
                      max_bytes,
                  }
              }

              fn store(
                  &mut self,
                  uri: String,
                  _version: i64,
                  text: String,
              ) -> Result<(), CacheRefusal> {
                  let old = self.documents.remove(&uri);
                  let old_len = old.as_ref().map_or(0, |document| document.text.len());
                  self.total_bytes = self
                      .total_bytes
                      .checked_sub(old_len)
                      .ok_or(CacheRefusal::AccountingOverflow)?;

                  if old.is_none() && self.documents.len() >= self.max_documents {
                      return Err(CacheRefusal::DocumentLimit);
                  }
                  let next_total = self
                      .total_bytes
                      .checked_add(text.len())
                      .ok_or(CacheRefusal::AccountingOverflow)?;
                  if next_total > self.max_bytes {
                      return Err(CacheRefusal::ByteLimit);
                  }
                  self.documents.insert(uri, CachedDocument { text });
                  self.total_bytes = next_total;
                  Ok(())
              }

              fn text(&self, uri: &str) -> Option<&str> {
                  self.documents.get(uri).map(|document| document.text.as_str())
              }

              fn replace_text(
                  &mut self,
                  uri: String,
                  version: i64,
                  text: String,
              ) -> Result<(), CacheRefusal> {
                  self.store(uri, version, text)
              }

              fn remove(&mut self, uri: &str) -> Result<(), CacheRefusal> {
                  let Some(text) = self.documents.remove(uri) else {
                      return Ok(());
                  };
                  self.total_bytes = self
                      .total_bytes
                      .checked_sub(text.text.len())
                      .ok_or(CacheRefusal::AccountingOverflow)?;
                  Ok(())
              }
          }

          fn skip_ws''',
          )
          replace_pattern(
              dispatch,
              r"fn extract_top_level_string_field\(.*?\n\}\n\nfn params_object",
              "fn params_object",
          )
          replace_once(
              dispatch,
              '            "\\"capabilities\\":{{",\n',
              '            "\\"capabilities\\":{{\\"positionEncoding\\":{},",\n',
          )
          replace_once(
              dispatch,
              '        id.as_json(),\n        json_string(env!("CARGO_PKG_VERSION"))\n',
              '        id.as_json(),\n        json_string(LSP_POSITION_ENCODING),\n        json_string(env!("CARGO_PKG_VERSION"))\n',
          )
          replace_pattern(
              dispatch,
              r"fn error_response_null_id\(.*?\n\}\n\nfn null_response",
              '''fn error_response_null_id(code: i32, message: &str) -> String {
              format!(
                  "{{\\"jsonrpc\\":\\"2.0\\",\\"id\\":null,\\"error\\":{{\\"code\\":{},\\"message\\":{}}}}}",
                  code,
                  json_string(message)
              )
          }

          fn invalid_request_response(id: Option<&RequestId>, message: &str) -> String {
              match id {
                  Some(id) => error_response(id, -32600, message),
                  None => error_response_null_id(-32600, message),
              }
          }

          fn null_response''',
          )
          replace_once(
              dispatch,
              '''    let mut documents_saved = 0u64;
              let mut documents = DocumentCache::new();
          ''',
              '''    let mut documents_saved = 0u64;
              let mut open_documents: BTreeMap<String, i64> = BTreeMap::new();
              let mut documents = DocumentCache::new();
          ''',
          )
          replace_pattern(
              dispatch,
              r"        let method = extract_top_level_string_field.*?\n\n        match \(method\.as_deref\(\), id\.as_ref\(\), state\) \{",
              '''        let id = match extract_request_id(&text) {
              RequestIdField::Absent => None,
              RequestIdField::Valid(id) => Some(id),
              RequestIdField::Invalid => {
                  let response = error_response_null_id(-32600, "invalid JSON-RPC request id");
                  transport::write_message(output, response.as_bytes())?;
                  continue;
              }
          };
          match decoded_string_field(&text, "jsonrpc") {
              DecodedField::Valid(version) if version == "2.0" => {}
              DecodedField::Missing | DecodedField::Valid(_) | DecodedField::Invalid => {
                  let response = invalid_request_response(
                      id.as_ref(),
                      "invalid or missing JSON-RPC version; expected 2.0",
                  );
                  transport::write_message(output, response.as_bytes())?;
                  continue;
              }
          }
          let method = match decoded_string_field(&text, "method") {
              DecodedField::Valid(method) => Some(method),
              DecodedField::Missing | DecodedField::Invalid => {
                  let response = invalid_request_response(
                      id.as_ref(),
                      "invalid or missing JSON-RPC method",
                  );
                  transport::write_message(output, response.as_bytes())?;
                  continue;
              }
          };

          match (method.as_deref(), id.as_ref(), state) {''',
          )

          arms = {
              "didOpen": '''            (Some("textDocument/didOpen"), None, ServerState::Running) => {
                  if let Some(uri) = extract_text_document_uri(&text) {
                      if open_documents.contains_key(&uri) {
                          transport::write_message(
                              output,
                              log_warning(
                                  "FrankenLean refused duplicate didOpen; the existing open document remains authoritative",
                              )
                              .as_bytes(),
                          )?;
                          continue;
                      }
                      if open_documents.len() >= MAX_OPEN_DOCUMENTS {
                          transport::write_message(
                              output,
                              log_warning(
                                  "FrankenLean refused didOpen because the bounded open-document limit was reached",
                              )
                              .as_bytes(),
                          )?;
                          continue;
                      }
                      match (
                          extract_text_document_version_field(&text),
                          extract_text_document_text_field(&text),
                      ) {
                          (VersionField::Valid(version), DecodedField::Valid(content)) => {
                              open_documents.insert(uri.clone(), version);
                              if let Err(refusal) =
                                  documents.store(uri.clone(), version, content.clone())
                              {
                                  transport::write_message(
                                      output,
                                      log_warning(refusal.message()).as_bytes(),
                                  )?;
                              }
                              check_document(output, &uri, &content, on_did_open)?;
                              documents_opened = documents_opened.saturating_add(1);
                          }
                          _ => {
                              invalidate_retained_source(
                                  output,
                                  &mut documents,
                                  &uri,
                                  "FrankenLean refused didOpen without a valid integer version and full document; any retained source for this URI was invalidated",
                              )?;
                          }
                      }
                  }
              }
          ''',
              "didChange": '''            (Some("textDocument/didChange"), None, ServerState::Running) => {
                  if let Some(uri) = extract_text_document_uri(&text) {
                      let Some(current_version) = open_documents.get(&uri).copied() else {
                          transport::write_message(
                              output,
                              log_warning(
                                  "FrankenLean refused didChange for a document that is not open",
                              )
                              .as_bytes(),
                          )?;
                          continue;
                      };
                      match (
                          extract_text_document_version_field(&text),
                          extract_content_changes_text_field(&text),
                      ) {
                          (VersionField::Valid(version), DecodedField::Valid(content)) => {
                              if version <= current_version {
                                  transport::write_message(
                                      output,
                                      log_warning(
                                          "FrankenLean refused non-monotone didChange version; latest accepted document version remains authoritative",
                                      )
                                      .as_bytes(),
                                  )?;
                                  continue;
                              }
                              open_documents.insert(uri.clone(), version);
                              if let Err(refusal) =
                                  documents.store(uri.clone(), version, content.clone())
                              {
                                  transport::write_message(
                                      output,
                                      log_warning(refusal.message()).as_bytes(),
                                  )?;
                              }
                              check_document(output, &uri, &content, on_did_open)?;
                              documents_changed = documents_changed.saturating_add(1);
                          }
                          _ => {
                              invalidate_retained_source(
                                  output,
                                  &mut documents,
                                  &uri,
                                  "FrankenLean refused didChange without a valid integer version and exactly one Full-sync text change; retained source was invalidated",
                              )?;
                          }
                      }
                  }
              }
          ''',
              "didSave": '''            (Some("textDocument/didSave"), None, ServerState::Running) => {
                  if let Some(uri) = extract_text_document_uri(&text) {
                      let Some(version) = open_documents.get(&uri).copied() else {
                          transport::write_message(
                              output,
                              log_warning(
                                  "FrankenLean refused didSave for a document that is not open",
                              )
                              .as_bytes(),
                          )?;
                          continue;
                      };
                      match extract_save_text_field(&text) {
                          DecodedField::Valid(content) => {
                              if let Err(refusal) =
                                  documents.replace_text(uri.clone(), version, content.clone())
                              {
                                  transport::write_message(
                                      output,
                                      log_warning(refusal.message()).as_bytes(),
                                  )?;
                              }
                              check_document(output, &uri, &content, on_did_open)?;
                              documents_saved = documents_saved.saturating_add(1);
                          }
                          DecodedField::Missing => {
                              if let Some(content) = documents.text(&uri) {
                                  check_document(output, &uri, content, on_did_open)?;
                                  documents_saved = documents_saved.saturating_add(1);
                              } else {
                                  transport::write_message(
                                      output,
                                      log_warning(
                                          "FrankenLean could not re-check textless didSave because no retained source exists",
                                      )
                                      .as_bytes(),
                                  )?;
                              }
                          }
                          DecodedField::Invalid => {
                              invalidate_retained_source(
                                  output,
                                  &mut documents,
                                  &uri,
                                  "FrankenLean refused malformed didSave text; retained source was invalidated instead of replaying stale content",
                              )?;
                          }
                      }
                  }
              }
          ''',
              "didClose": '''            (Some("textDocument/didClose"), None, ServerState::Running) => {
                  if let Some(uri) = extract_text_document_uri(&text) {
                      if open_documents.remove(&uri).is_none() {
                          transport::write_message(
                              output,
                              log_warning(
                                  "FrankenLean received didClose for a document that was not open",
                              )
                              .as_bytes(),
                          )?;
                      }
                      if let Err(refusal) = documents.remove(&uri) {
                          transport::write_message(output, log_warning(refusal.message()).as_bytes())?;
                      }
                      transport::write_message(
                          output,
                          clear_diagnostics_notification(&uri).as_bytes(),
                      )?;
                  }
              }
          ''',
          }
          replace_pattern(
              dispatch,
              r'            \(Some\("textDocument/didOpen"\).*?(?=            \(Some\("textDocument/didChange"\))',
              arms["didOpen"],
          )
          replace_pattern(
              dispatch,
              r'            \(Some\("textDocument/didChange"\).*?(?=            \(Some\("textDocument/didSave"\))',
              arms["didChange"],
          )
          replace_pattern(
              dispatch,
              r'            \(Some\("textDocument/didSave"\).*?(?=            \(Some\("textDocument/didClose"\))',
              arms["didSave"],
          )
          replace_pattern(
              dispatch,
              r'            \(Some\("textDocument/didClose"\).*?(?=            \(Some\("\$/lean/plainGoal"\))',
              arms["didClose"],
          )

          replace_once(
              dispatch,
              '''        assert_eq!(
                  extract_top_level_string_field(json, "method").as_deref(),
                  Some("textDocument/hover")
              );
          ''',
              '''        assert_eq!(
                  decoded_string_field(json, "method"),
                  DecodedField::Valid("textDocument/hover".to_string())
              );
          ''',
          )
          replace_once(
              dispatch,
              '        assert!(output.contains("FrankenLean"));\n',
              '        assert!(output.contains("FrankenLean"));\n        assert!(output.contains("\\\"positionEncoding\\\":\\\"utf-16\\\""));\n',
          )
          replace_pattern(
              dispatch,
              r"    #\[test\]\n    fn textless_save_without_retained_source_is_visible_and_not_counted\(\).*?\n    \}\n",
              '''    #[test]
          fn save_for_unopened_document_is_visible_and_not_counted() {
              let (outcome, output, seen) = run_session(
                  r#"{"jsonrpc":"2.0","method":"textDocument/didSave","params":{"textDocument":{"uri":"file:///missing.lean"}}}"#,
              );
              assert!(outcome.clean);
              assert_eq!(outcome.documents_saved, 0);
              assert!(seen.is_empty());
              assert!(output.contains("window/logMessage"));
              assert!(output.contains("didSave for a document that is not open"));
          }
          ''',
          )
          replace_pattern(
              dispatch,
              r"    #\[test\]\n    fn did_close_evicts_source_and_clears_push_diagnostics\(\).*?\n    \}\n",
              '''    #[test]
          fn did_close_evicts_source_and_clears_push_diagnostics() {
              let (outcome, output, seen) = run_session(
                  &[
                      r#"{"jsonrpc":"2.0","method":"textDocument/didOpen","params":{"textDocument":{"uri":"file:///test.lean","languageId":"lean4","version":1,"text":"open"}}}"#,
                      r#"{"jsonrpc":"2.0","method":"textDocument/didClose","params":{"textDocument":{"uri":"file:///test.lean"}}}"#,
                      r#"{"jsonrpc":"2.0","method":"textDocument/didSave","params":{"textDocument":{"uri":"file:///test.lean"}}}"#,
                  ]
                  .join("\\n"),
              );
              assert!(outcome.clean);
              assert_eq!(seen.len(), 1, "closed source must not be reused by didSave");
              assert!(output.contains("\\"uri\\":\\"file:///test.lean\\",\\"diagnostics\\":[]"));
              assert!(output.contains("didSave for a document that is not open"));
          }
          ''',
          )
          replace_once(
              dispatch,
              '''    #[test]
              fn document_fields_are_bound_to_exact_params_structure() {
          ''',
              '''    #[test]
              fn jsonrpc_version_and_method_are_required() {
                  for json in [
                      r#"{"id":5,"method":"textDocument/hover","params":{}}"#,
                      r#"{"jsonrpc":"1.0","id":5,"method":"textDocument/hover","params":{}}"#,
                      r#"{"jsonrpc":"2.0","id":5,"method":3,"params":{}}"#,
                  ] {
                      let (outcome, output) = lifecycle_session(json);
                      assert!(outcome.clean);
                      assert!(output.contains("\\"id\\":5,\\"error\\":{\\"code\\":-32600"));
                  }
              }

              #[test]
              fn did_change_and_save_require_an_open_document() {
                  let (outcome, output, seen) = run_session(
                      &[
                          r#"{"jsonrpc":"2.0","method":"textDocument/didChange","params":{"textDocument":{"uri":"file:///test.lean","version":2},"contentChanges":[{"text":"change"}]}}"#,
                          r#"{"jsonrpc":"2.0","method":"textDocument/didSave","params":{"textDocument":{"uri":"file:///test.lean"},"text":"save"}}"#,
                      ]
                      .join("\\n"),
                  );
                  assert!(outcome.clean);
                  assert_eq!(outcome.documents_changed, 0);
                  assert_eq!(outcome.documents_saved, 0);
                  assert!(seen.is_empty());
                  assert!(output.contains("didChange for a document that is not open"));
                  assert!(output.contains("didSave for a document that is not open"));
              }

              #[test]
              fn duplicate_did_open_preserves_the_first_open_snapshot() {
                  let (outcome, output, seen) = run_session(
                      &[
                          r#"{"jsonrpc":"2.0","method":"textDocument/didOpen","params":{"textDocument":{"uri":"file:///test.lean","languageId":"lean4","version":1,"text":"first"}}}"#,
                          r#"{"jsonrpc":"2.0","method":"textDocument/didOpen","params":{"textDocument":{"uri":"file:///test.lean","languageId":"lean4","version":2,"text":"second"}}}"#,
                          r#"{"jsonrpc":"2.0","method":"textDocument/didSave","params":{"textDocument":{"uri":"file:///test.lean"}}}"#,
                      ]
                      .join("\\n"),
                  );
                  assert!(outcome.clean);
                  assert_eq!(outcome.documents_opened, 1);
                  assert_eq!(outcome.documents_saved, 1);
                  assert_eq!(
                      seen,
                      vec![
                          ("file:///test.lean".to_string(), "first".to_string()),
                          ("file:///test.lean".to_string(), "first".to_string()),
                      ]
                  );
                  assert!(output.contains("refused duplicate didOpen"));
              }

              #[test]
              fn document_fields_are_bound_to_exact_params_structure() {
          ''',
          )

          cli = "crates/fln-cli/src/lib.rs"
          replace_once(
              cli,
              "        let mut messages = match fln_server::project(lsp_request, &snapshot) {\n",
              "        let mut messages = match fln_server::project_with_sources(\n"
              "            lsp_request,\n"
              "            &snapshot,\n"
              "            &[fln_server::LspSource::new(uri, text)],\n"
              "        ) {\n",
          )
          replace_once(
              cli,
              "    // Strip the `file://` prefix if present, because `complete_messages`\n"
              "    // in fln-server re-adds `file://` when building the notification URI.\n",
              "    // Normalize file URIs for the semantic diagnostic while the projector\n"
              "    // retains the exact editor URI and unsaved source snapshot separately.\n",
          )

          beads = Path(".beads/issues.jsonl")
          lines = beads.read_text(encoding="utf-8").splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if '"id":"franken_lean-v2p"' in line]
          if len(matches) != 1:
              raise SystemExit(f"expected one franken_lean-v2p row, observed {len(matches)}")
          i = matches[0]
          if '"status":"open"' in lines[i]:
              lines[i] = lines[i].replace('"status":"open"', '"status":"in_progress"', 1)
          elif '"status":"in_progress"' not in lines[i]:
              raise SystemExit("franken_lean-v2p has an unexpected lifecycle state")
          beads.write_text("".join(lines), encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check

      - name: verify the focused LSP surface
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-server --lib
          cargo test --locked -p fln-cli --lib --no-run
          cargo clippy --locked -p fln-server --all-targets -- -D warnings

      - name: publish the verified incremental commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "main moved during the verified landing; refusing a non-fast-forward write" >&2
            exit 2
          }
          git config user.name "Jeff Emanuel"
          git config user.email "35050222+Dicklesworthstone@users.noreply.github.com"
          git add .beads/issues.jsonl crates/fln-server/src/dispatch.rs crates/fln-cli/src/lib.rs
          git commit -m "fix(server): separate document state from source retention" \
            -m "Advertise and use UTF-16 positions against the exact unsaved editor snapshot. Validate JSON-RPC 2.0 and method fields before dispatch. Track open-document membership and accepted versions independently from the bounded text cache, so cache refusal cannot authorize unopened changes or erase version monotonicity. Refuse duplicate opens and unopened change/save transitions with focused lifecycle regressions." \
            -m "Bead: franken_lean-v2p"
          git push origin HEAD:main
