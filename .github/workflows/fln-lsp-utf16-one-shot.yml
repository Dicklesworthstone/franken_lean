name: fln LSP focused landing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fln-lsp-utf16-one-shot.yml

permissions:
  contents: write

concurrency:
  group: fln-lsp-focused-landing
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: checkout exact main head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: wire negotiated UTF-16 source projection
        shell: bash
        run: |
          python3 -I -c 'import base64; exec(compile(base64.b64decode("'))' 
          cargo fmt --all
          git diff --check

      - name: compile and test the bounded LSP surface
        shell: bash
        run: |
          cargo test -p fln-server --lib
          cargo test -p fln-cli --lib --no-run

      - name: publish one reviewed incremental commit
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "main moved during the verified landing; refusing a non-fast-forward write" >&2
            exit 2
          }
          git config user.name "Jeff Emanuel"
          git config user.email "35050222+Dicklesworthstone@users.noreply.github.com"
          git add .github/workflows/fln-lsp-utf16-one-shot.yml crates/fln-server/src/dispatch.rs crates/fln-cli/src/lib.rs
          git commit -m "fix(server): wire UTF-16 LSP negotiation" \
            -m "Advertise the UTF-16 position encoding during initialize and pass each exact unsaved editor snapshot into source-aware diagnostic projection. Keep the capability, primary ranges, related ranges, and live CLI server path under one tested contract. Convert the landing helper in place into a focused, read-only verification lane." \
            -m "Bead: franken_lean-v2p"
          git push origin HEAD:main
