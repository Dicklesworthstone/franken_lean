name: Inspect pinned Array fold callbacks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fln-array-fold-model.yml'
      - '.github/patches/fln-array-fold-model/**'

permissions:
  contents: read

concurrency:
  group: inspect-array-fold-callbacks
  cancel-in-progress: true

jobs:
  inspect:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect actual pinned companion bodies
        shell: bash
        run: |
          set -euo pipefail
          curl --user-agent 'OpenAI File Downloader, XaiImageApiFetch/1.0' --fail --location --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.32.0/lean-4.32.0-linux.tar.zst
          echo "fca846f3588724a38ad19ee40292c67cb7438d7555903372e3308eef795ba516  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd --no-same-owner -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/lean-4.32.0-linux/bin/lean" --githash)" = 8c9756b28d64dab099da31a4c09229a9e6a2ef35
          echo 'ARRAY_FOLD_CALLBACK_MODEL_INSPECTION_ONLY'
          "$RUNNER_TEMP/lean-4.32.0-linux/bin/lean" -j1 -M2048 -s65536 -T200000 .github/patches/fln-array-fold-model/print.lean
