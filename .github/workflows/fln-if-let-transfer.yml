name: Native pattern-condition object transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-if-let-transfer.yml']
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify and retain exact native-tested pattern conditions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/Dicklesworthstone/franken_lean'
          def request(path, data=None):
              req = urllib.request.Request(api + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Accept': 'application/vnd.github+json',
                           'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          manifest = {
              'crates/fln-parse/src/matching.rs': ['db0c8f8bcaa264906c097913db844696e466aada', '7bbbd43fd4db467ed0bc7d4c80d992c7c7994976'],
              'crates/fln-parse/src/matching/if_let.rs': [None, '49ef854e87ed3c7be128bf400c0802886be28bc6'],
              'crates/fln-parse/tests/do_if_let.rs': [None, '00d54337e9f6478e6bad0bc2c81996a99a55b11c'],
              'crates/fln-elab/src/source/patterns.rs': ['6e64b62f8d93f015fdb9b9d594eb88d41bd4670b', '5c3eb37679b947665818795eb689482f2f922948'],
              'crates/fln-elab/src/source/do_notation.rs': ['6e54f959268cf7748676c463a3550bc8ed972722', 'deb73696c9ff27d10e8fe3a18e50bcef2b8931e1'],
              'crates/fln-elab/src/source/do_notation/conditional.rs': ['e3ab10f2c0a2e16590f3400b3fa7ffcbf9f9c91c', '6fe7b6c72f8f023437f4a95ebf690b5555a0aab2'],
              'crates/fln-elab/src/source/do_notation/returns.rs': ['a0b73baaa4d71e6a1b6de71cc0bb2b852a86d6a4', 'c358cd1e29d3c1108ad9cb217e86580705f87c60'],
              'crates/fln-elab/src/source/do_notation/if_let.rs': [None, '6f6e3a18dcfec6ade6fab295abd82cae9e3fa996'],
              'crates/fln/tests/source_do/for_loops.rs': ['8d40c8f6ec46148b82ef9f24ffec7f22613c694b', '358a6b7331e43239fe0870c9975cc191307c3421'],
              'crates/fln/tests/source_do/for_loops/if_let.rs': [None, '479f1327278c9ed0bd5c7e15ba940b21589928aa'],
          }
          chunks = [
              '481849c14db0a4f678a5dc01589088b6402ca529',
              '53fc10cde92a16a8c2b4d93fbee5054171941498',
              'cfe9189ddeb52c12fd203db1a60aaaa74971eca9',
              'ad5212fe0e7cbad3602b565830abee57070b0e4f',
              '0f1fb44e0d31241001d82bcb6cb422d20fba89d1',
              '0d32bd9a8d5c681b2a1489d336ddfa6b398151dc',
              'a9c5dd5635c0f48ad0e2bfc53422620f1f451eda',
          ]
          packed = bytearray()
          for sha in chunks:
              response = request('/git/blobs/' + sha)
              assert response['encoding'] == 'base64'
              data = base64.b64decode(response['content'])
              assert blob(data) == sha
              packed.extend(data)
          assert len(packed) == 8318 and blob(packed) == '453115c715139f652b0dde63857bee8458e02430'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '867228665dc388b24025231483561affa8ca4302e16b63f21005a2558eec039a'
          text = patch.decode()
          paths = [line.split(' b/', 1)[1] for line in text.splitlines() if line.startswith('diff --git a/')]
          assert sorted(paths) == sorted(manifest) and len(paths) == len(set(paths))
          assert '\ndeleted file mode ' not in text
          for path, (before, _) in manifest.items():
              file = pathlib.Path(path)
              assert not file.is_symlink()
              assert (blob(file.read_bytes()) if file.exists() else None) == before, path
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pattern-condition-transfer'
          root.mkdir()
          patch_file = root / 'implementation.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--whitespace=error', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', '--whitespace=error', str(patch_file)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          for path, (_, after) in manifest.items():
              data = pathlib.Path(path).read_bytes()
              assert blob(data) == after, path
              uploaded = request('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert uploaded['sha'] == after, path
          receipt = {'base': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'blobs': {path: after for path, (_, after) in manifest.items()},
              'patch_sha256': hashlib.sha256(patch).hexdigest(), 'published_branch': False}
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt, indent=2), flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pattern-condition-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/pattern-condition-transfer
          retention-days: 2
          if-no-files-found: error
