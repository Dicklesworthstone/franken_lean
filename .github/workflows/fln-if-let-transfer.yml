name: Native match-branch object transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-if-let-transfer.yml']
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain the exact inspected and merged match implementation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          api = 'https://api.github.com/repos/Dicklesworthstone/franken_lean'
          def request(path, data=None):
              req = urllib.request.Request(api + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Accept': 'application/vnd.github+json',
                           'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          manifest = {
              'crates/fln-elab/src/source/do_notation.rs': ['46675aaec1c77cee7679b9e0898043780a825b42', 'f6c34bea64cce990278a9c3b03309e0dda95b6ac'],
              'crates/fln-elab/src/source/do_notation/conditional.rs': ['6fe7b6c72f8f023437f4a95ebf690b5555a0aab2', 'e85ad180325e1ea9a2ceef7b5627a9268b3a01bc'],
              'crates/fln-elab/src/source/do_notation/matching.rs': [None, '034f10b979e682ec3b34ac93af8a152f2278ecbe'],
              'crates/fln-elab/src/source/do_notation/returns.rs': ['c358cd1e29d3c1108ad9cb217e86580705f87c60', 'b7e8899eaa3c453f4a53143cac6f49eb2236da39'],
              'crates/fln-elab/src/source/patterns.rs': ['62284c1f653390234e831851885dbcf2f4b323fa', '913acf58f15e0a1e0d8452e485df38e7c73a06d1'],
              'crates/fln-parse/src/matching.rs': ['7bbbd43fd4db467ed0bc7d4c80d992c7c7994976', '9fc05b5003017ddc410fa621345b20952561a07d'],
              'crates/fln-parse/src/term_do.rs': ['9db527a151c6b06e4d0d94b7baef140e109a65a1', '6c2478324085ab6909fc288dc387f471bcf3d532'],
              'crates/fln-parse/tests/do_match.rs': [None, 'db0ea9685be56e18c54329a2506f96cf4cb41a09'],
              'crates/fln/tests/source_do/for_loops.rs': ['358a6b7331e43239fe0870c9975cc191307c3421', 'ea55f6c8058713e9e23c440b72c69e1c5abfbd38'],
              'crates/fln/tests/source_do/for_loops/match_sequences.rs': [None, '1af576b812dc37737f96c2799d3da656ae2c876e'],
          }
          chunks = [
              '62ca6761e632e90ed0cc46752f48feaac2b98e94',
              'd66b1655c27d2b8deb7e5ca486045ad4d32ef6cc',
              '0181bc35062991279d33a5daddbb2c269ff0d45b',
              'a3a6e446ddd7d93d64623fa60b9d7e01b2f08c50',
              'cb45a4b5861b2e84c6ab4d179301734497a1ac1a',
              '86b1d66e64abe3d994ae886fd4893b86671a380b',
              '6528e9eeb26bb17308fce135ba2218b6ab86b84a',
              '48aed86e652a93407f1c7a7bc625acaaa8d0f832',
              '7daa847d794fbc536c657c4fad7302b48fec3fcd',
              'de8b0d01a9ebb1af5f37236b63b25477c48c36e8',
              'efe063e22da12fbe08958fd648ef8865b9a0c288',
              'c0302b112652352720280e2f51d277f30c99f36d',
              '83d1b0c775e6b8f7fa497b96cf3d4badb47b2cbd',
          ]
          packed = bytearray()
          for sha in chunks:
              response = request('/git/blobs/' + sha)
              assert response['encoding'] == 'base64'
              data = base64.b64decode(response['content'])
              assert blob(data) == sha
              packed.extend(data)
          assert len(packed) == 15314 and blob(packed) == '5cf278fabf5bbea887ebe4108dddcb1e0e99ae2e'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == 'f9b570510285df6c39421047ff4659c0b774e823a4bda6e8b85536bba550b5cf'
          text = patch.decode()
          paths = [line.split(' b/', 1)[1] for line in text.splitlines() if line.startswith('diff --git a/')]
          assert sorted(paths) == sorted(manifest) and len(paths) == len(set(paths))
          assert '\ndeleted file mode ' not in text
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'match-branch-transfer'
          root.mkdir()
          def retain(section, path, data):
              target = root / section / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          for path, (before, _) in manifest.items():
              file = pathlib.Path(path)
              assert not file.is_symlink()
              data = file.read_bytes() if file.exists() else None
              assert (blob(data) if data is not None else None) == before, path
              if data is not None:
                  retain('baseline', path, data)
          patch_file = root / 'implementation.patch'
          patch_file.write_bytes(patch)
          applied = subprocess.run(['git', 'apply', '--3way', '--index', '--whitespace=error', str(patch_file)])
          if applied.returncode:
              assert applied.returncode == 1
              path = 'crates/fln-elab/src/source/do_notation.rs'
              conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
              assert conflicts == [path], conflicts
              file = pathlib.Path(path)
              text = file.read_text()
              conflict = '<<<<<<< ours\nmod pattern_binding;\n=======\nmod matching;\n>>>>>>> theirs\n'
              assert text.count(conflict) == 1
              text = text.replace(conflict, 'mod matching;\nmod pattern_binding;\n')
              assert '<<<<<<<' not in text and '>>>>>>>' not in text
              file.write_text(text)
              subprocess.run(['git', 'add', '--', path], check=True)
          assert not subprocess.check_output(['git', 'ls-files', '-u']).strip()
          assert sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()) == sorted(paths)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          output = {}
          for path, (_, expected) in manifest.items():
              data = pathlib.Path(path).read_bytes()
              assert blob(data) == expected, path
              uploaded = request('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert uploaded['sha'] == expected, path
              output[path] = expected
              retain('source', path, data)
          retained = {}
          for path in [
              'crates/fln-elab/src/source/do_notation/pattern_binding.rs',
              'crates/fln-parse/tests/source_do_patterns.rs',
              'crates/fln/tests/source_do_patterns.rs',
          ]:
              file = pathlib.Path(path)
              assert not file.is_symlink()
              data = file.read_bytes()
              retained[path] = blob(data)
              retain('concurrent', path, data)
          receipt = {
              'base': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'before': {path: before for path, (before, _) in manifest.items()},
              'blobs': output, 'concurrent': retained,
              'patch_sha256': hashlib.sha256(patch).hexdigest(),
              'published_branch': False,
              'validation': 'Exact known merged identities; caller separately runs native checks and publishes the functional commit.',
          }
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2))
          (root / 'merged.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--full-index', '--binary']))
          print(json.dumps(receipt, indent=2), flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-branch-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/match-branch-transfer
          retention-days: 2
          if-no-files-found: error
