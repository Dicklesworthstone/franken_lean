name: Kernel constructor membership
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fln-kernel-membership.yml'
      - 'crates/fln-kernel/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fln-kernel-membership
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Retain the exact source closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/source-closure
          git rev-parse HEAD > target/source-closure/commit.txt
          git archive --format=tar.gz -o target/source-closure/source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-source-${{ github.sha }}
          path: target/source-closure
          retention-days: 1
      - name: Verify committed kernel and independent checker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/membership-evidence
          git rev-parse HEAD > target/membership-evidence/input-commit.txt
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/membership-evidence/compiler.txt
          cargo test --locked -p fln-kernel --lib membership_tests -- --nocapture 2>&1 | tee target/membership-evidence/membership.log
          cargo test --locked -p fln-kernel --all-targets --no-fail-fast 2>&1 | tee target/membership-evidence/kernel.log
          cargo test --locked -p fln-checker --test admit --no-fail-fast 2>&1 | tee target/membership-evidence/checker.log
          cargo clippy --locked -p fln-kernel --all-targets -- -D warnings 2>&1 | tee target/membership-evidence/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/membership-evidence/workspace.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kernel-membership-${{ github.sha }}
          path: target/membership-evidence
          retention-days: 7
