name: Native term graph integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-term-graph-integrity.yml'
      - 'crates/fln-core/**'
      - 'crates/fln-kernel/**'
      - 'crates/fln-env/**'
      - 'crates/fln-bignum/**'
      - 'crates/fln-hash/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-term-graph-integrity
  cancel-in-progress: false

jobs:
  graph-and-kernel-regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
      - name: Check core formatting
        run: cargo fmt --check -p fln-core
      - name: Test core graphs and pinned observables
        run: cargo test --locked -p fln-core --no-fail-fast
      - name: Test public kernel acceptance and universe elimination
        run: |
          cargo test --locked -p fln-kernel --lib \
            --test k1_judgments \
            --test large_elimination_imax \
            --test admission_laundering \
            --test definition_body_stripping \
            --test budget_parity \
            --no-fail-fast
      - name: Check core lints
        run: cargo clippy --locked -p fln-core --all-targets -- -D warnings
      - name: Verify validation did not modify tracked files
        run: git diff --exit-code
