name: fln LSP JSON-RPC state recovery landing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fln-lsp-jsonrpc-state-recovery.yml
  workflow_run:
    workflows:
      - fln LSP position-negotiation landing
      - fln LSP position-negotiation checks
    types: [completed]

permissions:
  contents: write

concurrency:
  group: fln-lsp-jsonrpc-state-recovery
  cancel-in-progress: false

jobs:
  land:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: require versioned callbacks and negotiated positions
        shell: bash
        run: |
          grep -Fq 'FnMut(&str, Option<i64>, &str)' crates/fln-server/src/dispatch.rs
          grep -Fq 'initialize_position_encoding_offer' crates/fln-server/src/dispatch.rs

      - name: enforce JSON-RPC envelopes and lifecycle states
        shell: bash
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          path = Path("crates/fln-server/src/dispatch.rs")
          text = path.read_text(encoding="utf-8")
          marker = "requests_before_initialize_fail_with_server_not_initialized_and_recover"

          def replace_once(old: str, new: str) -> None:
              global text
              observed = text.count(old)
              if observed != 1:
                  raise SystemExit(f"expected one dispatch anchor, observed {observed}: {old[:180]!r}")
              text = text.replace(old, new, 1)

          if marker not in text:
              if "const INVALID_REQUEST_CODE" not in text:
                  if "const INVALID_PARAMS_CODE" in text:
                      replace_once(
                          "const INVALID_PARAMS_CODE: i32 = -32602;\n",
                          "const INVALID_REQUEST_CODE: i32 = -32600;\nconst INVALID_PARAMS_CODE: i32 = -32602;\nconst METHOD_NOT_FOUND_CODE: i32 = -32601;\nconst SERVER_NOT_INITIALIZED_CODE: i32 = -32002;\n",
                      )
                  else:
                      replace_once(
                          "const REQUEST_FAILED_CODE: i32 = -32803;\n",
                          "const INVALID_REQUEST_CODE: i32 = -32600;\nconst METHOD_NOT_FOUND_CODE: i32 = -32601;\nconst SERVER_NOT_INITIALIZED_CODE: i32 = -32002;\nconst REQUEST_FAILED_CODE: i32 = -32803;\n",
                      )
              else:
                  for declaration in [
                      "const METHOD_NOT_FOUND_CODE: i32 = -32601;\n",
                      "const SERVER_NOT_INITIALIZED_CODE: i32 = -32002;\n",
                  ]:
                      if declaration not in text:
                          replace_once(
                              "const INVALID_REQUEST_CODE: i32 = -32600;\n",
                              "const INVALID_REQUEST_CODE: i32 = -32600;\n" + declaration,
                          )

              replace_once(
                  "fn extract_top_level_string_field(json: &str, key: &str) -> Option<String> {\n"
                  "    match object_field(json, key) {\n"
                  "        Field::Value(value) => decode_json_string_value(value),\n"
                  "        Field::Missing | Field::Invalid => None,\n"
                  "    }\n"
                  "}\n",
                  "fn extract_top_level_string_field(json: &str, key: &str) -> DecodedField {\n"
                  "    match object_field(json, key) {\n"
                  "        Field::Missing => DecodedField::Missing,\n"
                  "        Field::Invalid => DecodedField::Invalid,\n"
                  "        Field::Value(value) => decode_json_string_value(value)\n"
                  "            .map(DecodedField::Valid)\n"
                  "            .unwrap_or(DecodedField::Invalid),\n"
                  "    }\n"
                  "}\n",
              )
              replace_once(
                  "fn null_response(id: &RequestId) -> String {\n",
                  "fn invalid_request_response(id: Option<&RequestId>, message: &str) -> String {\n"
                  "    id.map_or_else(\n"
                  "        || error_response_null_id(INVALID_REQUEST_CODE, message),\n"
                  "        |id| error_response(id, INVALID_REQUEST_CODE, message),\n"
                  "    )\n"
                  "}\n\n"
                  "fn null_response(id: &RequestId) -> String {\n",
              )

              old_serve = '''        let method = extract_top_level_string_field(&text, "method");
              let id = match extract_request_id(&text) {
                  RequestIdField::Absent => None,
                  RequestIdField::Valid(id) => Some(id),
                  RequestIdField::Invalid => {
                      let response = error_response_null_id(-32600, "invalid JSON-RPC request id");
                      transport::write_message(output, response.as_bytes())?;
                      continue;
                  }
              };

              match (method.as_deref(), id.as_ref(), state) {
          '''
              old_serve = "\n".join(line[14:] if line.startswith("              ") else line for line in old_serve.splitlines()) + "\n"
              new_serve = '''        let jsonrpc = extract_top_level_string_field(&text, "jsonrpc");
              let method = extract_top_level_string_field(&text, "method");
              let id_field = extract_request_id(&text);
              let response_id = match &id_field {
                  RequestIdField::Valid(id) => Some(id),
                  RequestIdField::Absent | RequestIdField::Invalid => None,
              };

              if !matches!(&jsonrpc, DecodedField::Valid(version) if version == "2.0") {
                  let response = invalid_request_response(
                      response_id,
                      "JSON-RPC envelope must contain exactly jsonrpc=2.0",
                  );
                  transport::write_message(output, response.as_bytes())?;
                  continue;
              }
              let method = match method {
                  DecodedField::Valid(method) => method,
                  DecodedField::Missing | DecodedField::Invalid => {
                      let response = invalid_request_response(
                          response_id,
                          "JSON-RPC request must contain a valid string method",
                      );
                      transport::write_message(output, response.as_bytes())?;
                      continue;
                  }
              };
              let id = match id_field {
                  RequestIdField::Absent => None,
                  RequestIdField::Valid(id) => Some(id),
                  RequestIdField::Invalid => {
                      let response = error_response_null_id(
                          INVALID_REQUEST_CODE,
                          "invalid JSON-RPC request id",
                      );
                      transport::write_message(output, response.as_bytes())?;
                      continue;
                  }
              };

              if matches!(state, ServerState::Uninitialized | ServerState::Initializing)
                  && !matches!(method.as_str(), "initialize" | "initialized" | "exit")
              {
                  if let Some(req_id) = id.as_ref() {
                      transport::write_message(
                          output,
                          error_response(
                              req_id,
                              SERVER_NOT_INITIALIZED_CODE,
                              "server not initialized",
                          )
                          .as_bytes(),
                      )?;
                  }
                  continue;
              }
              if state == ServerState::ShuttingDown && method != "exit" {
                  if let Some(req_id) = id.as_ref() {
                      transport::write_message(
                          output,
                          error_response(
                              req_id,
                              INVALID_REQUEST_CODE,
                              "server has shut down",
                          )
                          .as_bytes(),
                      )?;
                  }
                  continue;
              }

              match (Some(method.as_str()), id.as_ref(), state) {
          '''
              new_serve = "\n".join(line[14:] if line.startswith("              ") else line for line in new_serve.splitlines()) + "\n"
              replace_once(old_serve, new_serve)
              text = text.replace(
                  "error_response(req_id, -32600, \"server already initialized\")",
                  "error_response(req_id, INVALID_REQUEST_CODE, \"server already initialized\")",
                  1,
              )
              replace_once(
                  "            (Some(\"shutdown\"), Some(req_id), _) => {\n",
                  "            (Some(\"shutdown\"), Some(req_id), ServerState::Running) => {\n",
              )
              text = text.replace(
                  "error_response(req_id, -32601, \"method not found\")",
                  "error_response(req_id, METHOD_NOT_FOUND_CODE, \"method not found\")",
                  1,
              )
              replace_once(
                  "            extract_top_level_string_field(json, \"method\").as_deref(),\n"
                  "            Some(\"textDocument/hover\")\n",
                  "            extract_top_level_string_field(json, \"method\"),\n"
                  "            DecodedField::Valid(\"textDocument/hover\".to_string())\n",
              )

              test_anchor = '''    #[test]
              fn envelope_fields_ignore_nested_lookalikes() {
          '''
              test_anchor = "\n".join(line[14:] if line.startswith("              ") else line for line in test_anchor.splitlines()) + "\n"
              tests = r'''    #[test]
              fn invalid_or_missing_jsonrpc_version_is_an_invalid_request() {
                  for (message, expected_id) in [
                      (
                          r#"{"id":7,"method":"textDocument/hover","params":{}}"#,
                          "\"id\":7",
                      ),
                      (
                          r#"{"jsonrpc":"1.0","id":"old","method":"textDocument/hover","params":{}}"#,
                          "\"id\":\"old\"",
                      ),
                      (
                          r#"{"jsonrpc":2,"id":8,"method":"textDocument/hover","params":{}}"#,
                          "\"id\":8",
                      ),
                  ] {
                      let (outcome, output) = lifecycle_session(message);
                      assert!(outcome.clean);
                      assert!(output.contains(expected_id));
                      assert!(output.contains("\"code\":-32600"));
                      assert!(output.contains("jsonrpc=2.0"));
                  }
              }

              #[test]
              fn missing_or_non_string_method_is_an_invalid_request() {
                  for message in [
                      r#"{"jsonrpc":"2.0","id":8,"params":{}}"#,
                      r#"{"jsonrpc":"2.0","id":8,"method":7,"params":{}}"#,
                  ] {
                      let (outcome, output) = lifecycle_session(message);
                      assert!(outcome.clean);
                      assert!(output.contains("\"id\":8,\"error\":{\"code\":-32600"));
                      assert!(output.contains("valid string method"));
                      assert!(!output.contains("method not found"));
                  }
              }

              #[test]
              fn requests_before_initialize_fail_with_server_not_initialized_and_recover() {
                  let mut input_buf = Vec::new();
                  send(
                      &mut input_buf,
                      r#"{"jsonrpc":"2.0","id":1,"method":"textDocument/hover","params":{}}"#,
                  );
                  send(
                      &mut input_buf,
                      r#"{"jsonrpc":"2.0","id":2,"method":"shutdown"}"#,
                  );
                  send(
                      &mut input_buf,
                      r#"{"jsonrpc":"2.0","id":3,"method":"initialize","params":{}}"#,
                  );
                  send(
                      &mut input_buf,
                      r#"{"jsonrpc":"2.0","method":"initialized","params":{}}"#,
                  );
                  send(
                      &mut input_buf,
                      r#"{"jsonrpc":"2.0","id":4,"method":"shutdown"}"#,
                  );
                  send(&mut input_buf, r#"{"jsonrpc":"2.0","method":"exit"}"#);

                  let mut reader = BufReader::new(&input_buf[..]);
                  let mut output_buf = Vec::new();
                  let outcome = serve(
                      &mut reader,
                      &mut output_buf,
                      &mut |_uri, _version, _text| Vec::new(),
                  )
                  .expect("protocol session");
                  let output = String::from_utf8(output_buf).expect("UTF-8 protocol output");
                  assert!(outcome.clean);
                  assert_eq!(output.matches("\"code\":-32002").count(), 2);
                  assert!(output.contains("\"id\":3,\"result\""));
                  assert!(output.contains("\"id\":4,\"result\":null"));
              }

              #[test]
              fn requests_after_shutdown_are_invalid_without_reopening_the_server() {
                  let mut input_buf = Vec::new();
                  send(
                      &mut input_buf,
                      r#"{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}"#,
                  );
                  send(
                      &mut input_buf,
                      r#"{"jsonrpc":"2.0","method":"initialized","params":{}}"#,
                  );
                  send(
                      &mut input_buf,
                      r#"{"jsonrpc":"2.0","id":2,"method":"shutdown"}"#,
                  );
                  send(
                      &mut input_buf,
                      r#"{"jsonrpc":"2.0","id":3,"method":"textDocument/hover","params":{}}"#,
                  );
                  send(
                      &mut input_buf,
                      r#"{"jsonrpc":"2.0","id":4,"method":"initialize","params":{}}"#,
                  );
                  send(&mut input_buf, r#"{"jsonrpc":"2.0","method":"exit"}"#);

                  let mut reader = BufReader::new(&input_buf[..]);
                  let mut output_buf = Vec::new();
                  let outcome = serve(
                      &mut reader,
                      &mut output_buf,
                      &mut |_uri, _version, _text| Vec::new(),
                  )
                  .expect("protocol session");
                  let output = String::from_utf8(output_buf).expect("UTF-8 protocol output");
                  assert!(outcome.clean);
                  assert!(output.contains("\"id\":3,\"error\":{\"code\":-32600"));
                  assert!(output.contains("\"id\":4,\"error\":{\"code\":-32600"));
                  assert_eq!(output.matches("server has shut down").count(), 2);
              }

          '''
              tests = "\n".join(line[14:] if line.startswith("              ") else line for line in tests.splitlines())
              if text.count(test_anchor) != 1:
                  raise SystemExit("envelope-field test anchor did not match exactly once")
              text = text.replace(test_anchor, tests + test_anchor, 1)
              path.write_text(text, encoding="utf-8")
          else:
              for expected in [
                  "SERVER_NOT_INITIALIZED_CODE",
                  "JSON-RPC envelope must contain exactly jsonrpc=2.0",
                  "server has shut down",
              ]:
                  if expected not in text:
                      raise SystemExit(f"JSON-RPC state repair is partial: missing {expected}")
          PY

          cat > .github/workflows/fln-lsp-jsonrpc-state-recovery.yml <<'YAML'
          name: fln LSP JSON-RPC state checks

          on:
            push:
              branches: [main]
              paths:
                - crates/fln-server/**
                - .github/workflows/fln-lsp-jsonrpc-state-recovery.yml
            pull_request:
              paths:
                - crates/fln-server/**
                - .github/workflows/fln-lsp-jsonrpc-state-recovery.yml
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: fln-lsp-jsonrpc-state-checks
            cancel-in-progress: true

          jobs:
            check:
              runs-on: ubuntu-24.04
              timeout-minutes: 45
              steps:
                - name: checkout
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                - name: verify JSON-RPC envelope and lifecycle behavior
                  shell: bash
                  run: |
                    cargo fmt --all -- --check
                    git diff --check
                    cargo test -p fln-server --lib
          YAML

          cargo fmt --all
          git diff --check

      - name: test JSON-RPC state behavior
        shell: bash
        run: cargo test -p fln-server --lib

      - name: publish verified JSON-RPC state repair
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "main moved during the verified landing; refusing a non-fast-forward write" >&2
            exit 2
          }
          git config user.name "Jeff Emanuel"
          git config user.email "35050222+Dicklesworthstone@users.noreply.github.com"
          git add .github/workflows/fln-lsp-jsonrpc-state-recovery.yml crates/fln-server/src/dispatch.rs
          if git diff --cached --quiet; then
            echo "JSON-RPC state validation is already complete"
            exit 0
          fi
          git commit -m "fix(server): validate JSON-RPC lifecycle envelopes" \
            -m "Require jsonrpc=2.0 and a string method, distinguish invalid requests from unknown methods, return ServerNotInitialized before the initialize handshake completes, and refuse requests after shutdown. Add recovery and terminal-state regression cells." \
            -m "Bead: franken_lean-v2p"
          git push origin HEAD:main
