name: Projection delta integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-projection-delta-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply the tested scoped patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/projection-delta
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess,pathlib
          encoded=''
          patch=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='0cbcfbe222a8ade4d63181c19fafbd985f29ef0daf5a652e16a850fe2222bd45'
          pathlib.Path('target/projection-delta/change.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - name: Verify actual checker
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          cargo test --locked -p fln-checker --test projection_delta --test defeq --no-fail-fast 2>&1 | tee target/projection-delta/tests.log
          cargo clippy --locked -p fln-checker --test projection_delta -- -D warnings 2>&1 | tee target/projection-delta/clippy.log
          git diff --check
      - name: Publish verified checker files without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FrankenLean implementation'
          git config user.email 'noreply@github.com'
          git add -- crates/fln-checker/src/defeq.rs crates/fln-checker/tests/projection_delta.rs
          git commit -m 'fix(checker): reduce defined structure majors during lazy projection conversion'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/projection-delta/published-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: projection-delta-${{ github.sha }}
          path: target/projection-delta
          retention-days: 7
