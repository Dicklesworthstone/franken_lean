name: Source rewriting implementation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-source-rewriting.yml']
permissions:
  contents: write
concurrency:
  group: fln-source-rewriting-landing
  cancel-in-progress: false
jobs:
  rewriting:
    if: startsWith(github.event.head_commit.message, 'feat(elab): verify and land named hypothesis rewrites')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare configured compiler and exact source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          mkdir -p target/rewrite-landing
          git rev-parse HEAD > target/rewrite-landing/input.txt
          rustc -Vv > target/rewrite-landing/compiler.txt
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/af60165c19682e9b3f098788355796a56d1bf03c > target/rewrite-landing/blob.json
          python3 -I - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          root = pathlib.Path('target/rewrite-landing')
          encoded = base64.b64decode(json.loads((root / 'blob.json').read_text())['content'])
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '813053a1926c8d8382a13e0760a2f242d2b0ba1e3307b7111d722dc5ab945b0f'
          (root / 'implementation.patch').write_bytes(patch)
          PY
          git apply --check --index target/rewrite-landing/implementation.patch
          git apply --index target/rewrite-landing/implementation.patch
          python3 -I - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert paths == {'crates/fln-elab/src/source/tactics.rs', 'crates/fln-elab/src/source/tactics/rewrite.rs', 'crates/fln-elab/src/source/tactics/rewrite/locations.rs', 'crates/fln-parse/src/proofs.rs', 'crates/fln-parse/src/proofs/locations.rs', 'crates/fln/tests/source_rewrite_locations.rs'}, paths
          PY
          git diff --cached --check
          git diff --cached --name-only -z | xargs -0 rustfmt --edition 2024 --config skip_children=true --check
      - name: Test source proofs with real checkers
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-elab -p fln-parse --no-fail-fast 2>&1 | tee target/rewrite-landing/source-tests.log
          cargo test --locked -p fln --lib --test source_equality --test source_rewriting --test source_rewrite_locations --test source_backtracking --test source_automation --test source_instances --no-fail-fast 2>&1 | tee target/rewrite-landing/engine-tests.log
          cargo clippy --locked -p fln-elab -p fln-parse -p fln --all-targets -- -D warnings 2>&1 | tee target/rewrite-landing/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/rewrite-landing/workspace.log
      - name: Commit tested implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git config user.name 'FrankenLean implementation'
          git config user.email 'noreply@github.com'
          git commit -m 'feat(elab): rewrite named hypotheses with checked dependent transports'
          git push origin HEAD:main
          git rev-parse HEAD > target/rewrite-landing/published.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-rewriting-${{ github.sha }}
          path: target/rewrite-landing
          retention-days: 7
