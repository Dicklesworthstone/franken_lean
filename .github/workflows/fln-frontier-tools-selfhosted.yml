name: FrankenLean checker frontier implementation lane

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fln-frontier-tools-selfhosted.yml

permissions:
  contents: write

concurrency:
  group: fln-checker-frontier-isolated-v8
  cancel-in-progress: false

jobs:
  verify-and-land:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the repository object store
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-13 --profile minimal --component rustfmt --component clippy

      - name: Fetch and verify the exact Lean 4.32.0 release artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean-4.32.0-linux.tar.zst"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$archive" \
            https://github.com/leanprover/lean4/releases/download/v4.32.0/lean-4.32.0-linux.tar.zst
          printf '%s  %s\n' \
            fca846f3588724a38ad19ee40292c67cb7438d7555903372e3308eef795ba516 \
            "$archive" | sha256sum --check --strict
          tar --zstd --extract --file "$archive" --directory "$RUNNER_TEMP"
          lean_bin="$RUNNER_TEMP/lean-4.32.0-linux/bin/lean"
          test -x "$lean_bin"
          test "$("$lean_bin" --githash)" = 8c9756b28d64dab099da31a4c09229a9e6a2ef35
          pin="$(find "$RUNNER_TEMP/lean-4.32.0-linux" -type f -path '*/Init/Prelude.olean' -print -quit)"
          test -n "$pin"
          printf '%s\n' "$pin" > "$RUNNER_TEMP/pinned-prelude-path"

      - name: Apply, verify, and atomically publish two checker fixes
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/fln-frontier-target"
          git -C "$root" config user.name 'GPT-5.6 Pro'
          git -C "$root" config user.email 'noreply@openai.com'

          verify_only_checker_paths() {
            local status unexpected
            status="$(git status --porcelain=v1 --untracked-files=all)"
            printf '%s\n' "$status" | tee "$RUNNER_TEMP/status-${attempt}-${phase}.txt"
            unexpected="$(printf '%s\n' "$status" | grep -Ev '^.. crates/fln-checker/(src/admit.rs|tests/admit.rs)$' || true)"
            if test -n "$unexpected"; then
              printf 'unexpected workspace changes during %s:\n%s\n' "$phase" "$unexpected" >&2
              return 1
            fi
          }

          apply_structural_nonanswer_fix() {
            python3 -I - <<'PY'
          from pathlib import Path

          source = Path("crates/fln-checker/src/admit.rs")
          text = source.read_text(encoding="utf-8")
          start = text.index("fn admit_class_block(")
          end = text.index("fn admit_indexed_class_block(", start)
          section = text[start:end]
          replacements = [
              (
                  '''        match compare_inductive_expression(
                      constructor_type,
                      &expected_constructor,
                      comparison,
                      cancelled,
                  ) {
                      Ok(true) => {}
                      Ok(false) | Err(_) => return defer("constructor-compare"),
                  }
          ''',
                  '''        match compare_inductive_expression(
                      constructor_type,
                      &expected_constructor,
                      comparison,
                      cancelled,
                  ) {
                      Ok(true) => {}
                      Ok(false) => return defer("constructor-compare"),
                      Err(verdict) => return verdict,
                  }
          ''',
                  "constructor comparison",
              ),
              (
                  '''    match compare_inductive_expression(recursor_type, &expected_recursor, comparison, cancelled) {
                  Ok(true) => {}
                  Ok(false) | Err(_) => return defer("recursor-compare"),
              }
          ''',
                  '''    match compare_inductive_expression(recursor_type, &expected_recursor, comparison, cancelled) {
                  Ok(true) => {}
                  Ok(false) => return defer("recursor-compare"),
                  Err(verdict) => return verdict,
              }
          ''',
                  "recursor comparison",
              ),
          ]
          for old, new, label in replacements:
              old_count = section.count(old)
              new_count = section.count(new)
              if old_count == 1 and new_count == 0:
                  section = section.replace(old, new)
              elif old_count == 0 and new_count == 1:
                  pass
              else:
                  raise SystemExit(f"{label} anchors old={old_count} new={new_count}")
          source.write_text(text[:start] + section + text[end:], encoding="utf-8")

          tests = Path("crates/fln-checker/tests/admit.rs")
          test_text = tests.read_text(encoding="utf-8")
          test_name = "fn kr600_803_class_block_preserves_structural_resource_stops()"
          if test_name not in test_text:
              anchor = '''#[test]
          fn kr600_803_class_block_reconstructs_two_constructors_with_unequal_fields() {
              let verdict = admit_inductive(
                  &ConstantEnvironment::empty(),
                  &class_choice_entries(),
                  AdmissionBudget::unlimited(),
                  EnvironmentBudget::unlimited(),
              );
              assert!(
                  verdict.is_admitted(),
                  "two-constructor block admits: {verdict:?}"
              );
              let fln_checker::admit::InductiveVerdict::Admitted(admission) = verdict else {
                  return;
              };
              // Inductive + both constructors + recursor, in declaration order.
              assert_eq!(admission.members().len(), 4);
          }

          '''
              regression = anchor + '''#[test]
          fn kr600_803_class_block_preserves_structural_resource_stops() {
              let budget = AdmissionBudget::new(
                  InferenceBudget::unlimited(),
                  WhnfBudget::unlimited(),
                  DefEqBudget {
                      quick: QuickDefEqBudget::new(0, u64::MAX),
                      ..DefEqBudget::unlimited()
                  },
              );
              let verdict = admit_inductive(
                  &ConstantEnvironment::empty(),
                  &class_choice_entries(),
                  budget,
                  EnvironmentBudget::unlimited(),
              );
              assert!(
                  matches!(
                      verdict,
                      fln_checker::admit::InductiveVerdict::Inconclusive(
                          fln_checker::admit::InductiveStop::Structural(
                              QuickDefEqStop::Resource {
                                  limit: QuickDefEqLimit::Comparisons,
                                  allowed: 0,
                                  observed: 1,
                                  completed_comparisons: 0,
                              }
                          )
                      )
                  ),
                  "a structural resource stop must remain inconclusive: {verdict:?}"
              );
          }

          '''
              if test_text.count(anchor) != 1:
                  raise SystemExit(f"positive class fixture anchor count was {test_text.count(anchor)}")
              test_text = test_text.replace(anchor, regression)
          elif test_text.count(test_name) != 1:
              raise SystemExit(f"structural regression count was {test_text.count(test_name)}")
          tests.write_text(test_text, encoding="utf-8")
          PY
          }

          apply_option_iota_fix() {
            python3 -I - <<'PY'
          from pathlib import Path

          source = Path("crates/fln-checker/src/admit.rs")
          text = source.read_text(encoding="utf-8")
          start = text.index("fn option_rule_rhs(")
          end = text.index("fn empty_recursor_type(", start)
          section = text[start:end]
          old = '''        let value = builder.bvar(0);
                  result = builder.apply(result, value);
                  let parameter = builder.bvar(2);
                  result = builder.lambda("value", BinderStyle::Default, parameter, result);
          '''
          new = '''        let value = builder.bvar(0);
                  result = builder.apply(result, value);
                  // Inside the value binder's DOMAIN the surrounding telescope is
                  // `α, motive, none, some`; the family parameter is therefore
                  // Bound(3). Bound(2) names the motive and creates a closed but
                  // ill-typed iota rule that synthetic closure checks cannot detect.
                  let parameter = builder.bvar(3);
                  result = builder.lambda("value", BinderStyle::Default, parameter, result);
          '''
          old_count = section.count(old)
          new_count = section.count(new)
          if old_count == 1 and new_count == 0:
              section = section.replace(old, new)
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(f"Option.some rule anchors old={old_count} new={new_count}")
          source.write_text(text[:start] + section + text[end:], encoding="utf-8")

          tests = Path("crates/fln-checker/tests/admit.rs")
          test_text = tests.read_text(encoding="utf-8")
          import_old = '''use fln_checker::wire::{
              DecodeBudget, DecodeOutcome, WireExpr, WireName, decode_expr, decode_name,
          };
          '''
          import_new = '''use fln_checker::wire::{
              DecodeBudget, DecodeOutcome, ExprNode, WireExpr, WireName, decode_expr, decode_name,
          };
          '''
          if import_old in test_text and import_new not in test_text:
              if test_text.count(import_old) != 1:
                  raise SystemExit(f"wire import anchor count was {test_text.count(import_old)}")
              test_text = test_text.replace(import_old, import_new)
          elif test_text.count(import_new) != 1:
              raise SystemExit("wire import is neither the expected old nor new form")

          fixture_start = test_text.index("fn init_option_entries()")
          fixture_end = test_text.index("fn init_list_entries()", fixture_start)
          fixture = test_text[fixture_start:fixture_end]
          fixture_old = '''                    Expr::lam(
                                  primary_name("value"),
                                  bv(2),
                                  Expr::app(bv(1), bv(0)),
                                  BinderInfo::Default,
                              ),
          '''
          fixture_new = '''                    Expr::lam(
                                  primary_name("value"),
                                  bv(3),
                                  Expr::app(bv(1), bv(0)),
                                  BinderInfo::Default,
                              ),
          '''
          old_count = fixture.count(fixture_old)
          new_count = fixture.count(fixture_new)
          if old_count == 1 and new_count == 0:
              fixture = fixture.replace(fixture_old, fixture_new)
              test_text = test_text[:fixture_start] + fixture + test_text[fixture_end:]
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(f"independent Option fixture anchors old={old_count} new={new_count}")

          test_name = "fn kr600_803_init_option_some_iota_value_domain_is_the_outer_parameter()"
          if test_name not in test_text:
              anchor = '''#[test]
          fn kr600_803_init_option_fixture_pins_iota_rhs_closure() {
              let entries = init_option_entries();
              let metadata = entries[3]
                  .declaration()
                  .recursor_metadata()
                  .expect("fixture recursor metadata");
              for rule in metadata.rules() {
                  let facts = match inspect(rule.rhs(), TermBudget::unlimited()) {
                      TermOutcome::Complete(facts) => facts,
                      other => panic!("fixture iota inspection must complete: {other:?}"),
                  };
                  assert_eq!(facts.external_bound_span, 0);
              }
          }

          '''
              regression = anchor + '''#[test]
          fn kr600_803_init_option_some_iota_value_domain_is_the_outer_parameter() {
              let entries = init_option_entries();
              let rhs = entries[3]
                  .declaration()
                  .recursor_metadata()
                  .expect("fixture recursor metadata")
                  .rules()[1]
                  .rhs();
              let mut cursor = rhs.root();
              for binder in ["alpha", "motive", "none", "some"] {
                  cursor = match rhs.node(cursor) {
                      Some(ExprNode::Lambda { body, .. }) => *body,
                      other => panic!("missing {binder} lambda in Option.some iota rule: {other:?}"),
                  };
              }
              let Some(ExprNode::Lambda {
                  binder_type, body, ..
              }) = rhs.node(cursor)
              else {
                  panic!("missing value lambda in Option.some iota rule")
              };
              assert!(
                  matches!(rhs.node(*binder_type), Some(ExprNode::Bound { index }) if *index == 3),
                  "the value domain must name the outer alpha parameter, not the motive"
              );
              let Some(ExprNode::Apply { function, argument }) = rhs.node(*body) else {
                  panic!("Option.some iota body must apply the selected minor")
              };
              assert!(
                  matches!(rhs.node(*function), Some(ExprNode::Bound { index }) if *index == 1)
              );
              assert!(
                  matches!(rhs.node(*argument), Some(ExprNode::Bound { index }) if *index == 0)
              );
          }

          '''
              if test_text.count(anchor) != 1:
                  raise SystemExit(f"Option closure test anchor count was {test_text.count(anchor)}")
              test_text = test_text.replace(anchor, regression)
          elif test_text.count(test_name) != 1:
              raise SystemExit(f"Option depth regression count was {test_text.count(test_name)}")
          tests.write_text(test_text, encoding="utf-8")
          PY
          }

          verify_frontier() {
            local label="$1" pin status log
            pin="$(cat "$RUNNER_TEMP/pinned-prelude-path")"
            log="$RUNNER_TEMP/frontier-${attempt}-${label}.log"
            cargo build --locked -p fln-cli --bin fln
            set +e
            FLN_CHECKER_TRACE=1 "$CARGO_TARGET_DIR/debug/fln" check-olean "$pin" >"$log" 2>&1
            status=$?
            set -e
            cat "$log"
            python3 -I - "$status" "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          text = Path(sys.argv[2]).read_text(encoding="utf-8", errors="replace")
          if status == 0:
              print("checker_frontier=complete")
              raise SystemExit(0)
          matches = [int(value) for value in re.findall(r"declaration batch item ([0-9]+)", text)]
          if not matches:
              raise SystemExit("nonzero checker run did not report a declaration frontier")
          frontier = matches[-1]
          print(f"checker_frontier={frontier}")
          if frontier <= 42:
              raise SystemExit(f"real pinned frontier did not advance beyond Option: {frontier}")
          PY
          }

          for attempt in 1 2 3 4 5; do
            git -C "$root" fetch origin main master
            base="$(git -C "$root" rev-parse refs/remotes/origin/main)"
            mirror="$(git -C "$root" rev-parse refs/remotes/origin/master)"
            if test "$base" != "$mirror"; then
              printf 'public refs diverged before attempt %s: main=%s mirror=%s\n' "$attempt" "$base" "$mirror" >&2
              exit 1
            fi
            attempt_dir="$RUNNER_TEMP/fln-frontier-attempt-$attempt"
            git -C "$root" worktree add --detach "$attempt_dir" "$base"
            cd "$attempt_dir"
            printf '%s\n' "$base" > "$RUNNER_TEMP/base-${attempt}.txt"

            apply_structural_nonanswer_fix
            rustfmt --edition 2024 crates/fln-checker/src/admit.rs crates/fln-checker/tests/admit.rs
            phase=structural-patch
            verify_only_checker_paths
            git diff --check -- crates/fln-checker/src/admit.rs crates/fln-checker/tests/admit.rs
            cargo fmt --package fln-checker -- --check
            cargo test --locked -p fln-checker --test admit kr600_803_class_block_preserves_structural_resource_stops -- --exact
            cargo test --locked -p fln-checker --test admit --no-fail-fast
            cargo test --locked -p fln-checker --all-targets --no-fail-fast
            cargo clippy --locked -p fln-checker --all-targets -- -D warnings
            phase=structural-verified
            verify_only_checker_paths
            if ! git diff --quiet -- crates/fln-checker/src/admit.rs crates/fln-checker/tests/admit.rs; then
              git add crates/fln-checker/src/admit.rs crates/fln-checker/tests/admit.rs
              git commit -m 'fix(checker): preserve structural nonanswers in class admission' \
                -m 'Propagate comparison resource stops, cancellation, and structural faults through their typed verdict arms instead of collapsing them into ResultUniverse deferrals. Add a two-constructor regression that proves a zero comparison budget remains Inconclusive with the exact QuickDefEq resource stop.'
            fi
            test -z "$(git status --porcelain=v1 --untracked-files=all)"

            apply_option_iota_fix
            rustfmt --edition 2024 crates/fln-checker/src/admit.rs crates/fln-checker/tests/admit.rs
            phase=option-patch
            verify_only_checker_paths
            git diff --check -- crates/fln-checker/src/admit.rs crates/fln-checker/tests/admit.rs
            cargo fmt --package fln-checker -- --check
            cargo test --locked -p fln-checker --test admit kr600_803_init_option_ -- --nocapture
            cargo test --locked -p fln-checker --test admit --no-fail-fast
            cargo test --locked -p fln-checker --all-targets --no-fail-fast
            cargo clippy --locked -p fln-checker --all-targets -- -D warnings
            phase=option-verified
            verify_only_checker_paths
            verify_frontier option
            if ! git diff --quiet -- crates/fln-checker/src/admit.rs crates/fln-checker/tests/admit.rs; then
              git add crates/fln-checker/src/admit.rs crates/fln-checker/tests/admit.rs
              git commit -m 'fix(checker): bind Option.some iota value to alpha' \
                -m 'The pinned Option.some computation rule types its value binder with Bound(3), the outer family parameter. The checker and its synthetic fixture used Bound(2), which names the motive and is closed but ill-typed. Correct both independent constructions and add an exact telescope-depth regression.'
            fi
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            candidate="$(git rev-parse HEAD)"
            printf '%s\n' "$candidate" > "$RUNNER_TEMP/candidate-${attempt}.txt"

            git -C "$root" fetch origin main master
            latest_main="$(git -C "$root" rev-parse refs/remotes/origin/main)"
            latest_mirror="$(git -C "$root" rev-parse refs/remotes/origin/master)"
            if test "$latest_main" != "$base" || test "$latest_mirror" != "$base"; then
              printf 'attempt %s lost its lease: base=%s main=%s mirror=%s\n' \
                "$attempt" "$base" "$latest_main" "$latest_mirror" | tee "$RUNNER_TEMP/lease-${attempt}.txt"
              cd "$root"
              continue
            fi
            if test "$candidate" = "$base"; then
              printf 'both checker fixes are already public at %s\n' "$base"
              exit 0
            fi
            if git push --atomic origin \
              "$candidate:refs/heads/main" \
              "$candidate:refs/heads/master"; then
              printf 'published=%s\n' "$candidate" | tee "$RUNNER_TEMP/published.txt"
              exit 0
            fi
            cd "$root"
          done
          exit 1

      - name: Archive isolated landing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checker-frontier-isolated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/base-*.txt
            ${{ runner.temp }}/candidate-*.txt
            ${{ runner.temp }}/frontier-*.log
            ${{ runner.temp }}/lease-*.txt
            ${{ runner.temp }}/published.txt
            ${{ runner.temp }}/status-*.txt
            ${{ runner.temp }}/pinned-prelude-path
          if-no-files-found: warn
          retention-days: 14
