name: FrankenLean frontier tools self-hosted verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fln-frontier-tools-selfhosted.yml

permissions:
  contents: write

concurrency:
  group: fln-frontier-tools-verification
  cancel-in-progress: false

jobs:
  verify-and-land:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize the anchor recorder regression cells
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/structure-guard/src/bin/fln-agent-anchor.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "trim_end_matches(['\\r', '\\n'])",
              "trim_end_matches(&['\\r', '\\n'][..])",
          )
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if 'u0007' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one JSON oracle line, found {matches}')
          lines[matches[0]] = r'            r#""a\n\"β\\\u0007""#'
          text = '\n'.join(lines) + '\n'
          text = text.replace('let anchors = vec![Anchor {', 'let anchors = [Anchor {')
          text = text.replace('            dirty: true,\n        }];', '            dirty: true,\n        }];')
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check

      - name: Verify both permanent binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --manifest-path tools/structure-guard/Cargo.toml --bin fln-agent-anchor
          cargo clippy --manifest-path tools/structure-guard/Cargo.toml --bin fln-agent-anchor -- -D warnings
          cargo test --manifest-path crates/fln-olean/Cargo.toml --bin fln-olean-chain-audit
          cargo clippy --manifest-path crates/fln-olean/Cargo.toml --bin fln-olean-chain-audit -- -D warnings

      - name: Commit verified repairs and retire one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- tools/structure-guard/src/bin/fln-agent-anchor.rs crates/fln-olean/src/bin/fln-olean-chain-audit.rs; then
            git add tools/structure-guard/src/bin/fln-agent-anchor.rs crates/fln-olean/src/bin/fln-olean-chain-audit.rs
            git commit -m 'fix(agent): verify frontier diagnostic binaries'
          fi
          rm -f .github/workflows/fln-agent-anchor-verified-fix.yml
          rm -f .github/workflows/fln-frontier-tools-selfhosted.yml
          git add .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m 'chore(agent): retire frontier-tool landing scaffolding'
          fi
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          exit 1
