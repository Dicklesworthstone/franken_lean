name: FrankenLean checker frontier implementation lane

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fln-frontier-tools-selfhosted.yml

permissions:
  contents: write

concurrency:
  group: fln-checker-option-some-iota-repair
  cancel-in-progress: false

jobs:
  verify-and-land:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the live mainline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-13 --profile minimal --component rustfmt --component clippy

      - name: Bind Option.some iota value to the outer family parameter
        shell: bash
        env:
          EXPECTED_ADMIT_BLOB: 95101a7647ba5fe3ba91e46fe127e3091b81765f
          EXPECTED_TEST_BLOB: aeafa1da7fa66a8332ac7291c1c1f0f68f9bd6f2
        run: |
          set -euo pipefail
          test "$(git hash-object crates/fln-checker/src/admit.rs)" = "$EXPECTED_ADMIT_BLOB"
          test "$(git hash-object crates/fln-checker/tests/admit.rs)" = "$EXPECTED_TEST_BLOB"
          python3 -I - <<'PY'
          from pathlib import Path

          source = Path("crates/fln-checker/src/admit.rs")
          text = source.read_text(encoding="utf-8")
          start = text.index("fn option_rule_rhs(")
          end = text.index("fn empty_recursor_type(", start)
          section = text[start:end]
          old = '''        let value = builder.bvar(0);
                  result = builder.apply(result, value);
                  let parameter = builder.bvar(2);
                  result = builder.lambda("value", BinderStyle::Default, parameter, result);
          '''
          new = '''        let value = builder.bvar(0);
                  result = builder.apply(result, value);
                  // Inside the value binder's DOMAIN the surrounding telescope is
                  // `α, motive, none, some`; the family parameter is therefore
                  // Bound(3). Bound(2) names the motive and creates a closed but
                  // ill-typed iota rule that synthetic closure checks cannot detect.
                  let parameter = builder.bvar(3);
                  result = builder.lambda("value", BinderStyle::Default, parameter, result);
          '''
          if section.count(old) != 1:
              raise SystemExit(f"Option.some rule anchor count was {section.count(old)}")
          source.write_text(text[:start] + section.replace(old, new) + text[end:], encoding="utf-8")

          tests = Path("crates/fln-checker/tests/admit.rs")
          test_text = tests.read_text(encoding="utf-8")
          import_old = '''use fln_checker::wire::{
              DecodeBudget, DecodeOutcome, WireExpr, WireName, decode_expr, decode_name,
          };
          '''
          import_new = '''use fln_checker::wire::{
              DecodeBudget, DecodeOutcome, ExprNode, WireExpr, WireName, decode_expr, decode_name,
          };
          '''
          if test_text.count(import_old) != 1:
              raise SystemExit("wire import anchor moved")
          test_text = test_text.replace(import_old, import_new)

          fixture_start = test_text.index("fn init_option_entries()")
          fixture_end = test_text.index("fn init_list_entries()", fixture_start)
          fixture = test_text[fixture_start:fixture_end]
          fixture_old = '''                    Expr::lam(
                                  primary_name("value"),
                                  bv(2),
                                  Expr::app(bv(1), bv(0)),
                                  BinderInfo::Default,
                              ),
          '''
          fixture_new = '''                    Expr::lam(
                                  primary_name("value"),
                                  bv(3),
                                  Expr::app(bv(1), bv(0)),
                                  BinderInfo::Default,
                              ),
          '''
          if fixture.count(fixture_old) != 1:
              raise SystemExit(f"independent Option fixture anchor count was {fixture.count(fixture_old)}")
          test_text = test_text[:fixture_start] + fixture.replace(fixture_old, fixture_new) + test_text[fixture_end:]

          anchor = '''#[test]
          fn kr600_803_init_option_fixture_pins_iota_rhs_closure() {
              let entries = init_option_entries();
              let metadata = entries[3]
                  .declaration()
                  .recursor_metadata()
                  .expect("fixture recursor metadata");
              for rule in metadata.rules() {
                  let facts = match inspect(rule.rhs(), TermBudget::unlimited()) {
                      TermOutcome::Complete(facts) => facts,
                      other => panic!("fixture iota inspection must complete: {other:?}"),
                  };
                  assert_eq!(facts.external_bound_span, 0);
              }
          }

          '''
          regression = anchor + '''#[test]
          fn kr600_803_init_option_some_iota_value_domain_is_the_outer_parameter() {
              let entries = init_option_entries();
              let rhs = entries[3]
                  .declaration()
                  .recursor_metadata()
                  .expect("fixture recursor metadata")
                  .rules()[1]
                  .rhs();
              let mut cursor = rhs.root();
              for binder in ["alpha", "motive", "none", "some"] {
                  cursor = match rhs.node(cursor) {
                      Some(ExprNode::Lambda { body, .. }) => *body,
                      other => panic!("missing {binder} lambda in Option.some iota rule: {other:?}"),
                  };
              }
              let Some(ExprNode::Lambda {
                  binder_type, body, ..
              }) = rhs.node(cursor)
              else {
                  panic!("missing value lambda in Option.some iota rule")
              };
              assert!(
                  matches!(rhs.node(*binder_type), Some(ExprNode::Bound { index }) if *index == 3),
                  "the value domain must name the outer alpha parameter, not the motive"
              );
              let Some(ExprNode::Apply { function, argument }) = rhs.node(*body) else {
                  panic!("Option.some iota body must apply the selected minor")
              };
              assert!(
                  matches!(rhs.node(*function), Some(ExprNode::Bound { index }) if *index == 1)
              );
              assert!(
                  matches!(rhs.node(*argument), Some(ExprNode::Bound { index }) if *index == 0)
              );
          }

          '''
          if test_text.count(anchor) != 1:
              raise SystemExit(f"Option closure test anchor count was {test_text.count(anchor)}")
          tests.write_text(test_text.replace(anchor, regression), encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check -- crates/fln-checker/src/admit.rs crates/fln-checker/tests/admit.rs

      - name: Verify focused and complete checker targets
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked -p fln-checker --test admit kr600_803_init_option_ -- --nocapture
          cargo test --locked -p fln-checker --test admit --no-fail-fast
          cargo test --locked -p fln-checker --all-targets --no-fail-fast
          cargo clippy --locked -p fln-checker --all-targets -- -D warnings

      - name: Fetch and verify the exact Lean 4.32.0 release artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean-4.32.0-linux.tar.zst"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$archive" \
            https://github.com/leanprover/lean4/releases/download/v4.32.0/lean-4.32.0-linux.tar.zst
          printf '%s  %s\n' \
            fca846f3588724a38ad19ee40292c67cb7438d7555903372e3308eef795ba516 \
            "$archive" | sha256sum --check --strict
          tar --zstd --extract --file "$archive" --directory "$RUNNER_TEMP"
          lean_bin="$RUNNER_TEMP/lean-4.32.0-linux/bin/lean"
          test -x "$lean_bin"
          test "$("$lean_bin" --githash)" = 8c9756b28d64dab099da31a4c09229a9e6a2ef35
          pin="$(find "$RUNNER_TEMP/lean-4.32.0-linux" -type f -path '*/Init/Prelude.olean' -print -quit)"
          test -n "$pin"
          printf '%s\n' "$pin" > "$RUNNER_TEMP/pinned-prelude-path"

      - name: Require the real pinned frontier to advance beyond Option
        shell: bash
        run: |
          set -euo pipefail
          pin="$(cat "$RUNNER_TEMP/pinned-prelude-path")"
          cargo build --locked -p fln-cli --bin fln
          set +e
          FLN_CHECKER_TRACE=1 target/debug/fln check-olean "$pin" >"$RUNNER_TEMP/option-frontier.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/option-frontier.log"
          python3 -I - "$status" "$RUNNER_TEMP/option-frontier.log" <<'PY'
          import re
          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          text = Path(sys.argv[2]).read_text(encoding="utf-8", errors="replace")
          if status == 0:
              print("checker_frontier=complete")
              raise SystemExit(0)
          matches = [int(value) for value in re.findall(r"declaration batch item ([0-9]+)", text)]
          if not matches:
              raise SystemExit("nonzero checker run did not report a declaration frontier")
          frontier = matches[-1]
          print(f"checker_frontier={frontier}")
          if frontier <= 42:
              raise SystemExit(f"real pinned frontier did not advance beyond Option: {frontier}")
          PY

      - name: Commit directly to main and mirror master atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6 Pro'
          git config user.email 'noreply@openai.com'
          git add crates/fln-checker/src/admit.rs crates/fln-checker/tests/admit.rs
          git commit -m 'fix(checker): bind Option.some iota value to alpha' \
            -m 'The pinned Option.some computation rule types its value binder with Bound(3), the outer family parameter. The checker and its synthetic fixture used Bound(2), which names the motive and is closed but ill-typed. Correct both independent constructions and add an exact telescope-depth regression.'
          for attempt in 1 2 3 4 5; do
            git fetch origin main master
            if git rebase origin/main; then
              cargo fmt --all --check
              cargo test --locked -p fln-checker --test admit --no-fail-fast
              cargo test --locked -p fln-checker --all-targets --no-fail-fast
              cargo clippy --locked -p fln-checker --all-targets -- -D warnings
              pin="$(cat "$RUNNER_TEMP/pinned-prelude-path")"
              set +e
              target/debug/fln check-olean "$pin" >"$RUNNER_TEMP/option-frontier-rebased.log" 2>&1
              status=$?
              set -e
              cat "$RUNNER_TEMP/option-frontier-rebased.log"
              python3 -I - "$status" "$RUNNER_TEMP/option-frontier-rebased.log" <<'PY'
          import re
          import sys
          from pathlib import Path
          status = int(sys.argv[1])
          text = Path(sys.argv[2]).read_text(encoding="utf-8", errors="replace")
          if status != 0:
              matches = [int(value) for value in re.findall(r"declaration batch item ([0-9]+)", text)]
              if not matches or matches[-1] <= 42:
                  raise SystemExit("rebased real pinned frontier did not remain beyond Option")
          PY
              if git push --atomic origin HEAD:refs/heads/main HEAD:refs/heads/master; then
                exit 0
              fi
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Archive the real pinned frontier
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: option-frontier-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/option-frontier.log
            ${{ runner.temp }}/option-frontier-rebased.log
            ${{ runner.temp }}/pinned-prelude-path
          if-no-files-found: warn
          retention-days: 14
