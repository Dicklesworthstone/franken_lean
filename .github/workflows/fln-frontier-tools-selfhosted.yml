name: FrankenLean checker frontier implementation lane

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fln-frontier-tools-selfhosted.yml

permissions:
  contents: read

concurrency:
  group: fln-checker-frontier-hosted-option-differential
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the live mainline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-13 --profile minimal --component rustfmt --component clippy

      - name: Instrument an Option route differential without changing its verdict
        shell: bash
        env:
          EXPECTED_ADMIT_BLOB: 95101a7647ba5fe3ba91e46fe127e3091b81765f
        run: |
          set -euo pipefail
          test "$(git hash-object crates/fln-checker/src/admit.rs)" = "$EXPECTED_ADMIT_BLOB"
          python3 -I - <<'PY'
          from pathlib import Path

          path = Path("crates/fln-checker/src/admit.rs")
          text = path.read_text(encoding="utf-8")
          old = '''    if name == &checker_atom("Option")
                  && declaration.level_parameters().len() == 1
                  && metadata.num_parameters() == 1
              {
                  return admit_init_option(
                      environment,
                      declarations,
                      inductive,
                      budget,
                      environment_budget,
                      &mut comparison,
                      &mut cancelled,
                  );
              }
          '''
          new = '''    if name == &checker_atom("Option")
                  && declaration.level_parameters().len() == 1
                  && metadata.num_parameters() == 1
              {
                  let legacy = admit_init_option(
                      environment,
                      declarations,
                      inductive,
                      budget,
                      environment_budget,
                      &mut comparison,
                      &mut cancelled,
                  );
                  if std::env::var_os("FLN_CHECKER_TRACE").is_some() {
                      let mut generic_comparison =
                          StructuralComparisonControl::new(budget.conversion.quick);
                      let generic = admit_class_block(
                          environment,
                          declarations,
                          inductive,
                          budget,
                          environment_budget,
                          &mut generic_comparison,
                          &mut cancelled,
                      );
                      eprintln!(
                          "fln-checker: Option route differential: legacy={legacy:?}; generic={generic:?}"
                      );
                  }
                  return legacy;
              }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one Option dispatch block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check -- crates/fln-checker/src/admit.rs

      - name: Verify the instrumented checker
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked -p fln-checker --all-targets --no-fail-fast
          cargo clippy --locked -p fln-checker --all-targets -- -D warnings

      - name: Fetch and verify the exact Lean 4.32.0 release artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean-4.32.0-linux.tar.zst"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$archive" \
            https://github.com/leanprover/lean4/releases/download/v4.32.0/lean-4.32.0-linux.tar.zst
          printf '%s  %s\n' \
            fca846f3588724a38ad19ee40292c67cb7438d7555903372e3308eef795ba516 \
            "$archive" | sha256sum --check --strict
          tar --zstd --extract --file "$archive" --directory "$RUNNER_TEMP"
          lean_bin="$RUNNER_TEMP/lean-4.32.0-linux/bin/lean"
          test -x "$lean_bin"
          test "$("$lean_bin" --githash)" = 8c9756b28d64dab099da31a4c09229a9e6a2ef35
          pin="$(find "$RUNNER_TEMP/lean-4.32.0-linux" -type f -path '*/Init/Prelude.olean' -print -quit)"
          test -n "$pin"
          printf '%s\n' "$pin" > "$RUNNER_TEMP/pinned-prelude-path"

      - name: Capture the real pinned Option route differential
        shell: bash
        run: |
          set -euo pipefail
          pin="$(cat "$RUNNER_TEMP/pinned-prelude-path")"
          cargo build --locked -p fln-cli --bin fln
          set +e
          FLN_CHECKER_TRACE=1 target/debug/fln check-olean "$pin" >"$RUNNER_TEMP/option-route-differential.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/option-route-differential.status"
          cat "$RUNNER_TEMP/option-route-differential.log"
          test "$status" -ne 0
          grep -F 'fln-checker: Option route differential:' "$RUNNER_TEMP/option-route-differential.log"
          grep -F 'Option' "$RUNNER_TEMP/option-route-differential.log"

      - name: Archive the real-artifact differential
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: option-route-differential-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/option-route-differential.log
            ${{ runner.temp }}/option-route-differential.status
            ${{ runner.temp }}/pinned-prelude-path
          if-no-files-found: error
          retention-days: 14
