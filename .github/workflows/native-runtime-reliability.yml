name: Native runtime reliability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-runtime-reliability.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'fix(runtime): publish checked stack and contract fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '1'
      CARGO_PROFILE_DEV_INCREMENTAL: 'true'
      CARGO_PROFILE_DEV_DEBUG: '2'
      CARGO_PROFILE_TEST_DEBUG: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Validate and publish the two exact runtime increments
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runtime-reliability'
          root.mkdir()
          encoded = ''''''
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '8eae4fa1f9593083ffaeb12e508db7070290535b6e50e45844c3cddc1195fa16'
          items = json.loads(raw)
          (root / 'prepared.json').write_bytes(raw)
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          def run(args, label):
              print('RUN ' + ' '.join(args), flush=True)
              with (root / (label + '.log')).open('w') as log:
                  p = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in p.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  code = p.wait()
              (root / (label + '.exit')).write_text(str(code) + '\n')
              if code:
                  raise subprocess.CalledProcessError(code, args)
          for item in items:
              for attempt in range(3):
                  tag = str(item['stage']) + '-' + str(attempt)
                  assert not output('git', 'status', '--porcelain'), 'dirty checkout'
                  run(['git', 'fetch', 'origin', 'main'], tag + '-fetch')
                  run(['git', 'switch', '--detach', 'origin/main'], tag + '-snapshot')
                  parent = output('git', 'rev-parse', 'HEAD')
                  for f in item['files']:
                      assert output('git', 'rev-parse', 'HEAD:' + f['path']) == f['base_blob'], 'overlapping change: ' + f['path']
                  patch = root / (tag + '.patch')
                  patch.write_text(item['patch'])
                  run(['git', 'apply', '--check', str(patch)], tag + '-apply-check')
                  run(['git', 'apply', str(patch)], tag + '-apply')
                  for f in item['files']:
                      b = pathlib.Path(f['path']).read_bytes()
                      assert output('git', 'hash-object', f['path']) == f['git_blob'], f['path']
                      assert hashlib.sha256(b).hexdigest() == f['sha256'], f['path']
                  run(['rustup', 'show', 'active-toolchain'], tag + '-toolchain')
                  run(['cargo', 'test', '--locked', '-p', 'fln-elab', '--no-fail-fast'], tag + '-elab')
                  run(['cargo', 'test', '--locked', '-p', 'fln', '--lib', '--', 'nested_lexical_contexts_prepare_mutual_groups_on_a_small_host_stack'], tag + '-small-stack')
                  run(['cargo', 'test', '--locked', '-p', 'fln', '--lib', '--', 'runtime::decisions::tests'], tag + '-decisions')
                  if item['stage'] == 2:
                      run(['cargo', 'test', '--locked', '-p', 'fln', '--test', 'runtime_conditionals', '--test', 'runtime_logic_decisions', '--test', 'runtime_nat_decisions', '--test', 'source_equality_decisions', '--test', 'source_generic_decisions', '--test', 'source_option_decisions', '--no-fail-fast'], tag + '-runtime')
                      run(['cargo', 'test', '--locked', '-p', 'fln-cli', '--test', 'source_equality_decisions'], tag + '-cli')
                  run(['cargo', 'clippy', '--locked', '-p', 'fln-elab', '-p', 'fln', '-p', 'fln-cli', '--all-targets', '--', '-D', 'warnings'], tag + '-clippy')
                  run(['cargo', 'check', '--locked', '--workspace', '--all-targets'], tag + '-workspace')
                  run(['rustfmt', '--edition', '2024', '--config', 'skip_children=true', '--check', *[f['path'] for f in item['files']]], tag + '-format')
                  run(['git', 'diff', '--check'], tag + '-whitespace')
                  for f in item['files']:
                      assert output('git', 'hash-object', f['path']) == f['git_blob'], 'validation changed source'
                  paths = [f['path'] for f in item['files']]
                  assert sorted(output('git', 'diff', '--name-only').splitlines()) == sorted(paths)
                  run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-o', *paths, '-m', item['message'] + '\n\nRepublished from the exact prepared increment ' + item['local_commit'] + '. Fresh pinned full-debug validation: complete elaborator, small-stack and decision tests, scoped Clippy and workspace compilation passed; stage 2 also checks runtime integrations and installed equality execution. Full workspace tests and Reference parity are not claimed.'], tag + '-commit')
                  sha = output('git', 'rev-parse', 'HEAD')
                  result = subprocess.run(['git', 'push', 'origin', 'HEAD:main'], capture_output=True, text=True)
                  (root / (tag + '-push.log')).write_text(result.stdout + result.stderr)
                  print(result.stdout + result.stderr, flush=True)
                  if result.returncode:
                      if 'fetch first' in result.stderr or 'non-fast-forward' in result.stderr:
                          continue
                      raise subprocess.CalledProcessError(result.returncode, result.args)
                  (root / (str(item['stage']) + '-published.json')).write_text(json.dumps({'commit':sha, 'parent':parent, 'files':item['files'], 'force':False, 'published':True}, indent=2))
                  print('PUBLISHED ' + sha, flush=True)
                  break
              else:
                  raise RuntimeError('main advanced on all attempts; no history overwritten')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-reliability-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-reliability
          retention-days: 7
          if-no-files-found: error
