# Windows is a functional W1 lane, not part of the certified reproducibility
# matrix.  It exercises the exact locked Rust toolchain against the real Windows
# filesystem/process surface; bit-identical artifact certification remains a
# separate declared decision (plan D17 and §18.3).
name: windows-functional

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-functional

jobs:
  functional:
    name: windows-x86-64 functional workspace and conformance smoke
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout FrankenLean
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: initialize the Windows functional evidence bundle
        run: |
          evidence_dir="$RUNNER_TEMP/fln-windows-functional-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "$evidence_dir" || -L "$evidence_dir" ]]; then
            echo "Windows evidence directory already exists: $evidence_dir" >&2
            exit 2
          fi
          mkdir -p "$evidence_dir"
          python3 -I - "$evidence_dir/attempt-start.json" <<'PY'
          import json
          import os
          import sys

          record = {
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "schema": "fln.windows-functional-evidence/1",
              "status": "started",
          }
          with open(sys.argv[1], "x", encoding="utf-8") as handle:
              json.dump(record, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
              handle.flush()
              os.fsync(handle.fileno())
          PY
          echo "FLN_WINDOWS_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"

      - name: install the SUITE.lock-pinned Rust toolchain
        run: |
          channel="$(python3 -I - <<'PY'
          import re
          from pathlib import Path

          rows = []
          for raw in Path("SUITE.lock").read_text(encoding="utf-8").splitlines():
              line = raw.split("#", 1)[0].strip()
              if line.startswith("rust-nightly "):
                  rows.append(line.split())
          if len(rows) != 1 or len(rows[0]) != 2:
              raise SystemExit("SUITE.lock must contain exactly one rust-nightly row")
          channel = rows[0][1]
          if re.fullmatch(r"nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}", channel) is None:
              raise SystemExit(f"SUITE.lock rust-nightly is not an exact dated pin: {channel!r}")
          print(channel)
          PY
          )"
          expected="$(python3 -I - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("rust-toolchain.toml").read_text(encoding="utf-8"))["toolchain"]["channel"])
          PY
          )"
          test "$channel" = "$expected"
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt --component clippy
          rustup override set "$channel"
          rustc --version --verbose | tee "$FLN_WINDOWS_EVIDENCE_DIR/rustc-version.txt"
          cargo --version | tee "$FLN_WINDOWS_EVIDENCE_DIR/cargo-version.txt"

      - name: build every supported workspace target
        run: cargo check --locked --workspace --all-targets

      - name: run the functional unit and conformance workspace lanes
        run: cargo test --locked --workspace --no-fail-fast

      - name: assert Windows-native fault capability rows
        run: |
          cargo test --locked -p fln-conformance --test fault_boundary_registry \
            every_capability_has_a_platform_row_chosen_at_compile_time \
            -- --exact --nocapture

      - name: record the functional-not-certified boundary
        run: |
          echo "windows-x86-64 functional lane: passed build and conformance smoke"
          echo "bit-certification is deliberately not attempted by this workflow"

      - name: finalize Windows functional evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 -I - "$FLN_WINDOWS_EVIDENCE_DIR/attempt-final.json" <<'PY'
          import json
          import os
          import platform
          import sys

          record = {
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "job_status": os.environ["JOB_STATUS"],
              "platform": platform.platform(),
              "schema": "fln.windows-functional-evidence/1",
              "status": "finalized",
          }
          with open(sys.argv[1], "x", encoding="utf-8") as handle:
              json.dump(record, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
              handle.flush()
              os.fsync(handle.fileno())
          PY

      - name: archive Windows functional evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-functional-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FLN_WINDOWS_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
