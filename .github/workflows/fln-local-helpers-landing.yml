name: Land native record execution

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-local-helpers-landing.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact locally tested record implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import pathlib, hashlib, base64, zlib, subprocess
          before = {'crates/fln/src/lib.rs':'4332913ea4787e9c362756267f7210065aa72832','crates/fln/src/runtime.rs':'4f1093fdeb2af74e0e7c858d257a814a7a456f40','crates/fln/src/runtime/records.rs':None,'crates/fln/tests/runtime_records.rs':None}
          after = {'crates/fln/src/lib.rs':'07e42957627196b2750c339360a57dc6fc137b0c','crates/fln/src/runtime.rs':'bed3119fa4c1b3b554eaa64dfc218130e131582c','crates/fln/src/runtime/records.rs':'9401fe055d3dd93ab972cf7af7bfa3f1c3ab7ff3','crates/fln/tests/runtime_records.rs':'08cfddc7aaa326b8959b5d3616bedf880a6b1fa0'}
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def verify(expected):
              for name, sha in expected.items():
                  path = pathlib.Path(name)
                  assert (not path.exists()) if sha is None else blob(path.read_bytes()) == sha, name
          verify(before)
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '39f32838b089f82092373321713db55604cf9e99fc8fdd3564c0e0bd89caba05'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          verify(after)
          out=pathlib.Path('target/record-runtime'); out.mkdir(parents=True,exist_ok=True)
          (out/'integration.patch').write_bytes(patch)
          PY
      - name: Install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/record-runtime/compiler.txt
      - name: Verify native records and existing execution paths
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln --lib --test runtime_records --test runtime_conditionals --test runtime_nat_recursion --test runtime_local_functions --no-fail-fast 2>&1 | tee target/record-runtime/tests.log
          cargo clippy --locked -p fln --all-targets -- -D warnings 2>&1 | tee target/record-runtime/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/record-runtime/workspace-check.log
          rustfmt --edition 2024 --check --config skip_children=true crates/fln/src/lib.rs crates/fln/src/runtime.rs crates/fln/src/runtime/records.rs crates/fln/tests/runtime_records.rs
          git diff --check
      - name: Publish tested implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln/src/lib.rs crates/fln/src/runtime.rs crates/fln/src/runtime/records.rs crates/fln/tests/runtime_records.rs
          git commit -m 'feat(runtime): execute checked records with nested fields and captured closures'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/record-runtime/published-commit.txt
      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: record-runtime-${{ github.sha }}
          path: target/record-runtime
          retention-days: 7
          if-no-files-found: warn
