name: Land local closure execution

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-local-helpers-landing.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply exact native closure implementation and installed tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/local-helpers
          git rev-parse HEAD > target/local-helpers/input-commit.txt
          python3 -I <<'PY'
          import pathlib, subprocess, hashlib, zlib, base64
          before = {
              'crates/fln-cli/tests/source_local_helpers.rs': None,
              'crates/fln/src/runtime.rs': '887b6b7acd38593761d67a137e3575a821471ac0',
              'crates/fln/tests/runtime_local_functions.rs': None,
              'examples/native_local_helpers.lean': None,
          }
          after = {
              'crates/fln-cli/tests/source_local_helpers.rs': '0924071f2b0b509408d8a4342df7e0c26060ce03',
              'crates/fln/src/runtime.rs': '7a2f2e8034588d848d80e0906e5b67dcb8fec18a',
              'crates/fln/tests/runtime_local_functions.rs': '69c3499ee4bdc55a2acbdf2a0c15ac7f1251d013',
              'examples/native_local_helpers.lean': '234a890b85654ce1c9f5aef595a249caa5cc23f3',
          }
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def verify(expected):
              for name, sha in expected.items():
                  path = pathlib.Path(name)
                  if sha is None:
                      assert not path.exists(), name
                  else:
                      assert blob(path.read_bytes()) == sha, name
          verify(before)
          encoded = ''''''
          encoded = encoded.replace('CULspQQn', 'CULspQn')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '13f3be58806c4a9cb459f96605b2fac0fd3f919cf33c3fca451874079efe9469'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          verify(after)
          pathlib.Path('target/local-helpers/integration.patch').write_bytes(patch)
          PY
      - name: Install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/local-helpers/compiler.txt
      - name: Test captured closures and installed bytecode replay
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln --test source_local_functions --test runtime_local_functions --test runtime_conditionals 2>&1 | tee target/local-helpers/runtime-tests.log
          cargo test --locked -p fln-cli --test source_local_helpers --test source_term_binders 2>&1 | tee target/local-helpers/installed-tests.log
          cargo clippy --locked -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/local-helpers/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/local-helpers/workspace-check.log
          rustfmt --edition 2024 --check --config skip_children=true crates/fln/src/runtime.rs crates/fln/tests/runtime_local_functions.rs crates/fln-cli/tests/source_local_helpers.rs
          git diff --check
      - name: Publish tested functionality directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln/src/runtime.rs crates/fln/tests/runtime_local_functions.rs crates/fln-cli/tests/source_local_helpers.rs examples/native_local_helpers.lean
          git commit -m 'feat(runtime): execute captured local helpers and replay through the installed CLI'
          git push origin HEAD:main
          git rev-parse HEAD > target/local-helpers/published-commit.txt
          git archive --format=tar.gz HEAD > target/local-helpers/published-source.tar.gz
      - name: Retain exact source and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-helpers-${{ github.sha }}
          path: target/local-helpers
          retention-days: 7
          if-no-files-found: error
