name: Land native Nat recursion

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-local-helpers-landing.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply exact native Nat recursor implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/local-helpers
          git rev-parse HEAD > target/local-helpers/input-commit.txt
          python3 -I <<'PY'
          import pathlib, subprocess, hashlib, zlib, base64
          before = {
              'crates/fln/src/runtime.rs': '7a2f2e8034588d848d80e0906e5b67dcb8fec18a',
              'crates/fln/src/runtime/nat.rs': None,
              'crates/fln/tests/runtime_nat_recursion.rs': None,
              'crates/fln-cli/tests/source_nat_runtime.rs': None,
              'examples/native_nat_recursion.lean': None,
          }
          after = {
              'crates/fln/src/runtime.rs': '4f1093fdeb2af74e0e7c858d257a814a7a456f40',
              'crates/fln/src/runtime/nat.rs': '6efe94b74f2b3c9f4c11447fb1f87dc52893f8e7',
              'crates/fln/tests/runtime_nat_recursion.rs': '779d78322b92750fc6af92e6114174e039b1ac8c',
              'crates/fln-cli/tests/source_nat_runtime.rs': 'd08c281b4efe75bc7aca4d411f8ac714cf5ec616',
              'examples/native_nat_recursion.lean': 'fc6fec8bd0e89c4a14b51a836062c05e6a1529e3',
          }
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def verify(expected):
              for name, sha in expected.items():
                  path = pathlib.Path(name)
                  if sha is None:
                      assert not path.exists(), name
                  else:
                      assert blob(path.read_bytes()) == sha, name
          verify(before)
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '41a1fd73c3e03110ddd0a056f47ba4a16568a5ce99d63c2bd10b488fb91f6f65'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          verify(after)
          pathlib.Path('target/local-helpers/integration.patch').write_bytes(patch)
          PY
      - name: Install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/local-helpers/compiler.txt
      - name: Verify native recursion source admission and installed replay
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln --lib 2>&1 | tee target/local-helpers/library-tests.log
          cargo test --locked -p fln --test runtime_nat_recursion --test runtime_local_functions --test runtime_conditionals --test source_recursion --test source_local_functions --test source_term_binders 2>&1 | tee target/local-helpers/runtime-tests.log
          cargo test --locked -p fln-cli --test source_nat_runtime --test source_local_helpers --test source_term_binders 2>&1 | tee target/local-helpers/installed-tests.log
          cargo clippy --locked -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/local-helpers/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/local-helpers/workspace-check.log
          rustfmt --edition 2024 --check --config skip_children=true crates/fln/src/runtime.rs crates/fln/src/runtime/nat.rs crates/fln/tests/runtime_nat_recursion.rs crates/fln-cli/tests/source_nat_runtime.rs
          git diff --check
      - name: Publish tested native functionality directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln/src/runtime.rs crates/fln/src/runtime/nat.rs crates/fln/tests/runtime_nat_recursion.rs crates/fln-cli/tests/source_nat_runtime.rs examples/native_nat_recursion.lean
          git commit -m 'feat(runtime): execute Nat recursion with shared results and changing accumulators'
          git push origin HEAD:main
          git rev-parse HEAD > target/local-helpers/published-commit.txt
          git archive --format=tar.gz HEAD > target/local-helpers/published-source.tar.gz
      - name: Retain exact source and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-helpers-${{ github.sha }}
          path: target/local-helpers
          retention-days: 7
          if-no-files-found: error
