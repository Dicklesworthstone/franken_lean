name: Land record elimination and recursion

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-local-helpers-landing.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact tested record computation implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import pathlib, hashlib, base64, zlib, subprocess
          before = {'crates/fln/src/runtime.rs':'bed3119fa4c1b3b554eaa64dfc218130e131582c','crates/fln/src/runtime/nat.rs':'6efe94b74f2b3c9f4c11447fb1f87dc52893f8e7','crates/fln/src/runtime/records.rs':'9401fe055d3dd93ab972cf7af7bfa3f1c3ab7ff3','crates/fln/tests/runtime_records.rs':'08cfddc7aaa326b8959b5d3616bedf880a6b1fa0'}
          after = {'crates/fln/src/runtime.rs':'cb42f107e6324448047040fda0c7faaf5dc10f7a','crates/fln/src/runtime/nat.rs':'b6af3c59d846c76ad44d7e30fcba132ab2e2736e','crates/fln/src/runtime/records.rs':'894f54db522a143ace4d83aab2078a92575b8d06','crates/fln/tests/runtime_records.rs':'d28cbf80cbd09a027697f4aafc786bb1b4c7cefb'}
          def verify(expected):
              for name, sha in expected.items():
                  data=pathlib.Path(name).read_bytes()
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha, name
          verify(before)
          encoded=''''''
          patch=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='2830dbd63ffcc10474b613a7adf92cf42ad60f7d4e7ebb1597167f6ade66469d'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          verify(after)
          out=pathlib.Path('target/record-runtime');out.mkdir(parents=True,exist_ok=True)
          (out/'integration.patch').write_bytes(patch)
          PY
      - name: Install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/record-runtime/compiler.txt
      - name: Verify record matching and native recursive data
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln --lib --test runtime_records --test runtime_conditionals --test runtime_nat_recursion --test runtime_local_functions --no-fail-fast 2>&1 | tee target/record-runtime/tests.log
          cargo clippy --locked -p fln --all-targets -- -D warnings 2>&1 | tee target/record-runtime/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/record-runtime/workspace-check.log
          rustfmt --edition 2024 --check --config skip_children=true crates/fln/src/runtime.rs crates/fln/src/runtime/nat.rs crates/fln/src/runtime/records.rs crates/fln/tests/runtime_records.rs
          git diff --check
      - name: Publish tested implementation directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln/src/runtime.rs crates/fln/src/runtime/nat.rs crates/fln/src/runtime/records.rs crates/fln/tests/runtime_records.rs
          git commit -m 'feat(runtime): lower record matches and recursive structured accumulators'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/record-runtime/published-commit.txt
      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: record-runtime-${{ github.sha }}
          path: target/record-runtime
          retention-days: 7
          if-no-files-found: warn
