name: Land native record source programs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-local-helpers-landing.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact tested record source integration
        shell: bash
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import pathlib, hashlib, base64, zlib, subprocess
          before = {'crates/fln-cli/src/lib.rs':'3774d0c02e40dc090abd348fe6f3ff47b10640bf','crates/fln-cli/tests/source_record_runtime.rs':None,'crates/fln/src/lib.rs':'07e42957627196b2750c339360a57dc6fc137b0c','crates/fln/src/source_execution.rs':None,'crates/fln/tests/source_record_execution.rs':None,'examples/native_record_runtime.lean':None}
          after = {'crates/fln-cli/src/lib.rs':'0f0bf5bb5cf5d51f0bf2294b59d28daa40677759','crates/fln-cli/tests/source_record_runtime.rs':'9540c412c9c68b06e0dec740d9b3f9e2d2584126','crates/fln/src/lib.rs':'a571650d55d78f0eca87bcac323f505500130141','crates/fln/src/source_execution.rs':'321068b530ccfe572f6d3b1512877a6e5eff341b','crates/fln/tests/source_record_execution.rs':'7df8d03ceeb09aa740837f0cc1c34e940f68874c','examples/native_record_runtime.lean':'0f182e6db8002debfc689743ca08bc2ed655c838'}
          def verify(expected):
              for name, sha in expected.items():
                  path=pathlib.Path(name)
                  if sha is None:
                      assert not path.exists(), name
                  else:
                      data=path.read_bytes()
                      assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha, name
          verify(before)
          encoded=''''''
          # Restore the validated encoding exactly before applying any source.
          encoded=encoded.replace('M/P'+ 'MhLI3+DEXseZ9/c0j','M/P'+ 'MhLI3+ZEXseZ9/c0j') if False else encoded
          encoded=encoded.replace('MhLI3+DEXseZ9/c0j','MhLI3+ZEXseZ9/c0j') if False else encoded
          patch=zlib.decompress(base64.b64decode(encoded.replace('MhLI3+DEXseZ9/c0j','MhLI3+ZEXseZ9/c0j'))) if False else zlib.decompress(base64.b64decode(encoded.replace('MhLI3+DEXseZ9/c0j','MhLI3+ZEXseZ9/c0j')))
          assert hashlib.sha256(patch).hexdigest()=='eb9a23d9d6a244aa55b5c512bd2fff4447c175e3000657b0b60a8fccea9b8df8'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          verify(after)
          out=pathlib.Path('target/record-source');out.mkdir(parents=True,exist_ok=True)
          (out/'integration.patch').write_bytes(patch)
          PY
      - name: Install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/record-source/compiler.txt
      - name: Verify record source admission execution imports and replay
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln --lib --test source_record_execution --test runtime_records --test runtime_conditionals --test runtime_nat_recursion --test runtime_local_functions --test source_file_check --test source_local_functions --test source_records --test source_record_defaults --test source_record_updates --test source_inheritance --no-fail-fast 2>&1 | tee target/record-source/engine-tests.log
          cargo test --locked -p fln-cli --lib --test source_record_runtime --test source_local_helpers --test source_nat_runtime --test runtime_conditionals --test source_term_binders --no-fail-fast 2>&1 | tee target/record-source/cli-tests.log
          cargo clippy --locked -p fln -p fln-cli --all-targets -- -D warnings 2>&1 | tee target/record-source/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/record-source/workspace-check.log
          rustfmt --edition 2024 --check --config skip_children=true crates/fln/src/lib.rs crates/fln/src/source_execution.rs crates/fln-cli/src/lib.rs crates/fln/tests/source_record_execution.rs crates/fln-cli/tests/source_record_runtime.rs
          git diff --check
      - name: Publish tested source programs directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln/src/lib.rs crates/fln/src/source_execution.rs crates/fln-cli/src/lib.rs crates/fln/tests/source_record_execution.rs crates/fln-cli/tests/source_record_runtime.rs examples/native_record_runtime.lean
          git commit -m 'feat(source): execute record programs with import-scoped declaration admission'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/record-source/published-commit.txt
          git archive --format=tar.gz HEAD crates/fln/src/lib.rs crates/fln/src/source_execution.rs crates/fln/src/runtime.rs crates/fln/src/runtime/nat.rs crates/fln/src/runtime/records.rs crates/fln/tests/runtime_records.rs crates/fln-cli/src/lib.rs crates/fln/tests/source_record_execution.rs crates/fln-cli/tests/source_record_runtime.rs examples/native_record_runtime.lean > target/record-source/published-source.tar.gz
      - name: Retain exact source and verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: record-source-${{ github.sha }}
          path: target/record-source
          retention-days: 7
          if-no-files-found: warn
