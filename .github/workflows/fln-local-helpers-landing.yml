name: Land dependent local helpers

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-local-helpers-landing.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply the exact reconciled local-helper implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/local-helpers
          git archive --format=tar.gz HEAD > target/local-helpers/input-source.tar.gz
          git rev-parse HEAD > target/local-helpers/input-commit.txt
          python3 -I <<'PY'
          import pathlib, subprocess, hashlib, zlib, base64
          before = {
              'crates/fln-elab/src/source.rs': '4c76dc9cf1d1f0efbbf9096a8e0b531a9eb72fef',
              'crates/fln-elab/src/source/local_functions.rs': None,
              'crates/fln-parse/src/lib.rs': 'f76ce6b0b0b3e5b2ec27385a3e63924894ea8063',
              'crates/fln-parse/src/matching.rs': '83964c0610da962706457492839c4e2153a1ae58',
              'crates/fln/tests/source_local_functions.rs': None,
          }
          after = {
              'crates/fln-elab/src/source.rs': 'bc0fa8701bb0769511504c49973a4bed9edd8201',
              'crates/fln-elab/src/source/local_functions.rs': '6ef77b51a8704d8d583ad17105dc4f6079ffadd5',
              'crates/fln-parse/src/lib.rs': '89d86ec69bb26d62ac200846cdcda560c43e9faf',
              'crates/fln-parse/src/matching.rs': '145df866c15c1c4fce793ab107d69b41e6085647',
              'crates/fln/tests/source_local_functions.rs': '4f1d0db2ce203744f3223a03b8347e5f147e08cd',
          }
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def verify(expected):
              for name, sha in expected.items():
                  path = pathlib.Path(name)
                  if sha is None:
                      assert not path.exists(), name
                  else:
                      assert blob(path.read_bytes()) == sha, name
          verify(before)
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '08e652117e66df33688f0916c15dac0072c29545b8c4e9719f26078dad98432c'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          verify(after)
          pathlib.Path('target/local-helpers/integration.patch').write_bytes(patch)
          PY
      - name: Install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/local-helpers/compiler.txt
      - name: Check native parser elaborator and both declaration checkers
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-parse -p fln-elab --no-fail-fast 2>&1 | tee target/local-helpers/packages.log
          cargo test --locked -p fln --test source_local_functions --test source_term_binders --test source_backtracking --test source_file_check 2>&1 | tee target/local-helpers/source-check.log
          cargo clippy --locked -p fln-parse -p fln-elab --all-targets -- -D warnings 2>&1 | tee target/local-helpers/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/local-helpers/workspace-check.log
          rustfmt --edition 2024 --check --config skip_children=true crates/fln-elab/src/source.rs crates/fln-elab/src/source/local_functions.rs crates/fln-parse/src/lib.rs crates/fln-parse/src/matching.rs crates/fln/tests/source_local_functions.rs
          git diff --check
      - name: Publish tested source directly to main
        shell: bash
        run: |
          set -euo pipefail
          tested_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$tested_parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln-elab/src/source.rs crates/fln-elab/src/source/local_functions.rs crates/fln-parse/src/lib.rs crates/fln-parse/src/matching.rs crates/fln/tests/source_local_functions.rs
          git commit -m 'feat(source): elaborate parameterized local helpers with dependent scopes'
          git push origin HEAD:main
          git rev-parse HEAD > target/local-helpers/published-commit.txt
          git archive --format=tar.gz HEAD > target/local-helpers/published-source.tar.gz
      - name: Retain exact source and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-helpers-${{ github.sha }}
          path: target/local-helpers
          retention-days: 7
          if-no-files-found: error
