name: Native contradiction preparation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fln-contradiction-tactic.yml'
      - 'crates/fln-parse/src/proofs.rs'
      - 'crates/fln-parse/tests/false_or_by_contra.rs'
      - 'crates/fln-elab/src/source/tactics.rs'
      - 'crates/fln-elab/src/source/tactics/**'
      - 'crates/fln/tests/source_false_or_by_contra.rs'
      - 'crates/fln-cli/tests/source_false_or_by_contra.rs'
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check changed source formatting
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc -Vv
          rustfmt --edition 2024 --config skip_children=true --check \
            crates/fln-elab/src/source/tactics.rs \
            crates/fln-elab/src/source/tactics/false_or_by_contra.rs \
            crates/fln-parse/src/proofs.rs \
            crates/fln-parse/tests/false_or_by_contra.rs \
            crates/fln/tests/source_false_or_by_contra.rs \
            crates/fln-cli/tests/source_false_or_by_contra.rs
          git diff --check
      - name: Test canonical syntax and native proof obligations
        run: |
          set -euo pipefail
          cargo test --locked -p fln-parse --test false_or_by_contra -- --nocapture
          cargo test --locked -p fln --test source_false_or_by_contra --test source_goal_identities --test source_core_closing_tactics --test source_classical_tactics -- --nocapture --test-threads=1
          cargo test --locked -p fln-cli --test source_false_or_by_contra -- --nocapture
      - name: Check elaborator and affected targets without relaxing warnings
        run: |
          set -euo pipefail
          cargo clippy --locked -p fln-elab --lib -- -D warnings
          cargo clippy --locked -p fln-parse --test false_or_by_contra -- -D warnings
          cargo clippy --locked -p fln --test source_false_or_by_contra --test source_goal_identities -- -D warnings
          cargo clippy --locked -p fln-cli --test source_false_or_by_contra -- -D warnings
