name: Source frontier reproduction snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fln-source-frontier-snapshot.yml'
      - 'crates/fln/src/runtime.rs'
      - 'crates/fln/src/runtime/**'
      - 'crates/fln-comp/src/fir.rs'
      - 'crates/fln-comp/src/fir/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve exact source without another compiler archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/frontier-snapshot
          git rev-parse HEAD > target/frontier-snapshot/commit.txt
          git archive --format=tar.gz HEAD > target/frontier-snapshot/source.tar.gz
          sha256sum target/frontier-snapshot/source.tar.gz > target/frontier-snapshot/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-frontier-${{ github.sha }}
          path: target/frontier-snapshot
          retention-days: 2
          compression-level: 0
