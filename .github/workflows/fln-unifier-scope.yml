name: Native unifier scope tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fln-unifier-scope.yml'
      - 'crates/fln-elab/src/constraint/**'
      - 'crates/fln-elab/tests/native_unification*.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fln-unifier-scope-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unifier:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Retain exact reproduction source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/unifier-source
          git archive --format=tar.gz HEAD > target/unifier-source/source.tar.gz
          git rev-parse HEAD > target/unifier-source/commit.txt
          sha256sum target/unifier-source/source.tar.gz > target/unifier-source/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unifier-source-${{ github.sha }}
          path: target/unifier-source
          retention-days: 2
          if-no-files-found: error
      - name: Apply exact tested scope increment
        if: startsWith(github.event.head_commit.message, 'feat(elab): publish tested residual-scope assignment orientation')
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          paths = {
            'crates/fln-elab/src/constraint/unify.rs': ('0b1bc1943939ad029f0d71f8325d37f9924d976b', '57c2c2ee893e0e7d2f364adb7e022701c467d443'),
            'crates/fln-elab/src/constraint/unify/residual.rs': ('8858a2f988c094cc58a5b549adac8878901f1732', '5855fee80d23204486638677b2cbc6222a87b7b3'),
            'crates/fln-elab/tests/native_unification_context_pruning.rs': ('f085f8bc24c3e65f39935c76acf49bf27f3384c8', '923a90068e1a52b7ccdb7d1667e6eff0a9076f94'),
          }
          def verify(which):
            for path, identities in paths.items():
              data = pathlib.Path(path).read_bytes()
              actual = hashlib.sha1(('blob %d\0' % len(data)).encode() + data).hexdigest()
              if actual != identities[which]:
                raise SystemExit('Source identity changed: ' + path + ': ' + actual)
          verify(0)
          payload = ''
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          verify(1)
          PY
      - name: Install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component clippy
          rustc -Vv
      - name: Exercise native elaborator
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p target/unifier-checks
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/unifier-checks/tests.log
          tests=${PIPESTATUS[0]}
          cargo clippy --locked -p fln-elab --all-targets -- -D warnings 2>&1 | tee target/unifier-checks/clippy.log
          lint=${PIPESTATUS[0]}
          printf 'tests=%s clippy=%s\n' "$tests" "$lint" | tee target/unifier-checks/result.txt
          test "$tests" -eq 0 && test "$lint" -eq 0
      - name: Publish verified source directly to main
        if: success() && startsWith(github.event.head_commit.message, 'feat(elab): publish tested residual-scope assignment orientation')
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/fln-elab/src/constraint/unify.rs crates/fln-elab/src/constraint/unify/residual.rs crates/fln-elab/tests/native_unification_context_pruning.rs
          git commit -m 'feat(elab): orient assignments by residual scope and depth' -m 'Check latent residual scopes before assignment mutation using the same dependency inventory as final conditional K1 validation. Reverse unsafe outer-to-inner aliases, retain opaque and occurs-check policies, and retry blocked residuals after ordinary constraint progress. Eight new regressions cover dependent contexts, depth, late resolution, kernel refusal, queues and rollback. Full elaborator tests and strict all-target Clippy passed before publication; no full-workspace or Reference-parity claim. Advances fln-pv1 without closing it.'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/unifier-checks/published.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unifier-checks-${{ github.sha }}
          path: target/unifier-checks
          retention-days: 7
          if-no-files-found: warn
