# CI — the quality gate (bead franken_lean-rur).
#
# The test step IS scripts/check.sh (AGENTS.md: never duplicate the gate commands
# inline in workflow files). Stages inside check.sh: fmt, check, clippy, test,
# structure-guard, ubs-when-present. The e2e smoke family runs beside it and all
# NDJSON/console artifacts are archived so failures are diagnosable without rerun.

name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/cargo
  FLN_REQUIRE_UBS: 1
  FLN_UBS_SCOPE: all-tracked

jobs:
  gate:
    name: quality gate (check.sh + e2e smokes)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: initialize isolated evidence attempt
        id: evidence_attempt
        shell: bash
        run: |
          evidence_root="$RUNNER_TEMP/fln-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "$evidence_root" || -L "$evidence_root" ]]; then
            echo "evidence attempt root already exists: $evidence_root" >&2
            exit 2
          fi
          mkdir -p "$evidence_root/check" "$evidence_root/e2e"
          python3 -I - "$evidence_root/attempt-start.json" <<'PY'
          import json
          import os
          import sys

          record = {
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "schema": "fln.ci-evidence-attempt-start/1",
              "status": "started",
          }
          with open(sys.argv[1], "x", encoding="utf-8") as handle:
              json.dump(record, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
              handle.flush()
              os.fsync(handle.fileno())
          PY
          {
            echo "FLN_EVIDENCE_ROOT=$evidence_root"
            echo "FLN_CHECK_ART_ROOT=$evidence_root/check"
            echo "FLN_E2E_ART_ROOT=$evidence_root/e2e"
          } >> "$GITHUB_ENV"

      - name: checkout FrankenLean
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # UBS is Tribunal/engineering apparatus, never a FrankenLean runtime dependency.
      # Fetch one reviewed tree and verify the exact runner bytes before it reaches PATH.
      - name: checkout pinned UBS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dicklesworthstone/ultimate_bug_scanner
          ref: 6a2def31c2396ac227c3949a51bab973b273d2d5
          path: target/ci-tools/ubs
          persist-credentials: false

      - name: verify and provision pinned UBS
        shell: bash
        run: |
          expected_commit="6a2def31c2396ac227c3949a51bab973b273d2d5"
          actual_commit="$(git -C target/ci-tools/ubs rev-parse --verify 'HEAD^{commit}')"
          if [[ "$actual_commit" != "$expected_commit" ]]; then
            echo "UBS checkout mismatch: $actual_commit != $expected_commit" >&2
            exit 2
          fi
          printf 'UBS source commit: %s\n' "$actual_commit"
          python3 -I - <<'PY'
          import hashlib
          from pathlib import Path

          runner = Path("target/ci-tools/ubs/ubs")
          expected = "8bdb113e18417fcd1b4acc86e16dfc5ed4fd9f1a405c873b06fa5030bd12da32"
          if runner.is_symlink() or not runner.is_file():
              raise SystemExit(f"UBS runner is not a regular file: {runner}")
          actual = hashlib.sha256(runner.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"UBS digest mismatch: {actual} != {expected}")
          print(f"UBS runner SHA-256: {actual}")
          PY
          chmod +x target/ci-tools/ubs/ubs
          echo "$GITHUB_WORKSPACE/target/ci-tools/ubs" >> "$GITHUB_PATH"

      # The trusted bootstrap parses SUITE.lock and rust-toolchain.toml to decide which
      # compiler to install, before structure-guard or any other repository check runs.
      # Prove — against a real hostile module, not a comment — that the interpreter it
      # uses cannot be redirected by module shadowing, and that the probe itself is
      # meaningful because the non-isolated interpreter IS redirected. The shadow lives
      # in a scratch directory; the repository tree is never mutated.
      - name: bootstrap interpreter isolation probe
        shell: bash
        run: |
          shadow="$(mktemp -d)"
          cat > "$shadow/tomllib.py" <<'SHADOW'
          def loads(*_args, **_kwargs):
              return {"toolchain": {"channel": "attacker-chosen-toolchain"}}
          SHADOW
          probe=$'import pathlib, sys, sysconfig, tomllib\n'
          probe+=$'stdlib = pathlib.Path(sysconfig.get_paths()["stdlib"]).resolve()\n'
          probe+=$'shadowed = not pathlib.Path(tomllib.__file__).resolve().is_relative_to(stdlib)\n'
          probe+=$'print("shadowed" if shadowed else "stdlib")\n'

          # Vector 1: a module beside the script / in the cwd of a stdin script.
          vulnerable="$(cd "$shadow" && printf '%s' "$probe" | python3 -)"
          isolated="$(cd "$shadow" && printf '%s' "$probe" | python3 -I -)"
          # Vector 2: an ambient PYTHONPATH.
          vulnerable_env="$(PYTHONPATH="$shadow" python3 -c "$probe")"
          isolated_env="$(PYTHONPATH="$shadow" python3 -I -c "$probe")"

          rc=0
          if [[ "$vulnerable" != "shadowed" ]]; then
            echo "probe is not meaningful: cwd shadowing did not take effect" >&2
            rc=2
          fi
          if [[ "$vulnerable_env" != "shadowed" ]]; then
            echo "probe is not meaningful: PYTHONPATH shadowing did not take effect" >&2
            rc=2
          fi
          if [[ "$isolated" != "stdlib" ]]; then
            echo "isolated interpreter was shadowed via the script directory" >&2
            rc=2
          fi
          if [[ "$isolated_env" != "stdlib" ]]; then
            echo "isolated interpreter was shadowed via PYTHONPATH" >&2
            rc=2
          fi
          # Every trusted bootstrap snippet in this workflow must request isolation.
          if grep -nE '^\s*(channel="\$\()?([A-Z_]+="[^"]*" )*python3 - ' .github/workflows/ci.yml; then
            echo "a bootstrap snippet invokes python3 without -I (see matches above)" >&2
            rc=2
          fi
          if [[ $rc -eq 0 ]]; then
            echo "bootstrap interpreter isolation: both shadowing vectors reproduced and both refused"
          fi
          exit "$rc"

      # rust-toolchain.toml pins the exact nightly; rustup honors it automatically.
      - name: install pinned toolchain
        shell: bash
        run: |
          channel="$(python3 -I - <<'PY'
          import pathlib
          import re
          import sys
          import sysconfig
          import tomllib

          # This snippet decides which compiler the whole job installs, and it runs
          # before any repository-controlled check. Python resolves imports from the
          # script's directory (or the cwd, for a stdin script) and from PYTHONPATH, so
          # a checked-in `tomllib.py` or an ambient PYTHONPATH would otherwise choose
          # the toolchain for us. `-I` closes both channels; assert it rather than
          # trusting that a future edit keeps the flag.
          if not sys.flags.isolated:
              raise SystemExit(
                  "bootstrap parser must run under `python3 -I`: without isolation a "
                  "repository-local or PYTHONPATH module can shadow the stdlib parser "
                  "that selects the toolchain"
              )
          stdlib = pathlib.Path(sysconfig.get_paths()["stdlib"]).resolve()
          resolved = pathlib.Path(tomllib.__file__).resolve()
          if not resolved.is_relative_to(stdlib):
              raise SystemExit(f"tomllib resolved outside the stdlib: {resolved}")

          def parse_suite_channel(source):
              rows = []
              for raw in source.splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if not line:
                      continue
                  tokens = line.split()
                  if tokens[0] == "rust-nightly":
                      if len(tokens) != 2:
                          raise ValueError("SUITE.lock has a malformed rust-nightly row")
                      rows.append(tokens[1])
              if len(rows) != 1:
                  raise ValueError(
                      f"SUITE.lock must contain exactly one rust-nightly row; found {len(rows)}"
                  )
              channel = rows[0]
              if re.fullmatch(r"nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}", channel) is None:
                  raise ValueError(
                      f"SUITE.lock rust-nightly is not an exact dated pin: {channel!r}"
                  )
              return channel

          def validate_toolchain(source, expected):
              document = tomllib.loads(source)
              if set(document) != {"toolchain"} or not isinstance(
                  document["toolchain"], dict
              ):
                  raise ValueError(
                      "rust-toolchain.toml must contain only one [toolchain] table"
                  )
              toolchain = document["toolchain"]
              allowed = {"channel", "components", "profile", "targets"}
              unknown = sorted(set(toolchain) - allowed)
              if unknown:
                  raise ValueError(
                      f"rust-toolchain.toml has unsupported keys: {unknown}"
                  )
              actual = toolchain.get("channel")
              if not isinstance(actual, str) or actual != expected:
                  raise ValueError(
                      "rust-toolchain.toml channel "
                      f"{actual!r} != SUITE.lock rust-nightly {expected!r}"
                  )
              for key in ("components", "targets"):
                  value = toolchain.get(key, [])
                  if (
                      not isinstance(value, list)
                      or not all(isinstance(item, str) and item for item in value)
                      or len(value) != len(set(value))
                  ):
                      raise ValueError(
                          f"rust-toolchain.toml {key} must be an array of unique non-empty strings"
                      )
              if "profile" in toolchain and toolchain["profile"] not in {
                  "minimal",
                  "default",
                  "complete",
              }:
                  raise ValueError(
                      "rust-toolchain.toml profile must be minimal|default|complete"
                  )
              return actual

          def expect_reject(label, operation):
              try:
                  operation()
              except (ValueError, tomllib.TOMLDecodeError):
                  return
              raise SystemExit(f"bootstrap negative probe accepted {label}")

          pin = "nightly-2026-07-13"
          expect_reject(
              "duplicate SUITE.lock pin",
              lambda: parse_suite_channel(
                  f"rust-nightly {pin}\nrust-nightly {pin}\n"
              ),
          )
          expect_reject(
              "undated SUITE.lock pin",
              lambda: parse_suite_channel("rust-nightly nightly\n"),
          )
          expect_reject(
              "decoy toolchain section",
              lambda: validate_toolchain(
                  f'[metadata]\nchannel = "{pin}"\n[toolchain]\nchannel = "{pin}"\n',
                  pin,
              ),
          )
          expect_reject(
              "path toolchain",
              lambda: validate_toolchain(
                  f'[toolchain]\nchannel = "{pin}"\npath = "/tmp/toolchain"\n',
                  pin,
              ),
          )
          expect_reject(
              "duplicate toolchain key",
              lambda: validate_toolchain(
                  f'[toolchain]\nchannel = "{pin}"\nchannel = "{pin}"\n',
                  pin,
              ),
          )
          expect_reject(
              "scalar components",
              lambda: validate_toolchain(
                  f'[toolchain]\nchannel = "{pin}"\ncomponents = "rustfmt"\n',
                  pin,
              ),
          )
          expect_reject(
              "duplicate components",
              lambda: validate_toolchain(
                  f'[toolchain]\nchannel = "{pin}"\ncomponents = ["rustfmt", "rustfmt"]\n',
                  pin,
              ),
          )
          expect_reject(
              "unknown profile",
              lambda: validate_toolchain(
                  f'[toolchain]\nchannel = "{pin}"\nprofile = "fast"\n', pin
              ),
          )

          expected = parse_suite_channel(
              pathlib.Path("SUITE.lock").read_text(encoding="utf-8")
          )
          actual = validate_toolchain(
              pathlib.Path("rust-toolchain.toml").read_text(encoding="utf-8"),
              expected,
          )
          print(actual)
          PY
          )"
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt --component clippy
          PINNED_RUST_CHANNEL="$channel" python3 -I - <<'PY'
          import os
          import pathlib
          import subprocess

          commit_rows = []
          for raw in pathlib.Path("SUITE.lock").read_text(encoding="utf-8").splitlines():
              line = raw.split("#", 1)[0].strip()
              if not line:
                  continue
              tokens = line.split()
              if tokens[0] == "rust-commit":
                  if len(tokens) != 2:
                      raise SystemExit("SUITE.lock has a malformed rust-commit row")
                  commit_rows.append(tokens[1])
          if len(commit_rows) != 1:
              raise SystemExit(
                  f"SUITE.lock must contain exactly one rust-commit row; found {len(commit_rows)}"
              )
          expected = commit_rows[0]
          if len(expected) != 40 or any(char not in "0123456789abcdef" for char in expected):
              raise SystemExit(f"SUITE.lock rust-commit is not a 40-hex hash: {expected!r}")
          verbose = subprocess.run(
              ["rustup", "run", os.environ["PINNED_RUST_CHANNEL"], "rustc", "-Vv"],
              check=True,
              text=True,
              capture_output=True,
          ).stdout.splitlines()
          actual = next(line.split(": ", 1)[1] for line in verbose if line.startswith("commit-hash: "))
          if actual != expected:
              raise SystemExit(f"rustc commit mismatch: {actual} != {expected}")
          PY

      - name: cache cargo
        id: cargo_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cargo
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: ownership evidence — clean source-bound matrix
        id: ownership_e2e
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' }}
        shell: bash
        run: |
          ownership_root="$RUNNER_TEMP/fln-ownership-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "$ownership_root" || -L "$ownership_root" ]]; then
            echo "ownership evidence root already exists: $ownership_root" >&2
            exit 2
          fi
          mkdir -p "$ownership_root"
          set +e
          FLN_E2E_ART_ROOT="$ownership_root" \
            FLN_OWNERSHIP_EXPECTED_COMMIT="$GITHUB_SHA" \
            ./scripts/e2e/kernel_contract_ownership.sh --lane clean
          command_rc=$?
          set -e
          mapfile -d '' -t bundles < <(
            find "$ownership_root" -mindepth 1 -maxdepth 1 -print0
          )
          artifact=""
          capture_rc=0
          if (( ${#bundles[@]} != 1 )); then
            echo "ownership matrix published ${#bundles[@]} root entries; expected exactly one" >&2
            capture_rc=2
          else
            artifact="${bundles[0]}"
            if [[ -L "$artifact" || ! -d "$artifact" ]]; then
              echo "ownership matrix entry is not a real directory: $artifact" >&2
              capture_rc=2
            elif ! ./scripts/e2e/kernel_contract_ownership.sh \
                --validate-bundle "$artifact"; then
              echo "independent ownership bundle validation failed: $artifact" >&2
              capture_rc=1
            fi
          fi
          {
            printf 'artifact_path=%s\n' "$artifact"
            printf 'command_exit=%s\n' "$command_rc"
          } >> "$GITHUB_OUTPUT"
          if (( command_rc != 0 )); then
            exit "$command_rc"
          fi
          if (( capture_rc != 0 )); then
            exit "$capture_rc"
          fi

      - name: quality gate (scripts/check.sh)
        id: quality_gate
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' }}
        shell: bash
        run: |
          artifact="$FLN_CHECK_ART_ROOT/quality-gate"
          set +e
          FLN_CHECK_ART_DIR="$artifact" \
            FLN_CHECK_CACHE_STATE="cargo-cache-hit=${{ steps.cargo_cache.outputs.cache-hit }}" \
            ./scripts/check.sh
          command_rc=$?
          set -e
          {
            printf 'artifact_path=%s\n' "$artifact"
            printf 'command_exit=%s\n' "$command_rc"
          } >> "$GITHUB_OUTPUT"
          exit "$command_rc"

      - name: tribunal epoch-lab nested workspace
        id: epoch_lab
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' }}
        shell: bash
        run: |
          ./scripts/check.sh --tribunal-manifest-inventory
          cargo test --locked --manifest-path tribunal/epoch-lab/Cargo.toml
          cargo run --locked --manifest-path tribunal/epoch-lab/Cargo.toml -- verify v4.32.0

      - name: gate self-test (planted failures must be caught and named)
        id: gate_self_test
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' }}
        shell: bash
        run: |
          artifact="$FLN_CHECK_ART_ROOT/gate-self-test"
          set +e
          FLN_CHECK_ART_DIR="$artifact" \
            FLN_CHECK_CACHE_STATE="cargo-cache-hit=${{ steps.cargo_cache.outputs.cache-hit }}" \
            ./scripts/check.sh --self-test
          command_rc=$?
          set -e
          {
            printf 'artifact_path=%s\n' "$artifact"
            printf 'command_exit=%s\n' "$command_rc"
          } >> "$GITHUB_OUTPUT"
          exit "$command_rc"

      - name: e2e smoke — structural gate
        id: structure_gate
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' }}
        shell: bash
        run: |
          step_root="$FLN_E2E_ART_ROOT/structure-gate"
          mkdir "$step_root"
          set +e
          FLN_E2E_ART_ROOT="$step_root" \
            FLN_E2E_CACHE_STATE="cargo-cache-hit=${{ steps.cargo_cache.outputs.cache-hit }}" \
            ./scripts/e2e/structure_gate.sh
          command_rc=$?
          set -e
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          artifact=""
          capture_rc=0
          if (( ${#bundles[@]} != 1 )); then
            echo "structural gate published ${#bundles[@]} bundles; expected exactly one" >&2
            capture_rc=2
          else
            artifact="${bundles[0]}"
          fi
          {
            printf 'artifact_path=%s\n' "$artifact"
            printf 'command_exit=%s\n' "$command_rc"
          } >> "$GITHUB_OUTPUT"
          if (( capture_rc != 0 )); then
            exit "$capture_rc"
          fi
          exit "$command_rc"

      - name: e2e smoke — dependency closure audit
        id: closure_audit
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' }}
        shell: bash
        run: |
          step_root="$FLN_E2E_ART_ROOT/closure-audit"
          mkdir "$step_root"
          set +e
          FLN_E2E_ART_ROOT="$step_root" \
            FLN_E2E_CACHE_STATE="cargo-cache-hit=${{ steps.cargo_cache.outputs.cache-hit }}" \
            ./scripts/e2e/closure_audit.sh
          command_rc=$?
          set -e
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          artifact=""
          capture_rc=0
          if (( ${#bundles[@]} != 1 )); then
            echo "closure audit published ${#bundles[@]} bundles; expected exactly one" >&2
            capture_rc=2
          else
            artifact="${bundles[0]}"
          fi
          {
            printf 'artifact_path=%s\n' "$artifact"
            printf 'command_exit=%s\n' "$command_rc"
          } >> "$GITHUB_OUTPUT"
          if (( capture_rc != 0 )); then
            exit "$capture_rc"
          fi
          exit "$command_rc"

      - name: e2e smoke — Tribunal campaign frameworks
        id: campaign_frameworks
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' }}
        shell: bash
        run: |
          step_root="$FLN_E2E_ART_ROOT/campaign-frameworks"
          mkdir "$step_root"
          set +e
          FLN_E2E_ART_ROOT="$step_root" \
            FLN_E2E_CACHE_STATE="cargo-cache-hit=${{ steps.cargo_cache.outputs.cache-hit }}" \
            ./scripts/e2e/campaign_frameworks.sh
          command_rc=$?
          set -e
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          artifact=""
          capture_rc=0
          if (( ${#bundles[@]} != 1 )); then
            echo "campaign frameworks lane published ${#bundles[@]} bundles; expected exactly one" >&2
            capture_rc=2
          else
            artifact="${bundles[0]}"
          fi
          {
            printf 'artifact_path=%s\n' "$artifact"
            printf 'command_exit=%s\n' "$command_rc"
          } >> "$GITHUB_OUTPUT"
          if (( capture_rc != 0 )); then
            exit "$capture_rc"
          fi
          exit "$command_rc"

      - name: e2e smoke — attribute state census
        id: attribute_state_census
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' }}
        shell: bash
        run: |
          step_root="$FLN_E2E_ART_ROOT/attribute-state-census"
          mkdir "$step_root"
          set +e
          FLN_E2E_ART_ROOT="$step_root" \
            FLN_E2E_CACHE_STATE="cargo-cache-hit=${{ steps.cargo_cache.outputs.cache-hit }}" \
            ./scripts/e2e/attribute_state_census.sh
          command_rc=$?
          set -e
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          artifact=""
          capture_rc=0
          if (( ${#bundles[@]} != 1 )); then
            echo "attribute state census lane published ${#bundles[@]} bundles; expected exactly one" >&2
            capture_rc=2
          else
            artifact="${bundles[0]}"
          fi
          {
            printf 'artifact_path=%s\n' "$artifact"
            printf 'command_exit=%s\n' "$command_rc"
          } >> "$GITHUB_OUTPUT"
          if (( capture_rc != 0 )); then
            exit "$capture_rc"
          fi
          exit "$command_rc"

      - name: e2e smoke — bidirectional unsafe-note Clippy census
        id: unsafe_note_clippy
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' }}
        shell: bash
        run: |
          step_root="$FLN_E2E_ART_ROOT/unsafe-note-clippy"
          mkdir "$step_root"
          set +e
          FLN_E2E_ART_ROOT="$step_root" \
            FLN_E2E_CACHE_STATE="cargo-cache-hit=${{ steps.cargo_cache.outputs.cache-hit }}" \
            ./scripts/e2e/unsafe_note_clippy.sh
          command_rc=$?
          set -e
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          artifact=""
          capture_rc=0
          if (( ${#bundles[@]} != 1 )); then
            echo "unsafe-note Clippy lane published ${#bundles[@]} bundles; expected exactly one" >&2
            capture_rc=2
          else
            artifact="${bundles[0]}"
          fi
          {
            printf 'artifact_path=%s\n' "$artifact"
            printf 'command_exit=%s\n' "$command_rc"
          } >> "$GITHUB_OUTPUT"
          if (( capture_rc != 0 )); then
            exit "$capture_rc"
          fi
          exit "$command_rc"

      # The census shards are governed outputs that the checkout carries, so this
      # proves them against the committed pins rather than fetching anything: the
      # per-shard bytes= in contracts/CONTRACT_HANDOFF.txt and the two sha256 group
      # digests in contracts/EXTERN_BUILTIN_ENVIRONMENT.txt (bead
      # fln-census-out-of-git-2ya9). Running it here means the census consumers
      # below are reading bytes that have already been checked.
      #
      # The exits are separated deliberately. A census that DISAGREES with the pins
      # is a decided failure and stops the run. A census that is merely absent is
      # inconclusive, not a failure — that is the state a future untracked census
      # would present on a runner with no Reference toolchain, and it should skip
      # the dependent steps rather than redden the gate.
      - name: verify extern/builtin census against committed pins
        id: census
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          ./scripts/extract/census_materialize.sh --verify-only
          census_rc=$?
          set -e
          case "$census_rc" in
            0) echo "available=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "census unavailable; dependent steps will be skipped" >&2
               echo "available=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "available=false" >> "$GITHUB_OUTPUT"
               echo "census does not match the committed pins" >&2
               exit "$census_rc" ;;
          esac

      - name: e2e — canonical W1 contract handoff
        id: contract_handoff
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' && steps.census.outputs.available == 'true' }}
        shell: bash
        run: |
          step_root="$FLN_E2E_ART_ROOT/contract-handoff"
          mkdir "$step_root"
          set +e
          # --validate, not --check. --check re-walks the Reference and needs an elan
          # toolchain pinned to SUITE.lock, which this runner does not install; asking
          # for it here only produced a setup failure (exit 2) that looked like a real
          # verification. Reference-drift detection therefore runs in
          # .github/workflows/contract-drift.yml, which installs the SUITE.lock-pinned
          # toolchain and runs scripts/e2e/contract_drift.sh with its seeded mutants.
          # This comment used to defer to "a scheduled job that actually installs the
          # toolchain" and name none, because none existed; the deferral then outlived
          # its own missing referent, which is what bead franken_lean-0kpa was filed
          # for. Do not re-word it back into a promise: what holds the delegation is
          # contract_roots.rs, which fails if no gate INVOKES that lane, and being
          # named in check.sh's INPUT_PATHS or shellcheck arguments is not invocation.
          FLN_E2E_ART_ROOT="$step_root" \
            FLN_CONTRACT_HANDOFF_FULL_CENSUS=0 \
            ./scripts/e2e/contract_handoff.sh
          command_rc=$?
          set -e
          mapfile -d '' -t bundles < <(
            find "$step_root" -mindepth 1 -maxdepth 1 -type d -print0
          )
          artifact=""
          capture_rc=0
          if (( ${#bundles[@]} != 1 )); then
            echo "contract handoff published ${#bundles[@]} bundles; expected exactly one" >&2
            capture_rc=2
          else
            artifact="${bundles[0]}"
          fi
          {
            printf 'artifact_path=%s\n' "$artifact"
            printf 'command_exit=%s\n' "$command_rc"
          } >> "$GITHUB_OUTPUT"
          if (( capture_rc != 0 )); then
            exit "$capture_rc"
          fi
          exit "$command_rc"

