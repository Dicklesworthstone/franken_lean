      - name: verify and index complete evidence attempt
        if: ${{ !cancelled() && steps.evidence_attempt.outcome == 'success' }}
        shell: bash
        env:
          QUALITY_ARTIFACT: ${{ steps.quality_gate.outputs.artifact_path }}
          QUALITY_EXIT: ${{ steps.quality_gate.outputs.command_exit }}
          SELF_TEST_ARTIFACT: ${{ steps.gate_self_test.outputs.artifact_path }}
          SELF_TEST_EXIT: ${{ steps.gate_self_test.outputs.command_exit }}
          STRUCTURE_ARTIFACT: ${{ steps.structure_gate.outputs.artifact_path }}
          STRUCTURE_EXIT: ${{ steps.structure_gate.outputs.command_exit }}
          CLOSURE_ARTIFACT: ${{ steps.closure_audit.outputs.artifact_path }}
          CLOSURE_EXIT: ${{ steps.closure_audit.outputs.command_exit }}
          UNSAFE_NOTE_CLIPPY_ARTIFACT: ${{ steps.unsafe_note_clippy.outputs.artifact_path }}
          UNSAFE_NOTE_CLIPPY_EXIT: ${{ steps.unsafe_note_clippy.outputs.command_exit }}
          CONTRACT_HANDOFF_ARTIFACT: ${{ steps.contract_handoff.outputs.artifact_path }}
          CONTRACT_HANDOFF_EXIT: ${{ steps.contract_handoff.outputs.command_exit }}
          CAMPAIGN_ARTIFACT: ${{ steps.campaign_frameworks.outputs.artifact_path }}
          CAMPAIGN_EXIT: ${{ steps.campaign_frameworks.outputs.command_exit }}
          ATTRIBUTE_CENSUS_ARTIFACT: ${{ steps.attribute_state_census.outputs.artifact_path }}
          ATTRIBUTE_CENSUS_EXIT: ${{ steps.attribute_state_census.outputs.command_exit }}
          ENV_SNAPSHOTS_ARTIFACT: ${{ steps.environment_collision.outputs.parent_artifact_path }}
          ENVIRONMENT_COLLISION_ARTIFACT: ${{ steps.environment_collision.outputs.artifact_path }}
          ENVIRONMENT_RESOURCE_COLLISION_ARTIFACT: ${{ steps.environment_collision.outputs.resource_artifact_path }}
          ENVIRONMENT_COLLISION_EXIT: ${{ steps.environment_collision.outputs.command_exit }}
          LEXER_NO_MOCK_ARTIFACT: ${{ steps.lexer_no_mock_e2e.outputs.artifact_path }}
          LEXER_NO_MOCK_EXIT: ${{ steps.lexer_no_mock_e2e.outputs.command_exit }}
          PARSER_CORPUS_NO_MOCK_ARTIFACT: ${{ steps.parser_corpus_no_mock_e2e.outputs.artifact_path }}
          PARSER_CORPUS_NO_MOCK_EXIT: ${{ steps.parser_corpus_no_mock_e2e.outputs.command_exit }}
          DYNAMIC_PARSER_NO_MOCK_ARTIFACT: ${{ steps.dynamic_parser_no_mock_e2e.outputs.artifact_path }}
          DYNAMIC_PARSER_NO_MOCK_EXIT: ${{ steps.dynamic_parser_no_mock_e2e.outputs.command_exit }}
          HYGIENE_NO_MOCK_ARTIFACT: ${{ steps.hygiene_no_mock_e2e.outputs.artifact_path }}
          HYGIENE_NO_MOCK_EXIT: ${{ steps.hygiene_no_mock_e2e.outputs.command_exit }}
          VELLUM_NAMING_ARTIFACT: ${{ steps.vellum_naming.outputs.artifact_path }}
          VELLUM_NAMING_EXIT: ${{ steps.vellum_naming.outputs.command_exit }}
          VERDICT_SCHEMA_ARTIFACT: ${{ steps.verdict_schema.outputs.artifact_path }}
          VERDICT_SCHEMA_EXIT: ${{ steps.verdict_schema.outputs.command_exit }}
        run: |
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          attempt_root = Path(os.environ["FLN_EVIDENCE_ROOT"]).resolve(strict=True)
          check_root = Path(os.environ["FLN_CHECK_ART_ROOT"]).resolve(strict=True)
          e2e_root = Path(os.environ["FLN_E2E_ART_ROOT"]).resolve(strict=True)
          attempt_start_path = attempt_root / "attempt-start.json"
          attempt_start = json.loads(attempt_start_path.read_text(encoding="utf-8"))
          if (
              attempt_start.get("schema") != "fln.ci-evidence-attempt-start/1"
              or attempt_start.get("status") != "started"
              or attempt_start.get("github_run_id") != os.environ["GITHUB_RUN_ID"]
              or attempt_start.get("github_run_attempt")
              != os.environ["GITHUB_RUN_ATTEMPT"]
          ):
              raise SystemExit("invalid CI evidence attempt-start record")

          expected_roots = {
              check_root: {"quality-gate", "gate-self-test"},
              e2e_root: {
                  "structure-gate",
                  "closure-audit",
                  "campaign-frameworks",
                  "attribute-state-census",
                  "unsafe-note-clippy",
                  "contract-handoff",
                  # env_snapshots is the sole parent bundle at this shared root;
                  # the two collision scenarios are its named children.
                  "environment-collision",
                  "dynamic-parser-no-mock",
                  "hygiene-no-mock",
                  "lexer-no-mock",
                  "parser-corpus-no-mock",
                  "vellum-naming",
                  "verdict-schema",
              },
          }
          for root, expected_names in expected_roots.items():
              observed = {entry.name for entry in root.iterdir()}
              if observed != expected_names:
                  raise SystemExit(
                      f"incomplete evidence root {root}: {sorted(observed)} "
                      f"!= {sorted(expected_names)}"
                  )

          specs = (
              (
                  "quality_gate",
                  os.environ.get("QUALITY_ARTIFACT", ""),
                  os.environ.get("QUALITY_EXIT", ""),
                  check_root / "quality-gate",
                  False,
              ),
              (
                  "gate_self_test",
                  os.environ.get("SELF_TEST_ARTIFACT", ""),
                  os.environ.get("SELF_TEST_EXIT", ""),
                  check_root / "gate-self-test",
                  False,
              ),
              (
                  "structure_gate",
                  os.environ.get("STRUCTURE_ARTIFACT", ""),
                  os.environ.get("STRUCTURE_EXIT", ""),
                  e2e_root / "structure-gate",
                  True,
              ),
              (
                  "closure_audit",
                  os.environ.get("CLOSURE_ARTIFACT", ""),
                  os.environ.get("CLOSURE_EXIT", ""),
                  e2e_root / "closure-audit",
                  True,
              ),
              (
                  "campaign_frameworks",
                  os.environ.get("CAMPAIGN_ARTIFACT", ""),
                  os.environ.get("CAMPAIGN_EXIT", ""),
                  e2e_root / "campaign-frameworks",
                  True,
              ),
              (
                  "attribute_state_census",
                  os.environ.get("ATTRIBUTE_CENSUS_ARTIFACT", ""),
                  os.environ.get("ATTRIBUTE_CENSUS_EXIT", ""),
                  e2e_root / "attribute-state-census",
                  True,
              ),
              (
                  "unsafe_note_clippy",
                  os.environ.get("UNSAFE_NOTE_CLIPPY_ARTIFACT", ""),
                  os.environ.get("UNSAFE_NOTE_CLIPPY_EXIT", ""),
                  e2e_root / "unsafe-note-clippy",
                  True,
              ),
              (
                  "contract_handoff",
                  os.environ.get("CONTRACT_HANDOFF_ARTIFACT", ""),
                  os.environ.get("CONTRACT_HANDOFF_EXIT", ""),
                  e2e_root / "contract-handoff",
                  True,
              ),
              (
                  "env_snapshots",
                  os.environ.get("ENV_SNAPSHOTS_ARTIFACT", ""),
                  os.environ.get("ENVIRONMENT_COLLISION_EXIT", ""),
                  e2e_root / "environment-collision",
                  True,
              ),
              (
                  "environment_collision",
                  os.environ.get("ENVIRONMENT_COLLISION_ARTIFACT", ""),
                  os.environ.get("ENVIRONMENT_COLLISION_EXIT", ""),
                  e2e_root / "environment-collision",
                  "collision-fln-amv.10",
              ),
              (
                  "environment_resource_collision",
                  os.environ.get("ENVIRONMENT_RESOURCE_COLLISION_ARTIFACT", ""),
                  os.environ.get("ENVIRONMENT_COLLISION_EXIT", ""),
                  e2e_root / "environment-collision",
                  "resource-collision-fln-amv.13",
              ),
              (
                  "lexer_no_mock_e2e",
                  os.environ.get("LEXER_NO_MOCK_ARTIFACT", ""),
                  os.environ.get("LEXER_NO_MOCK_EXIT", ""),
                  e2e_root / "lexer-no-mock",
                  True,
              ),
              (
                  "parser_corpus_no_mock_e2e",
                  os.environ.get("PARSER_CORPUS_NO_MOCK_ARTIFACT", ""),
                  os.environ.get("PARSER_CORPUS_NO_MOCK_EXIT", ""),
                  e2e_root / "parser-corpus-no-mock",
                  True,
              ),
              (
                  "dynamic_parser_no_mock_e2e",
                  os.environ.get("DYNAMIC_PARSER_NO_MOCK_ARTIFACT", ""),
                  os.environ.get("DYNAMIC_PARSER_NO_MOCK_EXIT", ""),
                  e2e_root / "dynamic-parser-no-mock",
                  True,
              ),
              (
                  "hygiene_no_mock_e2e",
                  os.environ.get("HYGIENE_NO_MOCK_ARTIFACT", ""),
                  os.environ.get("HYGIENE_NO_MOCK_EXIT", ""),
                  e2e_root / "hygiene-no-mock",
                  True,
              ),
              (
                  "vellum_naming",
                  os.environ.get("VELLUM_NAMING_ARTIFACT", ""),
                  os.environ.get("VELLUM_NAMING_EXIT", ""),
                  e2e_root / "vellum-naming",
                  True,
              ),
              (
                  "verdict_schema",
                  os.environ.get("VERDICT_SCHEMA_ARTIFACT", ""),
                  os.environ.get("VERDICT_SCHEMA_EXIT", ""),
                  e2e_root / "verdict-schema",
                  True,
              ),
          )

          manifest_records = [
              json.loads(line)
              for line in Path("ci/VERIFICATION_MANIFEST.jsonl")
              .read_text(encoding="utf-8")
              .splitlines()
          ]
          ci_registry = {
              record["scenario"]: record
              for record in manifest_records
              if record.get("kind") == "scenario"
              and record.get("activation") == "active"
              and record.get("ci_required") is True
          }
          spec_labels = {label for label, *_rest in specs}
          if set(ci_registry) != spec_labels:
              raise SystemExit(
                  "CI specs and active verification registry differ: "
                  f"{sorted(spec_labels)} != {sorted(ci_registry)}"
              )
          for label, _raw_path, _raw_exit, expected, is_child in specs:
              registry = ci_registry[label]
              expected_root = expected.relative_to(attempt_root).as_posix()
              expected_kind = (
                  "named-child"
                  if isinstance(is_child, str)
                  else "single-bundle"
                  if is_child
                  else "direct"
              )
              expected_name = is_child if isinstance(is_child, str) else "-"
              if (
                  registry.get("ci_root") != expected_root
                  or registry.get("artifact_kind") != expected_kind
                  or registry.get("artifact_name") != expected_name
              ):
                  raise SystemExit(
                      f"{label} CI artifact contract differs from "
                      "ci/VERIFICATION_MANIFEST.jsonl"
                  )

          records = []
          seen = set()
          for label, raw_path, raw_exit, expected, is_child in specs:
              if not raw_path or not raw_exit:
                  raise SystemExit(f"{label} did not publish artifact_path and command_exit")
              try:
                  command_exit = int(raw_exit)
              except ValueError as error:
                  raise SystemExit(f"{label} published invalid exit {raw_exit!r}") from error
              artifact = Path(raw_path)
              if artifact.is_symlink() or not artifact.is_dir():
                  raise SystemExit(f"{label} artifact is not a real directory: {artifact}")
              artifact = artifact.resolve(strict=True)
              if isinstance(is_child, str):
                  expected = expected.resolve(strict=True)
                  parent = artifact.parent
                  if parent.parent != expected:
                      raise SystemExit(
                          f"{label} artifact escaped its isolated nested root: {artifact}"
                      )
                  parents = list(expected.iterdir())
                  if parents != [parent] or artifact.name != is_child:
                      raise SystemExit(
                          f"{label} root does not contain exactly its named parent/child bundle"
                      )
              elif is_child:
                  if artifact.parent != expected.resolve(strict=True):
                      raise SystemExit(f"{label} artifact escaped its isolated root: {artifact}")
                  children = list(expected.iterdir())
                  if children != [artifact]:
                      raise SystemExit(f"{label} root does not contain exactly its named bundle")
              elif artifact != expected.resolve(strict=True):
                  raise SystemExit(f"{label} artifact path mismatch: {artifact} != {expected}")
              if artifact in seen:
                  raise SystemExit(f"duplicate artifact path: {artifact}")
              seen.add(artifact)
              try:
                  relative = artifact.relative_to(attempt_root)
              except ValueError as error:
                  raise SystemExit(f"{label} artifact escaped attempt root") from error

              run_log = artifact / "run.ndjson"
              manifest_path = artifact / "manifest.json"
              digest_path = artifact / "manifest.digest"
              bundle_commit = artifact / "bundle.complete.json"
              for required in (run_log, manifest_path, digest_path, bundle_commit):
                  if required.is_symlink() or not required.is_file():
                      raise SystemExit(f"{label} missing regular evidence file: {required.name}")
              subprocess.run(
                  [
                      "python3",
                      "-I",
                      "scripts/evidence.py",
                      "validate-bundle",
                      "--art-dir",
                      str(artifact),
                      "--manifest",
                      str(manifest_path),
                      "--digest",
                      str(digest_path),
                      "--commit",
                      str(bundle_commit),
                      "--artifact-root",
                      str(artifact),
                  ],
                  check=True,
              )
              terminal_lines = [
                  line for line in run_log.read_text(encoding="utf-8").splitlines() if line
              ]
              if not terminal_lines:
                  raise SystemExit(f"{label} run log is empty")
              terminal = json.loads(terminal_lines[-1])
              if terminal.get("event") != "run_end":
                  raise SystemExit(f"{label} run log is not terminal")
              if terminal.get("process_exit") != command_exit:
                  raise SystemExit(
                      f"{label} command/terminal exit mismatch: "
                      f"{command_exit} != {terminal.get('process_exit')}"
                  )
              manifest_bytes = manifest_path.read_bytes()
              records.append(
                  {
                      "artifact": relative.as_posix(),
                      "bundle_commit_sha256": hashlib.sha256(
                          bundle_commit.read_bytes()
                      ).hexdigest(),
                      "command_exit": command_exit,
                      "label": label,
                      "manifest_sha256": hashlib.sha256(manifest_bytes).hexdigest(),
                      "run_id": terminal.get("run_id"),
                      "verdict": terminal.get("verdict"),
                  }
              )

          index = {
              "all_commands_passed": all(row["command_exit"] == 0 for row in records),
              "artifacts": records,
              "attempt_start_sha256": hashlib.sha256(
                  attempt_start_path.read_bytes()
              ).hexdigest(),
              "complete": True,
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "schema": "fln.ci-evidence-index/1",
          }
          encoded = (json.dumps(index, sort_keys=True, separators=(",", ":")) + "\n").encode()
          index_path = attempt_root / "attempt-index.json"
          with index_path.open("xb") as handle:
              handle.write(encoded)
              handle.flush()
              os.fsync(handle.fileno())
          digest = hashlib.sha256(encoded).hexdigest()
          with (attempt_root / "attempt-index.digest").open("x", encoding="utf-8") as handle:
              handle.write(f"sha256:{digest}  {index_path.name}\n")
              handle.flush()
              os.fsync(handle.fileno())
          print(f"sealed complete evidence attempt: {index_path} ({digest})")
          PY

      - name: archive ownership evidence bundle
        if: ${{ always() && steps.ownership_e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ownership-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fln-ownership-evidence/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: archive gate + e2e artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fln-evidence/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
