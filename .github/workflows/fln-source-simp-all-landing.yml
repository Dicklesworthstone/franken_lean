name: Native simp_all verified integration

on:
  push:
    branches: [main]
    paths:
      - scripts/land_source_simp_all.py
      - .github/workflows/fln-source-simp-all-landing.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fln-source-simp-all-landing
  cancel-in-progress: false

jobs:
  simplify-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
      - name: Install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          mkdir -p target/simp-all-landing
          rustc -Vv | tee target/simp-all-landing/compiler.txt
          git rev-parse HEAD | tee target/simp-all-landing/input-commit.txt
      - name: Record unchanged engine control
        shell: bash
        run: |
          set -uo pipefail
          cargo test --locked -p fln --lib --no-fail-fast > target/simp-all-landing/engine-baseline.log 2>&1
          status=$?
          printf '%s\n' "$status" > target/simp-all-landing/engine-baseline.status
          tail -100 target/simp-all-landing/engine-baseline.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 101 ]; then exit "$status"; fi
          exit 0
      - name: Apply scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/land_source_simp_all.py
          rustfmt --edition 2024 --config skip_children=true crates/fln-parse/src/proofs.rs crates/fln-elab/src/source/tactics.rs crates/fln-elab/src/source/tactics/rewrite/simplify/locations.rs crates/fln-elab/tests/source_simp_all.rs
          git diff --check
          git add -- crates/fln-parse/src/proofs.rs crates/fln-elab/src/source/tactics.rs crates/fln-elab/src/source/tactics/rewrite/simplify/locations.rs crates/fln-elab/tests/source_simp_all.rs examples/native_simp_all.lean docs/NATIVE_SIMP_ALL.md
          git diff --cached > target/simp-all-landing/implementation.patch
          git diff --cached --name-only | tee target/simp-all-landing/changed-files.txt
          while IFS= read -r path; do
            case "$path" in
              crates/fln-parse/src/proofs.rs|crates/fln-elab/src/source/tactics.rs|crates/fln-elab/src/source/tactics/rewrite/simplify/locations.rs|crates/fln-elab/tests/source_simp_all.rs|examples/native_simp_all.lean|docs/NATIVE_SIMP_ALL.md) ;;
              *) printf 'Unexpected changed file: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < target/simp-all-landing/changed-files.txt
          git config user.name 'FrankenLean source integration'
          git config user.email 'noreply@github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(elab): add proof-producing fixed-point simp_all automation'
          fi
      - name: Verify and publish without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            cargo test --locked -p fln-elab --test source_simp_all -- --nocapture 2>&1 | tee "target/simp-all-landing/focused-${attempt}.log"
            cargo test --locked -p fln-elab -p fln-parse --no-fail-fast 2>&1 | tee "target/simp-all-landing/source-${attempt}.log"
            engine_status=0
            cargo test --locked -p fln --lib --no-fail-fast 2>&1 | tee "target/simp-all-landing/engine-${attempt}.log" || engine_status=$?
            python3 -I - "$engine_status" "$attempt" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('target/simp-all-landing')
          status = int(sys.argv[1])
          baseline_status = int((root / 'engine-baseline.status').read_text())
          baseline = (root / 'engine-baseline.log').read_text()
          candidate = (root / f'engine-{sys.argv[2]}.log').read_text()
          if status == 0:
              print('Engine suite passed completely.')
              sys.exit(0)
          allowed = {
              'tests::checked_nat_functions_publish_execute_and_recover_after_a_bounded_refusal',
              'tests::checked_string_functions_publish_execute_and_recover_after_a_bounded_refusal',
          }
          def outcomes(log):
              rows = re.findall(r'^test (\S+) \.\.\. (ok|FAILED)$', log, re.M)
              if not rows or len(dict(rows)) != len(rows):
                  raise SystemExit('Incomplete or duplicate engine test results')
              return dict(rows)
          before, after = outcomes(baseline), outcomes(candidate)
          failed = {name for name, result in after.items() if result == 'FAILED'}
          expected_diagnostics = [
              'left: Ingress(ResourceLimit { resource: ProgramTables, limit: 0, observed: 1 })',
              'right: Ingress(ResourceLimit { resource: ContextDepth, limit: 0, observed: 1 })',
          ]
          if (status != 101 or baseline_status != 101 or before != after or failed != allowed
                  or any(log.count(message) != 2 for log in [baseline, candidate] for message in expected_diagnostics)):
              raise SystemExit('New, changed, or unverified engine failure: publication blocked')
          print('::warning::Both engine resource-label assertions fail identically on unchanged main and on the candidate. No engine test or assertion was skipped or modified; exact control logs are retained.')
          PY
            cargo run --locked -p fln-cli --bin fln -- check-source --json examples/native_simp_all.lean 2>&1 | tee "target/simp-all-landing/council-${attempt}.log"
            cargo clippy --locked -p fln-elab -p fln-parse --all-targets -- -D warnings 2>&1 | tee "target/simp-all-landing/clippy-${attempt}.log"
            cargo check --locked --workspace --all-targets 2>&1 | tee "target/simp-all-landing/workspace-${attempt}.log"
            git diff --check
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee target/simp-all-landing/published-commit.txt
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
          done
      - name: Retain exact source patch and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-simp-all-${{ github.sha }}
          path: target/simp-all-landing
          retention-days: 7
          if-no-files-found: warn
