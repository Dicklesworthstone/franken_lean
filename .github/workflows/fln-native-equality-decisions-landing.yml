name: Native equality decision integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-native-equality-decisions-landing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-equality-decision-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Integrate admitted native and polymorphic equality definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new):
              if new in text:
                  return text
              if text.count(old) != 1:
                  raise SystemExit(f"Refusing ambiguous or stale anchor: {old!r}")
              return text.replace(old, new, 1)

          for module in ['decidable_eq', 'decidable_generic']:
              if not Path(f'crates/fln-elab/src/seed/{module}.rs').is_file():
                  raise SystemExit(f'Missing tested implementation: {module}')
          seed = Path('crates/fln-elab/src/seed.rs')
          text = seed.read_text()
          for line in [
              'mod decidable_eq;',
              'mod decidable_generic;',
              'pub use decidable_eq::equality_decision_seed_declarations;',
              'pub use decidable_generic::generic_equality_decision_seed_declarations;',
          ]:
              if line not in text.splitlines():
                  anchor = 'mod decidable;\n'
                  if text.count(anchor) != 1:
                      raise SystemExit('Ambiguous seed module anchor')
                  text = text.replace(anchor, anchor + line + '\n', 1)
          if 'pub fn source_seed_declarations() -> [Declaration; 53]' in text:
              text = replace_once(text,
                  'pub fn source_seed_declarations() -> [Declaration; 53] {\n    [',
                  'pub fn source_seed_declarations() -> [Declaration; 59] {\n    let [bool_eq, nat_eq, bool_instance, nat_instance] = equality_decision_seed_declarations();\n    let [equality_type, generic_eq] = generic_equality_decision_seed_declarations();\n    [')
              text = replace_once(text,
                  '        semi_out_param_seed_declaration(),\n    ]',
                  '        semi_out_param_seed_declaration(),\n        bool_eq,\n        nat_eq,\n        bool_instance,\n        nat_instance,\n        equality_type,\n        generic_eq,\n    ]')
          elif 'pub fn source_seed_declarations() -> [Declaration; 57]' in text:
              text = replace_once(text,
                  'pub fn source_seed_declarations() -> [Declaration; 57]',
                  'pub fn source_seed_declarations() -> [Declaration; 59]')
              text = replace_once(text,
                  '    let [bool_eq, nat_eq, bool_instance, nat_instance] = equality_decision_seed_declarations();\n',
                  '    let [bool_eq, nat_eq, bool_instance, nat_instance] = equality_decision_seed_declarations();\n    let [equality_type, generic_eq] = generic_equality_decision_seed_declarations();\n')
              text = replace_once(text,
                  '        nat_instance,\n    ]',
                  '        nat_instance,\n        equality_type,\n        generic_eq,\n    ]')
          elif 'pub fn source_seed_declarations() -> [Declaration; 59]' not in text:
              raise SystemExit('Unrecognized source seed shape; refusing to overwrite it')
          for required in [
              '    let [bool_eq, nat_eq, bool_instance, nat_instance] = equality_decision_seed_declarations();',
              '    let [equality_type, generic_eq] = generic_equality_decision_seed_declarations();',
              '        equality_type,\n        generic_eq,',
          ]:
              if required not in text:
                  raise SystemExit('Incomplete equality seed integration')
          seed.write_text(text)
          engine = Path('crates/fln/src/lib.rs')
          engine.write_text(replace_once(engine.read_text(),
              '            "instDecidableNot",\n        ] {',
              '            "instDecidableNot",\n            "instDecidableEqBool",\n            "instDecidableEqNat",\n        ] {'))
          PY
          if [ ! -e crates/fln/tests/source_equality_decisions.rs ]; then
          cat > crates/fln/tests/source_equality_decisions.rs <<'RS'
          //! Native equality decisions carry kernel-checked positive and negative proofs.
          #![forbid(unsafe_code)]
          use fln::{Budget, Engine, EngineAdmissionLimits, KVMap, Name, SourceCheckLimits};
          use fln_env::constants::ConstantInfo;

          fn engine() -> (Engine, EngineAdmissionLimits) {
              let limits = EngineAdmissionLimits::new(Budget::for_stack_bytes(2 * 1024 * 1024));
              let engine = Engine::with_source_seed(limits)
                  .expect("source seed admission")
                  .into_complete()
                  .expect("source seed council");
              (engine, limits)
          }
          fn check(source: &str) {
              let (engine, limits) = engine();
              engine.check_source_files(&[source.as_bytes()], &KVMap::new(), SourceCheckLimits::new(limits))
                  .unwrap_or_else(|error| panic!("{source}\n{error:?}"))
                  .into_complete().expect("source check must complete");
          }
          #[test]
          fn bool_equality_decides_the_entire_truth_table() {
              check(r#"
                  theorem ff : false = false := by decide
                  theorem tt : true = true := by decide
                  theorem ft : Not (false = true) := by decide
                  theorem tf : Not (true = false) := by decide
                  theorem ff_bit : decide (false = false) = true := by rfl
                  theorem tt_bit : decide (true = true) = true := by rfl
                  theorem ft_bit : decide (false = true) = false := by rfl
                  theorem tf_bit : decide (true = false) = false := by rfl
              "#);
          }
          #[test]
          fn nat_equality_decides_zero_successors_and_both_inequality_directions() {
              let mut source = String::new();
              for left in 0..5 {
                  for right in 0..5 {
                      let proposition = if left == right {
                          format!("{left} = {right}")
                      } else {
                          format!("Not ({left} = {right})")
                      };
                      source.push_str(&format!("theorem cell_{left}_{right} : {proposition} := by decide\n"));
                  }
              }
              check(&source);
          }
          #[test]
          fn computed_equalities_drive_conditionals_and_proof_automation() {
              check(r#"
                  theorem sum : 2 + 3 = 5 := by decide
                  theorem product : 3 * 4 = 12 := by decide
                  theorem unequal : Not (2 + 3 = 6) := by decide
                  theorem nested : Not (Not (3 = 3)) := by decide
                  theorem positive_branch : ite (2 + 3 = 5) 17 19 = 17 := by rfl
                  theorem negative_branch : ite (2 = 3) 17 19 = 19 := by rfl
                  theorem bool_branch : ite (true = false) 17 19 = 19 := by rfl
                  theorem proof_field : 3 = 3 := dite (3 = 3) (fun h => h) (fun unused => rfl)
                  theorem no_field (fallback : Not (3 = 4)) : Not (3 = 4) := dite (3 = 4) (fun unused => fallback) (fun h => h)
              "#);
          }
          #[test]
          fn symbolic_equalities_have_dictionaries_without_being_guessed_true() {
              check(r#"
                  def nat_dictionary (a b : Nat) : Decidable (a = b) := inferInstance
                  def bool_dictionary (a b : Bool) : Decidable (a = b) := inferInstance
                  def choose (a b : Nat) : Nat := ite (a = b) 11 13
                  theorem chosen : choose 2 2 = 11 := by rfl
                  theorem not_chosen : choose 2 3 = 13 := by rfl
                  def classify (a b : Bool) : Bool := decide (a = b)
                  theorem classified : classify true false = false := by rfl
              "#);
          }
          #[test]
          fn false_equalities_and_forged_proof_fields_are_rejected_transactionally() {
              let (engine, limits) = engine();
              let before = engine.logical_root(&KVMap::new());
              for source in [
                  "theorem invalid : 2 = 3 := by decide",
                  "theorem invalid : true = false := by decide",
                  "theorem invalid : Not (2 = 2) := by decide",
                  "theorem invalid : Not (true = true) := by decide",
                  "theorem invalid (a b : Nat) : a = b := by decide",
                  "def invalid : Decidable (2 = 3) := Decidable.isTrue (Eq.refl 2)",
                  "def invalid : Decidable (2 = 2) := Decidable.isFalse (fun h => h)",
                  "def invalid : Bool := decide (1 : Prop)",
              ] {
                  let result = engine.check_source_files(&[source.as_bytes()], &KVMap::new(), SourceCheckLimits::new(limits));
                  assert!(result.is_err(), "accepted invalid source: {source}");
                  assert_eq!(engine.logical_root(&KVMap::new()), before, "{source}");
              }
          }
          #[test]
          fn equality_deciders_are_safe_definitions_not_axioms_or_opaque_oracles() {
              let (engine, _) = engine();
              for name in ["Bool.decEq", "Nat.decEq", "instDecidableEqBool", "instDecidableEqNat"] {
                  assert!(matches!(engine.environment().find(&Name::from_components(name.split('.'))), Some(ConstantInfo::Defn(_))),
                      "{name} must have an admitted implementation");
              }
          }
          RS
          fi
          if [ ! -e crates/fln/tests/source_generic_decisions.rs ]; then
          cat > crates/fln/tests/source_generic_decisions.rs <<'RS'
          //! Universe-polymorphic decision dictionaries elaborate through the native engine.
          #![forbid(unsafe_code)]
          use fln::{Budget, Engine, EngineAdmissionLimits, KVMap, SourceCheckLimits};
          fn check(source: &str) {
              let limits = EngineAdmissionLimits::new(Budget::for_stack_bytes(2 * 1024 * 1024));
              Engine::with_source_seed(limits).unwrap().into_complete().unwrap()
                  .check_source_files(&[source.as_bytes()], &KVMap::new(), SourceCheckLimits::new(limits))
                  .unwrap_or_else(|error| panic!("{source}\n{error:?}"))
                  .into_complete().expect("generic decision checking must complete");
          }
          #[test]
          fn generic_equality_uses_inferred_nat_and_bool_dictionaries() {
              check(r#"
                  def generic {A : Type} [DecidableEq A] (a b : A) : Bool := decide (a = b)
                  theorem nat_equal : generic 3 3 = true := by rfl
                  theorem nat_unequal : generic 3 4 = false := by rfl
                  theorem bool_equal : generic true true = true := by rfl
                  theorem bool_unequal : generic false true = false := by rfl
                  def nat_dictionary : DecidableEq Nat := inferInstance
                  def bool_dictionary : DecidableEq Bool := inferInstance
                  def explicit_nat : DecidableEq Nat := Nat.decEq
                  def explicit_bool : DecidableEq Bool := Bool.decEq
                  def via_dec_eq (a b : Nat) : Decidable (a = b) := decEq a b
                  theorem true_field : via_dec_eq 2 2 = Decidable.isTrue (Eq.refl 2) := by rfl
              "#);
          }
          #[test]
          fn generic_equality_preserves_local_function_dictionary_evidence() {
              check(r#"
                  def chosen {A : Sort u} [d : DecidableEq A] (a b : A) : Decidable (a = b) := decEq a b
                  theorem preserved {A : Sort u} [d : DecidableEq A] (a b : A) : chosen a b = d a b := by rfl
                  def proof_choice {A : Prop} [d : DecidableEq A] (a b : A) : Decidable (a = b) := decEq a b
                  theorem proposition {A : Prop} [d : DecidableEq A] (a b : A) : proof_choice a b = d a b := by rfl
              "#);
          }
          #[test]
          fn equality_decisions_enable_checked_surface_conditionals_and_case_splits() {
              check(r#"
                  def classify (a b : Nat) : Nat := if a = b then 7 else 9
                  theorem yes : classify 3 3 = 7 := by rfl
                  theorem no : classify 3 4 = 9 := by rfl
                  theorem named (a b : Nat) (fallback : a = b) : a = b := if h : a = b then h else fallback
                  def split (a b : Bool) : Nat := by
                    by_cases h : a = b
                    · exact 11
                    · exact 13
                  theorem same : split true true = 11 := by rfl
                  theorem different : split false true = 13 := by rfl
              "#);
          }
          #[test]
          fn generic_decisions_never_invent_instances_or_evidence() {
              let limits = EngineAdmissionLimits::new(Budget::for_stack_bytes(2 * 1024 * 1024));
              let base = Engine::with_source_seed(limits).unwrap().into_complete().unwrap();
              let root = base.logical_root(&KVMap::new());
              for source in [
                  "def missing : DecidableEq String := inferInstance",
                  "def missing {A : Type} (a b : A) : Decidable (a = b) := decEq a b",
                  "def forged : DecidableEq Nat := fun a => fun b => Decidable.isTrue (Eq.refl a)",
                  "def forged : Decidable (true = false) := decEq true true",
                  "def forged : Decidable (2 = 3) := decEq 2 2",
              ] {
                  assert!(base.check_source_files(&[source.as_bytes()], &KVMap::new(), SourceCheckLimits::new(limits)).is_err(), "{source}");
                  assert_eq!(base.logical_root(&KVMap::new()), root, "{source}");
              }
          }
          #[test]
          fn an_exhausted_equality_check_is_a_nonanswer_and_leaves_no_declaration() {
              use fln_core::outcome::Outcome;
              let limits = EngineAdmissionLimits::new(Budget::for_stack_bytes(2 * 1024 * 1024));
              let base = Engine::with_source_seed(limits).unwrap().into_complete().unwrap();
              let root = base.logical_root(&KVMap::new());
              let mut low = SourceCheckLimits::new(limits);
              low.admission.kernel = low.admission.kernel.narrowed(0, 32);
              let source = b"theorem stopped : 3 = 3 := by decide";
              match base.check_source_files(&[source], &KVMap::new(), low) {
                  Ok(Outcome::Inconclusive(_)) => {}
                  Err(error) => assert!(matches!(error.disposition(), ("resource" | "inconclusive", false, 3)), "{error:?}"),
                  other => panic!("resource exhaustion became a verdict: {other:?}"),
              }
              assert_eq!(base.logical_root(&KVMap::new()), root);
              assert!(!base.environment().contains(&fln::Name::from_components(["stopped"])));
              base.check_source_files(&[source], &KVMap::new(), SourceCheckLimits::new(limits))
                  .unwrap().into_complete().unwrap();
          }
          RS
          fi
          if [ ! -e crates/fln-cli/tests/source_equality_decisions.rs ]; then
          cat > crates/fln-cli/tests/source_equality_decisions.rs <<'RS'
          //! Installed-command coverage for native proof-carrying equality decisions.
          #![forbid(unsafe_code)]
          use std::{process::Command, sync::atomic::{AtomicUsize, Ordering}};
          static NEXT: AtomicUsize = AtomicUsize::new(0);
          #[test]
          fn installed_command_checks_generic_equality_without_publishing_a_bad_suffix() {
              let directory = std::env::temp_dir().join(format!("fln-equality-decisions-{}-{}", std::process::id(), NEXT.fetch_add(1, Ordering::Relaxed)));
              std::fs::create_dir(&directory).unwrap();
              let prefix = directory.join("prefix.lean");
              let proof = directory.join("proof.lean");
              let prefix_source = "def choose {A : Type} [DecidableEq A] (a b : A) : Nat := if a = b then 7 else 9";
              let valid = r#"
                  theorem arithmetic : 2 + 3 = 5 := by decide
                  theorem different : Not (2 = 3) := by decide
                  theorem booleans : Not (true = false) := by decide
                  theorem positive_branch : choose 4 4 = 7 := by rfl
                  theorem negative_branch : choose true false = 9 := by rfl
              "#;
              std::fs::write(&prefix, prefix_source).unwrap();
              let mut successful_output = None;
              for source in [valid, "theorem invalid : 2 = 3 := by decide", "theorem invalid : Not (true = true) := by decide", valid] {
                  std::fs::write(&proof, source).unwrap();
                  let output = Command::new(env!("CARGO_BIN_EXE_fln"))
                      .args(["check-source", "--json"]).arg(&prefix).arg(&proof).output().unwrap();
                  if source == valid {
                      assert_eq!(output.status.code(), Some(0), "{}", String::from_utf8_lossy(&output.stderr));
                      assert!(output.stderr.is_empty());
                      let text = String::from_utf8(output.stdout).unwrap();
                      for required in ["\"schema\":\"fln.source-check/1\"", "\"outcome\":\"complete\"", "\"authority\":true", "\"files\":2", "\"commands\":6", "\"theorems\":5", "\"executed\":false"] {
                          assert!(text.contains(required), "{text}");
                      }
                      if let Some(previous) = &successful_output {
                          assert_eq!(&text, previous, "recovery must be deterministic");
                      } else {
                          successful_output = Some(text);
                      }
                  } else {
                      assert_eq!(output.status.code(), Some(1));
                      assert!(output.stdout.is_empty(), "no partial successful receipt");
                      assert!(!output.stderr.is_empty());
                      assert!(!String::from_utf8_lossy(&output.stderr).contains("\"authority\":true"));
                  }
                  assert_eq!(std::fs::read_to_string(&prefix).unwrap(), prefix_source);
                  assert_eq!(std::fs::read_to_string(&proof).unwrap(), source);
                  assert_eq!(std::fs::read_dir(&directory).unwrap().count(), 2);
              }
          }
          RS
          fi
      - name: Validate and commit the actual integrated source
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          changed=(
            crates/fln-elab/src/seed.rs
            crates/fln-elab/src/seed/decidable_eq.rs
            crates/fln-elab/src/seed/decidable_generic.rs
            crates/fln/src/lib.rs
            crates/fln/tests/source_equality_decisions.rs
            crates/fln/tests/source_generic_decisions.rs
            crates/fln-cli/tests/source_equality_decisions.rs
          )
          rustfmt --edition 2024 --config skip_children=true "${changed[@]}"
          validate() {
            cargo test --locked -p fln --test source_equality_decisions --test source_generic_decisions --test source_decisions --test source_decision_tactics
            cargo test --locked -p fln-cli --test source_equality_decisions
            cargo test --locked -p fln-elab --no-fail-fast
            cargo clippy --locked -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings
            cargo check --locked --workspace --all-targets
            git diff --check
          }
          validate
          git add "${changed[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(elab): enable proof-carrying equality decisions end to end' -m 'Admit Nat.decEq, Bool.decEq, their instances, DecidableEq and decEq through both checking engines. Cover arithmetic proofs, dependent conditionals, generic Sort u dictionaries, case splits, false-goal rejection, resource nonanswers and installed-command transactional recovery. All decision tests, elaborator tests, strict Clippy and workspace type checking pass.'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then
              printf 'LANDED_COMMIT=%s\n' "$(git rev-parse HEAD)"
              exit 0
            fi
            git fetch --no-tags --depth=64 origin main
            git rebase origin/main
            validate
          done
          echo 'Concurrent updates prevented a non-force push after eight validated attempts' >&2
          exit 1
