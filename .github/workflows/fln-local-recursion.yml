name: Native local recursion and monadic branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-local-recursion.yml']
permissions:
  contents: read
concurrency:
  group: fln-local-recursion
  cancel-in-progress: false
jobs:
  local-recursion:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'feat(source): land checked native local recursion'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install the configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc -Vv
      - name: Check and publish two native source increments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'local-recursion'
          evidence.mkdir()
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          def run(*args):
              subprocess.run(args, check=True)
          def checked(label, *args):
              with (evidence / (label + '.log')).open('wb') as log:
                  process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  for line in iter(process.stdout.readline, b''):
                      log.write(line)
                      print(line.decode(errors='replace'), end='', flush=True)
                  if process.wait():
                      raise RuntimeError('validation failed: ' + label)
          def decode(shas, digest, label):
              chunks = []
              for sha in shas:
                  req = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + sha, headers={'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + os.environ['GH_TOKEN']})
                  with urllib.request.urlopen(req, timeout=60) as response:
                      data = json.load(response)
                  assert data['encoding'] == 'base64'
                  content = base64.b64decode(data['content'])
                  assert hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest() == sha
                  chunks.append(content)
              patch = lzma.decompress(base64.b64decode(b''.join(chunks), validate=True))
              assert hashlib.sha256(patch).hexdigest() == digest
              assert '\ndeleted file mode ' not in patch.decode()
              file = evidence / (label + '.patch')
              file.write_bytes(patch)
              return file
          recursive_paths = {
              'crates/fln-cli/tests/source_check.rs',
              'crates/fln-elab/src/source.rs',
              'crates/fln-elab/src/source/local_functions.rs',
              'crates/fln-elab/src/source/patterns.rs',
              'crates/fln-elab/src/source/recursion.rs',
              'crates/fln-elab/src/source/tactics/backtrack.rs',
              'crates/fln-parse/src/lib.rs',
              'crates/fln-parse/src/matching.rs',
              'crates/fln-parse/tests/local_recursion.rs',
              'crates/fln/tests/source_local_recursion.rs',
              'crates/fln/tests/source_record_literals.rs',
              'docs/NATIVE_LOCAL_RECURSION.md',
              'examples/native_local_recursion.lean',
          }
          repairs = {
              'crates/fln-checker/src/defeq.rs',
              'crates/fln/src/runtime/specialize.rs',
              'crates/fln/tests/source_instances.rs',
          }
          conditional_paths = {
              'crates/fln-elab/src/source/do_notation.rs',
              'crates/fln-parse/src/lib.rs',
              'crates/fln-parse/src/matching.rs',
              'crates/fln-parse/src/term_do.rs',
              'crates/fln-parse/tests/do_notation.rs',
              'crates/fln/src/runtime.rs',
              'crates/fln/tests/source_do.rs',
              'docs/NATIVE_DO_NOTATION.md',
          }
          recursion = decode(['f5feb0a8b27fc91c9deae1b05dad360065972455', 'ba71a80586059d7c16c521d5f6968d485c03e49b', '0cc75a2f2cd1611f4f53c48f8840c8950188b3e8', '0fb161c37784316aad7459da56637ee6fe9483d5'], '85f72fc5c4aa72dc9a16fcd5ecef6d3d4cb24f6227e87bd3ffa11f6ec91cec41', 'recursion')
          repair = decode(['90efd71c34f866d8d868c5e58cbdc0f95602ec09'], 'b3e487b49662ba85f6985e5309bd292eaf77fbc186e4e769de7c15626a7f048d', 'repairs')
          conditional = decode(['e2bc5679aa560167b87ceffa7d11610368d0da13'], '92b8f1661664341dbad766a2e3a0e614883ea7339f2f092cbb32ff1778b9c5ec', 'conditional')
          def validate(prefix):
              checked(prefix + 'tests', 'cargo', 'test', '--locked', '-p', 'fln-parse', '-p', 'fln-elab', '-p', 'fln', '--no-fail-fast')
              checked(prefix + 'installed', 'cargo', 'test', '--locked', '-p', 'fln-cli', '--test', 'source_check', 'installed_local_recursion_checks_runs_and_replays_without_partial_publication')
              checked(prefix + 'clippy', 'cargo', 'clippy', '--locked', '-p', 'fln-parse', '-p', 'fln-elab', '-p', 'fln', '-p', 'fln-cli', '--all-targets', '--', '-D', 'warnings')
              checked(prefix + 'workspace', 'cargo', 'check', '--locked', '--workspace', '--all-targets')
              run('git', 'diff', '--check')
              run('git', 'diff', '--cached', '--check')
          run('git', 'config', 'user.name', 'github-actions[bot]')
          run('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          phases = [
              ([recursion, repair], recursive_paths | repairs, 'feat(source): support checked local structural recursion and native execution'),
              ([conditional], conditional_paths, 'feat(source): check and execute terminal monadic conditional branches'),
          ]
          for phase, (patches, paths, message) in enumerate(phases, 1):
              assert not output('git', 'status', '--porcelain')
              (evidence / ('base-' + str(phase) + '.txt')).write_text(output('git', 'rev-parse', 'HEAD') + '\n')
              for patch in patches:
                  run('git', 'apply', '--index', '--whitespace=error', str(patch))
              assert set(output('git', 'diff', '--cached', '--name-only').splitlines()) == paths
              (evidence / ('manifest-' + str(phase) + '.json')).write_text(json.dumps({p:output('git', 'hash-object', p) for p in sorted(paths)}, indent=2))
              validate(str(phase) + '-')
              run('git', 'commit', '-m', message, '-m', 'Identity-verified native implementation with source and execution regressions. Parser, elaborator and engine package tests, installed local-recursion test, scoped all-target Clippy and workspace compilation passed before publication. Preserve K1 and independent-checker authority; no new axioms or Reference fallback. fln-qb5 remains open.')
              for attempt in range(4):
                  if subprocess.run(['git', 'push', 'origin', 'HEAD:main']).returncode == 0:
                      (evidence / ('published-' + str(phase) + '.txt')).write_text(output('git', 'rev-parse', 'HEAD') + '\n')
                      break
                  run('git', 'fetch', 'origin', 'main')
                  previous = output('git', 'rev-parse', 'HEAD')
                  run('git', 'rebase', 'origin/main')
                  assert output('git', 'rev-parse', 'HEAD') != previous
                  validate(str(phase) + '-rebase-' + str(attempt + 1) + '-')
              else:
                  raise RuntimeError('publication retry limit reached')
      - name: Retain exact source and results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-recursion"
          git rev-parse HEAD > "$RUNNER_TEMP/local-recursion/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/local-recursion/source-tree.txt"
          git status --porcelain > "$RUNNER_TEMP/local-recursion/status.txt"
          git diff HEAD --binary > "$RUNNER_TEMP/local-recursion/unpublished.patch"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/local-recursion/source.tar.gz"
          rustc -Vv > "$RUNNER_TEMP/local-recursion/compiler.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-recursion-${{ github.run_id }}
          path: ${{ runner.temp }}/local-recursion
          retention-days: 7
          if-no-files-found: error
