name: Native local recursion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fln-local-recursion.yml']
permissions:
  contents: read
concurrency:
  group: fln-local-recursion
  cancel-in-progress: false
jobs:
  local-recursion:
    if: >-
      github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'feat(source): land checked native local recursion'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install the configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc -Vv
      - name: Verify, test, and publish native local recursion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'local-recursion'
          evidence.mkdir()
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          def run(*args):
              subprocess.run(args, check=True)
          def checked(label, *args):
              with (evidence / (label + '.log')).open('wb') as log:
                  process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  for line in iter(process.stdout.readline, b''):
                      log.write(line)
                      print(line.decode(errors='replace'), end='', flush=True)
                  if process.wait():
                      raise RuntimeError('validation failed: ' + label)
          expected = {
              'crates/fln-cli/tests/source_check.rs': 'cd03b5ffa093e5225a4358b39adaf523f81669be',
              'crates/fln-elab/src/source.rs': 'e514cd7c6c291d91ab95b9127e7d190e66883962',
              'crates/fln-elab/src/source/local_functions.rs': '30d2b24bc91f035b313d7ea15c2d5926ea34af08',
              'crates/fln-elab/src/source/patterns.rs': 'c6c96a47ac85170f975469d27920ca66770dac6c',
              'crates/fln-elab/src/source/recursion.rs': '45db4fc0910f8b1043ca42a5d8687ec531b13215',
              'crates/fln-elab/src/source/tactics/backtrack.rs': '0e803b572af79ed826f765460e5c15e19864404f',
              'crates/fln-parse/src/lib.rs': '5f47ad583e1567780853e8bb58ef3d7f06614e85',
              'crates/fln-parse/src/matching.rs': 'b2e6ad8ba45e0bf37d3ee733a31768dc8cc03b80',
              'crates/fln-parse/tests/local_recursion.rs': 'c26b7f83947fe620eb07073610dac4fe4e5dfad5',
              'crates/fln/tests/source_local_recursion.rs': '190ac5daf6095c5954abc6a7e42193bcc4cf6ce4',
              'crates/fln/tests/source_record_literals.rs': '22700f609d0d0ca9232836d448871bb6ff9c21f4',
              'docs/NATIVE_LOCAL_RECURSION.md': 'ff5914f9e75595d1902ccf5f7a83a1b3a598aa9c',
              'examples/native_local_recursion.lean': '2951909ff356bc752630c41ef585bff7ea8393bd',
          }
          chunks = []
          for sha in ['f5feb0a8b27fc91c9deae1b05dad360065972455', 'ba71a80586059d7c16c521d5f6968d485c03e49b', '0cc75a2f2cd1611f4f53c48f8840c8950188b3e8', '0fb161c37784316aad7459da56637ee6fe9483d5']:
              req = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + sha, headers={'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = json.load(response)
              assert data['encoding'] == 'base64'
              content = base64.b64decode(data['content'])
              assert hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest() == sha
              chunks.append(content)
          patch = lzma.decompress(base64.b64decode(b''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '85f72fc5c4aa72dc9a16fcd5ecef6d3d4cb24f6227e87bd3ffa11f6ec91cec41'
          assert '\ndeleted file mode ' not in patch.decode()
          (evidence / 'implementation.patch').write_bytes(patch)
          (evidence / 'base.txt').write_text(output('git', 'rev-parse', 'HEAD') + '\n')
          assert not output('git', 'status', '--porcelain')
          run('git', 'apply', '--index', '--whitespace=error', str(evidence / 'implementation.patch'))
          assert sorted(output('git', 'diff', '--cached', '--name-only').splitlines()) == sorted(expected)
          for path, sha in expected.items():
              assert output('git', 'hash-object', path) == sha, 'concurrent edit: ' + path
          # The first run exposed E0716 in the independently landed application-
          # head test: the admission capability borrows its base environment.
          # Preserve that lifetime instead of bypassing the new regression suite.
          test = 'crates/fln-elab/tests/native_unification_application_head.rs'
          assert output('git', 'hash-object', test) == 'fb6738ae7cb9c07cc57cf0e396bb76aed047dce6'
          repair = '\n'.join([
              'diff --git a/' + test + ' b/' + test,
              '--- a/' + test, '+++ b/' + test,
              '@@ -50,8 +50,9 @@ fn budget() -> UnificationBudget {',
              ' fn transaction() -> ElabTxn {',
              '     // The opaque Nat bootstrap supports literals, not constructor names.',
              '     // These tests need the real inductive block, admitted through K1.',
              '+    let environment = Environment::new();',
              '     let Outcome::Complete(admitted) = admit(',
              '-        &Environment::new(),', '+        &environment,',
              '         fln_elab::seed::nat_inductive_seed_declaration(),',
              '         budget().kernel,', '     ) else {', '',
          ])
          (evidence / 'lifetime.patch').write_text(repair)
          run('git', 'apply', '--index', '--whitespace=error', str(evidence / 'lifetime.patch'))
          expected[test] = output('git', 'hash-object', test)
          assert sorted(output('git', 'diff', '--cached', '--name-only').splitlines()) == sorted(expected)
          def validate(prefix):
              checked(prefix + 'frontend-and-engine', 'cargo', 'test', '--locked', '-p', 'fln-parse', '-p', 'fln-elab', '-p', 'fln', '--no-fail-fast')
              checked(prefix + 'installed', 'cargo', 'test', '--locked', '-p', 'fln-cli', '--test', 'source_check', 'installed_local_recursion_checks_runs_and_replays_without_partial_publication')
              checked(prefix + 'clippy', 'cargo', 'clippy', '--locked', '-p', 'fln-parse', '-p', 'fln-elab', '-p', 'fln', '-p', 'fln-cli', '--all-targets', '--', '-D', 'warnings')
              checked(prefix + 'workspace', 'cargo', 'check', '--locked', '--workspace', '--all-targets')
              run('git', 'diff', '--check')
              run('git', 'diff', '--cached', '--check')
          validate('')
          run('git', 'config', 'user.name', 'github-actions[bot]')
          run('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          run('git', 'commit', '-m', 'feat(source): support checked local structural recursion and native execution', '-m', 'Recover lexical captures, nested helpers, dependent results, structural-column retries and newline syntax. Includes source/VM/FLBC and scope-refusal regressions. Preserve the borrowed base lifetime in the concurrent application-head test. Parser/elaborator/engine tests, installed regression, scoped Clippy and workspace compilation passed before publication. No new axiom or kernel rule; fln-qb5 remains open.')
          for attempt in range(4):
              if subprocess.run(['git', 'push', 'origin', 'HEAD:main']).returncode == 0:
                  (evidence / 'published-commit.txt').write_text(output('git', 'rev-parse', 'HEAD') + '\n')
                  break
              run('git', 'fetch', 'origin', 'main')
              previous = output('git', 'rev-parse', 'HEAD')
              run('git', 'rebase', 'origin/main')
              assert output('git', 'rev-parse', 'HEAD') != previous
              validate('rebase-' + str(attempt + 1) + '-')
          else:
              raise RuntimeError('publication retry limit reached')
      - name: Retain exact source and results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-recursion"
          git rev-parse HEAD > "$RUNNER_TEMP/local-recursion/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/local-recursion/source-tree.txt"
          git status --porcelain > "$RUNNER_TEMP/local-recursion/status.txt"
          git diff HEAD --binary > "$RUNNER_TEMP/local-recursion/unpublished.patch"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/local-recursion/source.tar.gz"
          rustc -Vv > "$RUNNER_TEMP/local-recursion/compiler.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-recursion-${{ github.run_id }}
          path: ${{ runner.temp }}/local-recursion
          retention-days: 7
          if-no-files-found: error
