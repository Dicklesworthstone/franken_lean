name: Native higher-order runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/native-higher-order-runtime.yml']
permissions:
  contents: write
concurrency:
  group: native-higher-order-runtime
  cancel-in-progress: false
jobs:
  checked-landing:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - name: Install pinned compiler
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component clippy,rustfmt
      - name: Apply reviewed function-value preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/native-function-values
          test -f crates/fln/src/runtime/callables.rs
          python3 -I - <<'PYTHON'
          import base64, hashlib, pathlib, subprocess, zlib
          payload = ''
          data = zlib.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(data).hexdigest() == 'afe722bbd73fbd864436f402d13b8bfd1633715371bd0d243d2ace5d3fa7d352'
          path = pathlib.Path('target/native-function-values/implementation.patch')
          path.write_bytes(data)
          if subprocess.run(['git', 'apply', '--reverse', '--check', str(path)], capture_output=True).returncode:
              subprocess.run(['git', 'apply', '--check', str(path)], check=True)
              subprocess.run(['git', 'apply', str(path)], check=True)
          PYTHON
          cat > target/native-function-values/check.sh <<'SH'
          set -euo pipefail
          cargo +nightly-2026-08-31 test --offline --locked -p fln-comp -p fln-vm 2>&1 | tee target/native-function-values/compiler-vm.log
          cargo +nightly-2026-08-31 test --offline --locked -p fln --lib --test runtime_function_values --test runtime_higher_order --test runtime_local_functions --test runtime_conditionals --test runtime_nat_recursion --test runtime_records --test runtime_recursive_data --test runtime_variants 2>&1 | tee target/native-function-values/runtime.log
          cargo +nightly-2026-08-31 clippy --offline --locked -p fln-comp -p fln --tests -- -D warnings 2>&1 | tee target/native-function-values/clippy.log
          rustfmt +nightly-2026-08-31 --check --edition 2024 crates/fln/src/runtime/function_values.rs crates/fln/tests/runtime_function_values.rs
          cat > target/native-function-values/Callbacks.lean <<'LEAN'
          def twice (f : Nat -> Nat) (x : Nat) : Nat := f (f x)
          def inc (x : Nat) : Nat := x + 1
          def identity (f : Nat -> Nat) : Nat -> Nat := f
          #eval twice (fun x : Nat => x + 1) 40
          #eval twice inc 40
          #eval twice (Nat.add 1) 40
          #eval identity (Nat.add 1) 41
          LEAN
          cargo +nightly-2026-08-31 run --offline --locked -q -p fln-cli --bin fln -- run --json --emit-flbc target/native-function-values/callbacks.flbc target/native-function-values/Callbacks.lean > target/native-function-values/source.json
          cargo +nightly-2026-08-31 run --offline --locked -q -p fln-cli --bin fln -- flbc run --json target/native-function-values/callbacks.flbc > target/native-function-values/replay.json
          python3 -I - <<'PYTHON'
          import json, pathlib
          root = pathlib.Path('target/native-function-values')
          source = json.loads((root / 'source.json').read_text())
          replay = json.loads((root / 'replay.json').read_text())
          assert source['outcome'] == replay['outcome'] == 'complete'
          assert [row['value'] for row in source['evaluationResults']] == [42, 42, 42, 42]
          assert replay['returnValue'] == 42
          PYTHON
          SH
      - name: Validate source, compiler, VM and CLI replay
        run: bash target/native-function-values/check.sh
      - name: Commit checked function values directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add crates/fln/src/lib.rs crates/fln/src/runtime.rs crates/fln/src/runtime/function_values.rs crates/fln/tests/runtime_function_values.rs docs/NATIVE_HIGHER_ORDER_EXECUTION.md
          if git diff --cached --quiet; then
            echo 'Implementation already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(runtime): execute anonymous and global function values with lexical captures' -m 'Prepare monomorphic function values through the existing typed-let closure path after dual admission. Support named and constructor callbacks, global partial applications and eta-prepared function-returning bodies. Preserve eager operands, dependency telescopes, recursor shapes, ownership, deterministic artifacts and bounded failure atomicity. Validate engine/compiler/VM suites and CLI bytecode replay before publication.'
          for attempt in 1 2 3 4; do
            git rev-parse HEAD > target/native-function-values/source-commit.txt
            git rev-parse HEAD^{tree} > target/native-function-values/source-tree.txt
            git archive --format=tar.gz HEAD > target/native-function-values/source.tar.gz
            sha256sum target/native-function-values/source.tar.gz > target/native-function-values/SHA256SUMS
            if git push origin HEAD:main; then
              git rev-parse HEAD > target/native-function-values/published-commit.txt
              exit 0
            fi
            test "$attempt" != 4 || exit 1
            git fetch --no-tags --depth=50 origin main
            git rebase --onto origin/main HEAD^
            bash target/native-function-values/check.sh
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-function-values-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/native-function-values/
          retention-days: 1
