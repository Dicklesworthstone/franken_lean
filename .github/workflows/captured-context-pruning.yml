name: captured-context pruning

on:
  push:
    branches: [main]
    paths: [.github/workflows/captured-context-pruning.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: captured-context-pruning
  cancel-in-progress: false

jobs:
  validate-and-land:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install the exact repository compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          [[ "$channel" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/captured-evidence"
      - name: Bind the prepared source and reproduce the unsupported case
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --detach origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/captured-evidence/base.txt"
          git fetch origin 0c766e98646747fb788275f931902f41caf81a24
          python3 -I - <<'PY'
          import subprocess
          from pathlib import Path
          expected = {
              'crates/fln-elab/src/constraint/unify/flex_flex.rs': 'd0539f947b10facc331ed53b0d90b72753199e37',
              'crates/fln-elab/tests/native_unification_pruning.rs': '969658e428579eefc5a755f7bfd30c5fe07a0e18',
          }
          for path, blob in expected.items():
              if subprocess.check_output(['git', 'hash-object', path], text=True).strip() != blob:
                  raise SystemExit('concurrent change to ' + path)
          candidate = '0c766e98646747fb788275f931902f41caf81a24'
          for path in [
              'crates/fln-elab/src/constraint/unify/flex_flex/captured.rs',
              'crates/fln-elab/tests/native_unification_captured_pruning.rs',
          ]:
              target = Path(path)
              if target.exists():
                  raise SystemExit('destination already exists: ' + path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(subprocess.check_output(['git', 'show', candidate + ':' + path]))
          PY
          set +e
          cargo test --locked -p fln-elab --test native_unification_captured_pruning captured_argument_pruning_retains_formal_positions_not_captured_values -- --exact 2>&1 | tee "$RUNNER_TEMP/captured-evidence/baseline.log"
          result=${PIPESTATUS[0]}
          set -e
          [[ "$result" -ne 0 ]]
          grep -F '0 passed; 1 failed' "$RUNNER_TEMP/captured-evidence/baseline.log"
      - name: Integrate the prepared semantic extension
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise SystemExit('nonunique integration anchor: ' + path)
              target.write_text(text.replace(old, new), encoding='utf-8')
          path = 'crates/fln-elab/src/constraint/unify/flex_flex.rs'
          replace(path, '''//! The bounded fragment uses distinct local arguments outside the captured
          //! metavariable context. A shared argument whose domain cannot be scoped in
          //! the residual is dropped along with its dependents, after checking the
          //! original argument types. An escaping result still refuses pruning. Captured-
          //! argument, nonpattern and opaque cases retain their postponement behavior;
          //! this is not full Lean unification.''', '''//! The bounded fragment uses distinct local arguments, including captured
          //! locals when the original signature is independent of those arguments.
          //! A shared argument whose domain cannot be scoped in the residual is dropped
          //! along with its dependents, after checking the original argument types.
          //! Captured-signature dependencies, escaping results, nonpatterns and opaque
          //! cases still defer; this is not full Lean unification.''')
          replace(path, 'use super::*;\n', 'mod captured;\n\nuse super::*;\n')
          replace(path, '        let same_head = left.declaration.id == right.declaration.id;', '''        if !self.captured_pruning_compatible(&left, &right, locals)? {
                      return Ok(false);
                  }
                  let same_head = left.declaration.id == right.declaration.id;''')
          replace(path, '''            // A local captured by the hole is not a Miller-pattern parameter.
                      // Keep those equations for ordinary assignment/reduction instead.''', '''            // Captured arguments are checked against the original signature
                      // and exact lexical binding before either parent can be assigned.''')
          replace(path, 'local.is_let() || declaration.lctx.contains(id) || !distinct.insert(id.clone())', 'local.is_let() || !distinct.insert(id.clone())')
          path = 'crates/fln-elab/tests/native_unification_pruning.rs'
          replace(path, 'fn captured_arguments_and_opaque_or_deeper_holes_remain_deferred() {\n    for case in 0..3 {', 'fn opaque_or_deeper_holes_remain_deferred() {\n    for case in 1..3 {')
          replace(path, '        let early_x = (case == 0).then(|| local(&mut txn, "x", nat()));\n', '')
          replace(path, 'let x = early_x.unwrap_or_else(|| local(&mut txn, "x", nat()));', 'let x = local(&mut txn, "x", nat());')
          PY
          rustfmt --edition 2024 crates/fln-elab/src/constraint/unify/flex_flex.rs crates/fln-elab/tests/native_unification_pruning.rs crates/fln-elab/tests/native_unification_captured_pruning.rs
          git diff --check
      - name: Validate kernel-checked solving and downstream compilation
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/captured-evidence"
          cargo test --locked -p fln-elab --test native_unification_captured_pruning 2>&1 | tee "$evidence/captured-tests.log"
          cargo test --locked -p fln-elab 2>&1 | tee "$evidence/package-tests.log"
          cargo clippy --locked -p fln-elab --all-targets -- -D warnings 2>&1 | tee "$evidence/clippy.log"
          cargo check --locked --workspace --all-targets 2>&1 | tee "$evidence/workspace-check.log"
      - name: Publish only the tested source as a nonforced main fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git add -- crates/fln-elab/src/constraint/unify/flex_flex.rs crates/fln-elab/src/constraint/unify/flex_flex/captured.rs crates/fln-elab/tests/native_unification_pruning.rs crates/fln-elab/tests/native_unification_captured_pruning.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(elab): solve captured-context higher-order pattern equations' -m 'Validate exact captured bindings and transitive signature dependencies before pruning. Keep typed residual obligations, original-spine typing, K1 assignment validation, replay and rollback. Fourteen new regressions; the original positive case fails before integration. Full fln-elab tests, all-target Clippy and workspace all-target compilation passed on the pinned compiler. No pinned Reference or full-workspace test claim.'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD | tee "$RUNNER_TEMP/captured-evidence/published.txt"
      - name: Preserve source and compiler for continued isolated validation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/captured-evidence"
          mkdir -p "$evidence"
          rustc -Vv > "$evidence/compiler.txt"
          git diff > "$evidence/working.patch"
          git archive HEAD | gzip -1 > "$evidence/repository.tar.gz"
          tar -czf "$evidence/candidate-files.tar.gz" crates/fln-elab/src/constraint/unify/flex_flex.rs crates/fln-elab/src/constraint/unify/flex_flex/captured.rs crates/fln-elab/tests/native_unification_pruning.rs crates/fln-elab/tests/native_unification_captured_pruning.rs
          sysroot="$(rustc --print sysroot)"
          tar -C "$sysroot" -czf "$RUNNER_TEMP/captured-rust-toolchain.tar.gz" bin lib libexec share
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: captured-pruning-evidence
          path: ${{ runner.temp }}/captured-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: captured-pruning-rust-toolchain
          path: ${{ runner.temp }}/captured-rust-toolchain.tar.gz
          if-no-files-found: error
