name: Native propositional logic

on:
  push:
    branches: [main]
    paths:
      - 'crates/fln-core/**'
      - 'crates/fln-env/**'
      - 'crates/fln-kernel/**'
      - 'crates/fln-checker/**'
      - 'crates/fln-parse/**'
      - 'crates/fln-elab/**'
      - 'crates/fln/**'
      - 'crates/fln-cli/**'
      - 'examples/native_propositional_logic.lean'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-propositional-logic.yml'

permissions:
  contents: read

concurrency:
  group: native-propositional-logic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Check transactional search and lossless syntax
        run: |
          cargo test --locked -p fln-elab --lib source::tactics::search
          cargo test --locked -p fln-parse --lib proofs::search_tests
      - name: Check proofs and proof-carrying decisions through both engines
        run: cargo test --locked -p fln --test source_proof_search --test source_logic --test source_decisions --test source_equality_decisions --no-fail-fast
      - name: Check installed-command receipts and recovery
        run: cargo test --locked -p fln-cli --test source_logic
      - name: Lint touched source packages and downstream consumers
        run: |
          cargo clippy --locked -p fln-elab -p fln-parse -p fln -p fln-cli --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets

  dsimp:
    if: github.repository == 'Dicklesworthstone/franken_lean'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 85ab17cad002b018a07132cbf06ada555e21bcd5
          persist-credentials: false
      - name: Reconstruct the exact locally tested source tree
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == '9af08bc21e29d6aa33eb931b64ae3aab40ecb03f'
          parts = ['72df986a62bf8e8fd3e7afc4b9202fc2fb8267ad', '26a4e7da03704c4ab930e600a13d73b100aaea55', '571e8ff773c3a91dcf6de872220f804668bf9348', 'f9cb0f2fd0b4bfe9d9ce84e2b73b69fddcdf9e33']
          payload = bytearray()
          for sha in parts:
              request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  row = json.load(response)
              raw = base64.b64decode(row['content'])
              assert len(raw) <= 10000
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              payload.extend(raw)
          assert len(payload) == 28180
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          patch = decoder.decompress(payload, max_length=145981)
          assert decoder.eof and not decoder.unused_data and len(patch) == 145980
          assert hashlib.sha256(patch).hexdigest() == '30916725592f02f94ac0b4f2b52329c508ac325a59229eb57f7ce768b5c86964'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dsimp.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '736da8ec453c1d80052389f0893e8925f6c830a7', tree
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--stat'], check=True)
          print('DSIMP_TEST_SOURCE_TREE ' + tree, flush=True)
      - name: Validate reducer invariants, real source admission and downstream builds
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc -Vv
          cargo test --locked --offline -p fln-elab --lib source::tactics::rewrite::simplify::dsimp::
          cargo test --locked --offline -p fln-elab --lib source::scope::simp::defeq::tests
          cargo test --locked --offline -p fln --test source_dsimp --test source_dsimp_native --test source_unfold --test source_simp_locations --no-fail-fast
          cargo test --locked --offline -p fln-cli --test source_dsimp
          cargo clippy --locked --offline -p fln-elab --lib -- -D warnings
          cargo clippy --locked --offline -p fln --lib --test source_dsimp_native -- -D warnings
          cargo clippy --locked --offline -p fln-cli --test source_dsimp -- -D warnings
          cargo check --locked --offline --workspace --all-targets
      - name: Preserve verified source blobs without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert len(paths) == 43, paths
          rows = {}
          for path in paths:
              raw = pathlib.Path(path).read_bytes()
              assert len(raw) <= 2000000
              sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs', data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(raw).decode()}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  assert json.load(response)['sha'] == sha
              rows[path] = sha
          print('DSIMP_NATIVE_VERIFIED_BLOBS ' + json.dumps(rows, sort_keys=True), flush=True)
          print('BRANCH_UNCHANGED: Reference job and current-main reconciliation are separate requirements', flush=True)

  dsimp-reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 85ab17cad002b018a07132cbf06ada555e21bcd5
          persist-credentials: false
      - name: Reconstruct the exact locally tested source tree
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == '9af08bc21e29d6aa33eb931b64ae3aab40ecb03f'
          parts = ['72df986a62bf8e8fd3e7afc4b9202fc2fb8267ad', '26a4e7da03704c4ab930e600a13d73b100aaea55', '571e8ff773c3a91dcf6de872220f804668bf9348', 'f9cb0f2fd0b4bfe9d9ce84e2b73b69fddcdf9e33']
          payload = bytearray()
          for sha in parts:
              request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  row = json.load(response)
              raw = base64.b64decode(row['content'])
              assert len(raw) <= 10000
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              payload.extend(raw)
          assert len(payload) == 28180
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          patch = decoder.decompress(payload, max_length=145981)
          assert decoder.eof and not decoder.unused_data and len(patch) == 145980
          assert hashlib.sha256(patch).hexdigest() == '30916725592f02f94ac0b4f2b52329c508ac325a59229eb57f7ce768b5c86964'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dsimp.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '736da8ec453c1d80052389f0893e8925f6c830a7', tree
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--stat'], check=True)
          print('DSIMP_TEST_SOURCE_TREE ' + tree, flush=True)
      - name: Compare all 50 source programs with the exact pinned Reference
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.32.0/lean-4.32.0-linux.tar.zst
          echo "fca846f3588724a38ad19ee40292c67cb7438d7555903372e3308eef795ba516  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd --no-same-owner -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/lean-4.32.0-linux/bin/lean" --githash)" = 8c9756b28d64dab099da31a4c09229a9e6a2ef35
          python3 -I - <<'PY'
          import os, pathlib, subprocess
          cases = pathlib.Path('crates/fln/tests/source_dsimp.lean').read_text().split('-- CASE ')[1:]
          assert len(cases) == 26
          failures = []
          lean = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lean-4.32.0-linux/bin/lean'
          for case in cases:
              header, text = case.split('\n', 1)
              name, verdict = header.split(' ')
              assert verdict in ('accept', 'reject')
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / (name + '.lean')
              path.write_text(text)
              result = subprocess.run([str(lean), str(path)], capture_output=True, text=True, timeout=60)
              print(name, verdict, result.returncode, result.stdout, result.stderr, flush=True)
              assert result.returncode in (0, 1), 'Reference crash is not a rejection'
              if (result.returncode == 0) != (verdict == 'accept'):
                  failures.append(name)
          assert not failures, failures
          PY
          python3 -I scripts/check_dsimp_reference.py --lean "$RUNNER_TEMP/lean-4.32.0-linux/bin/lean"
