name: Integrate constructive Option equality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fln-option-equality-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fln-option-equality-selfhosted
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Record exact input and relevant open work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/option-equality
          git rev-parse HEAD | tee target/option-equality/input-commit.txt
          python3 -I - <<'PY' | tee target/option-equality/beads.txt
          import json, pathlib
          for line in pathlib.Path('.beads/issues.jsonl').read_text().splitlines():
              item = json.loads(line)
              title = item.get('title', '')
              if item.get('status') not in ('closed', 'tombstone') and any(word in title.lower() for word in ('decid', 'synod', 'instance', 'prelude')):
                  print(json.dumps({key: item.get(key) for key in ('id', 'title', 'status', 'priority', 'description', 'dependencies')}, ensure_ascii=False))
          PY
      - name: Install configured compiler
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc -Vv | tee target/option-equality/compiler.txt
      - name: Register the admitted generic dictionary in the normal source engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          from pathlib import Path
          path = Path('crates/fln/src/lib.rs')
          source = path.read_text()
          start = source.index('    pub fn build_with_source_seed(')
          end = source.index('    pub fn build_source_seed(', start)
          prefix, body, suffix = source[:start], source[start:end], source[end:]
          if '"instDecidableEqOption"' not in body:
              old = '            "instDecidableEqNat",\n        ] {'
              new = '            "instDecidableEqNat",\n            "instDecidableEqOption",\n        ] {'
              assert body.count(old) == 1, 'source instance registration anchor drifted'
              body = body.replace(old, new, 1)
              path.write_text(prefix + body + suffix)
          PY
          rustfmt --edition 2024 --config skip_children=true crates/fln-elab/src/seed/decidable_option.rs crates/fln/tests/source_option_decisions.rs
          git diff --check
          git diff > target/option-equality/implementation.patch
      - name: Check proofs and public source integration
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p fln-elab -p fln --all-targets 2>&1 | tee target/option-equality/check.log
          cargo test --locked -p fln-elab seed::decidable_option -- --nocapture 2>&1 | tee target/option-equality/option-tests.log
          cargo test --locked -p fln --test source_option_decisions -- --nocapture 2>&1 | tee target/option-equality/facade-option-tests.log
          cargo test --locked -p fln-elab --no-fail-fast 2>&1 | tee target/option-equality/elab-tests.log
          cargo test --locked -p fln --lib --no-fail-fast 2>&1 | tee target/option-equality/facade-tests.log
          cargo clippy --locked -p fln-elab --all-targets -- -D warnings 2>&1 | tee target/option-equality/clippy.log
          cargo check --locked --workspace --all-targets 2>&1 | tee target/option-equality/workspace-check.log
      - name: Commit tested source integration directly to main
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
              crates/fln/src/lib.rs|crates/fln-elab/src/seed/decidable_option.rs|crates/fln/tests/source_option_decisions.rs) ;;
              *) printf 'Unexpected changed path: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git add -- crates/fln/src/lib.rs crates/fln-elab/src/seed/decidable_option.rs crates/fln/tests/source_option_decisions.rs
          if ! git diff --cached --quiet; then
            git config user.name 'FrankenLean source integration'
            git config user.email 'noreply@github.com'
            git commit -m 'feat(elab): enable checked Option decisions in the public source engine'
            git push origin HEAD:main
          fi
          git rev-parse HEAD | tee target/option-equality/published-commit.txt
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: option-equality-${{ github.sha }}
          path: target/option-equality
          retention-days: 7
          if-no-files-found: warn
