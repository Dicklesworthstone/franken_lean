name: Native mutual elimination
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-mutual-elimination.yml'
      - 'crates/fln-elab/src/source/matching/**'
      - 'crates/fln-elab/src/source/matching.rs'
      - 'crates/fln-elab/src/source/tactics/eliminate.rs'
      - 'crates/fln/tests/source_mutual_matching.rs'
      - 'crates/fln/tests/source_mutual_cases.rs'
      - 'crates/fln/tests/source_mutual_recursion.rs'
permissions:
  contents: read
concurrency:
  group: native-mutual-elimination
  cancel-in-progress: false
jobs:
  elimination:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install configured Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mutual-elimination"
          channel=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
          rustc -Vv > "$RUNNER_TEMP/mutual-elimination/compiler.txt"
      - name: Stage the identity-bound structural recursion implementation
        if: >-
          github.event.head_commit.message == 'feat(elab): validate structural recursion over mutual families'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mutual-elimination'
          manifest = {
              'crates/fln-elab/src/source/matching.rs': ['8a388d1aad0bc432feeb799f425049c397671049','ab90555ef397c68550d48799a2403d443a507afd'],
              'crates/fln-elab/src/source/tactics/eliminate.rs': ['48fe5f57a6a7e4451ceec1e533ddbc6a8b75196a','1ec0181971e6ac5ef3eaa7b6ebf5fcf5eea4bc66'],
              'crates/fln/tests/source_mutual_recursion.rs': [None,'34caca0d23129bae516b3627c0f94aa08542bf96'],
              'docs/NATIVE_MUTUAL_ELIMINATION.md': ['312343c83d91f21ed39af0de5204636deada85e9','3cc70a49bbb3012087f540a32e1a3b41e264956f'],
          }
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          def fetch_blob(sha):
              request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + sha, headers={'Accept':'application/vnd.github+json','Authorization':'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=60) as response:
                  value = json.load(response)
              assert value['encoding'] == 'base64'
              data = base64.b64decode(value['content'])
              assert blob(data) == sha
              return data
          subprocess.run(['git','fetch','origin','main'], check=True)
          subprocess.run(['git','merge','--ff-only','origin/main'], check=True)
          assert not subprocess.check_output(['git','status','--porcelain']).strip()
          for path, (old, new) in manifest.items():
              p = pathlib.Path(path)
              assert (blob(p.read_bytes()) if p.exists() else None) == old, 'concurrent edit: ' + path
          chunks = ['2df219b368fdffae403c1231b1e1ae00d42e51ec','718eb66fd5e0c0ce2f7c492f05aed2fbdb423fef','8322257711476aacefe65537cb4a14f3fd0a3506']
          encoded = b''.join(fetch_blob(sha) for sha in chunks)
          assert blob(encoded) == '1fdfa96615a05466c61767b392e56b45e996be67'
          mailbox = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(mailbox).hexdigest() == '85f73f1b521b7ed582da33d7451db3524f44f345a99190ba9a422f835b7ee340'
          patch = root / 'implementation.mbox'
          patch.write_bytes(mailbox)
          subprocess.run(['git','apply','--index','--whitespace=error',str(patch)], check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(changed) == set(manifest)
          for path, (old, new) in manifest.items():
              assert blob(pathlib.Path(path).read_bytes()) == new, path
          (root / 'manifest.json').write_text(json.dumps(manifest,indent=2))
      - name: Check source elimination and surrounding engine behavior
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mutual-elimination"
          rustfmt --edition 2024 --config skip_children=true --check crates/fln/tests/source_mutual_recursion.rs
          cargo test --locked -p fln --test source_mutual_matching --test source_mutual_cases --test source_mutual_recursion 2>&1 | tee "$root/focused.log"
          cargo test --locked -p fln-elab -p fln --no-fail-fast 2>&1 | tee "$root/package-tests.log"
          cargo clippy --locked -p fln-elab -p fln --all-targets -- -D warnings 2>&1 | tee "$root/clippy.log"
          cargo check --locked --workspace --all-targets 2>&1 | tee "$root/workspace.log"
          git diff --check
          git diff --cached --check
      - name: Publish the checked structural recursion implementation
        if: >-
          github.event.head_commit.message == 'feat(elab): validate structural recursion over mutual families'
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mutual-elimination'
          manifest = json.loads((root / 'manifest.json').read_text())
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()) == set(manifest)
          for path, (old, new) in manifest.items():
              data = pathlib.Path(path).read_bytes()
              assert data == subprocess.check_output(['git','show',':' + path])
              assert hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest() == new
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','commit','-m','feat(elab): compile structural self-recursion over mutual data families','-m','Preserve recursive-field ownership and use only the selected family hypotheses for structural self-calls. Support accumulators, function-valued children, polymorphic and indexed results, constrained index equations and recursive pattern matrices. Retain termination restrictions, hidden sibling motives and resource nonanswers. Twelve new dual-checker regressions, full elaborator and engine tests, all-target package Clippy and workspace compilation passed before publication. No general mutual function groups, mutual induction or runtime-codegen claim; fln-qb5 remains open.'], check=True)
          subprocess.run(['git','push','origin','HEAD:main'], check=True)
          (root / 'published.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
      - name: Retain exact source and any unpublished changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mutual-elimination"
          git rev-parse HEAD > "$RUNNER_TEMP/mutual-elimination/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/mutual-elimination/source-tree.txt"
          git status --porcelain > "$RUNNER_TEMP/mutual-elimination/worktree-status.txt"
          git diff HEAD --binary > "$RUNNER_TEMP/mutual-elimination/unpublished.patch"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/mutual-elimination/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutual-elimination-${{ github.run_id }}
          path: ${{ runner.temp }}/mutual-elimination
          retention-days: 7
          if-no-files-found: error
