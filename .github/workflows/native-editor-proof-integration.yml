name: Native editor proof integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-editor-proof-integration.yml'
      - 'crates/fln-server/**'
      - 'crates/fln-cli/src/lib.rs'
      - 'crates/fln-cli/src/bin/**'
      - 'crates/fln-cli/src/source_check*'
      - 'crates/fln-cli/src/source_check/**'
      - 'crates/fln-cli/tests/lsp*'
      - 'crates/fln-cli/tests/lsp_proof_modules/**'
      - 'crates/fln-cli/tests/source_module_check.rs'
      - 'crates/fln/src/source_check*'
      - 'crates/fln/src/source_check/**'
      - 'crates/fln/tests/source_module*'
      - 'rust-toolchain.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check native proof libraries, reactive documents and watched files
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/native-editor-validation.log") 2>&1
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          toolchain=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          rustc -Vv
          cargo test --locked -p fln-server
          cargo test --locked -p fln-cli --lib source_check::lsp::dependencies
          cargo test --locked -p fln-cli --test lsp_proof_modules --test lsp_stdio_e2e --test source_module_check --no-fail-fast
          cargo test --locked -p fln --test source_module_session --test source_module_check --no-fail-fast
          cargo clippy --locked -p fln-server -p fln -p fln-cli --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-editor-validation-${{ github.sha }}
          path: ${{ runner.temp }}/native-editor-validation.log
          retention-days: 7
          if-no-files-found: error
