name: Native editor proof integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-editor-proof-integration.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  editor-proofs:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read active implementation beads
        shell: python
        run: |
          import json
          for line in open('.beads/issues.jsonl'):
              row = json.loads(line)
              if row.get('status') != 'closed' and any(w in row.get('title', '').lower() for w in ('lantern', 'server', 'incremental', 'elaboration', 'unifier')):
                  print(row['id'], row.get('priority'), row.get('status'), row.get('title'), row.get('description', ''))
      - name: Apply reactive checking to exact source inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'editor-proof-integration'
          root.mkdir()
          (root / 'base.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          blobs = {
              'crates/fln-server/src/dispatch/workspace.rs': '436f89ee2a678ec874ef8010f885da5eb62ab5f4',
              'crates/fln-cli/src/source_check/lsp/dependencies.rs': 'b89f63313e01f3902f7b6a5f111ec5b2a950a6c1',
              'crates/fln-cli/tests/lsp_proof_modules/reactive.rs': 'c911db12cdc4281749ee8438d595ee9f5790c966',
          }
          for path, sha in blobs.items():
              request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/' + sha,
                  headers={'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = json.load(response)
              content = base64.b64decode(data['content'])
              assert hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest() == sha
              target = pathlib.Path(path)
              assert not target.exists(), 'integration already present: ' + path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          changed = list(blobs)
          def edit(path, operation):
              target = pathlib.Path(path)
              before = target.read_text()
              after = operation(before)
              assert before != after, path
              target.write_text(after)
              changed.append(path)
          def replace(text, old, new, count=1):
              assert text.count(old) == count, (old, text.count(old), count)
              return text.replace(old, new)
          def documents(text):
              return replace(text, 'pub(super) trait CheckSource {', '''pub(super) trait CheckSource {
              fn tracks_dependencies(&self) -> bool { false }
              fn affected(&mut self, _: &[String], _: &[OpenDocumentSource<'_>]) -> Vec<String> { Vec::new() }''')
          edit('crates/fln-server/src/dispatch/documents.rs', documents)
          def dispatch(text):
              text = replace(text, 'mod documents;\n', 'mod workspace;\npub use workspace::{WorkspaceChecker, serve_workspace};\nmod documents;\n')
              start = text.index('fn serve_inner(')
              prefix, body = text[:start], text[start:]
              body = replace(body, '        match (method.as_str(), id, state) {', '''        let before = if on_did_open.tracks_dependencies() && state == ServerState::Running
                      && id.is_none() && matches!(method.as_str(), "textDocument/didOpen" | "textDocument/didChange" | "textDocument/didSave" | "textDocument/didClose")
                  { Some(workspace::BeforeChange::capture(&session)) } else { None };
                  let mut checked_event = None;
                  match (method.as_str(), id, state) {''')
              body = replace(body, '                    record_frontier(&mut frontiers, &checked);', '                    checked_event = Some(checked.uri.clone());\n                    record_frontier(&mut frontiers, &checked);', 3)
              body = replace(body, '            (_, None, _) => {}\n        }\n    }\n}', '''            (_, None, _) => {}
                  }
                  if let Some(before) = before {
                      let changed = before.changed(&session, checked_event.as_deref());
                      if !changed.is_empty() {
                          workspace::refresh(output, &session, &mut waits, &mut frontiers,
                              on_did_open, &changed, checked_event.as_deref())?;
                      }
                  }
              }
          }''')
              return prefix + body
          edit('crates/fln-server/src/dispatch.rs', dispatch)
          edit('crates/fln-cli/src/source_check/imports/editor.rs', lambda t: replace(t, 'fn document_path(uri:', 'pub(in crate::source_check) fn document_path(uri:'))
          def checker(text):
              text = replace(text, 'pub(crate) struct Checker { worker: Option<Worker> }', 'mod dependencies;\npub(crate) struct Checker { worker: Option<Worker>, dependencies: dependencies::Dependencies }')
              text = replace(text, 'Self { worker: None }', 'Self { worker: None, dependencies: dependencies::Dependencies::default() }')
              text = replace(text, '        if text.len() > SOURCE_RUN_DEFAULT_MAX_BYTES {', '        self.dependencies.begin(uri, documents);\n        if text.len() > SOURCE_RUN_DEFAULT_MAX_BYTES {')
              old = '''        if let Err(error) = fln::source_check::modules::parse_source_header(text.as_bytes()) {
                      return project(uri, text, &diagnostic(uri, text.as_bytes(), error.primary_offset().map_or(0, |p| p.0), &error.to_string()));
                  }'''
              new = '''        match fln::source_check::modules::parse_source_header(text.as_bytes()) {
                      Ok(header) if header.imports.is_empty() => self.dependencies.no_imports(uri),
                      Ok(_) => {},
                      Err(error) => return project(uri, text, &diagnostic(uri, text.as_bytes(), error.primary_offset().map_or(0, |p| p.0), &error.to_string())),
                  }'''
              text = replace(text, old, new)
              text = replace(text, '        if self.worker.is_none() {', '        self.dependencies.loaded(uri, &sources.uris);\n        if self.worker.is_none() {')
              text += '''
          impl fln_server::dispatch::WorkspaceChecker for Checker {
              fn check(&mut self, uri: &str, text: &str, documents: &[OpenDocumentSource<'_>]) -> Vec<String> {
                  Checker::check(self, uri, text, documents)
              }
              fn affected(&mut self, changed: &[String], documents: &[OpenDocumentSource<'_>]) -> Vec<String> {
                  self.dependencies.affected(changed, documents)
              }
          }
          '''
              return text
          edit('crates/fln-cli/src/source_check/lsp.rs', checker)
          def cli(text):
              start = text.index('    let mut on_did_open = move |uri: &str, text: &str, documents:')
              end = text.index('    if let Err(error) = writer.flush()', start)
              assert 'serve_with_documents' in text[start:end]
              return text[:start] + '    let outcome = fln_server::dispatch::serve_workspace(&mut reader, &mut writer, &mut checker);\n' + text[end:]
          edit('crates/fln-cli/src/lib.rs', cli)
          def tests(text):
              text = replace(text, 'assert_eq!(errors(&messages, &entry).len(), 2,', 'assert_eq!(errors(&messages, &entry).len(), 4,')
              text = replace(text, 'assert_eq!(successes(&messages).len(), 4,', 'assert_eq!(successes(&messages).len(), 5,')
              return text + '\n#[path = "lsp_proof_modules/reactive.rs"]\nmod reactive;\n'
          edit('crates/fln-cli/tests/lsp_proof_modules.rs', tests)
          def docs(text):
              start = text.index('Dependency edits are consumed')
              end = text.index('An error in a dependency', start)
              return text[:start] + '''Accepted dependency opens, changes and saves, rejected edits that invalidate
          source, and closes now automatically recheck affected open importers before
          the next request is processed. Transitive consumers are selected from the
          resolver's complete source closure and checked once in deterministic URI
          order. Incomplete resolution and dependency-retention pressure fall back to
          conservative rechecking, never silently missing an edge. The dependency
          index retains at most 16,384 paths and 4 MiB of path bytes, in addition to
          session-bounded document identities; these are not allocator RSS limits.
          Old diagnostic frontiers are replaced even when the importer version has
          not changed. Unavailable importer text produces a nonanswer, not disk fallback.
          Legacy callback APIs keep their original single-document behavior; embedders
          opt into `serve_workspace` with a typed `WorkspaceChecker`.
          Closed-file disk notifications, cursor goal inspection, semantic
          hover/completion/definition and Lean RPC sessions remain separate work.
          ''' + text[end:]
          edit('docs/NATIVE_EDITOR_PROOFS.md', docs)
          (root / 'paths.json').write_text(json.dumps(changed))
          subprocess.run(['git', 'add', '--', *changed], check=True)
          (root / 'integration.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          (root / 'source-files.json').write_text(json.dumps({p: pathlib.Path(p).read_text() for p in changed}))
      - name: Test reactive editor checking and downstream integration
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/editor-proof-integration/validation.log") 2>&1
          toolchain=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          cargo test --locked -p fln-server
          cargo test --locked -p fln-cli --lib source_check::lsp::dependencies
          cargo test --locked -p fln-cli --test lsp_proof_modules --test lsp_stdio_e2e --test source_module_check --no-fail-fast
          cargo test --locked -p fln --test source_module_session --test source_module_check --no-fail-fast
          cargo clippy --locked -p fln-server -p fln -p fln-cli --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
          git diff --cached --check
      - name: Export tested source tree without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'editor-proof-integration'
          paths = json.loads((root / 'paths.json').read_text())
          assert sorted(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()) == sorted(paths)
          def post(endpoint, value):
              request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/' + endpoint,
                  data=json.dumps(value).encode(), method='POST',
                  headers={'Accept':'application/vnd.github+json','Content-Type':'application/json','Authorization':'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          tree = []
          for path in paths:
              content = pathlib.Path(path).read_bytes()
              assert content == subprocess.check_output(['git','show',':' + path])
              sha = hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest()
              assert post('blobs', {'content':content.decode('utf-8'),'encoding':'utf-8'})['sha'] == sha
              tree.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          base_tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          result = post('trees', {'base_tree':base_tree,'tree':tree})
          assert result['sha'] == subprocess.check_output(['git','write-tree'], text=True).strip()
          result = {'parent':(root / 'base.txt').read_text().strip(), 'tree':result['sha'], 'files':tree}
          (root / 'tested-tree.json').write_text(json.dumps(result, indent=2))
          print('VALIDATED_SOURCE_TREE ' + json.dumps(result), flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: editor-proof-integration-${{ github.sha }}
          path: ${{ runner.temp }}/editor-proof-integration
          retention-days: 7
          if-no-files-found: error
