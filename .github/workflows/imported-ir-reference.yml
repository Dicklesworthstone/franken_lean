name: Imported IR live Reference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imported-ir-reference.yml'
      - 'crates/fln-admission/src/reuse.rs'
      - 'crates/fln/src/imported_ir.rs'
      - 'crates/fln/src/imported_ir/**'
      - 'crates/fln/src/imported_macros.rs'
      - 'crates/fln/src/imported_macros/**'
      - 'crates/fln/src/lib.rs'
      - 'crates/fln/src/source_check.rs'
      - 'crates/fln/src/source_check/**'
      - 'crates/fln-cli/src/lib.rs'
      - 'crates/fln-cli/src/source_check.rs'
      - 'crates/fln-cli/src/source_check/**'
      - 'crates/fln-cli/tests/source_olean_imports.rs'
      - 'crates/fln/tests/source_imported_macros.rs'
      - 'crates/fln/tests/source_imported_atomic_macros.rs'
      - 'crates/fln/tests/source_imported_syntax_methods.rs'
      - 'crates/fln/tests/source_grind.rs'
      - 'crates/fln/tests/source_grind/**'
      - 'crates/fln/src/source_records/equation_theorems.rs'
      - 'crates/fln-elab/src/**'
      - 'crates/fln-rt/src/**'
      - 'crates/fln-rt/tests/native_convert.rs'
      - 'crates/fln-vm/src/**'
      - 'crates/fln-vm/tests/name_native.rs'
      - 'crates/fln-vm/tests/level_native.rs'
      - 'scripts/extract/gen_macro_runtime_contract.py'
      - 'crates/fln-olean/fixtures/ir/**'
      - 'SUITE.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      FLN_REQUIRE_REFERENCE: '1'
      FLN_REFERENCE_PARTITION: ${{ github.workspace }}/contracts/builtin_partition.tsv
      FLN_IR_REFERENCE_ARTIFACTS: ${{ github.workspace }}/target/imported-ir-reference/live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record source and install the pinned Rust compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/imported-ir-reference
          git rev-parse HEAD > target/imported-ir-reference/commit.txt
          git rev-parse 'HEAD^{tree}' > target/imported-ir-reference/tree.txt
          rustup show active-toolchain
          rustc -Vv > target/imported-ir-reference/rustc.txt
      - name: Check cancellable import reconstruction
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-admission --lib reuse -- --nocapture \
            2>&1 | tee target/imported-ir-reference/import-cancellation.log
      - name: Check native metaprogram primitives and conversion
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p fln-vm --lib _native --no-fail-fast -- --nocapture \
            2>&1 | tee target/imported-ir-reference/macro-vm.log
          cargo test --locked -p fln-vm --test name_native --test level_native --no-fail-fast
          cargo test --locked -p fln-rt --test native_convert --no-fail-fast
      - name: Install the SUITE.lock Reference for test-only code generation
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/ir-elan-bin"
          archive="$RUNNER_TEMP/ir-elan.tar.gz"
          mkdir "$tool_root"
          curl --user-agent 'franken_lean-agent (+https://github.com/Dicklesworthstone/franken_lean)' \
            --fail --location --retry 3 --output "$archive" \
            https://github.com/leanprover/elan/releases/download/v4.2.1/elan-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_root"
          export ELAN_HOME="$HOME/.elan"
          "$tool_root/elan-init" -y --no-modify-path --default-toolchain none
          export PATH="$ELAN_HOME/bin:$PATH"
          mapfile -t reference_rows < <(grep -E '^reference ' SUITE.lock)
          test "${#reference_rows[@]}" -eq 1
          pin_tag="$(sed -nE 's/.* tag=([^ ]+).*/\1/p' <<<"${reference_rows[0]}")"
          pin_commit="$(sed -nE 's/.* commit=([0-9a-f]{40}).*/\1/p' <<<"${reference_rows[0]}")"
          [[ "$pin_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          test -n "$pin_commit"
          elan toolchain install "leanprover/lean4:$pin_tag"
          toolchain_root="$ELAN_HOME/toolchains/leanprover--lean4---$pin_tag"
          test "$("$toolchain_root/bin/lean" --githash)" = "$pin_commit"
          printf 'FLN_REFERENCE_LIB=%s/lib/lean\nFLN_REFERENCE_LEAN=%s/bin/lean\n' \
            "$toolchain_root" "$toolchain_root" >> "$GITHUB_ENV"
      - name: Materialize and verify the pinned execution partition
        shell: bash
        run: scripts/extract/census_materialize.sh
      - name: Execute imported IR and native macros, lint, and check formatting
        shell: bash
        run: |
          set -uo pipefail
          status=0
          cargo test --locked -p fln --lib source_check::modules::reuse -- --nocapture \
            2>&1 | tee target/imported-ir-reference/import-reuse.log || status=1
          cargo test --locked -p fln-vm --test float_arrays -- --nocapture \
            2>&1 | tee target/imported-ir-reference/float-array-vm.log || status=1
          cargo test --locked -p fln-vm -p fln-unsafe-abi --lib float_array -- --nocapture \
            2>&1 | tee target/imported-ir-reference/float-array-boundary.log || status=1
          cargo test --locked -p fln-parse --test macro_body_construction -- --nocapture \
            2>&1 | tee target/imported-ir-reference/macro-construction-parser.log || status=1
          cargo test --locked --no-fail-fast -p fln \
            --test source_notation --test source_module_grammar -- --nocapture \
            2>&1 | tee target/imported-ir-reference/macro-construction-source.log || status=1
          cargo test --locked -p fln --test source_mutual_well_founded \
            inferred_mutual -- --nocapture \
            2>&1 | tee target/imported-ir-reference/mutual-inference.log || status=1
          cargo test --locked -p fln --lib imported_ir:: -- --nocapture \
            2>&1 | tee target/imported-ir-reference/tests.log || status=1
          cargo test --locked -p fln --test source_imported_syntax_methods -- --nocapture \
            2>&1 | tee target/imported-ir-reference/syntax-methods.log || status=1
          cargo test --locked -p fln --test source_grind \
            definitions::definition_equations_match_pinned_lean -- --exact --nocapture --test-threads=1 \
            2>&1 | tee target/imported-ir-reference/grind-definitions.log || status=1
          cargo test --locked -p fln --lib imported_macros:: -- --nocapture \
            2>&1 | tee target/imported-ir-reference/macros.log || status=1
          cargo test --locked --no-fail-fast -p fln \
            --test source_imported_macros --test source_imported_atomic_macros -- --nocapture \
            2>&1 | tee target/imported-ir-reference/source-macros.log || status=1
          cargo test --locked -p fln --test source_grind \
            modifiers::selected_theorem_directions_match_the_live_pin -- --exact --nocapture \
            2>&1 | tee target/imported-ir-reference/grind-modifiers.log || status=1
          python3 -I -S scripts/extract/gen_macro_runtime_contract.py \
            --lean "$FLN_REFERENCE_LEAN" --check \
            2>&1 | tee target/imported-ir-reference/macro-contract.log || status=1
          cargo clippy --locked -p fln-admission -p fln -p fln-cli --lib --tests -- -D warnings \
            2>&1 | tee target/imported-ir-reference/clippy.log || status=1
          files=(crates/fln-admission/src/reuse.rs
            crates/fln/src/source_check/modules/reuse.rs
            crates/fln/src/source_check/modules/reuse/composed_tests.rs
            crates/fln/src/imported_ir/constructor_updates.rs
            crates/fln/src/lib.rs
            crates/fln/src/imported_ir/native_signature.rs
            crates/fln/src/source_records/equation_theorems.rs
            crates/fln/tests/source_imported_syntax_methods.rs
            crates/fln/tests/source_grind.rs
            crates/fln-elab/src/source/equation_theorems.rs
            crates/fln-elab/src/source/tactics/grind.rs
            crates/fln-elab/src/source/tactics/grind/quantifiers.rs
            crates/fln/src/source_check/modules.rs
            crates/fln/src/source_check/modules/imported.rs
            crates/fln/src/source_check/modules/execution.rs
            crates/fln/src/source_check/modules/imported_macros.rs
            crates/fln-cli/src/source_check/imports/execution.rs
            crates/fln-cli/src/lib.rs
            crates/fln-cli/src/source_check.rs
            crates/fln-cli/src/source_check/imports.rs
            crates/fln-cli/src/source_check/imports/macros.rs
            crates/fln-cli/tests/source_olean_imports.rs
            crates/fln-vm/src/macro_native.rs
            crates/fln-vm/src/interpreter/macro_native.rs
            crates/fln-vm/src/interpreter/macro_native/tests.rs
            crates/fln-rt/src/syntax_abi_generated.rs)
          while IFS= read -r path; do files+=("$path"); done < <(
            git ls-files 'crates/fln/src/imported_ir/constructor_updates/*.rs' \
              'crates/fln/src/imported_ir/constructor_updates/**/*.rs' \
              'crates/fln/src/imported_ir/native_signature/*.rs' \
              'crates/fln/src/imported_ir/native_signature/**/*.rs' \
              'crates/fln/tests/source_grind/*.rs' \
              'crates/fln/tests/source_grind/**/*.rs' \
              'crates/fln/src/imported_macros/*.rs' \
              'crates/fln/src/imported_macros/**/*.rs' \
              'crates/fln-vm/src/interpreter/macro_native/**/*.rs')
          rustfmt --edition 2024 --config skip_children=true --check "${files[@]}" \
            2>&1 | tee target/imported-ir-reference/format.log || status=1
          # Developer artifacts are formatted copies, never changes to tested
          # tracked bytes. Retain them so a formatter finding is reproducible.
          for path in "${files[@]}"; do
            copy="target/imported-ir-reference/formatted/$path"
            mkdir -p "$(dirname "$copy")"
            cp "$path" "$copy"
            rustfmt --edition 2024 --config skip_children=true "$copy" || status=1
          done
          cargo test --locked -p fln-cli --test source_olean_imports -- --nocapture \
            2>&1 | tee target/imported-ir-reference/cli-macros.log || status=1
          exit "$status"
      - name: Retain exact generated artifacts and verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imported-ir-reference-${{ github.sha }}
          path: target/imported-ir-reference
          retention-days: 7
          if-no-files-found: error
