name: Native collection source integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-list-notation.yml'
      - 'crates/fln-parse/**'
      - 'crates/fln-elab/**'
      - 'crates/fln/**'
      - 'crates/fln-cli/tests/source_collection_notation.rs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-lists:
    if: github.repository == 'Dicklesworthstone/franken_lean' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assemble checked collection instance integration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-lists'
          root.mkdir()
          (root / 'parent.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          req = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/blobs/51826ebf0d666874ed05473e38133481e20d3a4a', headers={'Accept':'application/vnd.github+json','Authorization':'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req, timeout=60) as response:
              stored = json.load(response)
          payload = base64.b64decode(stored['content'])
          assert hashlib.sha1(('blob ' + str(len(payload)) + '\0').encode() + payload).hexdigest() == '51826ebf0d666874ed05473e38133481e20d3a4a'
          patch = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == '1262225a950fc4cdaba45c7bd9152fe18e3c8ff0520b5adf8db866cc14069266'
          patch_path = root / 'instances.patch'
          patch_path.write_bytes(patch)
          paths = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')]
          if not pathlib.Path('crates/fln-elab/src/seed/collections/instances.rs').exists():
              subprocess.run(['git','apply','--check',str(patch_path)], check=True)
              subprocess.run(['git','apply',str(patch_path)], check=True)
          (root / 'paths.json').write_text(json.dumps(paths))
      - name: Validate parser, dictionaries, proof checking and scalar execution
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/native-lists"
          exec > >(tee "$root/validation.log") 2>&1
          channel=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc -Vv
          python3 -I - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-lists'
          paths = [p for p in json.loads((root / 'paths.json').read_text()) if p.endswith('.rs')]
          subprocess.run(['rustfmt','--edition','2024','--config','skip_children=true',*paths], check=True)
          PY
          cargo test --locked -p fln --test source_collection_instances
          cargo test --locked -p fln-parse --test source_list_notation --test source_list_patterns
          cargo test --locked -p fln-elab -p fln --all-targets --no-fail-fast -- --quiet
          cargo test --locked -p fln-cli --test source_collection_notation
          cargo clippy --locked -p fln-parse -p fln-elab -p fln -p fln-cli --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
          git diff --check
      - name: Export exact tested source tree for direct main publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-lists'
          paths = json.loads((root / 'paths.json').read_text())
          subprocess.run(['git','add','--',*paths], check=True)
          (root / 'integration.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          def post(endpoint, data):
              req = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_lean/git/' + endpoint, data=json.dumps(data).encode(), method='POST', headers={'Accept':'application/vnd.github+json','Content-Type':'application/json','Authorization':'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          entries = []
          for path in paths:
              content = pathlib.Path(path).read_bytes()
              assert content == subprocess.check_output(['git','show',':' + path])
              sha = hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest()
              assert post('blobs', {'content':content.decode(),'encoding':'utf-8'})['sha'] == sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree = post('trees', {'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries})['sha']
          assert tree == subprocess.check_output(['git','write-tree'],text=True).strip()
          manifest = {'parent':(root / 'parent.txt').read_text().strip(),'tree':tree,'files':entries}
          (root / 'tested-tree.json').write_text(json.dumps(manifest, indent=2))
          print('VALIDATED_SOURCE_TREE ' + json.dumps(manifest), flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-list-validation-${{ github.sha }}
          path: ${{ runner.temp }}/native-lists
          retention-days: 7
          if-no-files-found: error
