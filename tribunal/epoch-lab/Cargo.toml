[package]
name = "fln-epoch-lab"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
publish = false

[dependencies]
fln-hash = { path = "../../crates/fln-hash" }

# Test-only, for `checked_workspace_root!`/`checked_manifest_dir!` (bead
# fln-cross-tree-baked-root-k60n). CARGO_TARGET_DIR is shared machine-wide and
# `env!("CARGO_MANIFEST_DIR")` is a COMPILE-TIME constant, so a test binary built
# from another checkout is reused as fresh and answers for THAT tree while saying
# so nowhere. The lab's rigs read epoch fixtures off disk, so a wrong root is a
# verdict about a repository nobody asked about.
#
# A dev-dependency, not a dependency: it reaches `tests/` and `examples/` and
# deliberately not `src/main.rs`, whose one remaining raw site stays declared in
# RAW_SITE_RESIDUE rather than pulling a rank-22 crate into this binary's runtime
# closure. This adds no governance row (structure-guard discovers only crates/ and
# tools/) and touches only this nested workspace's own Cargo.lock, which is the
# pair of concerns the comment below records.
[dev-dependencies]
fln-conformance = { path = "../../crates/fln-conformance" }

# Deliberately a nested workspace, following tools/structure-guard/
# kernel-ownership-publisher. The epoch lab is Tribunal apparatus, not a product
# crate: it must not add a tooling-only edge to the product workspace (members =
# crates/* plus tools/*) nor force unrelated agents to rewrite the root
# Cargo.lock. structure-guard discovers crates under crates/ and tools/ only, so
# this adds no governance rows either.
[workspace]
resolver = "3"
