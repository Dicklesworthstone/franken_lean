# Exact pinned nightly — no "or later" (AGENTS.md Toolchain; plan D1).
# This pin is authoritative until SUITE.lock (bead franken_lean-xwf) subsumes it;
# the two must then agree, enforced in CI.
[toolchain]
channel = "nightly-2026-07-13"
# `miri` and `rust-src` are here because the Marrow concurrency guards need them
# and a fresh clone otherwise has neither (bead fln-nhf5). They are components of
# the pin, not a second pin: SUITE.lock governs the CHANNEL, which is unchanged.
#   miri     — crates/fln-unsafe-abi/MIRI_CONCURRENCY_GUARD.md, the four-test
#              guard that fails on the real reverted data race.
#   rust-src — required by `-Zbuild-std`, which is what makes ThreadSanitizer
#              usable at this pin at all: without a std rebuilt under the same
#              `-Zsanitizer=thread`, cargo refuses with an ABI mismatch.
components = ["rustfmt", "clippy", "miri", "rust-src"]
